abstract:
- language: en
  script: Latn
  content: "Transfer of GSM 07.07 to 3GPP. \r\n________________\r\nThis TS specifies
    a profile of AT commands and recommends that this profile be used for controlling
    Mobile Equipment (ME) functions and GSM network services from a Terminal Equipment
    (TE) through Terminal Adaptor (TA). The command prefix +C is reserved for Digital
    Cellular in ITU-T Recommendation V.25ter. This TS has also the syntax details
    used to constructthese extended GSM commands. Commands from ITU-T Recommendation
    V.25ter and existing digital cellular standards (TIA IS-99 and TIA IS-135) are
    used whenever applicable. Some of the new commands are defined such way that they
    can be easilyapplied to ME of networks other than GSM."
