abstract:
- language: en
  script: Latn
  content: Definition of a generic schema for a machine-readable cryptographic algorithm
    catalogue to reflect requirements posed by existing human-readably algorithm (and
    cipher suites) catalogues, increase interoperability, and support backwards compatibility
    for long-term preservation systems. It will be based on RFC 5698. This work item
    will itself not define the requirements for algorithms or/and cypher suites.
