abstract:
- language: en
  script: Latn
  content: "The objective of this Work Item is to define the overall requirements
    from the perspective of users, service providers' (operators) and content providers
    for the support of NGN services. \r\nThe objective is not to standardise usage
    of NGN applications but, instead, to identify the requirements to enable their
    support. The deliverable will expand requirements in the R2 definition and reference
    other TISPAN NGN WG1 Work Items where the detailed services and requirements are
    specified."
