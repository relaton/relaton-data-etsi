abstract:
- language: en
  script: Latn
  content: "The task will address the evaluation of the change requests by the EC
    concerning ETSI-EESSI standards, based on conclusions of the EC-led evaluation
    of EESSI deliverables and discussions, comments by the A9-Commettee. Although
    the formal requests has, as of yet, not been communicated to the EESSI, it became
    already clear that the focus of change proposals concerns TS 101 733, in particular
    to allow implementers and users to have more flexibility in chosing their options
    among the alternative formats. Another issue is to separate the format and policy
    parts of the standard.Change the title of the document and make it similar to
    the title of TS 101 903 which is XML Advanced Electronic Signatures (XAdES) \r\nThe
    title should advertise an acronym similar to XAdES. It is proposed an acronym
    like CAdES meaning CMS Advanced Electronic Signature.\r\nSo, it is propose to
    reissue a revision of the document by changing the title to CMS Advanced Electronic
    Signatures (CAdES). The introduction And the scope of the revised document should
    be aligned with the new title"
