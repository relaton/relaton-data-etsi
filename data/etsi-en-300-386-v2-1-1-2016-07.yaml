abstract:
- language: en
  script: Latn
  content: "To revise:\r\n-\tScope: it should be removed the exclusion of Optical
    amplifiers as these items are in transmission products\r\n-\tReferences: update
    with the latest basic standards and adding EN 55032.\r\n-\tDefinitions: it needs
    to change the definition of “public network”\r\n-\tTests methods: add details
    on how to test multiple power ports connected to the same source; possible alignment
    with test method for surge immunity in latest EN 61000-4-5\r\n-\tEmission requirements:
    add the EN 55032\r\n-\tEmission on DC power port: remove the statement about 6
    dB margin on noise floor because already covered by basic standards\r\n-\tRadiate
    emissions: reference to EN 300 127 “test on large TLC systems” to be replaced
    by EN 55016-2-3\r\n-\tRadiated immunity: frequency range to be extended up to
    6 GHz to cover the immunity requirements of radio services in the frequency range
    2,7-6 GHz\r\n-\tEFT pulse repetition rate on signal ports: 100 kHz frequency to
    be adopted for xDLS ports\r\n-\tPerformance criteria for power supply equipment:
    the power systems with output up to 400 V- DC (ref.: EN 330132-3-1) have to be
    included\r\n"
