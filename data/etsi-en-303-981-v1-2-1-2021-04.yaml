  content: "The proposed standard, similar to EN303980, will update the technical
    characteristics envelope to accommodate other designs of terminals operating in
    the same bands.\r\nThe proposed document will cover the essential requirements
    of article 3.2 of Directive 2014/53/EU.\r\nAt conclusion, TC-SES may decide to
    incorporate the material as revisions to EN303980 or to adopt it as a new standard."
