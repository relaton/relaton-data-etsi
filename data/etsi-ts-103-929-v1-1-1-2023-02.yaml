  content: This NWI enables to provide mapping tables to show which security requirements
    and provisions from the IEC 62443-4-2 and the EN 303 645, respectively, cover
    the specific requirements from the standardization request for the RED articles
    3(3)(d), 3(3)(e) and 3(3)(f) and are therefore relevant to fulfill the essential
    requirements given by the RED articles 3(3)(d), 3(3)(e) and 3(3)(f) (see alignment
    documents as additional contribution).
