abstract:
- language: en
  script: Latn
  content: "Scope\r\nTo provide a first set of definitions on spectral management
    quantities, including:\r\nA description of the technical purpose of Spectral Management\r\nA
    common reference model, definitions of LT-ports, NT-ports, upstream and downstream,
    etc.\r\nA minimum set of characteristics necessary to describe signals within
    the context of Spectral Management\r\nAn initial informative library of electrical
    signals that may flow into the ports of a metallic access network\r\nObjective\r\nTo
    be a clear reference to simplify & harmonize the description of network specific
    spectral management documents, without making any specific choice on the technology
    mix that may use the access network. \r\n\r\n \r\n\r\n"
