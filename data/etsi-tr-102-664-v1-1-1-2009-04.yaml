abstract:
- language: en
  script: Latn
  content: The new TR 102 7xx explains the need for flexible and complementary approaches
    for SRR in the frequency range from 24 GHz to 29 GHz. This is needed to meet industry
    requirements for continued deployment of UWB SRR which otherwise risks the discontinuation
    of the SRR technology because of the 2013 time limit, which does not take into
    account the long automotive development cycles and timely availability of the
    79 GHz technology.
