abstract:
- language: en
  script: Latn
  content: "This technical report will serve as a guidance document to help manufacturers
    and other stakeholders to meet the provisions defined for Consumer IoT devices
    in EN 303 645 and TS 103 645.\r\n\r\nThis work is complementary to EN 303 645
    and TS 103 701. The relationship between these specifications and how they can
    be used together will be explained. A non-exhaustive set of example implementations
    that meet the provisions will be provided. Not all possible implementations will
    be included. Pointers to supporting specifications will be included where relevant.
    Usage by industry players as well as future development of standards will be considered
    (e.g. specialisation for specific use cases, certification aspects).\r\n"
