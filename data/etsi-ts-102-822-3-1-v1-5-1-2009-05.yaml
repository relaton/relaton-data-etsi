    MetadataOriginationInformationType - Change fragment identification mechanism\r\n-
    MetadataOriginationInformationType - Add attribute\r\n- TVARoleCS - Add new terms\r\n-
    TVAMainType - change originID reference\r\n- ServiceInformationType - Add element\r\n-
    ServiceInformationType - Add element"
