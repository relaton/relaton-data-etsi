abstract:
- language: en
  script: Latn
  content: "T3#8: Joint rapporteurs: Lindholm, Rune & Vestergaard, Peter\r\n___________________\r\nJustification
    and scope\r\nThis work item creates a specification for the physical and logical
    characteristics for the 3GPP IC card and its interface to the 3GPP terminal. It
    will serve as a general platform for applications residing on such cards. The
    present document defines the electrical and physical characteristics of the IC
    card - Terminal Interface. It defines the logical characteristics of a telecommunications
    IC card. It specifies the electrical and physical requirements necessary for interoperation
    of IC cards and terminals.\r\n3GPP Work Area: - TSG-T WG3\r\nLinked work items:
    - USIM and UICC requirements; - USIM Characteristics.\r\nService Aspects: - None
    \r\nMMI-Aspects: - None\r\nCharging Aspects: - None\r\nSecurity Aspects: - The
    document specifies general security aspects of IC cards such as file access conditions.
    Note: specific USIM security aspects are dealt with in the \"USIM characteristics\"
    work item. \r\nImpacts: - Affects: - USIM; - ME.\r\nPrimary responsibility: -
    3GPP TSG-T  WG3 (USIM)\r\n\r\n"
