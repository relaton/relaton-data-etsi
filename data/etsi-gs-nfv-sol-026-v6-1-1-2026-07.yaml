abstract:
- language: en
  script: Latn
  content: The work item will develop the protocol and/or data model specifications
    fulfilling the requirements and service interface specifications for PIM services
    specified in ETSI GS NFV-IFA 053. This work item will use the analysis of existing
    solutions performed in ETSI GS NFV-IFA 053 to profile PIM service interfaces and
    their operations to the analyzed solutions, wherever applicable. Furthermore,
    the WI might also specify relevant descriptors for management of physical resources
    after investigating relevant solutions and approaches in the industry around descriptor-based
    infrastructure management, and/or relevant protocol and data model solutions if
    profiling is not possible for some PIM services. The resulting deliverable will
    contain normative provisions.
