abstract:
- language: en
  script: Latn
  content: "(1) To consider the inclusion of alternative test methods and where appropriate
    to further improve existing test methods.\r\n(2) To improve the politeness of
    existing adaptive and non-adaptive mechanisms and/or to consider the inclusion
    of alternative automatic and polite adaptive mechanisms. The objective is to ensure
    equal access to all users of the spectrum and in case of congestion a graceful
    degradation of service to all.\r\n(3) To include requirements such as receiver
    parameters required by Directive 2014/53/EU and to prepare this EN as Harmonized
    Standard under Directive 2014/53/EU (Radio Equipment Directive)."
