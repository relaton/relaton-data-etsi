abstract:
- language: en
  script: Latn
  content: "This Global System for Mobile communications Technical Specification (\r\nGTS)
    describes the feature Network Identity and Timezone (NITZ).\r\nThis feature provides
    the means for serving PLMNs to transfer current\r\nidentity and the local timezone
    to Mobile Stations (MS)s, and for the\r\nMSs to store and use this information.
    This enhances roaming by permit\r\nting accurate indication of PLMN identities
    that are either newer than\r\nthe Mobile Equipment (ME) or have changed their
    name since the ME was\r\nsold. Additionally timezone information can be utilized
    by MEs as des\r\nired.\r\n"
