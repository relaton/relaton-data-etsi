abstract:
- language: en
  script: Latn
  content: The present document specifies a SAREF extension to unify and federate
    heterogeneous Device Management (DM) solutions. The proposed resources allow the
    selection of the most relevant execution path to execute a DM command on a device,
    and the representation of the information retrievable from a device integrated
    in a DM solution.
