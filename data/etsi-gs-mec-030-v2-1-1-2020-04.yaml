abstract:
- language: en
  script: Latn
  content: This work item intends to introduce a Vehicular-to-Everything (V2X) MEC
    service, in order to facilitate V2X interoperability in a multi-vendor, multi-network
    and multi-access environment. It describes the V2X-related information flows,
    required information and operations. The present document specifies the necessary
    API with the data model and data format.
