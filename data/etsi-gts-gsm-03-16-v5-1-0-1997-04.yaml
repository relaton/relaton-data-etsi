abstract:
- language: en
  script: Latn
  content: "This Technical Specification (TS) gives the stage 2 description of the\r\nsubscriber
    data management handling between the Home Location Registe\r\nr (HLR) and the
    Visitor Location Register (VLR).\r\nA number of procedures require updating of
    subscriber information from\r\nHLR to VLR:\r\n- location updating;\r\n- restoration;\r\n-
    modification of data by the operator;\r\n- modification of data by the subscriber
    via the Mobile Station (MS).\r\nOnly the rules for the updating of subscriber
    data from the HLR to the\r\nVLR are described in this specification. Public Land
    Mobile Network (\r\nPLMN) specific and Unstructured Supplementary Service Data
    (USSD) subs\r\ncriber data are out of scope of this specification.\r\n "
