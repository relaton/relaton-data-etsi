  script: Latn
  content: "This revision of NFV-SOL 005 continues the development of the specification
    as part of the NFV Release 5. This edition will extend the specification of protocol
    and data models to support the Release 5 features. The scope of the former edition
    is summarized hereafter:\r\n\r\nNFV-SOL 005 specifies a set of RESTful protocol
    specifications and data models fulfilling the requirements specified in ETSI GS
    NFV-IFA 013 for the interfaces used over the Os-Ma-nfvo reference point."
