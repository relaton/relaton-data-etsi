abstract:
- language: en
  script: Latn
  content: "The goal of TS 103 433 V1.1.1 was to standardize a single layer HDR system
    addressing direct backwards compatibility i.e. a system leveraging SDR distribution
    networks and services already in place and that enables high quality HDR rendering
    on HDR-enabled CE devices including high quality SDR rendering on SDR CE devices.
    \r\nThe goal of the present work item is to produce a revision of the referenced
    standard that includes some fixes and also some enhancements. Examples for enhancements
    are a default mode that works only with static metadata and an improved BT.709
    to BT.2020 gamut mapper.\r\nA second goal of the work item is to transform the
    above referenced specification into a multi-part specification with a slightly
    modified title. The result of this work item shall become TS 103 433-1 (Part 1)."
