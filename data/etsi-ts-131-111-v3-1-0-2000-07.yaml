abstract:
- language: en
  script: Latn
  content: "- Justification and scope\r\nThis work item (Tdoc T3-99328) creates a
    specification for an application execution environment for the 3G UICC and its
    interface to the 3G terminal, based on GSM 11.14 (SIM Application Toolkit).\r\nThe
    document defines requirements of the USIM and the interface to the 3G Terminal
    in relation to the USIM Application Toolkit. These are derived from the service
    and security requirements defined in 3G TS 22.100 and 22.101. The document defines
    commands and procedures in both the USIM and 3G Terminal for using the USIM Application
    Toolkit. \r\n- Linked work items: 3G TS 31.101 \"UICC / terminal interface; physical
    and logical characteristics\",  3G TS 31.102 \"Characteristics of the USIM\",
    \ 3G TS 22.121 \"Virtual Home Environment\"\r\n- Service aspects: Service requirements
    from 3G TS 22.038, 22.100 and 22.101 and  shall be taken into account.\r\n- MMI-aspects:
    None.\r\n- Charging aspects: Chargeable aspects shall be identified and charging
    mechanisms shall be taken into account. \r\n- Security Aspects: Security Requirements
    from TSG-SA WG3 shall be taken into account.\r\n- Impacts : Affects: USIM, ME,
    NW \r\n___________________\r\nSupporting organisations: NTT DoCoMo, De La Rue,
    Vodafone, Mitsubishi Electric, G&D, Gemplus."
