abstract:
- language: en
  script: Latn
  content: The present document studies interface and protocol design for supporting communication between an AI Agent and other entities in a mobile network. These include other AI agents, tools, and data sources, agent repository function for centralized management of AI agents, user equipments (UEs), 3rd party applications, and network infrastructure (such as base station, computing platform). Moreover, the document analyses the gap between the supported features of existing protocols, such as the A2A and model context protocol (MCP), and the requirements of agent interface and protocol design in the context of telecommunications. Based on the analysis, it describes the key characteristics of each interface type and specifies the required methods and data objects in an agent-based mobile network architecture. Moreover, various examples are provided to demonstrate the communication via the designed protocol and interfaces in action.
