abstract:
- language: en
  script: Latn
  content: " As described in the informative GS NFV MAN 001, Os-Ma-nfvo is a reference
    point between the OSS and the NFV Orchestrator. This reference point is used for
    all management interactions between OSS and the NFV-specific management framework,
    and mainly used for the lifecycle management Network Services (a group of VNFs
    with defined relationship between them).The scope of the Work Item will include
    the detailed functional and information requirements of all NFV management interfaces
    over the reference point Os-Ma-nfvo, based on which complete interfaces technical
    specifications can subsequently be defined, for interoperability purposes.  The
    results of the work item will include: \r\n• Detailed description of interfaces
    and its operations functionality.\r\n• Detailed information model requirements
    of related NS lifecycle management interfaces, for: \r\n- Management of NS Descriptor
    and VNF Packages; \r\n- Lifecycle management of Network Services, including the
    instantiation, modification, update, scaling, and termination, testing of NSs.
    \r\n- Lifecycle change notifications of NSs. \r\n• Complete and detailed information
    model requirements of other related NFV management interfaces, for: \r\n- NS monitoring
    (e.g. NS fault information retrieval and management, NS performance information
    retrieval and management). \r\n- Policy Management \r\n• Detailed information
    model requirements of any other NFV management interfaces (new and/or previously
    described in GS NFV MAN 001) needed to be exposed between OSS and NFVO in support
    of necessary OSS-driven E2E operations. \r\n• Validation of interface operations
    and information model requirements against end-to-end flows. \r\n\r\nData models/schemas
    and protocols needed to implement the detailed functional requirements are not
    covered in this deliverable. The WI will leverage GS NFV MAN001, and will consider
    any applicable other guidelines, studies and requirements as appropriate.  The
    deliverable will contain normative provisions."
