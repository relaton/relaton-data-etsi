abstract:
- language: en
  script: Latn
  content: "This task will produce guidance on cryptographic suites based on ETSI
    TS 102 176 and inputs from national cryptographic recommendations including but
    not limited to France (ANSSI RGS) and Germany (BSI catalog). It will also consist,
    compared to ETSI TS 102 176, in an update including guidance for use of cryptographic
    suites in signature creation devices and other related devices). \r\nThe working
    group should be formed by cryptographic experts from various countries where cryptographic
    recommendations are expressed, including at least France (ANSSI RGS) and Germany
    (BSI catalog) but not limited to those countries and ideally benchmarking to other
    EU MS national rules in that matter.\r\nIt should be a subset of all existing
    national catalogs to guarantee compliance with national law and national evaluation
    bodies recommendations.\r\nThe presentation and maintenance mechanisms will also
    be further addressed."
