abstract:
- language: en
  script: Latn
  content: "Data link technology improves the efficiency of communications between
    controllers and pilots through supplementing voice communications with air-ground
    data link communications. On 30 September 2008 the Single Sky Committee has given
    a favourable opinion on the Implementing Rule on Data Link Services (DLS) in which
    the coordinated introduction of data link based on air-ground point-to-point data
    communications is described from 2011 onwards. The deployment of data link will
    also be the first major achievement that contributes to the first implementation
    package (IP1) of the European Air Traffic Management Master Plan (the ATM Master
    Plan).\r\nThe Implementing Rule on Data Link Services (DLS) is requiring the following
    services that should be operated over an ATN (Aeronautical Communication Network(
    and VDL (Very High Frequency Digital Link) Mode 2 infrastructure:\r\n1.     DLIC
    - Data Link Initiation Capability (log on and contact)\r\n2.     ACM - Air Traffic
    Control (ATC) Communications Management\r\n3.     ACL - Air Traffic Control (ATC)
    Clearances\r\n4.    AMC - Air Traffic Control (ATC)  Microphone Check\r\nThe related
    European standards will be developed in accordance with the implementing rule
    on data link services and in line with the EUROCONTROL Specification on Data Link
    Services.\r\n"
