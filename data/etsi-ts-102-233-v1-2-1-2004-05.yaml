abstract:
- language: en
  script: Latn
  content: "This document shall contain a stage 1 description of the interception
    information in relation to the process of sending and receiving e-mail. The document
    gives a stage 2 description of when IRI and CC shall be sent, and what information
    it shall contain. \r\nThe study shall include but not be restricted to SMTP and
    POP3. \r\nThe definition of handover (i.e. transport) of HI2 and HI3 is outside
    the scope of this document. Refer to DES/SEC 003020.\r\n"
