abstract:
- language: en
  script: Latn
  content: "This document shall contain a stage 1 description of the interception
    information in relation to the process of binding a “target identity” to an IP
    address. The document gives a stage 2 description of when IRI shall be sent, and
    what information it shall contain. \r\nThe study shall include but not be restricted
    to DHCP and Radius. \r\nThe definition of handover (i.e. transport) of HI2 and
    HI3 is outside the scope of this document. Refer to DES/SEC 003020.\r\n\r\nFor
    information\r\nThe work item shall consider the authentication methods listed
    above in the context of (amongst others) the following access services: \r\nInternet
    access via dial-up modem. \r\nInternet access via ADSL\r\nInternet access via
    cable modem\r\nInternet access via IEEE 802.11b with the WiFi profile\r\n"
