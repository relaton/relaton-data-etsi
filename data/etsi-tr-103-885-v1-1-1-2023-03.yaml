abstract:
- language: en
  script: Latn
  content: Existing spectrum sharing frameworks (e.g. CBRS, LSA and eLSA) shall be
    evaluated with regard to their suitability for temporary and flexible spectrum
    access. To evaluate such suitability, the study shall identify and assess properties
    and parameters (e.g., for scalable localized dedicated networks) that need to
    be considered. It includes a gap analysis to identify further improvements in
    the definition of requirements, system architectures and functionalities for spectrum
    access for on-demand use cases. This scope includes nomadic deployments.
