abstract:
- language: en
  script: Latn
  content: "The work item will specify the NFV object model for OS container management
    and orchestration and normative requirements applicable to interfaces exposing
    OS container management and orchestration services to NFV-MANO and other consuming
    entities. The requirements apply to the service interfaces to be offered by architectural
    elements providing the Container Infrastructure Service Management (CISM) and
    Container Image Registry functions described in ETSI GR NFV-IFA 029.\r\nThe resulting
    deliverable will contain normative provisions."
