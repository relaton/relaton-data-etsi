abstract:
- language: en
  script: Latn
  content: "This specification describes the network feature Operator Determined\r\nBarring
    (ODB).\r\nThis allows the network operator or service provider to regulate, by\r\nmeans
    of an exceptional procedure, access by the subscribers to GSM\r\nservices, by
    the barring of certain categories of outgoing or incoming\r\ncalls or of roaming.
    ODB shall take effect immediately and shall\r\nterminate ongoing calls and bar
    future calls.\r\nThe purpose of this network feature is to be able to limit the
    service\r\nprovider s financial exposure to new subscribers, or to those who have\r\nnot
    promptly paid their bills. It may only be applied to the service\r\nprovider s
    own subscribers.\r\n "
