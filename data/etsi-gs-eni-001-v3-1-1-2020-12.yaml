abstract:
- language: en
  script: Latn
  content: "The WI will identify and describe additional use cases and scenarios that
    are enabled with enhanced experience, through the use of network intelligence,
    in particular the technologies studied in the new work items (e.g., intent networking)
    in the same phase of ENI.   The specification will give the baseline on how the
    studies in ENI can be applied as solutions of the identified use cases in accordance
    with the ENI Reference Architecture, and will substantially benefit the operators
    and other stakeholders. \r\n \r\nIn Release 2 the WI will add additional use cases,
    as well as the use of ENI in the network and for third parties, including the
    use of ENI in intent-based networks and capability exposure to third parties,
    and other aspects of ENI application as it evolves.  \r\n"
