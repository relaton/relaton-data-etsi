abstract:
- language: en
  script: Latn
  content: "ETSI SCP REQ produced requirements for a high speed UICC-Terminal interface
    and ETSI SCP #28 selected USB as the underlying technology for this interface.\r\nIn
    light of the above, this work item will produce the technical specification for
    this new high speed interface, preserving compliance with USB technology and allowing
    backward compatibility with TS 102 221 based devices and applications.\r\nCRs
    to TS 102 221 may also be produced to define co-existence of the two interfaces.\r\n"
