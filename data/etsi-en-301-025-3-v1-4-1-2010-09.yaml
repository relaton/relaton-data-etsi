abstract:
- language: en
  script: Latn
  content: "The present document covers the minimum requirements for general communication
    for shipborne fixed installations using a VHF radiotelephone operating in certain
    frequency bands allocated to the maritime mobile service using both 25 kHz and
    12,5 kHz channels with associated equipment for DSC - class D.\r\nThe present
    document is intended to cover the provisions of Directive 1999/5/EC [1] (R&TTE
    Directive) article 3.3 (e), which states that radio equipment within the scope
    of the present document shall be so constructed that: \"it supports certain features
    ensuring access to emergency services\".\r\nIn addition to the present document,
    other ENs that specify technical requirements in respect of essential requirements
    under other parts of article 3 of the R&TTE Directive [1] will apply to equipment
    within the scope of the present document.\r\n\r\n"
