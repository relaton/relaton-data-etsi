abstract:
- language: en
  script: Latn
  content: "To provide information describing an ADSL system operating on European
    networks. The work aspects related to this mode of operation will be coexistence
    of ADSL with ISDN BRA line systems and ADSL extended bit rates. The outcome of
    this work may result in a revision of ETR 328 and/or a new annex for version 3
    of ANSI T1.413.\r\n"
