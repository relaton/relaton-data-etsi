abstract:
- language: en
  script: Latn
  content: "This Technical Specification (TS) defines the interfaces and Terminal
    Adaptation Functions (TAF) integral to a Mobile Termination (MT) which enables
    the attachment of asynchronous terminals to a MT (see GSM 04.02 [4]). The general
    aspects of Terminal Adaptation Functions are contained in GSM 07.01 [7]. This
    TS covers support of these services for the following interfaces and procedures:\r\n(i)V.14
    procedures\r\n(ii)V.21 DTE/DCE interface\r\n(iii)V.22bis DTE/DCE interface\r\n(iv)V.23
    DTE/DCE interface\r\n(v)V.32 DTE/DCE procedures\r\n(vi)I.420 S interface\r\n(vii)V.25bis
    signalling procedures\r\n(viii)V.25ter signalling procedures\r\n\r\nThe asynchronous
    data rates between the MT and the TE2 are defined in GSM 02.02 [2].\r\n"
