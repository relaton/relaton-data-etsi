abstract:
- language: en
  script: Latn
  content: "Inclusion of MD metrics on eMBB, with further extension to URLLC and mMTC
    to be evaluated during the WI in accordance with the developments in WI DTR/EE-EEPS58\r\noInvestigate
    on the definition of new EE KPIs which consider aspects such as e.g. coverage
    area, user experience, reliability of URLLC network slice,\r\noSpecify new EE
    KPIs for network slices, e.g.: EE KPI for V2X, EE KPI for URLLC based on reliability\r\noCloud
    computing for Core network consumption\r\noInsert formula to calculate network
    carbon emission and carbon emission factor identification: national statistics,
    regional statistics, commercial agreement (PPA), renewable energy produced locally\r\n\r\n"
