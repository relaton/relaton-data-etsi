abstract:
- language: en
  script: Latn
  content: 'Updates to ETSI TS 103 190-2, defining an Audio CMAF Media Profile, as
    specified in ISO/IEC 23000-19: "Information technology - Multimedia application
    format (MPEG-A) - Part 19: Common media application format (CMAF)", defining signaling
    according to ISO/IEC 23009-1: "Information technology - Dynamic adaptive streaming
    over HTTP (DASH) - Part 1: Media presentation description and segment formats",
    updating of object metadata to match with ETSI TS 103 448 and with changes in
    ITU BS.2076 (ADM), and editorial improvements.'
