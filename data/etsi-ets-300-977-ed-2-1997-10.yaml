abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) defines the interface b\r\netween
    the Subscriber Identity Module (SIM) and the Mobile Equipment (\r\nME) for use
    during the network operation phase of GSM as well as those\r\naspects of the internal
    organization of the SIM which are related to\r\nthe network operation phase. This
    is to ensure interoperability betwee\r\nn a SIM and an ME independently of the
    respective manufacturers and op\r\nerators. The concept of a split of the Mobile
    Station (MS) into these\r\nelements as well as the distinction between the GSM
    network operation\r\nphase, which is also called GSM operations, and the administrative
    man\r\nagement phase are described in the GSM 02.17 [6].\r\nThis ETS defines:\r\n-\tthe
    requirements for the physical characteristics of the SIM, the el\r\nectrical signals
    and the transmission protocols;\r\n-\tthe model which shall be used as a basis
    for the design of the logic\r\nal structure of the SIM;\r\n-\tthe security features;\r\n-\tthe
    interface functions;\r\n-\tthe commands;\r\n-\tthe contents of the files required
    for the GSM application;\r\n-\tthe application protocol.\r\nUnless otherwise stated,
    references to GSM also apply to DCS 1 800.\r\nThis ETS does not specify any aspects
    related to the administrative ma\r\nnagement phase. Any internal technical reallocation
    of either the SIM\r\nor the ME are only specified where these reflect over the
    interface. T\r\nhis ETS does not specify any of the security algorithms which
    may be u\r\nsed.\r\nThis ETS defines the SIM/ME interface for GSM Phase 2. While
    all attem\r\npts have been made to maintain phase compatibility, any issues that
    sp\r\necifically relate to Phase 1 should be referenced from within the rele\r\nvant
    Phase 1 specification.\r\n"
