abstract:
- language: en
  script: Latn
  content: The work item will carry out the necessary adaptations to 3GPP TS.29.162
    to meet the needs of the NGN framework. In particular, the procedures performed
    at IBCF and I-BGF level replacing and extending those respectively of the IMS-ALG
    and TrGW, shall be described.  Both PES and IMS shall be taken into account.
