abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) specifies the stage one\r\n
    description of the Voice Broadcast Service (VBS) which allows the dist\r\nribution\r\nof
    speech (or other signals which can be transmitted via the speech co\r\ndec),\r\ngenerated
    by a service subscriber, into a predefined geographical area\r\nto all\r\nor a
    group of service subscribers located in this area.\r\n[Remark: A similar service
    might be provided for the distribution of d\r\nata\r\nmessages. This service is
    not treated in the present stage 1 descripti\r\non.\r\nHowever, the principle
    requirements and realizations should be co-ordi\r\nnated and\r\nsynergies with
    the respective work item on General Packet Radio Servic\r\ne (GPRS)\r\nregarded.]\r\nThe
    Voice Broadcast Service (VBS) is applicable to all mobile stations\r\nin a\r\ncertain
    network and area which have the technical capability and the r\r\nespective\r\nsubscription
    to receive a VBS call.\r\nNOTE:\tIt is not considered as requirement that normal
    GSM phase 2 mobi\r\nle\r\nstations will be able to be used for this service.\r\nThe
    service is described from the service subscriber s and user s poin\r\nt of\r\nview;
    in particular:\r\n-\tthe procedure for normal operation with successful outcome;\r\n-\tthe
    action to be taken in exceptional circumstances;\r\n-\tthe interaction with other
    GSM services and features.\r\nThis ETS does not deal with the Man-Machine Interface
    (MMI) requiremen\r\nts, but\r\nmakes reference to the appropriate Global System
    for Mobile communicat\r\nions\r\n(GSM) specifications.\r\nThis ETS defines a teleservice
    of the digital cellular telecommunicati\r\non system\r\nGSM. Any interaction with
    other services and/or networks not dealt wit\r\nhin\r\nclauses 8 or 9 are outside
    the scope of this ETS.\r\n  "
