abstract:
- language: en
  script: Latn
  content: This standard specifies signalling interworking between QSIG and SIP in
    support of basic services within a Corporate telecommunication Network (CN). It
    is applicable to any interworking unit that can act as a gateway between a PISN
    employing QSIG and a corporate IP network employing SIP.
