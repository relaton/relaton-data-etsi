abstract:
- language: en
  script: Latn
  content: Maintaining the scope agreed for ITS Release 1 this revision addresses
    requested clarifications arising from industry review. For example, the document
    mentions a specific radio access technology, i.e. ITS-G5, in its normative text
    and it should be agnostic regarding this matter. The clarifications may lead to
    technical corrections and to address changes to reference appropriate parts of
    the upcoming IEEE 1609.2.1 and make TS 102 941 agnostic of the underlying access
    layer. Each requested change shall be reviewed in independent Change Requests
    (CRs) and only added after CR approval
