abstract:
- language: en
  script: Latn
  content: "Public Network Operators (PNOs) are implementing auto-discovery tools
    to capture an instant picture of their working equipment. The effectiveness of
    auto-discovery tools relies upon the information contained in the Management Information
    Base (MIB).\r\nMany PNOs are experiencing difficulties in linking the data obtained
    from the MIB to their inventory systems in order to get the full picture of working/spare
    equipment and discover discrepancies.\r\nThe lack of data structure and content
    prevent PNOs from having automated information flow from the equipment MIB to
    the inventory or other relevant systems.\r\n\r\nThe Technical Specification “Equipment
    Information in the Management Information Base (MIB) of the Network Elements”
    will specify the type and semantics of equipment related information in the MIB.
    \r\n"
