abstract:
- language: en
  script: Latn
  content: "To specify the MPEG compliant SEI carriage of the ST-2094-10 Dynamic Metadata
    taking into consideration similar standards being developed in other SDOs to avoid
    unnecessary complexity in Integrated Receiver / Decoder (IRD) implementations.\r\nTo
    describe the signalling of SMPTE ST-2094-10 HDR dynamic metadata, using methods
    compatible with an EN 300 468 compliant MPEG-2 Transport Streams and TS 103 285
    compliant MPEG DASH Profile for Transport of ISO BMFF Based DVB Services over
    IP Based Networks.\r\n"
