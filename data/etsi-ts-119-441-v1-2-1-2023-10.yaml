abstract:
- language: en
  script: Latn
  content: "Reformulate the requirements for qualified signature validation service
    providers (QSVSP) in annex B such that:\r\n1) It is clear that for a QSVSP, all
    requirements for a SVSP apply;\r\n2) Make clear what are the additional requirements.
    \r\nThis might be done by adding a note, and using the notation [QSVSP] instead
    of \" [CONDITIONAL] If the SVSP is a QSVSP\""
