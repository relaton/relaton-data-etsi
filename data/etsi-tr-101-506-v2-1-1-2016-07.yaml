abstract:
- language: en
  script: Latn
  content: 'The 2014/53/EU Directive (RED) will repeal the R&TTE Directive. Art 3.2
    in the new RED has been modified in the text, in particular adding RX importance
    to efficient use of the spectrum. It is necessary to review the content of TR
    101 506 to formally reflect WG TM4 view on the essential parameters to be included
    in the new HS under the new Directive for fulfilling the art 3.2 essential requirements.
    Starting point and further consideration based on:  - the latest revision of EG
    201 399 (v3.1.1), revised for preliminary RED guideline  - the draft EG 203 336
    with which the version of the TR should finally be consistent. Overall objective
    is to maintain a “real-time” suitable TM4 technical guideline (in line with other
    ETSI guideline documents available) while the required HS under the new RED are
    being developed and approved for ENAP.'
