abstract:
- language: en
  script: Latn
  content: "This revision of NFV-SOL 006 propagates the deliverable into NFV Release
    3. \r\nThis edition will add requirements and specification of interfaces to support
    the Release 3 features, and it will extend the scope of the former Release 2 edition
    summarized hereafter:\r\n\r\nSOL006 specifies the YANG models for representing
    Network Functions Virtualisation (NFV) descriptors, fulfilling the requirements
    specified in ETSI GS NFV-IFA 011 and ETSI GS NFV-IFA 014 applicable to a Virtualised
    Network Function Descriptor (VNFD), a Physical Network Functions Descriptor (PNFD)
    and a Network Service Descriptor (NSD).\r\n\r\nThis revision of NFV-SOL 006 will
    address the Release 3 candidate features listed in Annex B of the Release 3 Definition.\r\nThis
    revision will reflect the maintenance performed to associated NFV Release 2 documentation."
