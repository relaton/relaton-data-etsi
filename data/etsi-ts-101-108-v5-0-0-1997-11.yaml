  script: Latn
  content: "This standard specifies the stage 1 description for the Tandem Free Op\r\neration
    feature which provides the capability to avoid using two GSM s\r\npeech codecs
    in mobile to mobile speech calls.  The primary aim is to\r\nrealise improvements
    in speech quality.  The TFO mode of operation cou\r\nld also be used to reduce
    inter-MSC transmission bandwidth requirement\r\ns.\r\n"
