abstract:
- language: en
  script: Latn
  content: "“The present document investigates the addition of a new ENI Internal Functional Block called CoordOME to the existing ENI Internal Functional Blocks. All ENI Internal Functional Blocks collaborate and coordinate their actions using the ENI Semantic Bus. CoordOME is scoped as a multi-objective optimization component; responsibilities for semantic reasoning, policy enforcement, and knowledge management remain with their respective existing Functional Blocks. The present document describes how CoordOME enables multiple elements within and external to it to collaborate to produce a solution to a set of tasks. It surveys application scenarios for multi-element coordination orchestration, analyzes candidate optimization algorithms appropriate to each scenario, describes element information models, and studies the impact of CoordOME on the ENI System Architecture.”\r\n\r\n"
