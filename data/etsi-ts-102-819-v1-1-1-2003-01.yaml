abstract:
- language: en
  script: Latn
  content: "GEM is a specification which defines the APIs, semantic guarantees, and
    content formats that can be relied upon in all interactive television standards
    and specifications that support globally-interoperable MHP applications. GEM is
    not a terminal specification, rather it requires other normative references in
    order to construct a terminal.\r\n"
