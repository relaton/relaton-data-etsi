  content: "This ETS defines Terminal Adaptation Functions (TAF) which are integra\r\nted
    in a Mobile Termination (MT) and which enable the attachment of Sy\r\nnchronous
    Terminals to an MT (see GSM 04.02 [4]). The general aspects\r\nof Terminal Adaptation
    Functions are contained in specification GSM 07\r\n.01 (ETS 300 913) [8]. This
    ETS covers support of synchronous data ser\r\nvices (see GSM 02.02 (ETS 300 904)\r\n"
