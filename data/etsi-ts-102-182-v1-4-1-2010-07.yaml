abstract:
- language: en
  script: Latn
  content: The document gives an overview of the requirements for communication from
    authorities/organizations to citizens in all types of emergencies. It collects
    operational and organizational requirements as a basis for a common notification
    service, including targeting of the area to be notified. This Work-item will revise
    the current TS to add parameterisation of the requirements and any additional
    requirements discovered.
