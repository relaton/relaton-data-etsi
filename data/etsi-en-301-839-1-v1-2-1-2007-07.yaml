abstract:
- language: en
  script: Latn
  content: "EN 301 839 shall be revised:\r\n1. Generic definitions shall be used and
    inconsistencies be removed in EN 301 839-1 and -2. \r\n2. At present EN 301 839-1
    describes LBT as interference mitigation technology. It is suggested that also
    an alternative interference mitigation technology is introduced in EN 301 839-1.
    Possible candidates for this interference mitigation technology are:\r\na duty
    cycle limitation to less than 0.1%\r\na duty cycle limitation to less than 0.1%
    on one channel (300 kHz bandwidth)\r\na power reduction to less than 250 nW\r\nDevices
    respecting this interference mitigation technology can coexist with devices using
    LBT.\r\nNote: subject referred to RM for considerations as agreed at ERM#23 (see
    summary record)"
