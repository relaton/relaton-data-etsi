abstract:
- language: en
  script: Latn
  content: "The present document defines a framework to be used by ETSI ISG ZSM to
    coordinate and promote multi stakeholder Proofs of Concept (PoC) projects illustrating
    key aspects of ZSM. Proofs of Concept are an important tool to demonstrate the
    viability of a new technology during its early days and or pre-standardisation
    phase. \r\nThe main objectives of the ZSM PoC framework are:\r\n•\tto ensure the
    PoC projects are scoped around relevant topics for ISG ZSM that require from-the-field
    input;\r\n•\tto ensure that the PoC results, lessons learnt and identified gaps
    are feedback to ISG ZSM;\r\n•\tto build confidence on the viability of ZSM;\r\n•\tto
    encourage the development of a diverse and open ecosystem by fostering the integration
    of components from different players;\r\n•\tto support standardization and industry
    promotion activities of ISG ZSM.\r\nThis framework describes:\r\n•\tThe different
    roles and responsibilities in the PoC activity process.\r\n•\tThe PoC activity
    process.\r\n•\tThe acceptance criteria for PoC proposals and reports.\r\n"
