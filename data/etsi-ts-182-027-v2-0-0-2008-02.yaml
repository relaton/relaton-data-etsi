abstract:
- language: en
  script: Latn
  content: "The scope of this work item is to specify the architecture and functions
    of an IPTV system that makes use of the NGN IMS architecture and its features.\r\nFocus
    should be on integrating IPTV solutions defined by other organizations (such as
    DVB, ATIS IIF etc) with an IMS based architecture. \r\nThe resulting architecture
    should, by relying as much as possible on common components, coexist with other
    TISPAN NGN services.\r\nThe following are examples of NGN and IMS features that
    should be taken advantage of: \r\n·User and Network mutual Authentication\r\n·IMS
    Trust model\r\n·Capability exchange\r\n·Multimedia Session Control\r\n·Charging\r\n·User
    Profiles\r\n·Interaction with other NGN Services\r\n"
