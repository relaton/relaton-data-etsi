abstract:
- language: en
  script: Latn
  content: "Preparation of a new version of ES 202 336-1 to incorporate the following:\r\n·Amendment
    and update references to sub parts of the standard. This to include correction
    of document titles and numbering to align with the present structure.\r\n·Addition
    of a new section to cover the requirements of control system sensors and actuators.\r\n·Update
    section 9.4.2 “alarm and event message” to align with other parts of the standard.\r\n·Provide
    XSD file allowing XML files to be checked.\r\nOther editorial and technical changes
    necessary to ensure the core part of this standard relates fully and correctly
    to all sub parts. The extent of this work will only become clear when the document
    is reviewed."
