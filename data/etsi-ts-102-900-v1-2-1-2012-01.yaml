abstract:
- language: en
  script: Latn
  content: "Currently ETSI TS 102 900 specifies that EU-Alert shall support multiple
    languages. However, it doesn’t specify how that shall be done. The reason is that
    EU-Alert shall be compatible with CMAS and ATIS/TIA had not yet specified how
    languages besides English shall be supported. ATIS is currently specifying the
    support for Spanish next to English, but ATIS is not specifying how to support
    more languages besides English and Spanish, since that is not within their scope.
    \r\nIt is in the scope of ETSI 102 900, and this work item intends to specify
    how multiple languages shall be supported, while remaining compatible with the
    ATIS specification."
