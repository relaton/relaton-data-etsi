abstract:
- language: en
  script: Latn
  content: "Close gaps in TS 183 036 Release 2 and ensure alignment with TS 183 043
    Release 3 and alignment with 3GPP MMtel specifications.\r\nThis includes but is
    not limited to:\r\n1. Adding new interworking for CCBS/CCNR, MWI and CW.\r\n2.
    Change the indication of unavailable identity in case of CLIP and COLP to be \r\n
    \   compliant with PES as an essential correction.\r\n3. Adding the capability
    to activate specific services using the Keypad protocol."
