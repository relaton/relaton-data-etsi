abstract:
- language: en
  script: Latn
  content: "This  document defines a baseline set of capability requirements that
    enable all terminals to  \"register\" with all applicable 3GPP networks (depending
    on the availability of a appropriate subscription). It describes all the functions
    that a terminal must perform in order to \"exist\" within a 3GPP network. These
    functions are used to derive requirements for all aspects of terminal baseline
    capability. This document also identifies different service capabilities and the
    functions that a terminal must perform in order to access a service. The actual
    capabilities that a terminal must posses to meet these requirements are listed
    in the Annexes to this document and described in the referenced implementation
    specifications. \r\nThis document introduces the concept of  \"service-less terminal\"
    which can exist in the network but provides no user service. Although this is
    not a marketable terminal type it describes from the standardisation viewpoint
    a baseline set of capabilities to which specific service-related terminal capabilities
    can then be added."
