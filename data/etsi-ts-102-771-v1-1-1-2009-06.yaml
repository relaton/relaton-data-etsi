abstract:
- language: en
  script: Latn
  content: "The present document gives guidelines for the implementation of the Generic
    Stream Encapsulation (GSE) Protocol.\r\nThe guidelines are intended to be recommended
    rules, advice and good practices for the usage of the GSE specifications defined
    in TS 102 606, in order to assist systems integrators and equipment manufacturers.
    As such, they aim at facilitating the efficient and reliable implementation of
    GSE."
