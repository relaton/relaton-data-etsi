abstract:
- language: en
  script: Latn
  content: "Specify technical parameters for high capacity DRRS operating in\r\nfrequency
    bands with 40 MHz channel spacing e.g. 4GHz, 5GHz, 6GHz and\r\n11GHz bands, transmitting
    four STM-1 signals (STM-4) per 40 MHz RF\r\nchannel by using both polarizations
    in the co-channel dual polarized\r\n(CCDP) mode. The system is intended for operation
    on trunk routes.\r\n "
