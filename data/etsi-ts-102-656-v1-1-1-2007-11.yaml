abstract:
- language: en
  script: Latn
  content: "The present document gives guidance for the delivery and associated issues
    of retained data of telecommunications and subscribers. It provides a set of requirements
    relating to handover interfaces for the retained traffic data and subscriber data
    by law enforcement and state security agenciesother authorized requesting authorities.
    \ The requirements are to support the implementation of Directive 2006/24/EC of
    the European Parliament and of the Council of 15 March 2006 on the retention of
    data.\r\nThe present document describes the requirements from a Law Enforcement
    Agency's (LEA's) point of view. \r\nNot all requirements necessarily apply in
    one individual nation.\r\nThese requirements can be used to derive specific network
    requirements and furthermore to standardize handover interfaces.\r\nThe present
    document gives the requirements for the delivery of Retained Data (in line with
    TS 101 331 for LI)."
