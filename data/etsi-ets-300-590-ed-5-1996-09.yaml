abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) specifies the layer 3\r\nprocedures
    used on the BSS to MSC interface for control of GSM\r\nservices.\r\nFor the purposes
    of call control and mobility management, messages are\r\nnot interpreted at the
    Base Station System (BSS) which acts as a relay\r\nfunction. These messages and
    procedures are documented in Technical\r\nSpecification GSM 04.08, the only relevant
    issues covering these\r\nmessages in this Technical Specification are those concerned
    with\r\nerror conditions at the interface, and the headers that are required\r\nfor
    the correct addressing of the messages. This is specified in more\r\ndetail in
    Technical Specification GSM 08.06.\r\nThe functional split between MSC and BSS
    is defined in Technical\r\nSpecification GSM 08.02 and states that the BSS is
    responsible for\r\nlocal radio resource allocation and in order to support this
    the\r\nrequired procedures between BSS and MSC are defined in detail in this\r\nTechnical
    Specification.\r\nTechnical Specification GSM 08.02 also states that the BSS is\r\nresponsible
    for the scheduling of all CCCH/BCCH messages and therefore\r\nsome procedures
    for providing the BSS with the necessary information\r\nto be passed on these
    channels for individual calls (ie paging) are\r\ndefined in this Technical Specification,
    but the scheduling is not\r\ndiscussed.\r\nThis interface and consequently these
    layer 3 procedures are designed\r\nto support BSSs providing one or more cells.\r\n"
