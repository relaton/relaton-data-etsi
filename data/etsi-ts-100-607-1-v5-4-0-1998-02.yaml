abstract:
- language: en
  script: Latn
  content: "SUBJECT\r\nPhase 2+Transmit power control timing and confirmation in multislot
    configuration / 22.2\r\nPhase2+ Editorial modifications to section 20.1.4.1 &
    20.20.1.4.1\r\nPhase 2+Transmitter: Frequency error and phase error in multislot
    configuration\r\nCR to 11.10-1 Section 29.3.2.6.7 Total loss of response to checkpointing\r\nCR
    to 11.10-1 Section 29.3.2.6.5 No response to checkpointing\r\nCR to 11.10-1 Section
    29.3.2.6.3 End of a sequence\r\nCR to 11.10-1 Section 29.3.2.6.2 End of a window\r\nCR
    to 11.10-1 Section 29.3.2.6.1 SS in checkpoint recovery mode\r\nPhase 2+-HSCSD
    test case 26.13.1.1.1 Multislot signalling / RR / Measurement / symmetric\r\nCR
    to 11.10-1 Section 29.3.1.2.2 Total loss of UA frame\r\nPhase 2+ Addition of HSCSD
    test cases in Table 3.1: Applicability of tests\r\nEditorial modifications to
    section 31.6.2.4\r\nEditorial correction to Section 26.10.2.5.3\r\nEditorial modifications
    to section 26.12.2.1.3\r\nEditorial modifications to section 26.12.2.2\r\nEditorial
    modifications to section 3.2.2, table 3.1 Applicability of EFR tests\r\nCR to
    11.10-1 Section 29.3.2.2.2 Transmission Window\r\nPhase 2+HSCSD test case 26.13.1.1.2
    Multislot Signalling / RR/ Measurement/asymetric\r\nPhase 2+Section 26.10.2.3
    Incorrect Frequencies Specified\r\nEditorial modifications to section 22.5\r\nAllow
    use of artificial ear type 3.2 for speech teleservices tests\r\nPhase 2+ HSCSD
    test case 26.13.1.3.4 Multislot signalling / RR / Handover / successful / call
    under establishment / finely synchronized / relocation of channels\r\nPhase 2+-Section
    14 - incorrect references to Phase 1\r\nPhase 2+Transmitter: Frequency error and
    phase error in multislot configuration\r\nPhase 2+- Section 20.8 Cell reselection
    when C1 (serving cell) < 0 for 5 seconds\r\nPhase 2+Reference sensitivity - full
    rate data channels in multislot configuration / 14.2.7\r\nPhase 2+- section 20.20.2Multiband
    cell selection and reselection / Cell reselection\r\nEditorial modifications to
    Annex 3.2.3.1/3/4 removal of Phase 1 references\r\nEditorial modification of section
    22.2\r\nPhase 2+ HSCSD test case 26.13.1.2.1 Multislot signalling / RR / Dedicated
    assignment\r\nPhase 2+Transmitter: Output RF spectrum in multislot configuration\r\nPhase
    2+- Section 30.6.1 Echo loss\r\nAddition of test case references\r\nCorrection
    of 26.7.4.3.4\r\nSection 30 and section 2 Allow use of artificial ear type 3.2
    PIXIT\r\nPhase 2+ Addition of a test purpose in 26.11.3 to test L2 pseudolength
    different from 18 in SysInfo 2ter\r\nPhase 2+-Editorial modifications to section
    12.1.1.4.2\r\n"
