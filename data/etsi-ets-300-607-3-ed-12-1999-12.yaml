abstract:
- language: en
  script: Latn
  content: "SUBJECT\r\nImplementation of Tdoc 7-99-102   Stored List Cell Selection\r\nChange
    TSC value to equal BCC value in Implementation of TC_20_13\r\nImplementation changes
    in TC_34_2_3\r\nL2 pseudo length of SI4 in implementation of test case 34.3\r\nCorrection
    of a DCS constraint in the implementation of test case 26.6.4.2.2\r\nImplementation
    error in a DCS frequency list in test case 26.6.4.1\r\nImplementation error in
    DCS frequency list in test case 26.6.5.1\r\nOrder of cells in measurement reports
    in the implementation of TC\r\nImplementation error in 20_20_1 , 20_20_2\r\nImplementation
    errors in TC 26_10_2_4_2\r\nDCS Constraint error in Implementation of TC_26_6_5_2_10\r\nIncrease
    the time for in-service in implementation of TC_26_2_1_3\r\nPIXIT errors in the
    implementation of test cases 26.6.3.6 and 26.11.2.3\r\nChanges to the Implementation
    of 20 series test cases for EGSM\r\nCorrection to the in Call Modification in
    TC_26_8_1_4_5_1\r\nImplementation of paging block corrections in TC_20_5\r\nUse
    of PIXIT parameters in the implementation of 26_6_6_1\r\nUnwanted fill frames
    in implementation of default behaviours\r\nImplementation errors in TC_11_1_2\r\nDCS
    handover corrections in implementation of TC_26_6_5_2_9\r\nImplementation of SI
    5ter messages in 26.11.2.2.1 and 26.11.2.2.2\r\nImplementation of DCS handover
    frequencies in test cases 26_6_5_2_3 and _4\r\nImplementation of Tdoc  471/98
    in TC_26_6_1_3\r\nImplementation of non combined cell control channels in 20 series
    tests\r\n\r\n\r\n\r\n"
