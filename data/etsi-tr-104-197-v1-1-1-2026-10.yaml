abstract:
- language: en
  script: Latn
  content: The intent of this work item is to identify the actions of AI developers
    to ensure that their products and systems remain safe and secure when deployed.
    This work item will report on the core measures and how they work alongside the
    core principles of SAI. The intent is to ensure systems are both secure and safe
    in the deployed context. This reinforces secure by design. To also address how
    to give assurance of a secure and safe design
