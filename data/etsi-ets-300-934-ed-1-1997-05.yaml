abstract:
- language: en
  script: Latn
  content: "This ETS specifies the stage 2\r\ndescription of the Voice Broadcast Service
    (VBS) which allows the\r\ndistribution of speech (or other signals which can be
    transmitted via\r\nthe speech codec), generated by a service subscriber, into
    a\r\npredefined geographical area to all or a group of service subscribers\r\nlocated
    in this area.\r\n"
