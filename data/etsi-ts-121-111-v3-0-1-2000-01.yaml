abstract:
- language: en
  script: Latn
  content: "Justification and scope:\r\nThis work item creates a high level description
    of requirements for the 3GPP IC card and its interface to the 3GPP terminal. The
    document defines requirements of the USIM (Universal Subscriber Identity Module)
    and the IC card for 3GPP (UICC). These are derived from the service and security
    requirements defined in 3GPP 22.01 and 22.00. The USIM is a 3GPP application on
    an IC card. It inter-operates with 3GPP terminals and provides access to 3GPP
    services. The document is intended to serve as a basis for the specification of
    the USIM, the UICC, and the interface to the 3GPP terminal.\r\n3GPP work area:
    TSG Terminals, WG3 (USIM).\r\nLinked work items: - UICC physical and logical characteristics;
    - USIM characteristics\r\nService aspects: - Service requirements from 3GPP 22.00
    and 22.01 shall be taken into account.\r\nMMI-aspects: - None.\r\nCharging aspects:
    - None.\r\nSecurity Aspects: - Security Requirements from TSG-SA WG3 shall be
    taken into account.\r\nImpacts: Affects: - USIM, - ME.\r\nPrimary responsiblility:
    3GPP TSG-T  WG3 (USIM)\r\nSecondary responsiblility: 3GPP TSG-T  WG2 (Terminal
    capabilities), 3GPP TSG-SA WG1 (Services), 3GPP TSG-SA WG3 (Security)\r\n"
