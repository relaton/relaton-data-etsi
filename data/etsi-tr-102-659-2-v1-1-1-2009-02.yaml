abstract:
- language: en
  script: Latn
  content: "The present document addresses the need to identify interoperability gaps
    in existing and emerging Global/European Grid standards. It shortcomings; overlaps
    and loopholes in current, proposed, and de facto Grid standards at all levels
    of the middleware/protocol stack (network to application interfaces), with specific
    consideration for large-scale commercialization and interoperability of standards/systems
    relevant to the ICT sector (i.e. the ETSI constituency), such as NGN. \r\nThis
    is part 2 of a 2 part document providing a study of ICT Grid interoperability
    gaps. This document  provides an initial gap analysis. The gaps are identified
    through developing a series of scenarios and selecting specific areas within those
    scenarios to identify detailed requirements and investigating suitable standards
    to meet these requirements. Standards identified may be Grid specific standards
    or other standards which support an integrated Grid NGN environment.\r\n\r\nThis
    document addresses:\r\n· Interoperability gaps in Grid Standards;\r\n·Interoperability
    gaps between Grid and NGN standards in an integrated environment.\r\n\r\nThis
    document does not address:\r\n·Interoperability gaps between different Grids (e.g.
    GT4 to UNICORE or gLite);\r\n·Interoperability gaps  between 2 implementations
    of the same standard (e.g. shortcomings and lack of precision).\r\nPart 1of this
    2 part document captures the current state of Grid technologies and identifies
    the key stakeholders, including standards making bodies, research projects, production
    grids and other initiatives. Additionally, it identifies a recommended base of
    standards and de facto standards in the form of a Grid ICT Profile, taking into
    account the requirements for interoperability in the ICT domain."
