abstract:
- language: en
  script: Latn
  content: This  present document specifes a REST API that allows key management systems
    to interoperate to pass keys horizontally between two systems located in a common
    trusted node. The API enables QKD networks to serve applications that request
    shared secret keys from key management systems that are not linked by a contiguous
    chain of systems from the same vendor. It is beyond the scope of the present document
    to describe how the underlying QKD network agrees key material between nodes.
    URI formats, communication protocols (HTTPS), and the JSON data format encoding
    of posted parameters and responses (including key material) are described.  An
    OpenAPI description of the API is included.
