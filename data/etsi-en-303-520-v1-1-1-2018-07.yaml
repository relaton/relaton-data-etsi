  content: "SRD device to be used for wideband Ultra Low Power Wireless Medical Capsule
    Endoscopy application  and associated peripheral Data Recorder equipment operating
    in the frequency range 430 MHz to 440 MHz. This Harmonised Standard is aimed to
    cover the essential requirements of art. 3.2 of Directive 2014/53/EU.\r\nRemarks:
    \ This HEN is expected to be developed along the characteristics briefly outlined
    by SRDoc TR 103 451v1.1.1. The SRDoc is currently under examination by CEPT ECC
    for spectrum use compatibility analysis, although it is felt that the proposed
    frequency spectrum arrangement due to its ultra-low power seems compatible with
    the other radio "
