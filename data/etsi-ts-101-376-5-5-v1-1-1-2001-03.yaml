abstract:
- language: en
  script: Latn
  content: "GMR-1 Specification: This document defines the requirements for the Mobile
    Earth Station (MES) transceiver of the GeoMobile (GMR-1) satellite communications
    system.  Requirements are defined for two categories of parameters: those that
    are required to provide compatibility among the radio channels and those that
    define the transmission quality of the system.\r\n"
