abstract:
- language: en
  script: Latn
  content: "This specification defines the stage-2 service description for a\r\nGeneral
    Packet Radio Service (GPRS) on GSM.\r\nIn analogy with CCITT Recommendations I.130
    [1] and with reference to\r\nCCITT Recommendations VI.1 Q.65 (Stage 2 of the method
    for the\r\ncharacterisation of services supported by an ISDN), the second stage\r\nof
    the following three-level structure is derived from a stage 1\r\nservice description.\r\nStage
    1 is an overall service description, from the service\r\nsubscriber s and user
    s standpoints, that views the network as a\r\nsingle entity which provides services
    to the user.\r\n Stage 2 identifies the functional capabilities and information
    flows\r\nneeded to support the service described in stage 1. Furthermore, it\r\nidentifies
    various possible physical locations for the functional\r\ncapabilities. The output
    of Stage 2, which is signalling system\r\nindependent, is used as an input to
    Stage 3, the design of signalling\r\nsystem and switching Recommendations.\r\n
    Stage 3 defines the signalling system protocols and switching\r\nfunctions needed
    to implement the service described in stage 2.\r\n "
