abstract:
- language: en
  script: Latn
  content: "This Technical Specification defines the interface between the\r\nSubscriber
    Identity Module (SIM) and the Mobile Equipment (ME), and\r\nmandatory ME procedures,
    specifically for \"SIM Application Toolkit\".\r\nSIM Application Toolkit is a
    set of commands and procedures for use\r\nduring the network operation phase of
    GSM, in addition to those define\r\nin GSM 11.11 [14].\r\nSpecifying the interface
    is to ensure interoperability between a SIM\r\nand an ME independently of the
    respective manufacturers and operators.\r\nThe concept of a split of the Mobile
    Station (MS) into these elements\r\nas well as the distinction between the GSM
    network operation phase,\r\nwhich is also called GSM operations, and the administrative
    management\r\nphase are described in the Technical Specification GSM 02.17 [3].\r\nThis
    Technical Specification defines:\r\n- the commands;\r\n - the application protocol;\r\n
    - the mandatory requirements on the SIM and ME for each procedure.\r\n Unless
    otherwise stated, references to GSM also apply to DCS 1800.\r\nThis standard does
    not specify any aspects related to the\r\nadministrative management phase.  Any
    internal technical realisation o\r\neither the SIM or the ME are only specified
    where these reflect over\r\nthe interface.  This standard does not specify any
    of the security\r\nalgorithms which may be used.\r\nThis Technical Specification
    defines an enhancement for GSM Phase 2+ o\r\nthe SIM/ME interface for GSM Phase
    2. While all attempts have been mad\r\nto maintain phase compatibility, any issues
    that specifically relate t\r\nPhase 1 should be referenced from within the relevant
    Phase 1\r\nspecification.\r\n"
