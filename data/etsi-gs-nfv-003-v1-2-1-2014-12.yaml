abstract:
- language: en
  script: Latn
  content: "This document intends to provide terms and definitions for conceptual
    entities with the scope of the NFV work, in order to achieve a “common language”
    across all the NFV working groups and for wider industry discussions on this topic.\r\n\r\nIt
    should be noted, that terminology, architecture and requirements very much depend
    on each other, and that this document may need to be revised to align with the
    content of various group specifications and iterations of the ISG architecture
    document.\r\n\r\nWorkgroups are requested to contribute to this paper to capture
    the latest discussions on conceptual entities being defined in the different Working
    Groups\r\n"
