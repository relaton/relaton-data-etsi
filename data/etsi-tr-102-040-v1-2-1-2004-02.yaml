abstract:
- language: en
  script: Latn
  content: "ISO TC 68 has started a work item on a PKI Practices and Policy Framework.
    \ This work item is targeted at the Banking community but it has already been
    recognised by groups working on PKI (e.g. PKI forum) that this has general applicability
    to PKI and CA for a range of market sectors.\r\nThe ISO TC 68 activities are being
    monitored by the ETSI ESI WG, but additional resources is needed to make any type
    of significant impact on this work.  An American national standard ANSI X9.79
    has been fed in as a starting point as the starting point but it has been requested
    that this is generalised to take into account other International activities,
    in particular to take account of the EU Directive on Electronic Signatures and
    TS 101456."
