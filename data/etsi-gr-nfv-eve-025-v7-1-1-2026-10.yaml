abstract:
- language: en
  script: Latn
  content: This new work item will revise the ETSI GR NFV-EVE 025 to continue the analysis of Serverless and other application virtualization forms and identify relevant use cases in NFV. It will also investigate how the NFV framework (including the relevant functional entities, functions, and interfaces, etc.) can support Serverless and other application virtualization forms. Based on the study outputs, it will provide corresponding recommendations for potential normative work.
