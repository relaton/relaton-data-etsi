abstract:
- language: en
  script: Latn
  content: 'This revision of NFV-SOL001 continues the development of the specification
    as part of the NFV Release 4. This edition will extend the specification of descriptors
    to support additional Release 4 features. The scope of the former edition is summarized
    hereafter:  NFV-SOL 001 develops a data model specification for NFV descriptors
    fulfilling the requirements specified in ETSI GS NFV-IFA 011 and ETSI GS NFV-IFA
    014. The specification will be based on the OASIS TOSCA Simple profile in YAML
    specification.'
