abstract:
- language: en
  script: Latn
  content: "This EN provides the overall description for lower-layer functions of\r\nthe
    General Packet Radio Service (GPRS) radio interface (Um). It also\r\ncovers a
    subset of the functions of the BSS-to-SGSN (Gb) interface.\r\nThe overall description
    provides the following information:\r\n- The services offered to higher-layer
    functions.\r\n- The distribution of required functions into functional groups.\r\n-
    A definition of the capabilities of each functional group and their\r\npossible
    distribution in network equipment.\r\n- Service primitives for each functional
    group, including a detailed\r\ndescription of what  services and information flows
    are to be\r\nprovided.\r\n- A model of operation for information flows within
    and between the\r\nfunctions.\r\n GSM 04.60 is applicable to the following GPRS
    Um functional layers:\r\n- Logical link control functions.\r\n- Medium access
    control functions.\r\n- Physical link control functions.\r\n GPRS functional layers
    above logical link control are described in GSM\r\n03.60.\r\n"
