abstract:
- language: en
  script: Latn
  content: "TSG-T WG1/RF: The present document specifies the logical test interface
    between User Equipment (UE) and Tester.\r\n\r\nAbstract of document:\r\nThe present
    document specifies for User Equipment (UE), for 3rd Generation WCDMA system, those
    ME functions which are required for conformance testing purposes (e.g. test loops).
    These functions are activated via the radio interface. \r\nContentious Issues:\r\nThe
    content of this specification is directly related to which testing functions are
    needed by RF and Signalling tests. (TS 34.123-1, TS 34.121 and TS 34.122).\r\nNo
    contributions have been submitted for TDD test functions. \r\n"
