  content: This WI focuses on analyzing the security aspects of AI-Agents based core network (AI-Core). It will first conduct security analysis by starting from the identified use cases to extract and summarize potential security requirements; then provide a review of key existing standardization activities regarding AI agent security, as well as potential technologies that may fulfill the identified requirements.
