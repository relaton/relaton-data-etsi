abstract:
- language: en
  script: Latn
  content: "The ETSI specifications produced in support of the EESSI, need to be reviewed
    and harmonised with other international standardisation work. \r\nThe two major
    activities are to submit the time stamping policy work to the IETF and the XML
    signature format work to W3C/IETF.\r\nA possible new version of TS 101 733 will
    require updating of the corresponding two RFCs, submitted to and approved by the
    IETF."
