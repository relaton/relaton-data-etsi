abstract:
- language: en
  script: Latn
  content: "The present report provides non-mandatory recommendations for the use
    of the different codec implementation options for the circuit switched H.324 based
    multimedia telephony service. These recommendations address issues specific to
    the 3G operating environment, including guaranteeing sufficient error resilience
    and interworking between terminals.\r\nThe contents of this document are provided
    for information to assist in high quality implementation of multimedia telephony
    terminals. All references to \"terminals\" in this report are to terminals supporting
    the Circuit Switched Multimedia Telephony Service as described in [7-9].\r\n"
