abstract:
- language: en
  script: Latn
  content: The scope of this work item is to develop a data model specification for
    NFV descriptors fulfilling the requirements specified in GS NFV-IFA 011 and GS
    NFV-IFA 014. The specification will be based on the OASIS TOSCA Simple profile
    in YAML specification. The deliverable will contain normative provisions and an
    informative mapping between the data model terminology and the terminology used
    in GS NFV IFA 011 and 014.
