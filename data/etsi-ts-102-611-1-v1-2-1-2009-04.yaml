abstract:
- language: en
  script: Latn
  content: The document presents guidelines on how to develop terminals and network
    infrastructure equipment to allow seamless handover within the scope of one IP
    Platform, one ESG, and one IPDC Operator, in order to continue IP Datacast service
    consumption. Additionally, the present document specifies enablers for mobility
    between IP Platforms, ESGs, and IPDC Operators. Part 1 deals with DVB-H environments;
    Part 2 with DVB-SH ones.
