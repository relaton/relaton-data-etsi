abstract:
- language: en
  script: Latn
  content: "This EN describes the fault management of any NE of a GSM PLMN through\r\nthe
    Q3 interface, with focus on the Base Station System (BSS).\r\nThe OAM of the GSM
    Public Land Mobile Network (PLMN) is organised and\r\ndescribed in terms of TMN
    Management Services. GSM 12.00 describes the\r\narchitecture and gives a general
    overview of the OAM services, while\r\nthe rest of the GSM 12 series gives the
    detailed specification for eac\r\nh service and other aspects of the OAM.\r\n
    \ "
