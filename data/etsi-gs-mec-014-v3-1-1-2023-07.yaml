  content: This Work Item focuses on the enhancement of the UE Identity API. This
    includes defining new features, such as support for UE Identity API Request/Response
    procedure and the function MEC application obtaining a UE Identity from MEC platform.
    It will describe the information flows, required information,data model, and data
    format. This Work Item also intends to align with ETSI GS MEC014 v2.1.1.
