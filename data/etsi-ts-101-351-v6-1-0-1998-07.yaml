abstract:
- language: en
  script: Latn
  content: "SUBJECTv5.1.0 -> v6.0.0\r\nVarious issues\r\nOctet-based buffer control\r\nSABM
    and XID collision resolution\r\nIncreased LLC modulo and window size\r\nUnsuccessful
    XID negotiation\r\nPage response parameter introduction between GMM-LLC-GRR\r\n\r\nSUBJECTv6.0.0
    -> v6.1.0\r\nGeneration of the ciphering Input Offset Value\r\nXID parameter out
    of range\r\nMinimum information field length\r\nDuplicate UI frames\r\nRemoval
    of QoS-to-SAPI mapping\r\nClarifications\r\nN200 sense of negotiation\r\nReception
    of invalid N(R)\r\nLLC acknowledgement and retransmission procedures\r\n"
