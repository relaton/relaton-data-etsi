abstract:
- language: en
  script: Latn
  content: "This work item covers the technical realisation of the requirements for
    the CAT-Runtime environment, defined in TS 102 240, for the support of logical
    Terminal-UICC interfaces and logical SEs.\r\nIt provides a technical solution
    for allowing UICC based application to communicate over a logical UICC interface
    as defined in TS 102 221 and TS 102 223 and access the resources provided by the
    associated logical SE.\r\nThe changes in TS 102 241 shall be agnostic to applications."
