abstract:
- language: en
  script: Latn
  content: To modify EN 301 893 ver 1.3.1 to cover high throughput 5GHz RLAN technologies.
    This would allow the use of techniques such as Channel Bonding (e.g. using 40
    MHz channels), and the Multiple Input Multiple Output (MIMO) technology based
    on guidance from JPT5G and confirmed by WGFM. (2) To reconsider the method of
    measurement for spurious emissions.
