abstract:
- language: en
  script: Latn
  content: "How to combine network parameters and \"subjective\" parameters for audiovisual
    communications of IP networks\r\n- In the context of Fixed/Mobile convergence\r\nAt
    least two types of applications will be considered :\r\n- Applications such as
    IPTV and VoD  require different approaches (e.g.: Multicast/unicast, Real time/non
    real time,…). The appropriate QoS parameters and limits need to be defined.\r\n-Communication
    applications such as videotelephony, video conference."
