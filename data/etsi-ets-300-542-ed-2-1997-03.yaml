abstract:
- language: en
  script: Latn
  content: "This ETS gives the stage 2 description of the call identification\r\nsupplementary
    services.\r\nThe group line identification supplementary services are divided
    into\r\nthe following four supplementary services:\r\n- Calling line identification
    presentation  CLIP (clause 1);\r\n - Calling line identification restriction CLIR
    (clause 2);\r\n - Connected line identification presentation COLP (clause 3);\r\n-
    Connected line identification restriction COLR (clause 4).\r\n "
