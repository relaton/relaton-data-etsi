abstract:
- language: en
  script: Latn
  content: "This Work Item will investigate the requirements for potential deployment
    of future Urban Rail CBCT systems in the frequency band 5855MHz to 5925MHz under
    the assumption that CBTC applications have priority over ITS-G5 applications.
    \r\nAll relevant requirements of a CBTC system will be depicted including communication
    requirements, operational requirements and safety requirements. \r\nDifferent
    sharing option will be considered and weighted against the requirements of the
    CBTC system and the ITS standard possible evolution. The open or blocking points
    if any will be considered.\r\n"
