abstract:
- language: en
  script: Latn
  content: "This Global System for Mobile communications Technical Specification (\r\nGTS)
    provides functional specifications of five features to personaliz\r\ne GSM Mobile
    Equipment (ME). These features are called:\r\n-\tNetwork personalization;\r\n-\tNetwork
    subset personalization;\r\n-\tService Provider (SP) personalization;\r\n-\tCorporate
    personalization;\r\n-\tSubscriber Identity Module (SIM) personalization.\r\n This
    GTS specifies requirements for MEs which provide these personaliz\r\nation features.\r\nThese
    optional personalization features are stated in GSM 02.07 [2].\r\n"
