abstract:
- language: en
  script: Latn
  content: This specification defines a comprehensive Hardware-Based Root of Trust
    (HBRT) standard that consolidates scattered definitions and technologies across
    industries and specifications. It aims to define all essential Root of Trust functions
    as security controls, including but not limited to functions such as measurement,
    reporting, storage, update. In addition, this technical specification aims to
    address the support of quantum-safe cryptography and crypto agility. Finally,
    an informative Annex is provided that aims to show the relation to regulatory
    requirements, such as to those given in the EU Cyber Resilience Act (CRA).
