abstract:
- language: en
  script: Latn
  content: "Configuration Management (CM) aspects of managing a 3G network. This is
    described from the management perspective outlined in the two 3GPP specifications
    32.101 and 32.102.\r\nDefines a set of controls to be employed to effect set-up
    and changes to a 3G network in such a way that operational capability and quality
    of service, network integrity and system inter working are ensured. In this way,
    it describes the interface definition and behaviour for the management of relevant
    3G network NEs in the context of the described management environment. The context
    is described for both the management systems (OS) and NE functionality."
