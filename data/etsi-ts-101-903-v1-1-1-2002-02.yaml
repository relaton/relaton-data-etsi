abstract:
- language: en
  script: Latn
  content: The main goal of this task is the production of an ETSI TS on electronic
    signature format in XML, which will contain the XML syntax for qualified signatures
    equivalent to the ones specified in ETSI TS 101733. This task will take as starting
    point the technical report “XML Electronic Signatures” produced by STF 155. The
    current W3C basic XML signature format is used to adopt the higher-level ETSI
    signature format to the XML world. This draft will be externally circulated in
    suitable forums (XML W3C Working Groups, XML/EDI groups, etc.) in order to harmonise
    with results and ongoing activities of those bodies.
