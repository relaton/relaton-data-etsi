abstract:
- language: en
  script: Latn
  content: The objective of this scope of work is to provide an update of an existing
    section of ETSI GS OSG 001 (section 7) on security. This GS was originally created
    under the ISG OSG. This ISG is now closed and no longer active and its scope now
    falls under the TC PLT. The security in GS OSG 001 has become obsolete and there
    is an urgent need to update it to ensure continued protection and security of
    utility and end user customer information within the use of this protocol.
