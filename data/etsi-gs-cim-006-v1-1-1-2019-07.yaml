abstract:
- language: en
  script: Latn
  content: "The purpose of this Group Specification is to define or identify a cross-domain
    data model compatible with the CIM API defined in WI API0, for use in testing
    that preliminary API specification. The preliminary cross-cutting data model shall
    be applied using two or more of the use case domains  in WI UC. It is not essential
    that the data model be in any sense comprehensive, but it should allow testing
    of all functions of CIM API0.\r\n\r\nIt is expected that recent work within ETSI
    SmartM2M and within oneM2M will strongly influence this preliminary specification.\r\n"
