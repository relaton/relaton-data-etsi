abstract:
- language: en
  script: Latn
  content: "This work item will specify functional requirements, interfaces and operations
    to support the provision of NFV MANO services across multiple administrative domains.
    \r\nWork will be based on GR NFV-IFA028.  \r\n The work will consider management
    interactions between NFVOs in different administrative domains for:  \r\n1) Management
    of composite Network Service (NS) and its constituent nested NSs in different
    administrative domains.  \r\n2) NFVIaaS when the SLPOC (Single Logical Point of
    Contact) is integrated in the NFVO.  \r\nIn addition, the work item will consider
    the interactions between VIMs of the same  administrative domain for NFVIaaS when
    the SLPOC is integrated in VIMs.\r\nThe resulting work item deliverable will contain
    normative provisions.\r\n"
