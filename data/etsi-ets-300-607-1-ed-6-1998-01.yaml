  content: "This European Telecommunications Standard (ETS) describes the\r\ntechnical
    characteristics and methods of test for Mobile Stations\r\n(MS),\r\n27/06/97:(ID)
    Version 4.19.0 approved at SMG#22 as a result of :\r\nSUBJECT\r\nSection 26.11.3.1.1
    - Location updating / accepted - delete expected s\r\nequence step 8)\r\nSIM/ME
    Interface: 3V/5V Switching\r\nSection 20.3 - wait time in step i)\r\nSIM simulator
    functional requirements - voltage measurement uncertaint\r\ny in connection with
    current spikes\r\nSIM/ME Interface: Transmission Speed Enhancement\r\nSection
    21.3 - Superfluous steps g) and h), and editorials\r\nFixed Number Dialling\r\nCorrection
    on tests with Modem Type V.21\r\nTiming requirements in 20.10 and 20.15\r\nErrors
    in the Multiband default message contents\r\nSection 13.4 Table 13-7, DCS1800
    values for offests >= 6000 kHz\r\nSection 13.4 - Bandwidth of reference measurements\r\nIntroduction
    of section 34.2.9 „Multiple SMS mobile originated“\r\nMS residual output power
    between active bursts\r\n\"Sections 32.11.5 and 32.12.5 - time difference \"\"Dt\"\"
    in requirement\r\n2)\"\r\n26.7.4.3.1 - Clarification, and correction to make old
    cell available\r\nin due time\r\nEnhanced Full rate Signalling/ structured procedures/MS
    terminated cal\r\nl/ early assignment\r\nSection 26.6.11.1 Classmark Change Procedure\r\nEnhanced
    Full rate Signalling/ structured procedures/MS originated cal\r\nl/ late assignment\r\nCoding
    of the bearer capability IE when Enhanced Full rate is supporte\r\nd\r\nEFR tests
    for phase 2\r\nAmbient Noise Rejection\r\nEnhanced Full rate Signalling/ emergency
    call\r\nEFR CR for sections 0 to 10\r\nEFR CR to 26.9\r\nEFR phase 2 CR to 26.10\r\nDISC/UA
    exchange in Test 26.7.4.3.3\r\nClarification of action on expiry of T3210 in 26.7.4.3.2
    and 26.7.4.3.\r\n3\r\nAttempt counter reset\r\nIncorrect delays in 26.2.4 procedure
    6\r\nTolerances of ti ing advance\r\nAccidental possible expiry of T3240: especially
    in 26.6.8.4 and 26.6.4\r\n.\r\n26.6.4.1 - Timing requirements after ASSIGNMENT
    COMMAND\r\nDISC / UA exchange in test 26.5.5.2.3\r\nChannel Mode IE needed to
    assign an appropriate channel\r\nProgress indicator in 26.5.7.3\r\nTiming requirement
    in section 26.7.4.3.2.3 step 88\r\nEFR CR for section 26.6\r\n\"Section 26.11.5.1
    - expected sequence shows \"\"late\"\" rather than \"\"ea\r\nrly assignment\"\"\"\r\n "
