abstract:
- language: en
  script: Latn
  content: "This ETSI Technical Report (TR) establishes the technical procedure fo\r\nr
    the comparative evaluation of candidate technologies for the UTRA. T\r\nhe UTRA
    includes the handling of the representative bearers as defined\r\nin [DTR SMG-022101]
    [1], i.e. Open System Interconnection (OSI) layer\r\ns 1-3. It establishes the
    criteria based upon the requirements contain\r\ned in [DTR SMG-022101] [1]. The
    primary purpose of this [report] is to\r\nfacilitate the comparison of different
    candidates between milestones\r\nM1 and M2 of the UTRA definition procedure (Refinement
    and synthesis p\r\nhase). It will also be used after milestone M2 (Definition
    phase) and\r\nin the submission of the candidate to ITU. The scope of this report
    is\r\nnot to make the actual choice but to define how the technical evaluat\r\nion
    will be performed.\r\n"
