abstract:
- language: en
  script: Latn
  content: "Specification was approved during SCP-Plenary #21\r\n\r\nProvide a testing
    specification to test Card Application Toolkit implementation in terminals.\r\n\r\nThis
    CAT conformance test specification will cover the tests of terminals in relation
    to the TS 102.223 Rel-4 to Rel-6. \r\n\r\nIt will take into account the existing
    tests scripts specified in the 3GPP TS 11.10-4 as a base of the CAT test scripts
    with the addition of the tests of the additional features introduced in the CAT."
