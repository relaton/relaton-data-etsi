  script: Latn
  content: "The present work item intends to provide updates to the GS001 present
    document, to do the following:\r\ni)\tAdd text to the e-Commerce clause\r\nii)\tAdd
    text to the security and other issue/scenario clauses that accommodates quantum
    computing  for NGP\r\niii)\tAdd a new Issue clause with illustrative scenarios
    and referenced use cases for drones and autonomous and connected vehicles\r\niv)\tAdd
    a new Issue clause with illustrative scenarios and referenced use cases for infrastructure,
    public safety and emergency services support.\r\n"
