abstract:
- language: en
  script: Latn
  content: "The following amendments are considered necessary to the published version
    of EN 300 330 to conform with the ECC/Rec 70-03:\r\n- Revision of methods of measurements
    to comply with current specified spectrum mask for 6,78 MHz/13,56 MHz;\r\n- Modify
    definition of sub-bands below 135 kHz to remove an ambiguity between \"out of
    band emissions\" and \"spectrum mask notched\" limits.\r\n- Introduce limites
    at 3 m measurement distance in a new annex to comply with revised ECC/Rec. 70-03\r\n-
    Amend limit table and related graph in accordance with revised ECC/Rec. 70-03\r\n-
    General review of possible new required applications for EN 300 330"
