abstract:
- language: en
  script: Latn
  content: "This document will provide security requirements and assessment criteria
    covering all elements defined in CRA Annex I Part 1 for smart home products with
    security functionalities, including smart door locks, security cameras, baby monitoring
    systems and alarm systems, as mentioned in CRA Annex III Class I important products.\r\nThis
    work item intends to produce an EN as candidate for harmonisation, under the standardisation
    request in support of the implementation of the CRA (M/606). It will be a multipart
    standard. \r\n"
