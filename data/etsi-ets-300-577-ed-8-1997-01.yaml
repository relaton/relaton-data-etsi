abstract:
- language: en
  script: Latn
  content: "This European Telecommunications Standard (ETS) defines the requiremen\r\nts
    for the transceiver of the pan-european digital mobile cellular and\r\npersonal
    communication systems operating in the 900 MHz and 1 800 MHz\r\nband (GSM 900
    and DCS 1 800).\r\nRequirements are defined for two categories of parameters:\r\n-\tThose
    that are required to provide compatibility between the radio c\r\nhannels, connected
    either to separate or common antennas, that are use\r\nd in the system. This category
    also includes parameters providing comp\r\natibility with existing systems in
    the same or adjacent frequency band\r\ns.\r\n -\tThose that define the transmission
    quality of the system.\r\n This ETS defines RF characteristics for the Mobile
    Station (MS) and Ba\r\nse Station System (BSS). The BSS will contain either Base
    Transceiver\r\nStations (BTS) or microcell base transceiver stations (micro-BTS).
    The\r\nprecise measurement methods are specified in GSM 11.10 and 11.20.\r\nUnless
    otherwise stated, the requirements defined in this ETS apply to\r\nthe full range
    of environmental conditions specified for the equipmen\r\nt (see annex D).\r\nIn
    this ETS, some relaxation are introduced for GSM 900 mobile station\r\ns which
    fulfil the following conditions:\r\n-\tpertain to power class 4 or 5 (see section
    4.1.1);\r\n -\tnot designed to be vehicle mounted (see GSM 02.06).\r\n In this
    ETS, these mobile stations are referred to as \"small MS\".\r\nNOTE:\tIn this
    ETS, a handhold which can be connected to a car kit is n\r\not considered to be
    vehicle mounted.\r\nMobile stations may operate on more than one of the frequency
    bands sp\r\necified in section 2. These mobile stations, defined in GSM 02.06,
    are\r\nreferred to as \"Multi band mobile stations\" in this ETS. Multi band m\r\nobile
    stations shall meet all requirements for each of the bands suppo\r\nrted. bhe
    relaxation on GSM 900 for a \"small MS\" are also valid for a\r\nmulti band MS
    if it complies with the definition of a small MS.\r\nThe RF characteristics of
    repeaters are defined in annex E of this ETS\r\n. Annexes D and E are the only
    sections of this ETS applicable to repe\r\naters. Annex E does not apply to the
    MS or BSS.\r\n"
