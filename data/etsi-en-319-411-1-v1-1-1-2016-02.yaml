abstract:
- language: en
  script: Latn
  content: "This document will specify policy requirements for certification authorities
    issuing public key certificates, based on previously publish 319 411-3 and elements
    of existing TS 102 042 relevant to EV and baseline certificates. An annex will
    be added compared to EN 319 411-3 to provide a check list for conformity assessment
    of certification authorities issuing public key certificates. In addition, the
    main policy requirements will be updated to keep in line with current best practice
    \r\n"
