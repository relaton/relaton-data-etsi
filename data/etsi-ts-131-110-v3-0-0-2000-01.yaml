  script: Latn
  content: "T3#8: Joint rapporteurs: Christian Dietrich & Jean-Marc Gambin, both Schlumberger\r\n___________________\r\n-
    Justification and scope\r\nIt will be modelled after an existing ETSI guide EG
    201 220. \r\nThis concept was endorsed by PCG.\r\nThis work item (Tdoc T3-99319)
    creates a specification for the definition and administration of application identifiers
    for the UICC. An application Identifier consists of a RID (Registered application
    provider IDentifier)  and a PIX (Proprietary Identifier eXtension). As endorsed
    by the PCG, the 3GPP has applied to ISO for an RID. The new specification will
    describe the coding of the PIX as well as the registration procedure in accordance
    with ISO/IEC 7816-5. \r\n- Linked work items: 3G TS 31.101 \"UICC / terminal interface;
    Physical and logical characteristics\", 3G TS 31.102 \"Characteristics of the
    USIM\"\r\n- Service aspects: None.\r\n- MMI-aspects: None.\r\n- Charging aspects:
    None.\r\n- Security Aspects: None.\r\n- Impacts: USIM, ME.\r\n___________________\r\nSupporting
    organisations: Gemplus, G&D, NTT DoCoMo, Schlumberger, Sonera.\r\n\r\n"
