abstract:
- language: en
  script: Latn
  content: The present document considers the assurance of material that may be used
    in legal proceedings. It identifies that certain aspects of assurance require
    techniques which are dependent on well-trained human expertise, but notes that
    other aspects are purely digital and can be assured by cryptographic techniques.
    The present document provides a definition of "purely digital" material and lists
    examples of material that does and does not fall into this category. The present
    document provides examples of techniques which could be used to handle purely
    digital material effectively. The present document notes other standards (such
    as ISO17025) which could be used for material which is not purely digital, though
    this is not the main focus of the present document.
