abstract:
- language: en
  script: Latn
  content: "The scope of this European Telecommunication Standard (ETS) is:\r\ni)
    to provide a detailed specification for the interworking between\r\ninformation
    elements contained in layer 3 messages sent on the MS-MSC\r\ninterface (Call Control
    and Mobility Management parts of TS GSM 04.08)\r\nand parameters contained in
    MAP services sent over the MSC-VLR\r\ninterface (TS GSM 09.02) where the MSC acts
    as a transparent relay of\r\ninformation;\r\n ii) to provide a detailed specification
    for the interworking between\r\ninformation elements contained in BSSMAP messages
    sent on the BSC-MSC\r\ninterface (TS GSM 08.08) and parameters contained in MAP
    services sent\r\nover the MSC-VLR interface (TS GSM 09.02) where the MSC acts
    as a\r\ntransparent relay of information;\r\n iii) to provide a detailed specification
    for the interworking as in i)\r\nand ii) above when the MSC also processes the
    information.\r\n Interworking for supplementary services is given in TS GSM 09.11.\r\nInterworking
    for the short message service is given in TSs GSM 03.40\r\nand GSM 04.11. Interworking
    between the call control signalling of TS\r\nGSM 04.08 and the PSTN/ISDN is given
    in TSs GSM 09.03, GSM 09.07 and\r\nGSM 09.08. Interworking between the  A  and
    \ E  interfaces for\r\ninter-MSC handover signalling is given in TSs GSM 09.07
    and 09.08.\r\n "
