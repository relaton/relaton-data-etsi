abstract:
- language: en
  script: Latn
  content: "TSG-T WG1/SIG: User Equipment (UE) Protocol/RF/EMC conformance specification;\r\nPart
    2: Implementation Conformance Statement (ICS) proforma specification\r\n\r\nAbstract
    of document:\r\nTo evaluate conformance of a particular implementation, it is
    necessary to have a statement of which capabilities and options have been implemented
    for a telecommunication specification. Such a statement is called an Implementation
    Conformance Statement (ICS).\r\nThe objective of TS 34.123-2 is to provide the
    ICS proforma for 3G User Equipment. This ICS is to be used for RF, protocol and
    EMC testing.\r\nThis TS directly depends on TR 21.904 that is being elaborated
    by TSG T WG2.\r\nContentious Issues:\r\nThe content of this specifications is
    directly related to the content and stability of TR 21.904.\r\n\r\n"
