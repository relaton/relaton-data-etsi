abstract:
- language: en
  script: Latn
  content: 'The present document gives implementation guidelines on the use of the
    electronic service guide in IP Datacast over DVB-SH system for the announcement
    of services to the terminal. The present document intends in particular to guide
    implementers of IP Datacast over DVB-SH Services, Servers and Terminals to make
    best use of the specification IP Datacast over DVB-H: Electronic Service Guide
    TS 102 471. The document must also be considered as complementary to the implementation
    guidelines applicable in DVB-H context, in particular for supporting ESG regionalization,
    one of the specific features provided by a DVB-SH network.'
