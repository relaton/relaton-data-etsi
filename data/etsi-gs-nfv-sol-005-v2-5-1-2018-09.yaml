abstract:
- language: en
  script: Latn
  content: "This revision of NFV-SOL 005 conducts NFV Release 2 maintenance. It corrects
    errors, ambiguities, misalignments, and applies editorial modifications (i.e.
    Corrections of category F and D as described in ETSI TWPs Annex L). This edition
    does not add or modify features, nor does it extend the scope of the former Release
    2 edition summarized hereafter\r\n\r\nSOL 005 specifies a set of Restful protocol
    specifications and data models fulfilling the requirements specified in ETSI GS
    NFV-IFA 013 for the interfaces used over the Os-Ma-nfvo reference point."
