abstract:
- language: en
  script: Latn
  content: "The goal of TS 103 433 V1.1.1 was to standardize a single layer HDR system
    addressing direct backwards compatibility i.e. a system leveraging SDR distribution
    networks and services already in place and that enables high quality HDR rendering
    on HDR-enabled CE devices including high quality SDR rendering on SDR CE devices.
    \r\nThe goal of the present work item is to specify enhancements for single layer
    transfer function based HDR systems, enabled by signal processing blocks that
    are similar/the same to those in SL-HDR1. Similar to SL-HDR1, these enhancements
    will be enabled by use of dynamic metadata and a post processor in the Consumer
    Electronics device.\r\nAn example for an enhancement is high performance display
    adaptation."
