abstract:
- language: en
  script: Latn
  content: "The DAB registered tables document contains tables of values used when
    implementing DAB systems.  ETS 300 401 - the main DAB standard contains many tables
    which, as time progresses, will have additions made to allow fully compatible
    implementations to be used, yet not documented at the time it is released.  The
    tables in this document are kept outside the ETS 300 401 in order to ensure the
    easy procedure for registering new table values without changing the original
    standard.\r\nThe content of this document is maintained by the World DAB Information
    and Registration Centre (WorldDAB IRC), Wyvil Court, Wyvil road, London, SW8 2TG,
    England.\r\n"
