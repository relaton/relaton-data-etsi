abstract:
- language: en
  script: Latn
  content: "Step 3 of a three-step approach to describe a generic Handover Interface
    (HI) for the provision of lawful interception from a Network Operator, an Access
    Provider or a Service Provider (NWO/AP/SvP) to the Law Enforcement Agencies (LEAs).\r\nThe
    document specifies the generic flow of information as well as the procedures and
    information elements, which are applicable to any future telecommunication network
    or service, the network/service specific protocols relating to the provision of
    lawful interception at the Handover Interface (HI), for the following networks/services:
    switched circuit and packet data."
