abstract:
- language: en
  script: Latn
  content: "Approved at SCP #10.\r\n\r\nThe availability of a standardised Application
    Programming Interface (API) will provide a common, open platform for the development
    of applications for the UICC/CAT platform. Thus simplifying the product development
    cycle, product management and also product distribution and thus reducing costs
    and increasing the interoperability. The use of  the existing 3GPP TS 42.019 /
    02.19 specifications will ensure backward compatibility with existing cards.\r\nDeliverables:\r\nDefine
    an “UICC Application Programming Interface; service description” specification"
