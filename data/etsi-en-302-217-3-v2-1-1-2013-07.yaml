abstract:
- language: en
  script: Latn
  content: "Introduce new system category in 71-76/81-86 GHz band (Annex UC) for differentiate
    use when deployed in self-coordination/uncoordinated (present systems as “Category
    A” for light licensing/unlicensed cases) or link-by-link coordination (new “Category
    B” for licensed cases).\r\nNOTE: parameters for new Category B will be “additional”
    to Category A. Category B relevant additional parameters will be reported in EN
    302  217-2-2 (see REN/ATTM-0419) for consistency with similar applications in
    \ lower bands"
