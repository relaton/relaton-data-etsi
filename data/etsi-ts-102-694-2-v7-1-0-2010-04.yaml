abstract:
- language: en
  script: Latn
  content: "Implementation of\r\nCR 001 Cat F Test Case 5.3.2.3.3: initial activation
    in low power mode with corrupted frames\r\nCR 002 Cat F Correction of the RQ verification
    of TC 4: 'Communication with frames - idle bits and wakeup sequence'\r\nCR 003r2
    Cat F Addition of test cases fro CLT LLC definition\r\nCR 004 Cat F Changes with
    respect to TS 102 221 interface\r\nCR 005r1 Cat D Editorial corrections \r\nCR
    006r1 Cat F Modify test case 5.2.4.5 and adding new test cases 5.2.4.x and 5.2.4.y\r\nCR
    007r1 Cat F Reword RQ6 in clause 5.7.7.5\r\nCR 008r1 Cat F Correct test case 5.7.7.6.3\r\nCR
    009r1 Cat F Modified 5.2.4.2 to start clock in middle of frame exchange\r\nCR
    010r1 Cat F Modification of 5.2.4.4/5 to send ISO command after SWP deactivation\r\nCR
    011r1 Cat F Updated 5.3.2.3.6 to test both with and without activation of TS 102
    221 interface\r\nCR 012r1 Cat F Loosened test equipment timing constraints in
    5.7.1.X\r\nCR 013r1 Cat D Various editorial corrections\r\nCR 014r1 Cat F Updated
    test cases for activation / corrupted frames to send subsequent frames in order
    to check for response\r\nCR 015r1 Cat F Correction of tests wrongly implying an
    ACT_POWER_MODE after a correct ACT_SYNC in low power mode\r\nCR 016r1 Cat F 5.5.1.3
    - removal of redundant test execution parameters\r\nCR 017r1 Cat F 5.6.2.3.9:
    removal of redundant and unclearly specified test case\r\nCR 018r1 Cat F Correction
    of test case 5.6.2.2.4\r\n"
