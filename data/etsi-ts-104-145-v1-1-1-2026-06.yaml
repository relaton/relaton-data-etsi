abstract:
- language: en
  script: Latn
  content: This specification will define a quantum-safe mechanism for Enterprise
    Transport Security (ETS).  The existing ETS specification, described in ETSI TS
    103 523-3 utilizes ECDH to provide a passive mechanism for decryption of TLS communication.  This
    specification will take a similar approach by augmenting the existing ECDH mechanism
    with a quantum-safe key encapsulation mechanism.
