abstract:
- language: en
  script: Latn
  content: "This document will provide security requirements and assessment criteria
    covering all elements defined in CRA Annex I Part 1 and Part 2 for personal wearable
    products to be worn or placed on a human body that have a health monitoring (such
    as tracking) purpose and to which Regulation (EU) 2017/745 or Regulation (EU)
    2017/746 do not apply or personal wearable products that are intended for the
    use by and for children, as mentioned in CRA Annex III Class I important products.\r\nThis
    work item intends to produce an EN as candidate for harmonisation, under the standardisation
    request in support of the implementation of the CRA (M/606). Once adopted, it
    is planned that this work item will replace work item DTS/CYBER-EUS-002 (TS )
    of the CYBER-EUSR Work Programme that should be stopped.  \r\n"
