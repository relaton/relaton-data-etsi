abstract:
- language: en
  script: Latn
  content: "ETSI SCP REQ produced requirements for Contact-less UICC services.\r\nIn
    light of the above, this work item will produce the technical specifications to
    support these new services. (WID in SCP-070138)\r\nThis document is a specification
    for a logical layer that is on top of the one defined in TS 102 613.\r\nVersion
    7.3.0 implements CRs approved at SCP #39:\r\nCR 013r1CRemove \"battery on\" event\r\nCR
    016r1FClarify behaviour for unknown commands and events\r\nCR 021--CCorrection
    of table 2\r\nCR 022--DEditorial change to table markings\r\nCR 023--DExplanation
    of Figure 7\r\nCR 024--FParameter length for AID in EVT_TRANSACTION\r\nCR 025--FClarification
    for EVT_POST_DATA\r\nCR 026--FClarification of host for connectivity\r\nCR 027--FChange
    in the WR_XCHGDATA for the RF Reader gate\r\nCR 028--CUsage of the EVT_FIELD_ON
    event in the Card emulation procedure\r\nCR 029--FExtending parameters for type
    A and B card mode\r\nCR 030--CCorrection of Table 16\r\nCR 031--FAddition of hot
    unplug\r\nCR 033--CUsage of the EVT_FIELD_ON event in the Card emulation procedure\r\n\r\n"
