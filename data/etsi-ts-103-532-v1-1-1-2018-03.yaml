abstract:
- language: en
  script: Latn
  content: "This WI specifies standard features needed to use ABE as ABAC. It specifies
    a protocol including the following features: \r\n- Interactions between the principal,
    the service provider, the authority releasing attributed\r\n- The policy schema
    for data access control\r\n- Key, policy, and attribute distribution\r\n- Key,
    policy, and attribute expiration and revocation\r\n- Definition of what subset
    of ABAC (XACML) may be mapped into the protocol\r\n-Definition of semantics for
    a basic set of attributes to ensure interoperability\r\n- Identification of additional
    attributes required by the protocol that would require an extension to traditional
    ABAC (e.g. an extension to XACML)\r\n- Mapping the protocol to a standard Public
    Key Infrastructure X.509 (PKIX)\r\n- Mapping the protocol to a standard assertion
    protocol (SAML)\r\n- Definition of new protocol bindings when existing bindings
    do not cover the deployment scenario (e.g. a CoAP binding for the IoT case)\r\nThe
    deliverable will cover both the Ciphertext-Policy (CP-ABE) and Key-Policy (KP-ABE)
    variants of Attribute-Based Encryption."
