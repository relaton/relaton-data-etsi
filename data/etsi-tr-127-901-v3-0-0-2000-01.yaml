abstract:
- language: en
  script: Latn
  content: "Report on options for Terminal interfaces (physical interface). \r\nReferences:
    ETSI 04.02, 07.10. ARIB Vol.4, Ch.8\r\nT2 concluded that 3GPP should not produce
    any technical specification for terminal interfaces other than the radio interface
    and the USIM interface. The SDOs could develop their own optional physical connector
    specification based on their market requirements. T endorsed the conclusion of
    T2. \r\n\r\n"
