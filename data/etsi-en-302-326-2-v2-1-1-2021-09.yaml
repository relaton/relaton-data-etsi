abstract:
- language: en
  script: Latn
  content: "The revision should align the HS EN to the requirements of art. 3.2 of
    the 2014/53/EU Directive (RED). With respect to present version valid for art
    3.2 of the R&TTE Directive; possible reduction of equipment types will be studied,
    aligned with current technology evolution.\r\nPossibly, a single standard  will
    be produced (i.e. merging also EN 302 326-1) instead of a multipart\r\nOpportunity
    to extend frequency coverage up to 42 GHz band will be considered, depending on
    discussion in TM4\r\n"
