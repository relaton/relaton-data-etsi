abstract:
- language: en
  script: Latn
  content: "Scope:      \r\nThe scope of the present standard is as follows:\r\n-it
    describes additional modes to the DVB T standard (ETSI EN 300 744) providing supplementary
    options for network planning (4K Mode);\r\n-it proposes an optional in-depth inner
    interleaver for the 2K & 4K transmission modes, usable either in the DVB H or
    DVB T contexts;\r\n-it defines extended Transmission Parameter Signalling (TPS)
    information to be use for signalling DVB H services;\r\n-it provides, in annex
    B, the transmission parameters to operate the transmission system in 5 MHz channel
    bandwidth, even outside of the traditional broadcasting bands."
