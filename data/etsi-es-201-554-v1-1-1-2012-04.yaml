abstract:
- language: en
  script: Latn
  content: "To define core network energy efficiency metrics, define efficiency parameters
    and measurement methods for core network equipment. \r\nEnergy efficiency metrics
    and measurement methods should model the traffic behaviour of equipment in operation
    as needed. Traffic models for voice and packet data should be specified if applicable.
    Energy Efficiency metric and measurement methods to apply these models on Core
    Network should be specified and used as main basis for the energy efficiency measurements.
    The Energy Efficiency metric defined shall promote power saving features as applicable.
    \r\nMetric and measurement should be applicable for: \r\nIMS core functions (HSS,
    CSCF, etc), Fixed core functions (softswitch), Mobile core functions (HLR, MSC,
    GGSN, SGSN, EPC, etc) and Radio access control nodes (RNC, BSC).\r\nThe ad-hoc
    group should further define and agree on any additional nodes to be covered in
    the first edition of the standard.\r\nAny unclearness in interface to other standards
    identified during the standardization process should be taken care of by the ad
    hoc group. \r\nThe ad hoc group need also keep track of related standards in ATIS
    and CCSA."
