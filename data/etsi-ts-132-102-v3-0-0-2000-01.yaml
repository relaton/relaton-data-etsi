abstract:
- language: en
  script: Latn
  content: "This Technical Specification (TS) will identify and standardise the most
    important and strategic contexts in the physical architecture for the management
    of UMTS. It will serve as a framework to help define a physical architecture for
    a planned UMTS and to adopt standards and provide products that are ready for
    implementation.\r\nThis document is applicable to all further Technical Specifications
    regarding the Telecom Management of UMTS.\r\n\r\n"
