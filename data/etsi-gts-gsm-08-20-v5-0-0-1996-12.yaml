abstract:
- language: en
  script: Latn
  content: "This Global System for Mobile communications Technical Specification (\r\nGTS)
    defines rate adaptation functions to be used in GSM PLMN Base Sta\r\ntion Systems
    (BSS) and transcoders for adapting radio interface data r\r\nates to the 64 kbit/s
    needed at the MSC in accordance with GSM 03.10.\r\nThe number of Base Station
    System - Mobile-services Switching Centre (\r\nBSS - MSC) traffic channels supporting
    data rate adaptation may be lim\r\nited. In this case some channels may not support
    data rate adaptation.\r\nThose that do, must conform to this specification.\r\nNOTE:\tThis
    specification should be considered together with GSM 04.21\r\nto give a complete
    description of PLMN rate adaptation.\r\n  "
