abstract:
- language: en
  script: Latn
  content: The present document applies to monitoring of power and cooling systems
    for telecommunication installations and equipment. This part 1 is the core of
    a series of documents. It describes the generic control, supervision and alarm
    interface of the equipment and how it may be connected to a local array or a wide
    array network. It introduces different equipment relevant to EE (DC, UPS, AC distribution,
    back-up generator, cooling system, other utilities). It explains the links and
    evolution compared to existing standards used in Telecommunications Management
    Network (TMN). The knowledge of how to create generic interfaces is outlined.
    The present document helps to identify the type and minimum set of information
    required for monitoring and management and the possible network architectures
    for heterogeneous power and cooling system equipment.
