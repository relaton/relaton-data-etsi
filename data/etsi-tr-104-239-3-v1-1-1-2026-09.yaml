abstract:
- language: en
  script: Latn
  content: 'This work item is the third part in a series of quantum-safe implementation
    guidance documents.  It is intended to provide developers with guidance to aid
    the secure implementation of the quantum-safe digital signature algorithm ML-DSA
    as specified by NIST FIPS 204.  This will highlight some potential ML-DSA implementation
    hazards; identify some side-channel and fault attack issues specific to ML-DSA;
    consider some testing and formal verification aspects relevant to ML-DSA; and
    briefly discuss the secure usage of ML-DSA.  '
