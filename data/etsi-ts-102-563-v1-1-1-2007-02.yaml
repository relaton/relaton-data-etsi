abstract:
- language: en
  script: Latn
  content: The present document defines the method to code and transmit audio services
    using the HE AAC v2 [2] audio coder for Eureka-147 Digital Audio Broadcasting
    (DAB) (EN 300 401 [1]) and details the necessary mandatory requirements for decoders.
    The permitted audio modes and the data protection and encapsulation are detailed.
    This audio coding scheme permits the full use of the PAD channel for carrying
    dynamic labels and user applications.
