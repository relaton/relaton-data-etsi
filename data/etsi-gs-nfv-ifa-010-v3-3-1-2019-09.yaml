abstract:
- language: en
  script: Latn
  content: "This revision of  NFV-IFA 010 continues the development of the specification
    as part of the NFV Release 3. \r\nThis edition will add functional requirements
    for NFV-MANO to support the Release 3 features, and it will extend the scope of
    the former Release 2 edition summarized hereafter:\r\n\r\nThis WI aims for a NFV
    Phase 2 deliverable containing all the normative functional requirements for NFV
    management and orchestration e.g. to support VNF migration, VNF Healing, Health-check.
    \r\nThe following aspects need to be considered (in-scope) while developing such
    a deliverable \r\n- Consolidating all the functional requirements scattered in
    various phase 1 GSs (SWA GS, REL GS, INF GSs, MAN GS, NFV004) for management and
    orchestration. ISG level requirements from NFV004 should be considered as default
    requirement for phase 2 unless specific corrections to certain requirements are
    agreed in ISG level. \r\n- Refining functional requirements for concepts defined
    in Phase 1 \r\nThe target deliverable is a requirement GS which will be fulfilled
    by NFV management and orchestration interface normative work. The other interface
    normative WI can progress in parallel. The functional requirements on interfaces
    and models related to interfaces are not in scope of this WI. The final deliverable
    will contain normative provisions.\r\n\r\nThis revision of NFV-IFA 010 will address
    the Release 3 candidate features listed in Annex B of the Release 3 Definition.
    Where needed, it will continue the previous version to enhance and complete the
    specified Release 3 features.\r\nThis revision will reflect the maintenance performed
    to NFV Release 2 documentation and of already specified Release 3 features."
