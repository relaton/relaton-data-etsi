abstract:
- language: en
  script: Latn
  content: 'Develop a prose test specification for Pan-European eCall including test
    purposes and test procedures as well as a test model derived from "FprEN16454:
    Intelligent transport systems – Esafety – Ecall end to end conformance testing"
    and 3GPP TS 26.269 / ETSI TS 126.269 "eCall data transfer; In-band modem solution;
    Conformance testing". By utilizing ETSI compliant notation the remaining degrees
    of freedom present in CEN 16454 to be removed and ambiguities to be resolved.
    E.g. the test specification to include a formalization of the messages exchanged
    between the entities analogue to the well-established test specifications from
    3GPP RAN5. Moreover, the pre-test conditions to be defined in detail, e.g. the
    set of voice codecs to be used. The specification to also clarify the relevant
    tests and procedures in TS 126.269 that allow conformance testing of the in-band
    modem in commercial IVS products.'
