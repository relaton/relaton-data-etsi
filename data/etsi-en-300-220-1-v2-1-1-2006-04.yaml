abstract:
- language: en
  script: Latn
  content: "Amendments to EN 300 220 to incorporate changes to ECC-REC 70-03 and to
    accomodate new technologies such as spread spectrum and adaptive frequency agile
    with listen before talk. Details of the changes:\r\n1. Revision to definition
    of categories, 2. Revision to the requirements for testing to handle spread spectrum
    techniques, 3. Amendments to the methods of measurement, 4. Amendments to the
    standard concerning adjacent channel power to cover spread spectrum techniques,
    5. Amendment to the requirements on duty cycle to incorporate recent changes made
    to ECC-Rec 70-03, 6. Changes to the requirements conc. receiver parameters to
    incorporate the needs of new technologies, 7. These amendments shall be in line
    with the 863-870MHz strategic band plan as adopted by CEPT ECC FMwg Sept. 2001
    and any subsequent recommandations received from SE24.\r\nChanges to bring the
    standard in line with the most recent technical and legal indications acc. to
    the R&TTE Directive"
