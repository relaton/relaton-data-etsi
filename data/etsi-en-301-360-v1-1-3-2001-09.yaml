abstract:
- language: en
  script: Latn
  content: "Satellite user terminals (entire Ka band) receiving in the 17.7 to 19.7
    GHz  as well as and transmitting in the 27,5 to 29,5 GHz via geostationary satellites,
    taking into consideration the protection of the spectral and orbital resources.
    This EN covers satellites user terminals operating in the Fixed Satellite Service
    (FSS) bands which are shared  with other services. The results of WRC 97 conference
    12/97 should be considered.\r\n \r\n"
