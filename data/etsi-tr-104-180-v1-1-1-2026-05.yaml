abstract:
- language: en
  script: Latn
  content: This work item aims to develop and identify quality metrics for data for
    future standardisation. It focuses on identifying key properties of data quality
    including trustworthiness (e.g., completeness, accuracy, bias, reliability, redundancy,
    source reliability, and integrity) and formulating standardised methods to assess
    these properties.This work item refers developed standard specifications related
    to data quality and collaborates with standards bodies & groups working on data,
    security, and AI trustworthiness (e.g., ETSI TC SAI, JTC 21).
