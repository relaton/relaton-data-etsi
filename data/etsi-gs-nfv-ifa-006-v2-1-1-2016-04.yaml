abstract:
- language: en
  script: Latn
  content: "This Work Item will describe the complete functional requirements for
    interfaces on the Vi-Vnfm reference point in between the VNFM and the VIM(s),
    to address the functions specified in GS NFV MAN 001. The results of the work
    item will include: \r\n1) Detailed description of interfaces and its operations
    functionality, and \r\n2) Information elements of: \r\n    a) Virtualized resource
    management interfaces, for:\r\n        i) Lifecycle management of virtualized
    resources, including instantiation, modification, configuration and termination
    of such virtualized resources.\r\n        ii) Fault management of virtualized
    resources.\r\n        iii) Performance management of virtualized resources. \r\n
    \   b) Resource management interfaces, for:\r\n        i) Resources reservation
    information retrieval.\r\n        ii) Virtualized resources information retrieval.\r\n
    \       iii) Software image management.\r\nThe resulting deliverable will contain
    normative provisions."
