abstract:
- language: en
  script: Latn
  content: "Part 3 of the deliverable defines the framework for a Service Level Agreement
    between a customer and a supplier of Telecommunications Services.  Such a framework
    uses the methodology proposed in Part 1 to evaluate the Quality of Service, and
    defining the following concepts:\r\nd) The services covered by the SLA\r\ne) The
    performance or quality criteria pertinent from the user point of view with reference
    to the indicator values\r\nf) The methods to measure the performance or the quality
    of service\r\n\r\nIn addition, a Service Level Agreement aims to define a common
    quality management process used by the supplier and the customer, including:\r\na)
    Outage management\r\nb) Statistics for prevention\r\nc) Usage statistics\r\netc."
