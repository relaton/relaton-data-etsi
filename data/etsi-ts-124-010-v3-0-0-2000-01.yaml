abstract:
- language: en
  script: Latn
  content: "In this specification the general aspects of the specification of supplementary
    services at the layer 3 radio interface are given.\r\nGSM 04.8x and 04.9x-series
    specify the procedures used at the radio interface (reference point Um as defined
    in GSM 04.02) for normal operation, registration, erasure, activation, deactivation,
    invocation and interrogation of supplementary services. Provision and withdrawal
    of supplementary services is an administrative matter between the mobile subscriber
    and the service provider and cause no signalling on the radio interface.\r\nGSM 04.08
    and GSM 04.80 specifies the formats and coding for the supplementary services.\r\nDefinitions
    and descriptions of supplementary services are given in GSM 02.04 and GSM 02.8x
    and 02.9x-series.\r\nTechnical realization of supplementary services is described
    in GSM 03.11 and GSM 03.8x and 03.9x-series.\r\nThe procedures for Call Control,
    Mobility Management and Radio Resource management at the layer 3 radio interface
    are defined in GSM 04.07 and GSM 04.08.\r\n"
