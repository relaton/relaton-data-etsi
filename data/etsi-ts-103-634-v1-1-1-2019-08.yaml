abstract:
- language: en
  script: Latn
  content: This TS will provide a textual description of the coding algorithm of the  Low
    Complexity Communication Codec(LC3plus). LC3plus shall incorporate flexible coding
    modes and hence include audio bandwidth from narrowband (NB) to fullband (FB)
    at bitrates from 16kbps to 320kbps.  The codec shall provide a block size of 10
    and 5 ms. In particular wideband at <=32kbps and super-wideband at <=64 kbps coding
    modes shall be defined for a 10 ms block size. The codec shall be flexible to
    operate with associated channel coding in a rate-adaptive scheme that offers improved
    quality for clean as well as improved resilience for degraded channels. Fixed-point
    C code, associated test vectors and conformance criteria should also be part of
    this  specification. LC3plus algorithm shall be based on the tested codec from
    DTR/DECT-00316.
