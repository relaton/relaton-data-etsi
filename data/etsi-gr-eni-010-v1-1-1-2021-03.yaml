abstract:
- language: en
  script: Latn
  content: "The purpose of this work item is to specify quantitative evaluation criteria
    of network autonomicity categories, which is defined in the published GR ENI 007.
    \r\nThis WI is composed of three components: \r\n(1) to further specify the categories
    and quantitative factors determing the network autonomicity categories; \r\n(2)
    to define a framework of quantitative evaluation process and a scoring criteria;
    \r\n(3) to describe several scenario examples of  quantitative evaluation criteria.\r\n"
