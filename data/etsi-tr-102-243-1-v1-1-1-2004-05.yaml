abstract:
- language: en
  script: Latn
  content: "This document provides informative details related to transmit power characteristics
    for point-to-point fixed service systems to assist sharing and compatibility analysis
    in both inter- and intra-service sharing conditions. The scope will be limited
    to providing:\r\n - Both maximum and typical transmitter output power values and\r\n
    - Maximum available antenna gains delclared by manufacturers with associated diameter
    values\r\n\r\nValues will be provided for all system options and frequency ranges
    covered in the multipart standard EN 301 217. This information shall permit better
    representative examples of FS systems to be used in compatibility and sharing
    studies. The report should give some indication of typical feeder losses where
    felt appropriate."
