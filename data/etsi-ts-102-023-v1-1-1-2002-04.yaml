abstract:
- language: en
  script: Latn
  content: The work will be based on the policy requirements for certification authorities
    issuing qualified certificates (TS 101 456) developed in the phase 2 EESSI activity
    by ETSI. The electronic time stamp is gaining an increasing interest by the business
    sector and is becoming an important component of electronic signatures, also featured
    by the ETSI Electronic Signature Format standard TS 101 733. Agreed minimum security
    and quality requirements are necessary in order to ensure trustworthy validation
    of long-term electronic signatures.
