abstract:
- language: en
  script: Latn
  content: "The following changes are planned (see also Remarks below):\r\n·Update
    outdated references and terminology;\r\n·Update tense of verbs (the guide was
    produced shortly after the publication of the R&TTE Directive; several years have
    passed);\r\n·Replace statements saying that the item is currently under discussion
    with the results, or remove these statements;\r\n·Develop a checklist of items
    to be performed when developing Harmonized Standards;\r\n·Possibly insert a list
    of  \"regulatory impact” statements to be avoided in ENs, based on ERM document
    24_078.\r\n·Do minor editorials.\r\nRemarks: STF 279 (PC) plans to produce a set
    of recommendations for updating the ETSI Guide (EG 201 399 V1.3.1) in the form
    of a Report to TC-ERM and all concerned technical bodies on an information basis.
    \ This report is initially planned to be available for the OCG RTTED group by
    \ 11 April 2005.  When the report with the set of recommendations for updating
    EG 201 399 is received by the OCG RTTED, it will be circulated on the RM reflector,
    and ERM RM will discuss how to modify this work item for the revision of EG 201
    399.\r\n\r\n"
