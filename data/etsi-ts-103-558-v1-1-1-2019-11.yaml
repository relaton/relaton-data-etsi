abstract:
- language: en
  script: Latn
  content: "The present document specifies methods for the objective prediction of
    listening effort (and eventually listening quality) at the near-end side for the
    following two scenarios:\r\n1) at acoustical interfaces in the presence of background
    noise\r\n2) at electrical interfaces aiming at the effects of noise that originates
    from the transmission chain or from the send side. \r\nThe work is based on the
    results of subjective studies. Normal hearing and hearing impaired listeners are
    considered.\r\n"
