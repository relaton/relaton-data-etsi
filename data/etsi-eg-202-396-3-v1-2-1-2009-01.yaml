abstract:
- language: en
  script: Latn
  content: "Currently EG 202 396-3  is only applicable to wideband transmisson scenarios.
    However also in narrowband scenarios it is required to predict the speech quality
    performance of terminals in the presence of background noise. Since no other method
    is known for that the method described in EG 202 396-3 should be extended to narrowband.\r\nTherefore
    EG 202 396-3 is to be revised in order to reflect this situation."
