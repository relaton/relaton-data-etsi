abstract:
- language: en
  script: Latn
  content: "This revision of NFV-SOL 001 continues the development of the specification
    as part of the NFV Release 3. This edition will add requirements and specification
    of interfaces to support the Release 3 features, and it will extend the scope
    of the former Release 2 edition summarized hereafter:\r\n\r\nNFV-SOL 001 develops
    a data model specification for NFV descriptors fulfilling the requirements specified
    in ETSI GS NFV-IFA 011 and ETSI GS NFV-IFA 014. The specification will be based
    on the OASIS TOSCA Simple profile in YAML specification."
