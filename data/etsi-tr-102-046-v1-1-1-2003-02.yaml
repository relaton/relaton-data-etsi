abstract:
- language: en
  script: Latn
  content: ETSI ESI WG and previous STF have generated seven ETSI Technical Specifications,
    four ETSI Technical Reports and provided major contributions to several IETF RFC
    under the EESSI initiative; all of these specifications will mature over the next
    few years. The specifications will need to evolve in the light of implementation
    experience, changes in market or technical changes. Thus it will be necessary
    to make minor modifications to address target user concerns, correct deficiencies
    in the specifications and to reach to user feedback.
