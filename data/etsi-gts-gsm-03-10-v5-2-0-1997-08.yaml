abstract:
- language: en
  script: Latn
  content: "A GSM PLMN may be described by a limited set of access interfaces\r\n(refer
    to TS GSM 04.02 and 02.01) and a limited set of GSM PLMN\r\nconnection types to
    support the telecommunication services described\r\nin the GSM 02-series of specifications.
    This specification identifies\r\nand defines these connection types in so far
    as they relate to the\r\nparticular network capabilities for a GSM PLMN.\r\nThe
    basic lower layer capabilities of a GSM PLMN are represented by a\r\nset of GSM
    PLMN connection types. The definition of a set of GSM PLMN\r\nconnection types
    provides the necessary input to identify network\r\ncapabilities of a GSM PLMN.
    In addition to describing network\r\ncapabilities of a GSM PLMN, the identification
    of connection types\r\nfacilitates the specification of network-to-network interfaces.
    It may\r\nalso assist in the allocation of network performance parameters.\r\nThis
    specification should be considered in conjunction with other GSM\r\nspecifications
    with particular reference to TS GSM 01.02, 02.01,\r\n02.02, 02.03, 03.01, 03.02,
    04.02 and 04.03.\r\nThis specification provides a bridge between the service specification\r\nin
    the GSM 02-series of specification and the more detailed\r\nspecifications such
    as TS GSM of the 03, 04, 07 and 09 series. As\r\nsuch, it establishes a framework
    for the specification and\r\nunderstanding of the more detailed specifications.
    It is therefore not\r\na specification against which detailed conformance testing
    can be\r\nperformed. However, it shall be considered mandatory for the\r\nunderstanding
    of the more detailed specifications and used to resolve\r\nissues of conflict
    in these specifications.\r\n  "
