abstract:
- language: en
  script: Latn
  content: "To define the functional requirements of high bit-rate asymmetric (and\r\nsymmetric)
    metallic access transmission systems intended to transport\r\nadvanced broadband
    services.\r\nVDSL transmission is intended to operate over the periphery of existin\r\ng
    metallic access networks, and will consequently have reduced transmi\r\nssion
    range when compared with ISDN-BA, HDSL and ADSL systems.\r\n Cost effectiveness
    is seen as an important requirement by the network\r\noperators.\r\n This work
    item will encourage open discussion and dialogue between net\r\nwork operators
    and manufacturers, leading to the formulation of Part 1\r\nof the TS which will
    describe key functional, electrical and environ\r\nmental requirments.\r\n It
    is anticipated that this Part 1 will enable manufacturers to offer\r\nappropriate
    implementation specific requirements which will be capture\r\nd in Part 2 of the
    TS.\r\n Consideration shall be given to channel/plant characteristics, the acc\r\ness
    environment, bit-rates, latency, power feeding, EMC and spectral c\r\nompatibility
    with existing narrow band services (e.g. POTS and ISDN-BA\r\n).\r\n"
