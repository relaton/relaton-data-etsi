abstract:
- language: en
  script: Latn
  content: 'This work item is the second part in a series of quantum-safe implementation
    guidance documents.  It is intended to provide developers with guidance to aid
    the secure implementation of the quantum-safe key encapsulation mechanism ML-KEM
    as specified by NIST FIPS 203.  This will highlight some potential ML-KEM implementation
    hazards; identify some side-channel and fault attack issues specific to ML-KEM;
    consider some testing and formal verification aspects relevant to ML-KEM; and
    briefly discuss the secure usage of ML-KEM.  '
