abstract:
- language: en
  script: Latn
  content: "This document covers scenarios and procedures to support the UMTS Virtual
    Home Environment (VHE). The VHE is a capability for providing operator-specific
    to end users with a consistent look and feel which is independant of location
    and serving network. It facilitates service adaptation to different network environments
    supporting directly connected, cordless and cellular access. The pilosophy of
    VHE has been proposed by GSM MoU and implementation scenarios have been identified
    and studied by ITU-T for IMT 2000 work.\r\n\r\nReference document: EG NA 061301.\r\n"
