abstract:
- language: en
  script: Latn
  content: "An addendum to ETSI TS 102 034 concerning Broadcast Content Guides (BCG).
    It provides specifications for the signalling and delivery of TV-Anytime information
    in DVB-IP services. The BCG addresses both Content on Demand and Live Content,
    whether the content is available as a DVB-IP service or as a pure DVB service.\r\nIt
    is as compatible as far as possible with ETSI TS 102 323, which specifies the
    signalling and delivery of TV-Anytime information in DVB transport streams"
