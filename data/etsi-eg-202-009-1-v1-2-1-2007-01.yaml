abstract:
- language: en
  script: Latn
  content: "Since the publication of EG 202 009, additional work has been completed
    among the user organizations while new QoS related standards have been made available
    by ETSI. Also, according to the complaints received by the help desk of the user
    organizations, there is a growing users' concern about the mobile networks and
    the services provided via Internet including while using mobile access. Therefore
    additional work to define new QoS parameters is needed in this area and a revision
    of EG 202 009 is needed, in particular Part 2, to make the standard makers aware
    of these parameters. This revision should be based on the development of appropriate
    criteria and methodology within a panel of users and experts then a validation
    of these proposals among the European user community with workshops in some European
    countries.\r\nThe final aim is to propose that the revised document is include
    in the LIST OF STANDARDS AND/OR SPECIFICATIONS FOR ELECTRONIC COMMUNICATIONS NETWORKS,
    SERVICES AND ASSOCIATED FACILITIES AND SERVICES, Pursuant to Article 17 of Directive
    2002/21/EC"
