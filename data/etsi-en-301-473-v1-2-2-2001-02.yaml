abstract:
- language: en
  script: Latn
  content: "To provide specifications for the standardization of transmit/receive
    aircraft earth stations in order to ensure general safety and to limit interference
    to other radio communications systems. There is a need for technical requirements
    in European Telecommunication Standards which cover aircraft earth stations\r\noperating
    in the bands allocated to the AMSS, or the MSS, which are intended for use in
    aircraft. To ensure the safety aspects and the compatibility with other radio
    and electronic systems on the aircraft, the preparation of the documents must
    be undertaken in collaboration with the Joint Aviation Authorities (JAA), supported
    as necessary by other interested organisations, e.g. EUROCAE.\r\n"
