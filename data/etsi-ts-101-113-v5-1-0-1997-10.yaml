abstract:
- language: en
  script: Latn
  content: "This TS defines the stage one\r\ndescription of the General Packet Radio
    Service (GPRS) on GSM. Stage\r\none is an overall service description, primarily
    from the service\r\nsubscriber s and user s points of view, but does not deal
    with the\r\ndetails of the human interface itself. This TS includes information\r\napplicable
    to network operators, service providers and terminal,\r\nswitch and data base
    manufacturers.\r\nThis TS contains the core requirements for the General Packet
    Radio\r\nService (GPRS) on GSM, which are sufficient to provide a complete\r\nservice.\r\nThis
    TS also documents some additional requirements which may be\r\nimplemented (but
    do not have to be implemented).\r\nIn addition, additional functionalities not
    documented in this TS may\r\nbe implemented. The requirements of which are considered
    outside the\r\nscope of this TS and consequently outside the scope of the\r\ncorresponding
    stage 2 and stage 3 ENs. This additional functionality\r\nmay be on a network-wide
    basis, or particular to one or a group of\r\nusers. Such additional functionality
    shall not compromise conformance\r\nto the core requirements of the service.\r\nThe
    interface between the Mobile Station (MS) and any external\r\napplications is
    outside the scope of this TS.\r\nCharging principles are outside the scope of
    this TS, unless specific\r\nservice requirements are stated. These requirements
    deal with the\r\nallocation of certain call charges to particular users.\r\nInteractions
    with services/supplementary services not listed in\r\nclauses 8 and 9 are outside
    the scope of this TS.\r\n"
