abstract:
- language: en
  script: Latn
  content: "This Technical Specification is divided split into two parts, Chapters\r\n1-4
    dealing with the MTP and chapters 5-7 dealing with the SCCP and\r\nits use.\r\nThe
    MTP provides a mechanism giving reliable transfer of signalling\r\nmessages. Chapters
    1-4 of this Technical Specification deals with the\r\nsubset of the MTP that can
    be used between an BSS and an MSC, which is\r\ncompatible with a full MTP.\r\nThe
    SCCP is used to provide a referencing mechanism to identify a\r\nparticular transaction
    relating to for instance a particular call.\r\nChapters 5-7 identify the SCCP
    subset that should be used between a\r\nBSS and an MSC. The SCCP can also be used
    to enhance the message\r\nrouting for (for instance) operations and maintenance
    information.\r\n"
