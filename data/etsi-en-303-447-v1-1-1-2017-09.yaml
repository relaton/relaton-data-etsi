- language: en
  script: Latn
  content: 'Define inductive robotic mower systems below 148.5kHz with related performance
    requirements and essential requirements in accordance with the Radio Equipment
    Directive 2014/53/EU Article 3(2). The EN will not cover devices under EN 303
    348 (Inductive loop for hearing impaired in 0- 20kHz) and the work will be coordinated
    with EN 303660 to avoid overlapp.  '
