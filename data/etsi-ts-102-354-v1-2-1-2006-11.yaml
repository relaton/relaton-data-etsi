  script: Latn
  content: "The present published document (TS 102 354v111) is an endorsement of the
    TIA Document TIA-1008; \"IP Over Satellite (IPoS)\".\r\nThis work item is intended
    to update this ETSI document to refer to the new version of the TIA Document:
    TIA-1008A; \"IP Over Satellite (IPoS)\". \r\nMain changes:\r\n1) Support for DVB-S2
    in forward channel;\r\n2) Support for high speed inroutes (reverse channels);\r\n3)
    Editorial and technical corrections.\r\n"
