abstract:
- language: en
  script: Latn
  content: "The present document provides terms and definitions used within the scope
    of the ISG ENI, in order to achieve a \"common language\" across all the ISG ENI
    documentation. This work item will be updated with the general terminology required
    as the ENI specifications develop.  In Release 4 definitions will be extracted
    from concepts e.g. context aware, situational aware, knowledge management, cognition
    functional blocks, zero trust.\r\nIn Release 4 the present document will add additional
    definitions from other ISG deliverables.\r\n"
