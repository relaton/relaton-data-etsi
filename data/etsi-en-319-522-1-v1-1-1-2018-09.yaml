abstract:
- language: en
  script: Latn
  content: 'This document will provide an overview of the EN. It will include an global
    view of the standardized service, addressing at least: logical model, including
    an overview of the different entities, components and events involved in an e-Delivery
    transaction; interfaces between the different roles and providers; relevant events
    in the data object flows and the corresponding evidence; and trust building among
    providers pertaining to the same or to different administrative domains.'
