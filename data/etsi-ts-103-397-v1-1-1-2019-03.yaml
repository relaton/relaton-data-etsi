abstract:
- language: en
  script: Latn
  content: "The current VoLTE networks are isolated without interconnections. In order
    to replace the CS voice services, all VoLTE networks shall be interconnected with
    better quality. \r\nThere are three technical aspects: e2e voice service level
    quality and  voice over LTE PS network level quality and emergency in roaming.
    \r\nThis test specification aims to verify the various interconnections and ensure
    that interoperability and roaming will respect the SLA agreed between operators."
