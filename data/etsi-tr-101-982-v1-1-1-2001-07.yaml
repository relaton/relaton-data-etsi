abstract:
- language: en
  script: Latn
  content: "System Reference Document for radar to be fitted on road infrastructure
    and vehicles. \r\nThe aim is to update the standard EN 301 091 for RTTE requirements,
    inclusion of radars for road traffic infrastructure applications.\r\nInclusion
    of 24 GHz Short Range Radar for safety. Anticollision under the EU ITS program.\r\nThe
    aim is to update EN 301 091 for automotive apllications in order to support future
    life saving equipment. Review ITU frequency allocations in the considered range
    request sharing study (from SE24) with primary users and elaborate the rationale."
