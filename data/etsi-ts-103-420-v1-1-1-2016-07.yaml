abstract:
- language: en
  script: Latn
  content: "In a separate document, define extensions to the Enhanced AC-3 codec as
    defined in TS 102 366 to carry object audio in a manner that is backwards compatible
    with existing channel based operation. (In this context, backwards compatibility
    means that if audio is encoded as defined in the proposed specification but decoded
    on an old device compliant just with TS 102 366, such device would output channel
    audio with the established semantics, using the mechanisms defined in TS 102 366
    alone).\r\nThe specification will cover:\r\n1. EMDF based metadata for object
    audio\r\n2. A mapping from 1) to ADM as defined in ITU-R BS.2076\r\n3. EMDF based
    metadata for carrying objects backwards compatible with channel-based operation\r\n4.
    Signal processing for 3)."
