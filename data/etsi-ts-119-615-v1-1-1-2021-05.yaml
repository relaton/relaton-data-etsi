abstract:
- language: en
  script: Latn
  content: "The document will specify how to  process a trusted list in order to obtain
    information about a listed QTSP and QTS it provides (e.g. for the purpose of validating
    of qualified signatures or for other types of signature and other services (e.g.
    (Q)eSeals, web-authentication, validation report, time-stamp etc.)).\r\nThis document
    will complement TS 119 612.\r\n\r\nIn particular it will specify: \r\n\r\n1. How
    to set trust (List of Trusted Lists (LOTL) – Trusted List (TL))\r\n\r\n2. How
    to extract information, how to interpret it\r\n\r\n                                                              i.
    \     verify the status of a TSP service (at a certain date) (e.g. via it’s certificate)
    and get relevant additional information on the service (e.g. type of service (e.g.
    eSeal Cert issuance))\r\n\r\n                                                            ii.
    \     extract relevant information (qualification info, service extension information,
    …) for a certain trust service output (e.g. a end-entity certificate) "
