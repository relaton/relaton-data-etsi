abstract:
- language: en
  script: Latn
  content: "To identify, among the generic provisions and terminology of EG 201 399,
    the actual attributes, technical phenomena and their specific terminology used
    in WG TM4 standards for the various typologies of Fixed Radio Systems for the
    production of Harmonised Standards under the R&TTE Directive 99/5/EC.  This TR
    wish to offer specific technical guidance for WG TM4 and other bodies (e.g. the
    ETSI STF, TCAM and the EC) in production and adoption of Fixed Service Harmonised
    Standards.\r\n\r\nThe possibility to convert the final TR into an EG is also considered.\r\n\r\n"
