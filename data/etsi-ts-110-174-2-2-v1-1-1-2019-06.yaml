abstract:
- language: en
  script: Latn
  content: "The present document addresses the opportunities and challenges offered
    by the use of lamp-posts to provide facilities supporting services required by
    sustainable digital multiservice cities and communities.\r\n \r\nThe replacement
    of existing luminaires by LED light sources offers an opportunity to increase
    the functionality provided by the lamp-posts - beginning with improved operational
    control of the lighting provided. \r\n \r\nHowever, additional functionality is
    supported by simultaneous installation of an electronics package to enable the
    lamp-post to host sensing devices. The present document describes the functions
    to be supported by this package together with consideration of power supply to
    any hosted sensing devices.\r\n \r\nA more comprehensive replacement approach
    includes the incorporation of 5G services by the separate installation of small
    (micro- or femto-cell) network components acting as a Remote Radio Unit (RRU).
    \ The present document describes the technical challenges associated with the
    physical installation, provision of power, cabling and other infrastructures necessary
    to meet the necessary level of availability for these services."
