abstract:
- language: en
  script: Latn
  content: "This revision of NFV-TST 008 continues the development of the specification
    as part of the NFV Release 3.\r\nThis edition will add requirements and specification
    of metrics to support the Release 3 features, and it will extend the scope of
    the former Release 2 edition summarized hereafter:\r\n\r\nSpecify detailed and
    vendor-agnostic key operational performance metrics at different layers of the
    Network Function Virtualization Infrastructure (NFVI), especially processor usage
    and network interface usage metrics.These metrics are expected to serve as references
    for processed and time-aggregated measurement values for performance management
    information that traverses the Or-Vi and/or Vi-Vnfm reference points.\r\nThe work
    item deliverable will contain normative provisions.\r\n\r\nThis revision of NFV-TST
    008 will address the Release 3 candidate features listed in Annex B of the Release
    3 Definition. Where needed, it will continue the previous version to enhance and
    complete the specified Release 3 features.\r\nThis revision will reflect the maintenance
    performed to NFV Release 2 documentation and of already specified Release 3 features."
