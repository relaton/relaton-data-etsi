abstract:
- language: en
  script: Latn
  content: 'Consider in currently published standard the following further aspects:
    • Relations with 3GPP SA5 WI on EE  • Multistandard and multiRAT base stations
    in sites  • Improving methods to measure energy consumption (including ES 202
    336-12) and energy efficiency • Add further examples of reporting tables  • Site
    impact assessment (ICT vs Support Equipment in sites) acc. EEPS(14)046004 • Statistical
    approach to make the extrapolation of results • Technical changes following the
    result and experience from trial application of published version.  The revision
    of the standard will be done in cooperation with ITU to continue to have technical
    aligned the two documents.'
