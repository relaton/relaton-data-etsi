abstract:
- language: en
  script: Latn
  content: "The present document defines an electronic interface between two systems
    for the exchange of information relating to the establishment and management of
    Lawful Interception. Typically this interface would be used between: on one side,
    a Communications Service Provider; and, on the other side, a Law Enforcement Agency
    who is entitled to request Lawful Interception. The present document is a specific
    and detailed example of one particular Warrantry interface.\r\nThis revision extends
    the specification to support Lawful Disclosure, which encompasses the various
    processes that deal with requests for data stored within the CSP domain, on behalf
    of a government authorised organisation.\r\nWhen published, the revision of the
    present document will include technical extensions to the tasking capabilities
    and will also investigate and potentially implement a mechanism that reuses the
    previously published ETSI TC LI specifications which define communications channels
    and associated best practises to directly deliver such stored data.\r\nThis revision
    is for the following changes: add Native XML delivery, make DELIVER verb consistent
    and minor editorial corrections."
