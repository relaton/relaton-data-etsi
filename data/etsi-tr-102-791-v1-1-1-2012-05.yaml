abstract:
- language: en
  script: Latn
  content: "SRDoc to describe the  spectrum requirements for wireless audio devices
    for hearing impaired people in the VHF and UHF frequency range The document will
    discuss the spectrum requirements for such wireless audio devices and include
    all optional frequency bands proposed as well as the quantity of spectrum envisaged
    to be required and the possible interference mititation techniques that are proposed
    for the respective application(s) to facilitate sharing with other radio applications
    and services.\r\n"
