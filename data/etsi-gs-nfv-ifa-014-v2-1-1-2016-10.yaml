abstract:
- language: en
  script: Latn
  content: "This Work Item will develop a specification for describing Network Service
    meta-data requirements and meta-data templates used to decribe Network Services.
    \r\nExamples of Network Service meta-data templates are Network Service Descriptor,
    VNF Forwarding Graph Descriptor, Virtual Link Descriptor and PNF Descriptor.\r\nThis
    work item will build from the information captured in the MAN Group Specification
    documents related to information elements. \r\n\r\nStandardized meta-data templates
    are required for Network Services to:\r\n•\tdescribe the relationships between
    NS and VNFs and/or connectivity to PNFs that are part of the NS, along with dependencies
    and other constraints, such as those imposed by the scope of the MANO GS MAN 001,
    \r\n•\tdescribe the NFV infrastructure resource requirements for a NS in a service
    provider environment\r\n•\tdescribe NS operational behaviour within the scope
    of NFV including NS  lifecycle events (eg. scaling, upgrading). \r\n\r\nDeliverable
    for this work item will be an normative GS document addressing: \r\n-\tRequirements
    for the structure and format of the various NS meta-data templates, \r\n-\tA consistent
    meta-model, describing the NS properties and resource requirements building,\r\n?\tA
    consistent meta-model, describing the NS networking properties and resource requirements
    building,.\r\nThe output of this work should be used as formal requirements for
    extensions into normative specifications developed by other SDOs."
