abstract:
- language: en
  script: Latn
  content: "This revision of NFV-IFA 015 maintains the deliverable into NFV Release
    3.\r\nThis edition will maintain the information model to support all Release
    3 features, and will extend the scope of the former  edition.\r\nThis Work Item
    will build upon the Information Elements developed in the latest versions of IFA
    Work Items IFA004, IFA005, IFA006, IFA007, IFA008, IFA011, IFA012, IFA013 and
    IFA014 and translate them into a UML NFV Information Model. The NFV Information
    Model will present a consolidated view of NFV Management and Orchestration model.
    It will use information from:\r\n• Network Service Templates information elements,
    produced by IFA014\r\n• VNF Descriptor information elements produced by IFA011\r\n•
    Informatiom elements related to acceleration resource management produced by IFA004\r\n•
    Information elements produced by IFA005, IFA006, IFA007, IFA008, IFA012 and IFA013.\r\nThe
    WI deliverable shall be informative even it consolidates the normative information
    elements from the Work Items listed above. The output deliverable will include
    the UML NFV Information Model as an electronic attachment. The format of the model
    will be the Papyrus Open Source format."
