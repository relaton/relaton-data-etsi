abstract:
- language: en
  script: Latn
  content: "The present document describes a second generation baseline transmission
    system for digital terrestrial television broadcasting. It specifies the channel
    coding/modulation system intended for digital television services and generic
    data streams. The scope is as follows:\r\n- it gives a general description of
    the Baseline System for digital terrestrial TV;\r\n- it specifies the digitally
    modulated signal in order to allow compatibility between pieces of equipment developed
    by different manufacturers. This is achieved by describing in detail the signal
    processing at the modulator side, while the processing at the receiver side is
    left open to different implementation solutions. However, it is necessary in this
    text to refer to certain aspects of reception."
