abstract:
- language: en
  script: Latn
  content: "This work item will extend the Bandwidth Management service (MEC-015)
    for supporting QoS and Multi-Access Traffic Steering (MTS) Management on MEC Platform.
    The new specification is referred to as “Traffic Management APIs”, to \r\nsupport
    the following requirements: \r\n1) MEC application to get informed of various
    MTS capabilities and multi-access network connection info available on the MEC
    platform  \r\n2) MEC application to provide indication and requirements, e.g.
    delay, throughput, loss, for influencing MTS operation"
