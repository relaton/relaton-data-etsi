abstract:
- language: en
  script: Latn
  content: The purpose of the new work item specifies what the AN Agent for home broadband installation and assurance is, as well as its functional requirements, description of its application scenario, and finally, its non-functional requirements. It will focus on automating customer premises equipment installation, service activation, troubleshooting, and lifecycle maintenance. Requirements for these functions such as query and perception, analysis and decision-making, task execution, memory function will be put forward.
