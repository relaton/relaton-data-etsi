abstract:
- language: en
  script: Latn
  content: Preparation of a full TVRA (using guidelines from ISO 15408 and TS 102
    165-1) for ITS covering Vehicle to vehicle, Vehicle to roadside infrastructure
    (network), Vehicle to roadside standalone unit and ITS integration with Internet
    communication scenarios. This work shall consider the existing output from ongoing
    studies (eSAFETY, SEVECOM  and others) and also from other standards groups including
    IEEE 1609.2 and ISO TC204 (CALM).
