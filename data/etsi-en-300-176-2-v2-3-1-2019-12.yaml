abstract:
- language: en
  script: Latn
  content: EN 300 175-8 is currently being updated for SWB and FB capabilities under
    WI REN/DECT-00328. Additionally, the requirement specifications regarding NB and
    WB are aligned with requirements defined by STQ. EN 300 176-2 defines the test
    methodologies for the requirements set up in EN 300 175-8. As a consequence of
    this tight coupling, the update of EN 300 175-8 requires an update of the corresponding
    parts in EN 300 176-2.
