abstract:
- language: en
  script: Latn
  content: "When the physical interface is not accessible to an attached test tool,
    alternative methods for the verification of conformance requirements based on
    APDU communication on the UICC-terminal interface are needed. The LS C6-220198/SETREQ(22)000011
    from 3GPP WG CT6 is proposing a new verification method based on toolkit test
    events- as one of the recommended test methods.\r\nThe scope of this Work Item
    is to collect and define requirements for the UICC to support a specific test
    operating mode and a test configuration.\r\nThe work includes the following aspects:\r\n-
    Define test operating mode and test configuration\r\n- Requirements for the specific
    test operating mode. \r\n- Requirements for the test configuration.\r\n- Security
    requirements to restrict the usage of the specific test operating mode and the
    test configuration to tests purposes only. "
