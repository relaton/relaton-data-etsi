abstract:
- language: en
  script: Latn
  content: "CRs @ SCP#8 - \r\nThe UICC may contain various security sensitive data
    items like secret codes, keys, certificates, etc. A standardised way to securely
    initialise or update this data is currently not existing. The purpose of this
    work item is to:\r\n1  Analyze  already existing standardized mechanisms to initialise
    and update  sensitive data in an ICC.\r\n2  Define a generic  mechanism  to initialise
    and update sensitive data in the UICC.\r\n"
