  content: Technical report aiming at evaluating the notion of nominated bandwidth so that the case of emission in the out of band domain are taken into account for future ENs or revision of existing ENs involving Earth station emissions, if need be. The nominated bandwidth of emissions in this document is limited to its use for Earth stations emissions; the concept of nominated bandwidth of satellite transponders is not part of the scope.
