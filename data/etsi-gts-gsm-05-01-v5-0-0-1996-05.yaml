abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) is an introduction to\r\nthe
    05 series of the GSM technical specifications for GSM and DCS\r\n1800. It is not
    of a mandatory nature, but consists of a general\r\ndescription of the organization
    of the physical layer with reference\r\nto the technical specifications where
    each part is specified in\r\ndetail. It introduces furthermore, the reference
    configuration that\r\nwill be used throughout this series of technical specifications.\r\n
