abstract:
- language: en
  script: Latn
  content: "A new stage 2 release 3 work item 'NGN integrated IPTV Architecture',
    which is an evolution of dedicated IPTV architecture to:\r\n-introduce new architecture
    features required to address new service requirements identified in WI01059;\r\n-consider
    closer integration between IPTV services and NGN networks;\r\n-consider migration
    scenarios fro existing solutions (i.e. DVB-IPI, ATIS-IIF), common components and
    joint operation between IMS based and 'NGN integrated IPTV subsystem'\r\nfill
    the gaps, if any, in TISPAN Release 2 dedicated IPTV architecture."
