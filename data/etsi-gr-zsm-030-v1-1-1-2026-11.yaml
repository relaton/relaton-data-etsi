abstract:
- language: en
  script: Latn
  content: 'The purpose of the new work item specifies what the AN agent for end-to-end
    network optimization, as well as its functional requirements, description of its
    application scenario, and finally, its non-functional requirements. The agent
    functions including perception management, analysis and decision-making, task
    execution, knowledge management, model management, short- and long-term memory
    management, and agent runtime and interaction.  Representative application scenarios
    include optimization of under-utilized network resources, mitigation of capacity
    bottlenecks caused by highly utilized resources, and cross-domain optimization.
    The work item aims to enable intent-driven, data-driven and closed-loop network
    optimization.  '
