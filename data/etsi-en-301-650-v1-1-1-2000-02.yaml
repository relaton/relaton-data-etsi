abstract:
- language: en
  script: Latn
  content: "definition of a DECT Multimedia Access Profile (DMAP) mainly for home
    and SOHO markets. This profile will combine a selection of the DECT data services
    with optional voice services offered by GAP allowing terminals to provide true
    integrated multimedia services. Data services and packet data and possibly isochronous
    services.\r\n\r\nThe aim of this standard is to guarantee interoperability. The
    profile will define a selection of the relevant options available in the current
    data profiles and where necessary describe interworking scenarios.\r\n\r\nThe
    multimedia profile will be based on existing profiles. This will limit the required
    standardisation effort and facilitate fast realisation of the profile and products
    to market.\r\nThe profile may include an aspect of a DECT API."
