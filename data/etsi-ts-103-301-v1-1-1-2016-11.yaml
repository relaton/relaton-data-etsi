abstract:
- language: en
  script: Latn
  content: The WI is to define specification at the facilities layer services to support
    communications from and/or to an infrastructure ITS-S (road side ITS-S or central
    ITS-S). It describes the related protocol handling for selected messages and specifies
    requirements to lower layer protocol stacks and to the security entity in order
    to support message dissemination and reception.
