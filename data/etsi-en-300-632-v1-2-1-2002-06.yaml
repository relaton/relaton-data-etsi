abstract:
- language: en
  script: Latn
  content: "Extend the frequency band of the ETS 300 632 from 24.25 - 29.5 GHz to
    24.25 - 31.8 GHz and modify equipment parameters if necessary. During this redrafting
    the opportunity will be taken to implement current TM4 practice and replace the
    ETS with an EN. For example, the section dealing with spurious emission, which
    currently defines limits, will be changed to reference CEPT Rec. 74-01. A section
    dealing with EMC will be added.\r\nNote. Currently the United Kingdom authorises
    the use of the frequency ranges from 31.0 to 31.3 GHz and 31.5 to 31.8 GHz for
    analogue security video systems using a Voluntary National Standard (VNS). The
    European Commission have authorised the use of the VNS but strongly recommended
    that the Radiocommunications Agency initiate work within TM4 to draft a European
    standard for 31 GHz analogue surveillance systems."
