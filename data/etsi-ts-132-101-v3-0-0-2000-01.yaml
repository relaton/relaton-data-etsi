abstract:
- language: en
  script: Latn
  content: "The present document establishes and defines the  management principles
    and high level requirements for the management of UMTS.\r\nIn particular, the
    present document identifies and/or defines:\r\n-the high level requirements of
    a UMTS Management System\r\n-the reference model, showing the elements the UMTS
    Management System interacts with\r\n-the network operator processes needed to
    run, operate and maintain a UMTS network\r\n-the functional architecture of the
    UMTS Management System\r\n-the principles to be applied to UMTS Management Interfaces\r\n-the
    methodology to be followed in further steps of the UMTS Management Specifications\r\nThe
    present document does not provide physical architectures of the UMTS Management
    System.\r\nThis document is applicable to all further 3GPP specifications regarding
    the Network Management of UMTS.\r\n"
