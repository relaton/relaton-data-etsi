abstract:
- language: en
  script: Latn
  content: "This revision of NFV-SOL 007 conducts NFV Release 2 maintenance. It corrects
    errors, ambiguities, misalignments, and applies editorial modifications (i.e.
    Corrections of category F and D as described in ETSI TWPs Annex L). \r\n\r\nThis
    edition does not add or modify features, nor does it extend the scope of the former
    Release 2 edition summarized hereafter:\r\nSOL007 specifies the Network Service
    Descriptor file structure and naming conventions for the different files, fulfilling
    the requirements specified in ETSI GS NFV-IFA 014."
