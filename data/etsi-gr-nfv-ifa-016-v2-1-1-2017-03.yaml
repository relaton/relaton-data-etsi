abstract:
- language: en
  script: Latn
  content: "This Work Item will produce guidelines for the development of a protocol-neutral
    UML (Unified Modeling Language) information model for ETSI NFV. \r\nThis Work
    Item will build upon the internal document NFV Papyrus Guidelines developed as
    part of IFA015. This Work Item will address closer alignment with corresponding
    UML modelling guidelines from ONF and may be influenced by other partners cooperating
    with NFV.\r\nThe deliverable will be informative."
