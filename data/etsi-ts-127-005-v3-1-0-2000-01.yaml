abstract:
- language: en
  script: Latn
  content: "Transfer of GSM 07.05 to 3GPP.\r\n_____________________\r\nThis TS defines
    three interface protocols for control of SMS functions within a GSM mobile telephone
    from a remote terminal via an asynchronous interface. This specification considers
    the mobile termination to be a single entity. Other TSs describe the split of
    functionality between the mobile equipment and SIM."
