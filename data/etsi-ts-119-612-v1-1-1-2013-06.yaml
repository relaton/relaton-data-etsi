abstract:
- language: en
  script: Latn
  content: "The goal of this WI is to produce a TS containing all the specifications
    related to Trusted Lists as they are defined currently in CD 2009/767/EC amended
    by CD 2010/425/EU and taking into account:\r\n•\tcurrent TS 102 231 v3.1.2;\r\n•\trecommendations
    from study (MARKT/2011/047/E) with regards to the analysis of Trusted Lists (as
    defined by Commission Decision 2009/767/EC amended by CD 2010/425/EU); and\r\n•\tfuture
    revision process of those CD's by the EC and by the EU Member States as resulting
    from the Services Directive Experts Group meetings and related decisions. This
    process aims to rely on the fact that future CD will refer the new TS and that
    current technical annex of CD's will then be removed and integrated into this
    new TS.\r\n\r\nIndicative planning: WI is expected to start no later than early
    May 2012 as an early draft would ideally be available for ETSI ESI#36 and for
    next Services Directive Experts Group meeting to be held on 15/06/2012. A second
    draft version would be available early September as second next Services Directive
    Experts Group meeting is planned to be held on 12/09/2012. A stable draft would
    be made available by end of September. A final draft for TC approval would be
    due by end of October 2012. Publication as a TS would be expected by end of 2012.
    This planning is indicative as it will mainly depend on the EC and Member States
    as being main stakeholders of the WI resulting TS.\r\nThe process of CD 2010/425/EU
    revision will be initiated by the EC in June 2012. \r\n\r\nThe production of TS
    119 612 is aimed to be a first step towards the future EN 319 612 as targeted
    by the Rationalised Framework document DSR/ESI-000099 (document under approval
    by ESI and CEN)."
