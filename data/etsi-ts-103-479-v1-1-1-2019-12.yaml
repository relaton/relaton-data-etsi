abstract:
- language: en
  script: Latn
  content: "The purpose of this work is to describe the architecture, the core elements
    and corresponding technical  interfaces for network independent access to emergency
    services. Elements are:    \r\n*Border Control Function    \r\n*Emergency Service
    Routing Proxy    \r\n*Emergency Call Routing Function     \r\n*Public Safety Answering
    Point    \r\n*Legacy Network Gateway    \r\n*Location Information Service  \r\nThe
    described architecture is currently named Next Generation 112 architecture. \r\n"
