abstract:
- language: en
  script: Latn
  content: "To study CB usage in different scenarios (different modulation modes and
    different RF output power). The study should asses CB compatibility (e.g. interference)
    with other telecommunication services (telephone, TV, etc.) in those different
    scenarios, using EMC and radio spectrum measurements (methods widely accepted)
    and to co-ordinate with ERC and CENELEC. The study will be based on actual up-to-date
    measurements data, and software simulation methods will be used as well.\r\n"
