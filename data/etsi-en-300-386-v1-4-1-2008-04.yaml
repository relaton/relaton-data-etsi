abstract:
- language: en
  script: Latn
  content: "update the references of CISPR 16-1, EN50082-1, EN55022, EN61000-4-2,
    EN61000-4-3, EN61000-4-4, EN61000-4-5, EN61000-4-6, EN61000-4-11 and EN300132-2
    and add dates to the basic standards \r\ninclude the reference of EN61000-3-11
    and EN61000-3-12\r\ninclude radiated immunity test (sub-clause 7.2.1.1.2 and 7.2.2.1.2)
    in the frequency range 2-2.7GHz; test level 3V/m; 80% AM at 1kHz; performance
    criterion “A”\r\nupdate the vvoltage dips and short interruption tests on AC port
    of “Other than Telecommunication centre” (sub-clause 7.2.2.4.4) according to the
    latest publication of EN61000-4-11 and the generic standard IEC61000-6-2\r\nremove
    the ETR238 from the bibliography \r\nadd the normative Annex A as in EN301489-1
    under revision process\r\n\r\n"
