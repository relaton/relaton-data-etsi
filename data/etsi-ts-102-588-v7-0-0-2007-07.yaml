abstract:
- language: en
  script: Latn
  content: "The aim of this work item is to deliver an API that allows Java Card™
    Applets to extend the functionality of the Smartcard Webserver. The Smartcard
    Webserver is defined by OMA and the requirements for this API are given in TS
    102 412. This work item will deliver\r\n·An architecture based on the UICC CAT
    Runtime Environment defined in TS 102 241\r\n·An API to register Applets to the
    Smartcard Webserver\r\n·An API that enables an Applet to receive Http requests
    from the Smartcard Webserver and to send Http responses back from the Applet to
    the Smartcard Webserver.\r\n"
