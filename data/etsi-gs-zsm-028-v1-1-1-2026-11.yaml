abstract:
- language: en
  script: Latn
  content: 'The present document specifies an operational framework and detailed requirements
    for the sustained management, monitoring, and governance of Large Language Models
    (LLMs) and Small Language Models (SLMs) after their deployment into live telecommunications
    network production environments. It exclusively addresses the post-deployment
    operational phase, defining standardized processes to ensure continuous reliability,
    safety, and performance alignment with network operational objectives. Key aspects
    include the definition of a model metadata schema with network-specific attributes
    for operational traceability; real-time performance monitoring and automated corrective
    actions (e.g., rollback) triggered against Network Service Level Objectives (NSLOs);
    online validation of models within operational network segments; standardized
    integration with network data sources and policy enforcement points; and comprehensive
    security, multi-tenancy, and compliance controls throughout the operational lifecycle.
    This framework is scoped independently of both generic AI management enablers
    and end-to-end LLM lifecycle frameworks: it is complementary to ETSI GS ZSM 012,
    which defines a set of generic AI/ML enablers (e.g., validation services, sandboxing,
    trust management) without specifying how to operate LLMs in production networks,
    and to ETSI GS ENI 050, which provides a high-level end-to-end lifecycle framework
    covering design, training, deployment and retirement but does not detail the operational
    phase. By focusing exclusively on the continuous operation of LLMs/SLMs in telecom
    production networks, the present document fills a dedicated niche that is not
    addressed by either of those specifications.'
