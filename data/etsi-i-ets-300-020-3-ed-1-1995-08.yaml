abstract:
- language: en
  script: Latn
  content: "These are the technical characteristics and methods of measurement for\r\nmobile
    stations, for the Pan European Personal Communication System\r\nstandardized by
    the ETSI Technical Committee \"Special Mobile Group\"\r\n(SMG).\r\n In this I-ETS
    a DCS 1800 Mobile Station can be:\r\n-   a vehicle mounted station;\r\n-   a transportable
    station;\r\n-   a handheld station;\r\n-   a vehicle mounted/transportable station;\r\n-
    \  a vehicle mounted/handheld station.\r\n This I-ETS covers the minimum characteristics
    considered necessary in\r\norder to provide sufficient equipment performance for
    mobile station\r\nequipment in the DCS 1800 system and to prevent interference
    to other\r\nservices or to other users and to GSM and DCS 1800 PLMNs. Where the\r\n900
    MHz service is referred to in sections of GSM 11.10 not included\r\nin this document
    then this shall be considered as the 1800 MHz\r\nservice.\r\n This I-ETS does
    not necessarily include all the characteristics which\r\nmay be required by a
    user, nor does it necessarily represent the\r\noptimum performance achievable.\r\n
    This I-ETS applies to the public land mobile radio telephone service\r\nin the
    DCS 1800 system, using constant envelope modulation and\r\noperating on radio
    frequencies in the 1800 MHz band with a channel\r\nseparation of 200 kHz and carrying
    8 full rate traffic channels or 16\r\nhalf rate channels per carrier according
    to the TDMA principle.\r\n "
