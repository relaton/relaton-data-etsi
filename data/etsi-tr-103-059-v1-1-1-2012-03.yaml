abstract:
- language: en
  script: Latn
  content: "For 13.56 MHz RFIDs the carrier allowance of 60 dBµA/m together with the
    present modulation mask level is not usable and functioning (see EN 300 330).\r\nThe
    ISO/JTC1 SC31 is issuing the ISO 18000-3m3 for the Item Level tagging for higher
    data speed and higher range requirement on the basis of 60 dBµA/m carrier level.
    \ \r\nThe proposed NWI therefore proposes a TR 103 xxx to evaluate the mask level
    problem and to provide proposals for the ECC."
