abstract:
- language: en
  script: Latn
  content: "To produce a \"generic standard\", candidate for harmonisation, which
    identify all the essential parameters relevant to P-MP fixed radio systems, and
    by cross referencing the relevant clauses in present equipment and antenna ENs
    produced by TM4, provides the actual value of the required essential parameters.
    \  The essential parameters will be derived from the guidance given in EG 201
    399 and from further specific adaptation to Fixed Radio systems given in TR (DTR/TM-4089)\r\n"
