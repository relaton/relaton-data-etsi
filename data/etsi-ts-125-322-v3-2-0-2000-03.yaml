abstract:
- language: en
  script: Latn
  content: "The scope of this description is to describe the RLC protocol. A description
    document is intermediate between a stage 2 document and a protocol specification.
    Once completed, it should be sufficient for manufacturers to start some \" high
    level design \" activities. It should allow as well to assess the complexity of
    the associated protocol. After the completion of a description document, the drafting
    of the protocol specification should not have to face difficulties which  would
    impact the other protocols i.e. the radio interface protocol architecture should
    be stable. This means that some procedures which are felt critical in terms of
    complexity will need to be studied in more details in the description document
    so that no problem is faced in the writing of the final protocol.\r\n\r\nThe following
    lists typical contents for a description document :\r\n1.list of procedures\r\n2.logical
    flow diagrams for normal procedures\r\n3.logical description of message (where
    it should be possible to guess roughly the size of the various information elements)\r\n4.principles
    for error handling\r\n5.some exceptional procedures which are felt critica\r\n6.It
    should, as far as possible, have the same format and outline as the final specification\r\n\r\nThe
    following is not covered\r\n1.exact message format\r\n2.all scenarios\r\n\r\n\r\n\r\n"
