abstract:
- language: en
  script: Latn
  content: The DTS-UHD is a “Next Generation” audio codec. The proposed specification
    will define both the metadata and compressed audio bit-stream to supports delivery
    of an immersive audio experience using more channels, audio objects and sound
    field synthesis. This DTS-UHD specification will be used to deliver the DTS:X
    consumer experience in streaming and broadcast applications. This proposed specification
    for DTS-UHD can also be used in conjunction with elements of the DTS specification
    (ETSI TS 102 114 ).
