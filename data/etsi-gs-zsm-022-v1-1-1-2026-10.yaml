abstract:
- language: en
  script: Latn
  content: a) The work item will specify extensions and new capabilities to support and integrate agent technologies within the ZSM framework reference architecture to enhance end-to-end zero-touch network and service management. b) The work item will define use cases involving agents for network and service management as well as multi-agent communication use cases to derive specific requirements. c) The work item will specify requirements for the ZSM architecture to enable agent communication, coordination, and knowledge sharing in support of zero-touch management operations. d) The work item will be a stage 1 and 2 normative specification based on the ZSM reference architecture and will reference relevant standards and open-source work where appropriate. e) The content of the ETSI GR ZSM 020 informative study on the utilization of agents for network and service management will serve as an input to this work item. f) Collaboration with other SDOs (e.g. IRTF NMRG, ITU-T SG13, TM Forum) will be pursued where appropriate to ensure alignment and synergy.
