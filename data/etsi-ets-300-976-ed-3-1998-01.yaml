abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) identifies the Mobile-s\r\nervices
    Switching Centre/Interworking Functions (MSC/IWFs) and require\r\nments to support
    interworking between:\r\na)PLMN and PSTN\r\nb)PLMN and ISDN\r\n It is not possible
    to treat ISDN and PSTN as one type of network, even\r\nwhen both ISDN and PSTN
    subscribers are served by the same exchange b\r\necause of the limitations of
    the PSTN subscribers access i.e. analogue\r\nconnection without D-channel signalling.\r\nWithin
    this ETS, the requirements for voice and non-voice (data) calls\r\nare considered
    separately.\r\n"
