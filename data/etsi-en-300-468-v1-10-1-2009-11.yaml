abstract:
- language: en
  script: Latn
  content: The present document specifies the Service Information (SI) data which
    forms a part of DVB bitstreams, in order that the user can be provided with information
    to assist in selection of services and/or events within the bitstream, and so
    that the Integrated Receiver Decoder (IRD) can automatically configure itself
    for the selected service.
