abstract:
- language: en
  script: Latn
  content: The present document gives the specification for the delivery of STI-D(LI)
    and ETI(LI) over IP networks. An example for STI-D would be from a DAB Service
    Multiplexer to a DAB Ensemble Multiplexer. An example for ETI would be between
    DAB Ensemble Multiplexers and DAB Modulators (COFDM).
