abstract:
- language: en
  script: Latn
  content: The TVRA needs to be updated to address the scope of BSA in ITS Revision
    2, the selected security architecture and services defined in the suite of documents
    TS 102 940/1/2/3 and in the data encoding specification TS 103 097. To also address
    the ITS directive and its annex and communications from the EU regarding C-ITS
    deployment. Advances made in WG5 since the publication need to be addressed in
    additions to key management and other protections implied by the risk analysis
    in its original form. An analysis of the TVRA aspects of long term issues for
    deployment of ITS should be addressed as far as possible. In addition the underlying
    method described in TS 102 165-1 has been updated by TC CYBER and should be acknowledged.
    Furthermore there has been only limited direct assessment of regulation (e.g.
    GDPR, RED) and of multiple media sources for C-ITS should be corrected.
