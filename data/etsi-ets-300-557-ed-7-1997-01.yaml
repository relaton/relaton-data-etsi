abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) specifies the procedure\r\ns
    used at the radio interface (Reference Point Um, see GSM 04.02) for\r\nCall Control
    (CC), Mobility Management (MM) and Radio Resource (RR) ma\r\nnagement.\r\nWhen
    the notations for \"further study\" or \"FS\" or \"FFS\" are present in\r\nthis
    ETS they mean that the indicated text is not a normative portion\r\nof this standard.\r\nThese
    procedures are defined in terms of messages exchanged over the c\r\nontrol channels
    of the radio interface. The control channels are descr\r\nibed in GSM 04.03.\r\nThe
    structured functions and procedures of this protocol and the relat\r\nionship
    with other layers and entities are described in general terms\r\nin GSM 04.07.\r\n0.1Scope
    of the Technical Specification\r\nThe procedures currently described in this ETS
    are for the call contro\r\nl of circuit-switched connections, mobility management
    and radio resou\r\nrce management.\r\nGSM 04.10 contains functional procedures
    for support of supplementary\r\nservices.\r\nGSM 04.11 contains functional procedures
    for support of point-to-point\r\nshort message services.\r\nGSM 04.12 contains
    functional description of short message - cell broa\r\ndcast.\r\nNOTE:\"layer
    3\" includes the functions and protocols described in this\r\nETS. The terms \"data
    link layer\" and \"layer 2\" are used interchangeab\r\nly to refer to the layer
    immediately below layer 3.\r\n0.2Application to the interface structures\r\nThe
    layer 3 procedures apply to the interface structures defined in GS\r\nM 04.03.
    They use the functions and services provided by layer 2 defin\r\ned in GSM 04.05
    and 04.06. GSM 04.07 gives the general description of\r\nlayer 3 including procedures,
    messages format and error handling.\r\n0.3Structure of layer 3 procedures\r\nA
    building block method is used to describe the layer 3 procedures. The basic building
    blocks are \"elementary procedures\" provided by the\r\nprotocol control entities
    of the three sublayers, i.e. radio resource\r\nmanagement, mobility management
    and connection management sublayer.\r\nComplete layer 3 transactions consist of
    specific sequences of element\r\nary procedures. The term \"structured procedure\"
    is used for these sequ\r\nences.\r\n0.4Test procedures\r\nTest procedures of GSM
    radio interface signalling are described in GSM\r\n11.10 and 11.20.\r\n0.5Use
    of logical channels\r\nThe logical control channels are defined in GSM 05.02.
    In the followin\r\ng those control channels are considered which carry signalling
    informa\r\ntion or specific types of user packet information:\r\ni)Broadcast Control
    CHannel (BCCH): downlink only, used to broadcast\r\nCell specific information;\r\n
    ii)Synchronization CHannel (SCH): downlink only, used to broadcast sy\r\nnchronization
    and BSS identification information;\r\n iii)Paging CHannel (PCH): downlink only,
    used to send page requests t\r\no Mobile Stations;\r\n iv)Random Access CHannel
    (RACH): uplink only, used to request a Dedic\r\nated Control CHannel;\r\n v)Access
    Grant CHannel (AGCH): downlink only, used to allocate a Dedi\r\ncated Control
    CHANNEL;\r\n vi)Stand Alone Dedicated Control CHannel (SDCCH): bi-directional;\r\n
    vii)Fast Associated Control CHannel (FACCH): bi-directional, associat\r\ned with
    a Traffic CHannel;\r\n viii)Slow Associated Control CHannel (SACCH): bi-directional,
    associa\r\nted with a SDCCH or a Traffic CHannel;\r\n ix)Cell Broadcast CHannel
