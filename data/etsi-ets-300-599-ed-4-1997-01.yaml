abstract:
- language: en
  script: Latn
  content: "It will be necessary to transfer between entities of a Public Land Mob\r\nile
    Network (PLMN) information specific to the PLMN in order to deal w\r\nith the
    specific behaviour of roaming mobile stations. The Signalling\r\nSystem No. 7
    specified by CCITT is used to transfer this information.\r\nThis ETS describes
    the requirements for the signalling system and the\r\nprocedures needed at the
    application level in order to fulfil these si\r\ngnalling needs.\r\nClauses 1
    to 4 are related to general aspects such as terminology, mob\r\nile network configuration
    and other protocols required by MAP.\r\nMAP consists of a set of MAP services
    which are provided to MAP servic\r\ne-users by a MAP service-provider.\r\nClauses
    5 to 10 of this ETS describe the MAP services.\r\nClauses 11 to 14 define the
    MAP protocol specification and the behavio\r\nur of service provider (protocol
    elements to be used to provide MAP se\r\nrvices, mapping on to TC service primitives,
    abstract syntaxes...).\r\nClauses 15 to 21 describe the MAP user procedures which
    make use of MA\r\nP services.\r\n "
