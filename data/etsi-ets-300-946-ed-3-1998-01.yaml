abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) specifies the Radio Lin\r\nk
    Protocol (RLP) for data transmission over the GSM PLMN. RLP covers t\r\nhe Layer
    2 functionality of the ISO OSI Reference Model (IS 7498). It\r\nis based on ideas
    contained in IS 3309, IS 4335 and IS 7809 (HDLC of I\r\nSO) as well as CCITT X.25
    and Q.92x (LAP-B and LAP-D of CCITT, respect\r\nively.) RLP has been tailored
    to the special needs of digital radio tr\r\nansmission. RLP provides to its users
    the OSI Data Link Service (IS 88\r\n86).\r\nRLP is intended for use with non-transparent
    data-transfer. Protocol c\r\nonversion may be provided for a variety of protocol
    configurations. Th\r\nose foreseen immediately are:\r\n-\tCharacter-mode protocols
    using start-stop transmission (IA5);\r\n -\tX.25 LAP-B.\r\n For reasons of better
    presentation, material about protocol conversion\r\nhas been placed within those
    Specifications concerned with the releva\r\nnt Terminal Adaptors, i.e. GSM 07.02
    for the asynchronous case and GSM\r\n07.03 for the synchronous case. Care must
    be taken that that material\r\nalso applies to Interworking Functions; see GSM
    09.04 - 09.07.\r\n "
