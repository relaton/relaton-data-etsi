abstract:
- language: en
  script: Latn
  content: "This technical report will define RRS Use Cases related to the introduction
    of mechanisms to enable the dynamic declaration of conformity with the essential
    requirements. In particular, this work is tailored to the potential needs of the
    future version of the R&TTE Directive, which is currently in preparation. These
    Use Cases will involve the reconfiguration of reconfigurable radio equipment after
    initial certification and such reconfiguration must ensure the continued compliance
    to the essential requirements of the future version of the Directive. It is expected
    that the new mechanisms to be introduced in the R&TTE Directive will require mechanisms
    for reconfigurable devices to dynamically declare their conformity. The corresponding
    Use Cases will be introduced by this document. \r\n"
