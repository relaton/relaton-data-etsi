abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) specifies the stage one\r\ndescription
    of the Voice Group Call Service (VGCS) which allows speec\r\nh conversation of
    a predefined group of service subscribers in half du\r\nplex mode on the radio
    link taking into account multiple mobile servic\r\ne subscribers involved in the
    VGCS call per cell.\r\nThe VGCS is applicable to all mobile stations in a certain
    network and\r\narea which have the technical capability and the corresponding
    subscr\r\niption, respectively, to participate in a VGCS call.\r\nNOTE:\tIt is
    not considered as requirement that normal GSM phase 2 mobi\r\nle stations will
    be able to be used for this service.\r\nThe service is described from the service
    subscriber s and user s poin\r\nt of view; in particular:\r\n-\tthe procedure
    for normal operation with successful outcome;\r\n -\tthe action to be taken in
    exceptional circumstances;\r\n -\tthe interaction with other GSM services and
    features.\r\n This ETS does not deal with the Man-Machine Interface (MMI) requiremen\r\nts,
    but makes reference to the appropriate Global System for Mobile Co\r\nmmunications
    (GSM) specifications.\r\nThis ETS defines a teleservice of the digital cellular
    telecommunicati\r\nons system GSM. Any interaction with other services and/or
    networks no\r\nt dealt with in clauses 8 or 9 are outside the scope of this ETS.\r\n"
