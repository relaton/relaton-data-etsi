abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) specifies the network f\r\nunctions\r\nneeded
    to provide the security related service and functions specified\r\nin\r\nGSM 02.09.\r\n
    This ETS does not address the cryptological algorithms that are needed\r\nto\r\nprovide
    different security related features. This topic is addressed i\r\nn annex\r\nC.
    Wherever a cryptological algorithm or mechanism is needed, this is\r\nsignalled\r\nwith
    a reference to annex C. The references refers only to functionali\r\nties, and\r\nsome
    algorithms may be identical or use common hardware.\r\n"
