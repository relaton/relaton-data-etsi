abstract:
- language: en
  script: Latn
  content: "This revision adds optional support of H.264/AVC for video content and
    optional support of HE AAC (Annex H) for audio content. The revisions to the TR
    have been developed in a largely backwards compatible manner, i.e. no changes
    to the mandatory functionality of a previously defined IRD have been made between
    one edition of the TR and the next. \r\nThis document is complementary to TR 102
    154, which provides Implementation Guidelines for the use of Video and Audio Coding
    in Contribution and Primary Distribution Applications based on the MPEG-2 Transport
    Stream. \r\nThis document is complementary to TR 102 005, which provides Implementation
    Guidelines for the use of audio-visual content in DVB services delivered over
    IP"
