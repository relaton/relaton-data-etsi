abstract:
- language: en
  script: Latn
  content: The current specification for systems operating in 71 GHz to 86 GHz has
    missing transmission capacities for 500 < CS = 2 000 MHz for higher spectral efficiency
    reference index. The proposed changes are to add these higher transmission capacities
    and their applicable corresponding transmission and reception parameters. Review
    of unwanted emission requirements for some cases of dual-port channels-aggregation
    equipment.
