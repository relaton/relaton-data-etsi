abstract:
- language: en
  script: Latn
  content: "With respect to the first edition of ES 201 980 published in April 2003,
    the present document contains several refinements to the DRM system. These refinements
    were performed and agreed by the DRM Consortium and include the following areas:\r\n-
    audio coding clauses are brought into line with the latest MPEG 4 standards;\r\n-
    signalling of alternate frequency information is revised;\r\n- clarification of
    text following field use of the DRM system.\r\n."
