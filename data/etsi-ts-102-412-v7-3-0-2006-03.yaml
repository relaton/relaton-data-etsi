abstract:
- language: en
  script: Latn
  content: "Approved in SCP#20\r\n\r\nWID SCP-050175\r\n\r\n·The present work should
    identify use cases based on Smart Card Web Server implemented into the UICC, being
    based on OMA specification (OMA-SCT-2005-0018R3-SCWS-RD),\r\n·The present document
    should define requirements on the connectivity provided to a Smart card Web Server
    into the UICC, and highlight potential backward compatibility issue,\r\nThe Work
    must take into account the timeframe decided at OMA being to have specifications
    ready by the end of this year (meaning that technical solution need to be referenced
    by OMA specification)."
