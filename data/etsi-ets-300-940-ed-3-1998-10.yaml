abstract:
- language: en
  script: Latn
  content: "SUBJECT (from SMG#23)\r\nProtocol error handling in the network\r\nDescriptive
    group or broadcast call reference\r\nEditorial Correction\r\nBA Range IE Handling\r\nMS
    handling of cipher mode setting\r\nCoding of the IEI of the priority level\r\nHandling
    of mandatory information error in release\r\nWrong reference\r\nHandling of ASCI
    information by non-supporting MS\r\nClarification of use of L2 Pseudo Length in
    SYSTEM INFORMATION messages.\r\nClarification of use of L2 Pseudo Length in SYSTEM
    INFORMATION messages.\r\nDeletion of codepoint for V.32bis.\r\nSUBJECT (from SMG
    #24)\r\nSystem information type 10\r\nNetwork Alerting in the MS: Consequential
    CR - A new Information Element is introduced in setup message (N>MS) to provide
    an indication for alerting.\r\nInconsistency of user rate in IE bearer capability\r\nFrequency
    redefinition procedure for multislot configuration\r\nClarification to SACCH procedures
    for multislot configuration\r\nClarification on audio connection\r\nMobile assisted
    frequency allocation\r\nMultiple allocation of IEs within on protocol\r\nAlignment
    of the compact notation with the way it is used\r\nSUBJECT (SMG#25)\r\nUplink
    access procedures\r\nUplink free message coding\r\nIndication of ASCI network
    options to the mobiles\r\nGroup Receive / Group Transmit mode definitions\r\nDeletion
    of NOTIFICATION/SACCH\r\nSI6 rest octets\r\nDeletion of \"NCH position\" IE\r\nIntroduction
    of message type table for messages using « short L2 header »\r\nClarification
    on channel request coding for dual rate mobiles"
