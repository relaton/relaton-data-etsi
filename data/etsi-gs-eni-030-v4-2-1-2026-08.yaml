abstract:
- language: en
  script: Latn
  content: "The purpose of the present document is to extend the previous version
    of GS ENI 030 and specify how an architecture can perform knowledge-based reasoning
    by using one or more transformers and one or more knowledge graphs. In particular,
    different arrangements of the implementation of the two will be studied to optimise
    knowledge-based reasoning. Prompt engineering, retrieval augmented generation,
    and other methods defined in GS ENI 030v4.1.1 will also be used in this approach.
    A Knowledge-Driven Reasoning Functional Block will be added to the System Architecture,
    enabling other entities to use this functionality. To validate the approach, the
    primary use case will be translating input policies from an end-user, application,
    or other external source to one or more ENI Policies for use in cognitive networking
    and decision making in modern telecommunication system design.\r\n"
