abstract:
- language: en
  script: Latn
  content: "This work item proposes the development of a Technical Report (TR) to investigate coexistence between Wireless Access Systems including Radio Local Area Network (WAS/RLAN) systems and the next generation of weather radar systems operating in particular in the frequency band 5600 MHz to 5650 MHz using solid-state power amplifiers (SSPAs) in their transmitters. Dynamic Frequency Selection (DFS) is currently the primary regulatory mechanism for coexistence in this band (as specified in EN 301 893). \r\n\r\nThe TR will assess the DFS performance considering the SSPA-based radar signals. Key topics of the TR will include:\r\n\r\n• Information about the improvement of SSPA-based radar on the meteorological activities \r\n• Characterization of SSPA radar emissions, including pulse shapes, repetition rates, and power levels. \r\n• Evaluation of DFS effectiveness with SSPA-based radars, considering the reduced peak power compared to currently deployed meteorological radars and typical pulse patterns. \r\n• Assessment of DFS parameters to provide effective SSPA-based radar protection.\r\n• Consider the impact of temporarily inactive radars (on/off cycles) on DFS behavior\r\n• May include a targeted measurement campaign to validate assumptions regarding pulse detectability of SSPA-based Radars signals by DFS behavior of RLAN.\r\n• May also assess the effectiveness of alternative mitigation techniques that provide a level of protection at least equivalent to DFS.\r\n\r\nThe findings of this TR will inform potential future revisions of EN 301 893."
