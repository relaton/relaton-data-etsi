abstract:
- language: en
  script: Latn
  content: "To secify radio and network aspects related to dual-mode terminals.\r\nThis
    EN will, in conjuction with other standards and TBRs, form the ba\r\nsis for the
    first edition of TBR 39, i.e. basic dual-mode terminals th\r\nat only consist
    of a DECT art and a GSM part and that may automaticall\r\ny switch between DECT
    and GSM modes. (Advanced dual-mode terminals, wh\r\nere the DECT and GSM parts
    are further integrated, will be considered\r\nin a TR (DTR/DECT-010096).\r\n The
    same considerations apply for dual-mode DECT/DCS1800 terminals and\r\nfor DECT/GSM/DCS1800
    dual mode/dual band terminals. The term GSM is\r\nconsidered to cover all the
    frequency bands, and combinations of\r\nfrequency bands allowed for GSM type equipment,
    i.e. P-GSM, E-GSM, R-G\r\nSM,\r\nDCS1800 or dual band GSM/DCS.\r\n "
