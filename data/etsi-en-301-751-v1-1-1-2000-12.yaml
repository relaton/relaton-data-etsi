abstract:
- language: en
  script: Latn
  content: "To produce a \"generic standard\", candidate for harmonisation, which
    identify all the essential parameters relevant to point-to-point fixed radio systems,
    and by cross-referencing to the relevant clauses in present equipment and antennas
    ENs produced by TM4, provides the actual value o the required essential parameters.
    \ The essential paramters will be derived from the guidance given in EG 201 399
    and from further specific adaptation to Fixed Radio Systems given in DTR/TM-04089.\r\n\r\n"
