abstract:
- language: en
  script: Latn
  content: "The scope of this work item is to specify: \r\n1) Requirements for a set
    of abstract interfaces, enabling a VNF to leverage acceleration services from
    the infrastructure, regardless of their implementation.\r\n2) A deployment  model
    of the above interfaces.\r\nThe list of abstract interfaces to be specified will
    be derived from the use cases described in IFA 001 (Overview and Use Cases) of
    the multi-part GS on NFV Acceleration.  Results will be a normative specification
    . \r\nThis Work Item is the 2nd of a series of Work Items on NFV Acceleration."
