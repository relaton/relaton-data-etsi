abstract:
- language: en
  script: Latn
  content: "The purpose of this WI is to produce a Group Specification defining a
    Wireless Transport NBI Profile to be used in conjunction with the IETF Data Models
    used to implement SDN.\r\nThis Profile will not only recommend which models to
    use from the vast library available from IETF, but also the selection of YANG
    sub-trees within such models, that are necessary to manage MW and mmW networks.\r\nIt
    is not in the scope of this WI to define any YANG module or to define or recommend
    any specific SDN architecture.\r\nThe ultimate goal of this Profile is to simplify
    and promote interoperability of SDN solutions based on the IETF NBI standards.\r\n\r\n"
