abstract:
- language: en
  script: Latn
  content: The document presents contextual information on handover required in DVB-SH
    networks. Handover is considered as the procedure used within one IP platform
    in order to continue IP Datacast service consumption under specific network modifications.
    This document relies on the DVB-SH and IP Datacast phase 1 set of specifications.
    Roaming between IP platforms is not addressed by this document. Part 1 of this
    deliverable deals with DVB-H.
