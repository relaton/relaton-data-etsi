abstract:
- language: en
  script: Latn
  content: "This ETS addresses the configuration management area, covering the\r\nfollowing
    aspects:\r\n-  a management architecture that shows how the X-interface is to
    be\r\nused between network and service providers;\r\n-  the management services
    and functions needed to manage ATM\r\nconnections, which span over several administrative
    domains. These\r\nmanagement services and functions cover the configuration\r\nmanagement
    requirements for the X-interface;\r\n-  the management information crossing the
    X-interface (using GDMO\r\nformalisms as described in ITU-T Recommendatio X.722).\r\n
    \ "
