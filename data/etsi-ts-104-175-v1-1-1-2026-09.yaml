abstract:
- language: en
  script: Latn
  content: This WorkItem specifies the core functionality of the NGSI-LD API. It builds on the NGSI-LD Information Model, which is conceptually a Property Graph model. The API is for the exchange of information (about entities, their properties and relationships to other entities, including metadata) with the intent that the associated protocol becomes the “glue” between different kinds of applications and smart services. The API allows users to provide, consume and subscribe to information in multiple scenarios and involving multiple stakeholders. It provides advanced geo-temporal queries, and it includes notification mechanisms. It uses JSON-LD for serialization. This WorkItem extends the former NGSI-LD API specification from ETSI ISG CIM.
