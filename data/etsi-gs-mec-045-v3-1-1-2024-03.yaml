- language: en
  script: Latn
  content: This Work Item focuses on introducing QoS Measurement service to provide
    network performance related metrics (including predictive QoS provided by AI/ML
    components if available). This Work Item will describe the reference scenarios
    and sequence diagrams and define the data model and API. Note that the existing
    standards, e.g. NWDAF, will be taken into account and alignment with other SDOs
    will be considered.
