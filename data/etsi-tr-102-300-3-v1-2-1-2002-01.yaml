abstract:
- language: en
  script: Latn
  content: "A guide to TETRA-specific features, radio network planning aspects\r\nand
    the features which affect the traffic capacity.\r\nTo describe the remaining parts
    of Direct Mode standard not already covered in ETR 300-3 Edition 1. Equipment
    and modes of operation to be addressed will include: DMO repeater, DMO Gateway,
    Combination of DMO Repeater and Gateway, Constraints on Dual Watch use, Managed
    DMO (MDMO). Ed 1 will also be updated to include aspects of Ed2 of the DMO standards
    (such as channel surveillance). \r\n"
