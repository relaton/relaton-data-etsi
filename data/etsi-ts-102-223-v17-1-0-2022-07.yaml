abstract:
- language: en
  script: Latn
  content: "This work item covers the technical realisation of use cases and the requirements
    about the multiple logical Terminal-UICC interfaces as described in ETSI TS 102
    412.\r\nIt provides a technical solution for allowing the terminal to be able
    to address multiple logical UICCs able to independently use the features defined
    for a UICC or any other secure element over the physical interface defined in
    ETSI TS 102 221.\r\nIt defines (but is not limited to):\r\n•\tSupport of multiple
    logical interfaces over one physical interface between the UICC and the terminal,
    based on ETSI TS 102 221.\r\n•\tManagement of these logical interfaces.\r\n•\tProcedure
    allowing mutual discovery of the UICC and Terminal ability to support this feature.\r\n•\tAdaptation
    of the security features of the UICC.\r\n"
