abstract:
- language: en
  script: Latn
  content: "Revision of EN 300 220 to amend,  clarify or provide slight corrections
    on definitions, methods of measurements, requirements for wideband and narrowband
    equipment etc.\r\nConsideration will be also given to making EN 300 220 more self
    standing in specifying parameters vs. operating frequency bands within the 25
    kHz to 1000 MHz range. This with special regard to the European Commission Decision
    on Short Range Devices (2006/771/EC)."
