abstract:
- language: en
  script: Latn
  content: "This work item will specify functional requirements for both Virtualised
    Infrastructure Manager (VIM) and the NFV Infrastructure (NFVI), for NFV acceleration
    from infrastructure management perspective. This includes the control and the
    management of acceleration resources, e.g. allocation, release, discovery of acceleration
    resources. As part of the WI, the corresponding impacts on VIM related specifications
    regarding functional requirements [GS NFV IFA010] and reference points ([GS NFV
    IFA005], [GS NFV IFA006]) will be identified.\r\n"
