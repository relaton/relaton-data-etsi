abstract:
- language: en
  script: Latn
  content: "15 new CRs at SCP #33 and #35.\r\nSCPt070861 CR #002   Fix of missing
    exceptions and wrong constant values (Cat F)\r\nSCPt070862 CR #003   Define a
    new constant to retrieve the query part of an URI (Cat F)\r\nSCPt070863 CR #004
    \  Editorial correction (Cat D)\r\nSCPt070864 CR #005   Add an exception in the
    HttpResponse.sendError() and HttpResponse.setContentType() methods (Cat F)\r\nSCPt070867
    CR #006   Protected SCWS exception (constructor of exception made public instead
    of private) (Cat F)\r\nSCPt070874 CR #007   Specify default headers fields added
    by the SCWS in HTTP responses (Cat F)\r\nSCPt071043 CR #008   Adding Reason BUFFER
    OVERFLOW  to some SCWS methods (Cat F)\r\nSCPt071045 CR #009   Adding reason HTTP_RESPONSE_ALREADY_SENT
    to getRemainingResponseBufferSize method (Cat F)\r\nSCPt071046 CR #010   Adding
    SCWS Exception to method getContentType (Cat F)\r\nSCPt071048 CR #011   Change
    constant value CONTENT_TYPE_UNKNOWN to avoid value overlapping (Cat F)\r\nSCPt071049
    CR #012   Specification of chunked buffer mode behaviour in case of exception
    (Cat F)\r\nSCPt071053 CR #015   Align values returned by copy method with the
    one defined in Java Card™ or UICC APIs (Cat F)\r\nSCPt071055 CR #016   Introduction
    of a reset method to the HttpResponse interface (Cat F)\r\nSCPt071059 CR #014r1
    Delete the URI FRAGMENT TAG constant (Cat F)\r\nSCPt071060 CR #013r1 Fix the \"OPTION\"
    method documentation and name (Cat D)"
