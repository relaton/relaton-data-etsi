abstract:
- language: en
  script: Latn
  content: "The present document defines a high-level framework of the data mechanism
    including data acquiring and processing supporting AI enabled network operation
    and maintenance, as well as service orchestration and management. \r\nThe realization
    of intelligent network depends on the big data, AI algorithms and computing resources.
    Therefore, effective data management and operation is extremely important. This
    work item is purposed to draft a GR of data  mechanism to better serve ENI system.\r\nThe
    present document mainly covers the following aspects:\r\n1.Data classification
    in terms of the data sources including Network management system, Network elements,
    servers, terminals and external environment data, data characteristics (static
    data, sequential data) and data format. \r\n2.Data operation including data collection,
    data storage, data processing, data sharing and data management.\r\na)Data collection
    including description about collection modes, e.g. Pull (query/request response)
    and Push (publish/notify), and data collection techniques, e.g. telemetry. \r\nb)Data
    storage including data storage recommendation and data storage platforms. \r\nc)Data
    processing including data cleaning and data correlation.\r\nd)Data sharing including
    data sharing and model sharing.\r\ne)Data management including metadata management,
    data security management and data quality management.\r\n3.Data acquisition and
    processing methods of the selected use cases proposed in ETSI GR ENI 001 [i.1]
    for ENI systems executing intelligent tasks.\r\n\r\n"
