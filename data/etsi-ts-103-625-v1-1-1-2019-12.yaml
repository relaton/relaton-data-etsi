abstract:
- language: en
  script: Latn
  content: "This WI intends to:\r\n- more fully document the transport methods using
    SMS, “Data SMS”(using different Data Coding Scheme and Port) and https messages\r\n-
    allow for the data sent within the messages to include other attributes (eg Altitude,
    emergency number used)\r\n- consider ways to manage handset roaming to other countries\r\n-
    incorporate appropriate PSAP user feedback on use of handset locations and operational
    deployments of AML\r\n- study how in longer term and taking as PSAPs become IP
    based and networks become IMS using SIP, how transition from SMS and https transport
    to use of a SIP header could be used to carry handset location information. Integrating
    with TS 103 479 will be taken into account."
