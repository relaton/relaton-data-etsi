abstract:
- language: en
  script: Latn
  content: 'Scope of work to be undertaken: To define Product Specific Requirements
    for Life Cycle Assessment (LCA) of Smartphones so that it is possible to compare
    the LCA between different smartphone models on SKU level (e.g. considering different
    memory configurations). The proposed standard aims to provide a methodology for
    evaluating the environmental impact of smartphones objectively and transparently
    and is based upon the life cycle assessment (LCA) framework standardized in ES
    203 199 and IEC 633 66. The purpose of the proposed standard is to: • provide
    smartphone-specific requirements, i.e. product specific rules (PSR), in addition
    to those of ES 203 199 and IEC 633 66 to ensure comparability of LCA studies of
    smartphones on SKU level; • harmonize the LCAs of smartphones; • increase the
    transparency and facilitate the interpretation of LCA studies of smartphones;
    • facilitate the communication of LCA studies of smartphones on SKU level • The
    proposed standard is valid for all types of smartphones. The proposed standard
    defines a set of requirements for which the LCA practitioners shall comply. Comparisons
    of results from LCA studies of smartphones which belong to the same product family,
    including assessments which have been performed by different organizations, is
    within the scope of the proposed standard.'
