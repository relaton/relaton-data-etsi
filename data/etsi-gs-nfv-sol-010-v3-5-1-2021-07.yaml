abstract:
- language: en
  script: Latn
  content: "This revision of NFV-SOL 010 continues the development of the specification
    as part of the NFV Release 3. This edition will conduct maintenance, add requirements
    and specification of interfaces to support the Release 3 features, and it may
    extend the scope of the former edition summarized hereafter:\r\n\r\nNFV-SOL 010
    specifies the structure and format of a VNF Snapshot Package file and of the artifacts
    it contains, fulfilling the requirements specified in ETSI GS NFV IFA 011 for
    a VNF Snapshot Package, to be used within a NFV-MANO administrative domain or
    where all artifacts are managed by the same security domain within the network.
    The current NFV-SOL 010 does not support using a VNF Snapshot Package across different
    NFV-MANO administrative domains or where artifacts are managed by different security
    domains within the network."
