abstract:
- language: en
  script: Latn
  content: "This WI specifies the functional models and information flows (Stage 2)
    and protocols (stage 3) which implement the security services and mechanisms required
    to provide security in a Customer Premises Network (CPN)  to support the overall
    security architecture for NGN release 3. CPN security services and mechanisms
    are used either singly or in combination to realize the CPN security requirements
    specified in ETSI TS 187 001 (NGN Security requirements). Reference will be made
    to TR185 021 “Feasibility study of security mechanisms for customer premises networks
    connected to TISPAN NGN” for security mechanisms that have been shown to be appropriate
    for CPN environment. \r\nThis activity will be undertaken in close collaboration
    with TISPAN WG5."
