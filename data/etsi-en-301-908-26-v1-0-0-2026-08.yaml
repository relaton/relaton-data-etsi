abstract:
- language: en
  script: Latn
  content: "The EN will cover all LTE and NR features up to and including 3GPP LTE
    Release 18 and NR Release 18 that are relevant for Aerial UE operating in the
    bands 703-733 MHz, 832-862 MHz, 880-915 MHz, 1710-1785 MHz, 1920-1980 MHz, 2500-2570
    MHz and 2570-2620 MHz. \r\n\r\nThis EN considers the requirements from ECC Decision
    (22)07 and the term aerial UE refers to a UE supporting Uncrewed Aircraft Systems
    (UAS) features and services and requiring an aerial subscription. An aerial UE
    is installed either on-board an Unmanned Aircraft (e.g. drones) or on-board manned
    aircraft (e.g. helicopter). It identifies itself to the mobile network as being
    in this class. \r\n\r\nThis EN will cover the essential requirements of article
    3.2 of the Radio Equipment Directive for E-UTRA Aerial UEand NR Aerial UE in addition
    to those common ones of Part 1."
