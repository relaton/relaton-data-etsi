abstract:
- language: en
  script: Latn
  content: "The use and general aspects of the BSC to BTS interface (the A-bis\r\ninterface)
    are given in Technical Specification GSM 08.51.\r\nThis TS specifies the general
    structure of layer 3 and traffic\r\nmanagement procedures and messages used on
    the A-bis interface to\r\nsupport signalling procedures as defined in Technical
    Specification\r\nGSM 04.08.\r\nNetwork management procedures and messages for
    the A-bis interface are\r\ndefined in Technical Specification GSM 08.59.\r\nThe
    functional split between BSC and BTS is defined in Technical\r\nSpecification
    GSM 08.52. The procedures and messages required to\r\nsupport this split are defined
    in detail in this specification.\r\n "
