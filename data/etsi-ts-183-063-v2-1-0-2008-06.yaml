abstract:
- language: en
  script: Latn
  content: "Specification of IMS-based IPTV stage 3 to support IPTV services based
    on the architecture and stage 2 information flows described in TS 182 027.\r\nSpecification
    of the scope of IPTV for further specification of new or enhanced Protocol specifications.
    This specification will describe the Procedures on the Functional Entities and
    Call Flows for the protocols and their possible enhancements. Interactions with
    other Simulation Services will be considered."
