abstract:
- language: en
  script: Latn
  content: To review the Project MESA SoR and determine what, if any, changes are
    necessary to better reflect the needs of the Public Protection Agencies in Europe
    and ensure the descriptive material clearly reflects the user community's willingness
    to consider all technology alternatives.  Emphasis will be placed on ensuring
    it is clearly understood the process is inclusive rather than exclusive with regard
    to the acceptances and adaptation of technology proposals and potential solutions.
