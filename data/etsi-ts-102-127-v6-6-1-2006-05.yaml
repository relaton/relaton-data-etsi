abstract:
- language: en
  script: Latn
  content: "The Bearer Independent Protocol as defined in TS 102 223 allows the UICC
    to establish a data channel with the terminal, and through the terminal either
    to a remote Server in the Network or to a remote device in the Personal Area Network
    (PAN).\r\nBetween the card and those remote entities in the Network or in the
    PAN there may be no end to end reliability i.e. no acknowledgement, no segmentation/fragmentation,
    no retransmission of messages.\r\nThe purpose of this work item is then:\r\nThe
    definition of the exact requirements for the transport layer between a UICC based
    application and a remote entity in the Network or in the PAN ( such as acknowledgement,
    retransmission, segmentation and re-assembly functionalities) (TS Stage 1)\r\nThe
    creation a TS describing this Transport Protocol for UICC based Applications (TS
    Stage 2)\r\nThis Transport Protocol should allow the implementation of a security
    layer on top of it, one of these implementations being the security mechanism
    defined in TS 102 225. \r\nV6.2.0 created after SCP#17."
