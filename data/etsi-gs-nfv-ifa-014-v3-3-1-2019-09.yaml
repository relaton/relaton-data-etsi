abstract:
- language: en
  script: Latn
  content: "This revision of  NFV-IFA 014 continues the development of the specification
    as part of the NFV Release 3. \r\nThis edition will add functional requirements
    and specification of the information model to support the Release 3 features,
    and it will extend the scope of the former Release 2 edition summarized hereafter:\r\n\r\nThis
    Work Item will develop a specification for describing Network Service meta-data
    requirements and meta-data templates used to decribe Network Services. \r\nExamples
    of Network Service meta-data templates are Network Service Descriptor, VNF Forwarding
    Graph Descriptor, Virtual Link Descriptor and PNF Descriptor.\r\nThis work item
    will build from the information captured in the MAN Group Specification documents
    related to information elements. \r\nStandardized meta-data templates are required
    for Network Services to:\r\n•describe the relationships between NS and VNFs and/or
    connectivity to PNFs that are part of the NS, along with dependencies and other
    constraints, such as those imposed by the scope of the MANO GS MAN 001, \r\n•describe
    the NFV infrastructure resource requirements for a NS in a service provider environment\r\n•describe
    NS operational behaviour within the scope of NFV including NS  lifecycle events
    (eg. scaling, upgrading). \r\nDeliverable for this work item will be an normative
    GS document addressing: \r\n-Requirements for the structure and format of the
    various NS meta-data templates, \r\n-A consistent meta-model, describing the NS
    properties and resource requirements building,\r\n-A consistent meta-model, describing
    the NS networking properties and resource requirements building,.\r\nThe output
    of this work should be used as formal requirements for extensions into normative
    specifications developed by other SDOs.\r\n\r\nThis revision of NFV-IFA 014 will
    address the Release 3 candidate features listed in Annex B of the Release 3 Definition.
    Where needed, it will continue the previous version to enhance and complete the
    specified Release 3 features.\r\nThis revision will reflect the maintenance performed
    to NFV Release 2 documentation and of already specified Release 3 features.\r\n"
