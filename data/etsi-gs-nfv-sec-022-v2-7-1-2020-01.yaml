abstract:
- language: en
  script: Latn
  content: "This revision of NFV-SEC 022 conducts NFV Release 2 maintenance. It corrects
    errors, ambiguities, misalignments, and applies editorial modifications (i.e.
    Corrections of category F and D as described in ETSI TWPs Annex L). This edition
    does not add or modify features, nor does it extend the scope of the former Release
    2 edition summarized hereafter:\r\nThis Group Specification will specify the access
    tokens and related metadata for APIs defined between VNFs, VNFM, NFVO and VIM.
    The work will consist in: 1.            defining security requirements for API
    access tokens (e.g. API requester ID binding, provide Authentication feature),
    \ \r\n2.            Analyzing the tokens specifications (e.g. Openstack Keystone,
    OpenID Connect Id-Token , IETF OAuth token Binding, 3GPP TS 33.179), \r\n3.            Defining
    an NFV token request and generation profile, the access token format and the associated
    metadata.  The specification will refer to existing specifications of access tokens
    if the NFV requirements are met by these specifications.  \r\n4.            Defining
    the process for the token verification by the API Producer.  This WI will produce
    a new GS SEC022 revision."
