abstract:
- language: en
  script: Latn
  content: "To define the user requirements of a CCA (Critical Communications Application)
    that provides PMR services. It is intended to interface to an LTE network that
    has extensions, e.g. GCSE and ProSe, implemented in order to be able to provide
    such services.\r\nThe URS for the CCA will take into account the users' requirements
    from TCCA CCBG URS and the use cases from CCBG SA."
