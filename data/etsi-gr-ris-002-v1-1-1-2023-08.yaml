abstract:
- language: en
  script: Latn
  content: 'The scope of the work item is to: a) analyze and describe technological
    challenges in terms of deploying RIS as a new network node b) analyze potential
    impacts to network architecture, protocol architecture, and framework of RIS controlling
    c) produce a set of recommendations for requirements and potential impact to specifications
    to support RIS as a new feature. The deliverable will be an informative report.'
