abstract:
- language: en
  script: Latn
  content: "To extend and improve the definitions, signal library and measurement
    methods fro spectral management purposes, as brought together in TR 101 830 version
    v1.0.0 (part1). This includes the addition of new signal descriptions such as
    SDSL.\r\n\r\nObjective: To be a clear reference t simplify & harmonize the description
    of network specific spectral management documents, without making any specific
    choice on the technology mix that may use the access network."
