abstract:
- language: en
  script: Latn
  content: "This Global System for Mobile communications Technical Specification (\r\nGTS)
    is an introduction to the 05 series of the GSM technical specific\r\nations for
    GSM and DCS 1 800. It is not of a mandatory nature, but con\r\nsists of a general
    description of the organization of the physical lay\r\ner with reference to the
    technical specifications where each part is s\r\npecified in detail. It introduces
    furthermore, the reference configura\r\ntion that will be used throughout this
    series of technical specificati\r\nons.\r\n "
