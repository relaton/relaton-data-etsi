abstract:
- language: en
  script: Latn
  content: This document provides information about an impact of specific types of
    packet loss and coding on speech quality predictions provided by P.862 and P.563
    models, when both naturally-produced and synthesized speech are used. The variability
    of predictions with respect to type of signal used (naturally-produced or synthesized)
    and loss conditions as well as their accuracy, by comparing the predictions with
    subjective assessments were assessed.
