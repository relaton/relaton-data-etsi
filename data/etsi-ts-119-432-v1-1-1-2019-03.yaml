abstract:
- language: en
  script: Latn
  content: This will specify different protocols for accessing TSP service components
    supporting either digital signature value creation or AdES digital signature creation.  It
    is to take into account the protocols defined for existing EU national implementations
    of digital signature services and existing protocols such as OASIS DSS and other
    market leading protocols for remote digital signature creation.  This protocol
    will take account of the use of external authentication services, such as provided
    by eIDAS electronic identification services.
