abstract:
- language: en
  script: Latn
  content: Preparing the document for splitting the static part from the existing
    standard ES 202 706 and make part 2 of the standard for the dynamic energy efficiency
    measurement method. Improving the EE dynamic measurement method in terms of new
    traffic model, channel model, using UE emulator in the test setup and remove the
    complexity of the current method. Updates of the document will also support the
    ongoing harmonization process with ATIS.
