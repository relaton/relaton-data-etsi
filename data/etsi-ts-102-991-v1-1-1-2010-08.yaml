abstract:
- language: en
  script: Latn
  content: "The target of the standard document has been to provide an instruction
    manual allowing a non-ambiguous implementation of the technology. This Guidelines
    Document was prepared to cover the following topics:\r\n- Descriptions of techniques
    implemented at the transmitting end complementing the explanations given by the
    standard and extending the focus area to matters of headend architectures;\r\n-
    Explanations on CATV network aspects to an extent important for an implementation
    of a DVB-C2 device;\r\n- Guidelines for the implementation of equipment installed
    at the receiver."
