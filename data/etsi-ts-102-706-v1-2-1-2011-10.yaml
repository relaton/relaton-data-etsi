abstract:
- language: en
  script: Latn
  content: "To define wireless access network energy efficiency metrics, define efficiency
    parameters and measurement methods for wireless access network equipment. Energy
    efficiency metrics and measurement methods should model the dynamic behaviour
    of equipment in operation. Traffic and attenuation models for voice and packet
    data should be specified. Energy Efficiency metric and measurement methods to
    apply these models on Radio Access Network should be specified and used as main
    basis for the energy efficiency measurement.\r\nThe Energy Efficiency metric defined
    shall promote power saving features.    \r\nMetric and measurement should be applicable
    for GSM/EDGE, WCDMA/HSPA, LTE and WiMAX."
