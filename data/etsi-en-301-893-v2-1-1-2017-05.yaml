abstract:
- language: en
  script: Latn
  content: "(1) To revise the existing EN 301 893 to become applicable under Directive
    2014/53/EU;\r\n(2) To consider the inclusion of receiver parameters as required
    by Directive 2014/53/EU;\r\n(3) To review and/or improve the test methods;\r\n(4)
    To improve Adaptivity for Load Based Equipment by replacing the current 2 alternative
    options with a single solution that provides equal (spectrum) access to different
    technologies;\r\n5) To review and revise if necessary the Adaptivity for Frame
    Based Equipment or to consider the removal of the clause on Adaptivity for Frame
    Based Equipment from EN 301 893."
