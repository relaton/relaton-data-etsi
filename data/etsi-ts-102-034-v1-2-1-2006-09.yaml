abstract:
- language: en
  script: Latn
  content: "This specification covers the delivery of DVB services over IP networks.
    The initial registration and configuration of the end-device (including IP address
    assignment etc), and the means of discovering and choosing a service are covered
    in other standards. This specification concentrates on the format of the service
    as it appears on the IP network and the requirements on that network for correct
    and timely delivery of the service.\r\n\r\nNew version allows new audio visual
    formats & Broadband Content Guide (BCG) metadata."
