abstract:
- language: en
  script: Latn
  content: "The present document defines by means of an information model, a functional
    entity behavioural model, and by validated SDL a model of the abstract behaviour
    of each service and service capability identified as being essential in TIPHON
    R4.\r\nThis part derives, by means of a threat analysis, the requirements for
    security features that when implemented are necessary and sufficient to ensure
    that TIPHON derived products do no harm to their participants."
