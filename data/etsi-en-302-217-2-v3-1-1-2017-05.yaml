abstract:
- language: en
  script: Latn
  content: 1) To add equipment parameters and provisions for 'channel aggregation'
    equipment. The aggregation level will be limited to two channels; higher aggregation
    level is left for future consideration. For each 'essential test' in the EN, the
    specific methodology and harmonised test procedure are considered for ensuring
    full network compatibility between present 'single emission' and new 'channel
    aggregation' systems. 2) Translate the present art. 3.2 HS under R&TTED version
    2.2.1 into a new version 3.1.0 as art. 3.2 HS under RED; for doing so, EN 302
    217-2-2 and EN 302 217-3 will be revised accordingly and merged into EN 302 217-2.
