abstract:
- language: en
  script: Latn
  content: "Low cost, low complexity, peer-to-peer digital private mobile radio systems
    complying with EN 301 166, based on FDMA with channel spacing of 6,25 kHz and
    operating with an e.r.p. of up to 500 mW for voice and data applications. \r\nA
    reference will be made in the scope to a new ECC Decision (currently under development)
    on digital PMR in 446,1 MHz to 446,2 MHz for operation under license-exempt authorization.\r\n"
