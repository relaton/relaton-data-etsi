abstract:
- language: en
  script: Latn
  content: "Through the notification of the UK interface regulation, the European
    Commission have strongly requested that ETSI TM4 consider a rationalisation of
    the number of fixed terrestrial (point-to-point) standards. This work item is
    therefore in response to this request and aims to simplify (and rationalise the
    number of)  existing standards.  \r\nThis work item is to appraise only the published
    ETSI fixed terrestrial (point-to-point) radio relay standards and consolidate
    these into the new style generic format . The primary intention will be to rationalise
    the existing number of standards, in excess of 30, to just a handful, e.g. ideally
    5. These standards will then be proposed as Harmonised Standards. \r\nThe preferred
    method of segmentation is yet to be decided, but this may be on the basis of  (frequency
    range or application or traffic capacity).  Annex A illustrates possible segmentation
    options. \r\nThe work will only consolidate new or existing work items on standards
    if the output deliverables are formally published before the completion of this
    work activity. Further, this work item does not, in principle, propose to change
    any existing technical parameter values, although the presentation of data/information
    may be modified to enhance understanding and usability leading to some new or
    revised requirements. The format shall be consistent across the range of standards
    which are segmented under the preferred method."
