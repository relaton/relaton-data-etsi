abstract:
- language: en
  script: Latn
  content: 'This work item creates a specification for the I3C interface, based on
    the requirements described in TS 103 465, that uses the MIPI I3C specification
    as reference.  It defines (but is not limited to):  - The definition of the electrical
    characteristics.  - The definition of the MAC Layer.  - The definition of the
    link layer.  - The definition of the conditions for entry into and exit from power
    saving modes.  The evaluation of existing standardised mechanisms will be performed
    in order to assess possible reuse and extension.'
