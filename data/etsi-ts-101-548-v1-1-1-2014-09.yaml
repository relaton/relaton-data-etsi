abstract:
- language: en
  script: Latn
  content: "The present document will identify the requirements for a series of reverse
    power feed standards that will allow operators to be able to source suitably compliant
    equipment for inclusion in their networks.  \r\n\r\nThis TS shall define the functional
    elements required to implement a reverse power feeding scheme (including, but
    not limited to reference model, architecture, power limits, efficiency, power
    back-up, power splitters, POTS signalling translation, power management and power
    metering). Other issues such as local laws, unbundling rules and cost are considered
    out of scope.\r\n\r\nClose collaboration with Technical Committee ETSI EE and
    other competent standards bodies.\r\n"
