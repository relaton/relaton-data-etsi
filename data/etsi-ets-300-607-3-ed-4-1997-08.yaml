abstract:
- language: en
  script: Latn
  content: "This European Telecommunications Standard specifies the Abstract Test\r\nSuite
    (ATS) and partial PIXIT proforma for the Network Layer (Layer 3)\r\nat the mobile
    radio interface of the GSM or DCS (phase 2) mobile\r\nstations (MS) conforming
    to the ETSs for the Radio Resource\r\nmanagement.\r\n21/02/97: (ID) version 4.18.0
    crearet at SMG#21 as a result of CRs:SUB\r\nJECT\r\nImprovement in test step BasicServiceMT\r\nLAI
    value parameterisation\r\nCorrection of location updating types\r\nCM service
    REQUEST & ACCEPT\r\nWrong variable storing frame number in MM_LUP_imsi1\r\nFacility
    iei in non FACILITY messages\r\nReconfigure test system during test in TC_26_6_2_3_1\r\nTiming
    check\r\nReplacement of TSO OC_LengthOfComp1\r\nImprovement in test step IdleUpdated\r\nCorrections
    in TC_26_7_4_3_2\r\nDefault RELEASE message in section 26.9\r\nCorrections in
    TC_26_7_3_2\r\nCorrections in TC_26_2_4_6\r\nCorrections in TC_26_6_6_1\r\nImprovement
    in test step BasicServiceMO\r\nCorrections in TC_26_7_4_3_3\r\nTSOs for change
    of cell power levels\r\nCorrections on the test step for stop of a main DCCH channel\r\nProblems
    related to channel release\r\nCorrections of constraints for for SMS testing\r\nT_guard
    time too short in TC_34_2_1, TC_34_2_2\r\nWrong TI flag in TC_31_8_1_1, TC_31_8_3_1,
    TC_34_2_3\r\nCorrections in TC_26_5_6_3\r\nCorrections of TC_31_6_2_5\r\nVerdict
    corrections in TC_34_3\r\nWrong TCVs in TC_26_9_6_1_2 & TC_34_2_3\r\nCall clearing
    during CP data exchange in TC_34_2_1\r\nCorrections in TC_26_9_4 & 26_9_5\r\nCM
    Re-establishment Request in TC_26_7_3_2\r\nOM_FHCHK & OM_FreqDef\r\nWrong ASN.1
    INTEGER encoding for e-parameters\r\nCall Hold in TC_31_6_1_7\r\n "
