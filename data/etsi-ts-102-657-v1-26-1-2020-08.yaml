abstract:
- language: en
  script: Latn
  content: "The present document contains handover requirements and a handover specification
    for the data that is identified in national legislations on Retained Data.\r\nThis
    revision provides the following changes: Addition of EID Parameter in the Subscription
    Information for Telephony, NA and Multimedia; Correction of Coding of NCGI in
    the XML-Schema-Definition; Addition of 3GPP UE Radio Capability ID; Update of
    different parameters such as new network access type (GPON) and new 3GPP 5G RAT
    types (RAT5Type), on top of a new billing parameter (RANSecondaryRATType)..\r\n"
