abstract:
- language: en
  script: Latn
  content: "The Scope of this Technical Report is to clarify how interworking can\r\nbe\r\nobtained
    between phase 2 mobile stations and phase 1 infrastructure.\r\nThe\r\nobjective
    is to obtain this without changing the consolidated set of\r\nphase 1\r\nspecifications.
    This Technical Report specifies the necessary\r\namendments to\r\nthe phase 1
    infrastructure so that an acceptable service is offered to\r\nmobile\r\nstations
    of phase 2, guaranteeing that a phase 2 mobile station\r\nobtains all\r\nphase
    1 services.\r\n This report outlines the necessary changes as well as the necessary\r\ncontrols\r\nand
    clarifications  with regard to phase 1 implementation, which\r\nshould be\r\nperformed
    to the different interfaces in phase 1 infrastructure before\r\nphase 2\r\nmobiles
    are offered service.\r\n"
