abstract:
- language: en
  script: Latn
  content: "The scope of this work item is to produce a Group Specification documenting
    a set of RESTful Interface Specifications fulfilling the requirements specified
    in GS NFV IFA 007 for the interfaces used over the Or-Vnfm reference point. The
    work item deliverable will contain normative provisions. \r\nWhen the same interface
    is produced or consumed on the Or-Vnfm and Ve-Vnfm reference points, one of the
    deliverables will reference and profile the other one\r\n"
