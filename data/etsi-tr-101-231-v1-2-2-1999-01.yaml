  script: Latn
  content: "The contents of the present document also exists as a living document
    on the EBU Web site http://www.ebu.ch.\r\nThis register contains the so-far allocated
    values of the Network Identification (NI) field of the Teletext Broadcast Service
    Data packet (extension data packet of type 8/30 format 1), and the Country and
    Network Identification (CNI) fields of the Programme Delivery Control data packets
    (extension data packets X/26 and 8/30 format 2).\r\n& of Video Programming System
    (VPS) identification codes.\r\n"
