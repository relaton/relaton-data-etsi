abstract:
- language: en
  script: Latn
  content: "The present document defines an electronic interface between two systems
    for the exchange of information relating to the establishment and management of
    Lawful Interception.   Typically this interface would be used between: on one
    side, a Communications Service Provider; and, on the other side, a Government
    or Law Enforcement Agency who is entitled to request Lawful Interception.   TR
    103 690 defines a generic interface for electronic Warrants; the present document
    is a specific and detailed example of one particular Warrantry interface.\"\r\nThe
    present document will be constructed in two phases. The first phase of the document
    is a reference architecture. It is created by investigating current practices
    and procedures across TC LI. It makes clear the distinction between the process
    of communicating with the Communication Service Provider to inform them about
    the interception details (commonly called \"tasking\") and also communication
    among government/law enforcement/judiciary to establish the warrant (commonly
    called \"warrantry\"). The second phase of the document provides a standardised
    detailed interface based on the architecture in the first phase."
