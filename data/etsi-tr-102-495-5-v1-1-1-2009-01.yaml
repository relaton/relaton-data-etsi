abstract:
- language: en
  script: Latn
  content: "The document defines the application and requirements for radio frequency
    usage for Ultra Wide Band (UWB) location tracking devices. These devices operate
    in the frequency ranges from 3.4 GHz to 4.8 GHz and 6 GHz to 8.5 GHz and use a
    fixed infrastructure. \r\nIt covers Ultra Wide Band location tracking tags which
    are attached to people or objects and are tracked using a fixed infrastructure.\r\n"
