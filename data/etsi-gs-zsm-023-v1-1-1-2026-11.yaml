abstract:
- language: en
  script: Latn
  content: "a) This GS specifies normative architectural extensions for the Autonomous Agent Entities defined in ZSM020, enabling predictive and coordinated, cross-domain network assurance within the Zero-touch network and Service Management (ZSM) framework.\r\nb) It defines use cases involving Autonomous agents for proactive, automated remediation, and coordinated assurance across administrative, technological, and service domains.\r\nc) The GS specifies requirements for Autonomous agents that support predictive network assurance, including capabilities for anomaly detection, root cause analysis, and automated decision-making in cross-domain scenarios.\r\nd) Collaboration with other SDOs (e.g. IRTF NMRG, ITU-T SG13, TM Forum) will be pursued where appropriate to ensure alignment and synergy.\r\n"
