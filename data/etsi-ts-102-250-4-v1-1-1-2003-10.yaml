abstract:
- language: en
  script: Latn
  content: "The present document defines the minimum requirements of QoS measurement
    equipment for GSM and 3G networks in the way that the values and trigger-points
    needed to compute the QoS parameter as defined in TS 103 xyz-2 can be measured
    following the procedures defined in TS 103 xyz-3. \r\nTest-equipment fulfilling
    the specified minimum requirements, will allow to perform the proposed measurements
    in a reliable and reproducible way."
