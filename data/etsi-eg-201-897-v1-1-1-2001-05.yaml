abstract:
- language: en
  script: Latn
  content: "This document specifies network access requirements that service providers
    have  in delivering telecommunication services including, but not limited to,
    third generation mobile, cordless and fixed services, over one or more operator's
    networks.This work may include the support of VPN, Broadband bearer services (eg.
    CBR, VBR, ABR) multimedia and Internet. This WI follows on from DEG/NA-061601.\r\n\r\nReference
    documents: ETR 244, ETR 339, DEG/NA-061206, DEG/NA-061601."
