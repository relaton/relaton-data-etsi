abstract:
- language: en
  script: Latn
  content: "This document describes the operation of the Adaptive Multi Rate speech
    codec during Source Controlled Rate (SCR) operation.\r\nFor clarity, the description
    is structured according to the block diagrams in figures 1 and 3.This structure
    of distributing the various functions between system entities is not mandatory
    for implementation, as long as the operation on the speech decoder output remains
    the same.\r\nThe SCR functions described in this technical specification are mandatory
    for implementation in the UEs. The receiver requirements are mandatory for implementation
    in all Transcoders , the transmitter requirements only for those links where SCR
    will be used.\r\nAnnex A-E describes the interworking operation of AMR with GSM-EFR,
    TDMA-EFR, TDMA-US1 and PDC-EFR. This mode of operation is F.F.S.\r\n"
