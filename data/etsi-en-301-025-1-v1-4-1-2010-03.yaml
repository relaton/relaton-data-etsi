abstract:
- language: en
  script: Latn
  content: "The present document covers the minimum requirements for general communication
    for shipborne fixed installations using a VHF radiotelephone operating in certain
    frequency bands allocated to the maritime mobile service using both 25 kHz and
    12,5 kHz channels with associated equipment for DSC - class D.\r\nThese requirements
    include the relevant provisions of the ITU Radio Regulations, appendix 18 [1],
    ITU-R Recommendation M.493-11 [5] where class D is defined, M.825-3 [8] and incorporate
    the relevant guidelines of the IMO as detailed in MSC/Circ.803 [9].\r\nThe present
    document also specifies technical characteristics, methods of measurement and
    required test results.\r\n\r\n"
