abstract:
- language: en
  script: Latn
  content: "The present document defines a set of Content Delivery Protocols for streaming
    and file delivery services to be used with IP Datacast over DVB-H [2]. Delivery
    protocols will be IP-based and will be implemented both in content servers and
    IP Datacast terminals. \r\nThe present document includes information applicable
    to broadcasters, network operators, service providers and manufacturers."
