abstract:
- language: en
  script: Latn
  content: "Definition of return channels and corresponding protocols enabling interactive
    services in mobile interactive broadcast systems. The work concerns satellite
    broadcast systems operating in the 2 GHz MSS S-band, typically applying DVB-SH.
    All channels use the 2 GHz MSS band. This specification will be created based
    on the technology developed in the ESA funded project DENISE. \r\n\r\nThis part
    \ will define Protocol Specifications - Control Plane."
