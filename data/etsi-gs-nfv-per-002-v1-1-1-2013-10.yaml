abstract:
- language: en
  script: Latn
  content: "This WI is to develop a framework to coordinate and promote public demonstrations
    of Proofs of Concept (PoC) platforms illustrating key aspects of NFV. The objective
    for the PoCs is to build commercial awareness and confidence and encourage development
    of an open ecosystem by integrating components from different players. The PoCs
    need to be scoped around the agreed ISG use cases and address the technical challenges
    and approaches being progressed by the WGs. PoCs are envisaged to be initially
    focused on feasibilty and interoperability issues, incorporating additional aspects
    (performance, reliability,security, integrability…) as the different WGs and EGs
    progress in defining a common understanding of these aspects. \r\nThis WI is to
    \r\n(i)\tdefine a process for calling for PoCs and adjudicating proposals (e.g.,
    where/what to submit, response times)\r\n(ii)\toutline the acceptance criteria
    for a PoC proposal, (e.g., participation, reporting, exhibition dates, etc.)\r\n(iii)\tdocument
    the objectives for the approved PoCs, (e.g., identification of the NFV use cases
    and Work Items impacted by the PoC)\r\n(iv)\tdefine the reporting requirements
    from the approved PoCs\r\n(v)\taggregate the approved PoC proposals & reports
    into a deliverable document.  \r\nIt should also issue guidance on timescales
    and under what conditions the PoC can be demonstrated to the wider industry. It
    can be useful to have timescales driven by a particular conference demonstration
    opportunity.\r\n"
