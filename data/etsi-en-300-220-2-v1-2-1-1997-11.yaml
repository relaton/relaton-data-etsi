  script: Latn
  content: "Revision and upgrade to EN of I-ETS 300 220 (8/93).\r\nCovers a wide range
    of telecommand, telemetry and generic non-speech\r\napplications, such as alarm
    systems, identification, detection, remote\r\ncontrol etc. in the frequency band
    25-1000 MHz, including European ISM\r\nbands.\r\nAdditional aspects related to
    the radio characteristics of equipment\r\nto be used in \"social alarm\" systems,
    to ensure adequate reliability\r\nfor the purposes of CENELEC TC79 standardization
    in this field.\r\n"
