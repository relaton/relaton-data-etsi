abstract:
- language: en
  script: Latn
  content: Security management and certificate policy for CSPs issuing certificates,
    which meet classes of requirements different from those for qualified certificates
    (C). These other classes arise from market needs, e.g .in the area of medium-value
    electronic commerce transactions, such as in mobile e-commerce. This task is complementary
    to and builds upon the policy developed for CSPs issuing qualified certificates
    under phase 2 of the EESSI program. The STF 178 will complete the work, which
    started with the requirement analysis carried out by STF155 for alternative classes
    of certificates (According to Directice Article 5.2). The specification will make
    reference to, amongst others, the framework defined in RFC 2527, completing the
    specific details for other classes of certificates/signatures in line with article
    5.2 of the EU Directive.
