abstract:
- language: en
  script: Latn
  content: "The scope of the Work Item will include the complete functional requirements
    for interfaces on the Or-Vnfm reference point between the VNFM and the NFVO, to
    address the functions specified in GS NFV MAN 001.\r\n\r\nThe results of the work
    item will include:\r\n1) Detailed description of interfaces and its operations
    functionality.\r\n2) Information flows and information elements of:\r\na) VNF
    lifecycle management interfaces, for:\r\ni) Lifecycle management of VNFs, including
    the instantiation, modification, update, scaling and termination of VNFs.\r\nii)
    Lifecycle change notifications of VNFs.\r\nb) VNF orchestration interfaces, for:\r\ni)
    Lifecycle operation and resource granting.\r\nc) Other related VNF management
    interfaces, for:\r\ni) VNF fault information retrieval and management.\r\nii)
    VNF performance information retrieval and management.\r\niii) VNF package management.\r\niv)
    Policy management.\r\n\r\nThe resulting deliverable will contain normative provisions.\r\n"
