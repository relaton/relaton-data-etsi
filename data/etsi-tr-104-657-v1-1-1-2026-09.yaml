  content: "Preparation of technical report studying different harmonised standards deployment scenarios as well as merger analysis.\r\n\r\nThe document, as part of the Experts Group, aims to deliver a report covering deployment scenarios, Mapping hENs and use cases resulting from the recommendations and analysis reported in the ETSI TR 104 305.\r\nThe document will also identify a list of priority hENs to be reviewed in detail by the expert group."
