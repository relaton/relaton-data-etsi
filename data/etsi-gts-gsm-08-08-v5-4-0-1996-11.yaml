abstract:
- language: en
  script: Latn
  content: "This Global System for Mobile communications Technical Specification (\r\nGTS)
    specifies the layer 3 procedures used on the Base Station System\r\n(BSS) to Mobile-services
    Switching Centre (MSC) interface for control\r\nof GSM services.\r\nFor the purposes
    of call control and mobility management, messages are\r\nnot interpreted at the
    Base Station System (BSS) which acts as a rela\r\ny function. These messages and
    procedures are documented in GSM 04.08,\r\nthe only relevant issues covering these
    messages in this GTS are thos\r\ne concerned with error conditions at the interface,
    and the headers th\r\nat are required for the correct addressing of the messages.
    This is sp\r\necified in more detail in GSM 08.06.\r\nThe functional split between
    MSC and BSS is defined in GSM 08.02 and s\r\ntates that the BSS is responsible
    for local radio resource allocation\r\nand in order to support this the required
    procedures between BSS and M\r\nSC are defined in detail in this Technical Specification.\r\nGSM
    08.02 also states that the BSS is responsible for the scheduling o\r\nf all CCCH/BCCH
    messages and therefore some procedures for providing t\r\nhe BSS with the necessary
    information to be passed on these channels f\r\nor individual calls (i.e. paging)
    are defined in this Technical Specif\r\nication, but the scheduling is not discussed.\r\nThis
    interface and consequently these layer 3 procedures are designed\r\nto support
    BSSs providing one or more cells.\r\n  "
