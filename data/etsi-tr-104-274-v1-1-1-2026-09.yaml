abstract:
- language: en
  script: Latn
  content: "Is on indoor Security scanners for use in airports and similar buildings
    in the frequency range 12-40GHz.  They are similar to those described in SRdoc
    TR 103 664 (security scanner 69,8-80,5 GHz) but operate in a somewhat lower frequency
    range with low power and have a dedicated application in security screening;  e.g
    to detect objects concealed in or underneath a person’s clothing and to display
    the location of the objects on a human avatar, which is presented on a touchscreen.
    \ As per the guidance in the LS from the ECC (ERM(22)77b002_LSin), the SRdoc will
    exclude the passive bands under RR No.5.340 from the frequencies to be considered
    for the intentional (wanted) emissions.\r\nThe SRdoc will include necessary information
    to support the co-operation between ETSI and the Electronic Communications Committee
    (ECC) of the European Conference of Post and Telecommunications Administrations
    (CEPT), including: • Detailed market information (annex A); • Technical information
    (annex B); • Relationship to the existing spectrum regulation (annex C); • Preliminary
    compatibility feasibility analysis (annex D).\r\n\r\n"
