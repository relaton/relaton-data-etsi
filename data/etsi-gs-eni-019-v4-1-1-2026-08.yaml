abstract:
- language: en
  script: Latn
  content: "The present document continues to specify the development of the ENI information
    model. The present document will define data model requirements, as well as defining
    required and recommended practices for deriving data models from an information
    model. This will be illustrated by providing at least two different examples of
    how to derive technology-specific data models from the ENI information model.
    Finally, it will define ontology requirements, and explain how ontologies can
    be incorporated to augment, enhance, and specify meaning and different relationships
    between modelled entities. This latter is critical to provide semantic reasoning.
    The present document is specific to and enhances the current ENI System Architecture.\r\nIn
    Release 4 the present document will specify additions to the ENI Extended Core
    and Policy Models. It will also describe recommended approaches for using models
    to define APIs to complement the information present in GS ENI 005."
