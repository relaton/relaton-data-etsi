abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) defines the functional\r\ncharacteristics
    and requirements of the Subscriber Identity Module (SI\r\nM) for use in GSM and
    DCS 1 800 applications. All references to GSM sh\r\nall apply equally to DCS 1
    800 unless otherwise stated.\r\nThe SIM is the entity that contains the identity
    of the subscriber. Wh\r\nen placed in a Mobile Equipment (ME), together they become
    a Mobile St\r\nation (MS) which may then register onto a GSM network.\r\nThe primary
    function of the SIM in conjunction with a GSM network is t\r\no authenticate the
    validity of an MS when accessing the network. In ad\r\ndition it provides a means
    to authenticate the user and may also store\r\nother subscriber-related information.
    Subscription entitlements are s\r\ntored not in the SIM, but in the network.\r\nIf
    the SIM functionality is incorporated into a multi-application ETSI\r\n/TE9 card,
    the GSM application may be used in other telecommunication\r\napplications.\r\nIn
    addition SIMs are permitted to contain non-GSM functionality. In th\r\ne case
    of multi-application cards, this ETS defines just the GSM appli\r\ncation.\r\n"
