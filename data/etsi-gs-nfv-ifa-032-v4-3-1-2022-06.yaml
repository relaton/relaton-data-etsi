abstract:
- language: en
  script: Latn
  content: "This revision of NFV-IFA 032 propagates the deliverable into NFV Release
    4. This edition will add requirements to support Release 4 features (listed in
    the Release 4 Definition) and will extend the scope of the former Release 3 edition
    summarized hereafter:\r\nNFV-IFA 032 specifies the interfaces for management of
    multi-site connectivity services. The services are produced by a WAN Infrastructure
    Manager (WIM). The present document also describes the operations and the information
    elements that are exchanged over these interfaces. \r\nThis revision will also
    reflect the maintenance needed for the previous version.\r\n"
