abstract:
- language: en
  script: Latn
  content: "The following changes to the EN 300 328 are required:\r\n- The removal
    of the requirement for a min bit rate of 250kbit/s\r\n- To include new wide band
    transmission technologies that are within the scope of the standard\r\n- The revised
    Harmonized Standard will have the number EN 300 328.  It will replace the current
    EN 300 328-2.\r\n"
