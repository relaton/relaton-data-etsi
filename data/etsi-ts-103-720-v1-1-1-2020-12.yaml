abstract:
- language: en
  script: Latn
  content: "The evolution of verticals in the context of 5G specifications also leads
    to the definition of technologies that enables the distribution of linear TV and
    radio services over 5G radio and core network technologies. This includes for
    example the ability to distribute free-to-air services to devices that are receive-only.
    The specific 3GPP technologies addressing the broadcaster’s needs, including:
    \r\n-\treceive-only mode devices and services,\r\n-\tMBMS dedicated carrier,\r\n-\textended
    numerologies for large inter-site distances,\r\n-\tnew core network interfaces
    and content transport mechanisms\r\nare distributed over several 3GPP specifications
    and are under control of multiple different 3GPP working groups.\r\n\r\nBeyond
    this, additional restrictions and profiling of existing 3GPP specifications are
    expected to be necessary that need to be documented in order to have deployment-ready
    specifications for 5G-based linear TV and radio services over cellular and broadcast
    networks. For example, existing core requirements on the 3GPP UE that may not
    apply to the receive-only mode devices receiving linear TV and radio services.
    \r\n\r\nThe objective of this work is to develop a single overview and system
    specification that \r\n-\tprofiles and restricts existing 3GPP specifications
    in the context of 5G in order to enable the deployment of linear TV and radio
    services,\r\n-\tdocuments UE and network implementation guidelines to deploy linear
    TV and radio services, as necessary.\r\nThe work item is aligned with ongoing
    3GPP standardization work, in particular the \"LTE-based 5G terrestrial broadcast
    (LTE_terr_bcast)\"\r\n"
