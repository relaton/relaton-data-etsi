abstract:
- language: en
  script: Latn
  content: "The document specifies radio parameters, data link services and protocol
    data units, and application services and protocol data units which are necessary
    for the efficient use of the radio spectrum and for the purpose of DSRC based
    applications. This includes methods of measurements for verifying the limits stated
    in the document. The present document applies to 5,8 GHz Short Range Devices (SRDs)
    for use in Road Transport Traffic and Telematics (RTTT): - with a Radio Frequency
    (RF) output connection and specified antenna or with an integral antenna; - for
    data transmission only; - operating on radio frequencies in the 5 725 MHz to 5
    875 MHz Industrial, Scientific and Medical (ISM) band. The applicability of the
    present document covers both the Road Side Units (RSUs) and the On Board Units
    (OBUs) with transceivers and transponders. This document does not necessarily
    include all the characteristics which may be required by a user, nor does it necessarily
    represent the optimum performance achievable. This document refers to a specific
    standard covering various RTTT applications. \r\n"
