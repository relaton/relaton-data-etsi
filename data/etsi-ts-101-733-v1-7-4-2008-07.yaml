abstract:
- language: en
  script: Latn
  content: "Version 1.7.4 is revision of version 1.7.3 that is using the acronym CAdES
    for \"CMS Advanced Electronic Signature\" \r\nwhich is similar to XAdES (XML Advanced
    Electronic Signatures) as specified in ETSI TS 101 903. \r\nThis version does
    not mandate anymore the use of the SHA-1 hash function. It is fully aligned with
    IETF RFC 5126."
