abstract:
- language: en
  script: Latn
  content: 'This work item will study the exploitation of the availability of idle
    computing resources in the MEC system deployed in the 3GPP architecture’s data
    network (DN). This study will take into account the underlying 3GPP 5G system
    architecture, ETSI and 3GPP existing standards. The scope of this study includes:  -
    to explore pertinent use cases, and to study the benefits and issues, via considering
    computing resources in the MEC system deployed in DN, - to study the impact of
    fluctuations in computing resources, as well as corresponding alternative solutions
    against this impact, especially through redundant deployment of applications in
    the MEC system deployed in DN, considering prediction and proactive deployment
    of applications, and timing for application uninstallation,  - to discuss potential
    requirements and enhancements for MEC system architecture and functions.'
