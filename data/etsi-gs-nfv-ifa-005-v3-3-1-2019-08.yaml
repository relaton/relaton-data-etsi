abstract:
- language: en
  script: Latn
  content: "This revision of  NFV-IFA 005 continues the development of the specification
    as part of the NFV Release 3. \r\nThis edition will add requirements and specification
    of interfaces and associated information model to support the Release 3 features,
    and it will extend the scope of the former Release 2 edition summarized hereafter:\r\n\r\nThis
    Work Item describes the complete functional requirements for interfaces on the
    Or-Vi reference point between the NFVO and the VIM(s), to address the functions
    specified in GS NFV MAN 001.\r\nThe work will include:\r\n1) Detailed description
    of interfaces and its operations functionality, and\r\n2) Information elements
    of: \r\n      a) Virtualized resource management interfaces, for:\r\n         i)
    Lifecycle management of virtualized resources, including instantiation, modification,
    configuration and termination of such virtualized resources.\r\n         ii) Fault
    management of virtualized resources.\r\n         iii) Performance management of
    virtualized resources. \r\n      b) Resource orchestration interfaces, for:\r\n
    \        i) Virtualized resources/NFVI capacity management.\r\n         ii) Resources
    reservation management.\r\n         iii) Virtualized resources information management.\r\n
    \        iv) Software image management,\r\n         v) NFP management.\r\nThe
    resulting deliverable will contain normative provisions.\r\n\r\nThis revision
    of NFV-IFA 005 will address the Release 3 candidate features listed in Annex B
    of the Release 3 Definition. Where needed, it will continue the previous version
    to enhance and complete the specified Release 3 features.\r\nThis revision will
    reflect the maintenance performed to NFV Release 2 documentation and of already
    specified Release 3 features."
