abstract:
- language: en
  script: Latn
  content: "To identify a common set of standards and specify configuration parameter
    values and references required for the implementation of direct communication
    between ITS stations, to achieve interoperable deployment of ITS services via
    V2V and V2I links.  The scope is limited to LTE-V2X mode 4.  Additional requirements
    like triggering conditions, position accuracy, security, and functional safety
    aspects are out of scope.  Descriptions, definitions and rules for all layers
    (Applications, Facilities, Networking & Transport and Access) of the ETSI ITS
    station reference architecture will be considered.\r\nThe scope is limited to
    communication aspects of ITS stations using a single access layer technology (i.e.,
    LTE-V2X).  Additional requirements like triggering conditions, position accuracy,
    security, and functional safety aspects are out of scope. \r\nDescriptions, definitions
    and rules for all layers (Applications, Facilities, Networking & Transport and
    Access) of the ETSI ITS station reference architecture will be considered."
