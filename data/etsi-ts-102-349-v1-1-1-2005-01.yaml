abstract:
- language: en
  script: Latn
  content: The present document defines the actual content to be transported in the
    DRM-specific protocol Receiver Status and Control Interface (RSCI) [4] based on
    the generic and application-independent Distribution and Communications Protocol
    (DCP) [2]. The RSCI protocol covers the transport of receiver's status information
    (output protocol) in addition to the DRM multiplex as well as commands (control
    protocol) to control the receiver's behaviour. The available TAG items for the
    RSCI TAG layer within the DCP protocol are defined in this document.
