abstract:
- language: en
  script: Latn
  content: "Item deals with end to end speech quality including the mouth to ear transmission.
    The goal of the work item is to define new quality parameters which describe the
    subjectively perceived conversational- and speech-quality for complex scenarios
    including the terminal and the corresponding acoustical interfaces. These quality
    parameters should focus on the effects of non-linear and/or time variant devices
    and their interaction. For more detailled information see STQ 06(99)26b.\r\n"
