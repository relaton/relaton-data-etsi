abstract:
- language: en
  script: Latn
  content: "This technical specification (TS) contains the Requirements catalogue
    for the ERM; Peer-to-Peer Digital Private Mobile Radio using FDMA with a channel
    spacing of 6,25 kHz with e.r.p of up to 500 mW as defined in TS 102 490 v1.1.1.\r\nThe
    objective of this specification is to provide a basis for conformance and interoperability
    tests for ERM Peer-to-Peer Digital Private Mobile Radio equipment giving a high
    probability of inter-operability between different manufacturer's equipment."
