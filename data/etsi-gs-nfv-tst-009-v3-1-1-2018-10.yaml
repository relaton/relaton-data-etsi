abstract:
- language: en
  script: Latn
  content: "This work item will specify vendor-agnostic definitions of performance
    metrics and the associated methods of measurement for Benchmarking networks supported
    in the NFVI. The Benchmarks and Methods will take  into account the communication-affecting
    aspects of the compute/networking/virtualization environment (such as the transient
    interrupts that block other processes, or the ability to dedicate variable amounts
    of resources to communication processes). \r\nThese Benchmarks are intended to
    serve as a basis for fair comparison of different implementations of NFVI, (composed
    of various hardware and software components) according to each individual Benchmark
    and networking configuration evaluated. Note that a Virtual Infrastructure Manager
    (VIM) may play a supporting role in configuring the network under test.  Example
    of existing Benchmarks include RFC 2544 Throughput and Latency (developed for
    physical network functions)."
