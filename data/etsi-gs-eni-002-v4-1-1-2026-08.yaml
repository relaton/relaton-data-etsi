abstract:
- language: en
  script: Latn
  content: "The purpose of the present document is to specify the requirements of
    how intelligence is applied to the network and applications in different scenarios
    to improve experience of service provision and network operation. Also, how intelligence
    enables dynamic autonomous behaviour and adaptive policy driven operation in a
    changing context. The ENI requirements are based on the ENI use case document
    and identified requirements from other SDOs. These requirements will form the
    base for the architecture design work.\r\nIn release 4, this document will add
    the requirements abstracted from new use cases and PoCs, as well as from the deliverables
    of other release 4 ENI work."
