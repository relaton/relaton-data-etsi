abstract:
- language: en
  script: Latn
  content: "It will specify the formats for the different contents to be produced
    and managed in electronic registered delivery transactions. This part will deal
    with:\r\n•\tMessage delivery formats. Specifications of the format/formats for
    the meta-information specified “Semantic Contents” part. Meta-information may
    come either in attached (as an envelope including the payload) or detached format.\r\n•\tEvidence
    and identification formats. Specifications of the syntax for the set of evidence
    and user identity information specified in “Semantic Contents” part above.\r\n•\tService
    discovery formats. Specifications of the format/formats for capabilities, requirements
    and trust information specified in the “Semantic Contents” part.\r\n"
