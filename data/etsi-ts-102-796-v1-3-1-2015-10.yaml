abstract:
- language: en
  script: Latn
  content: Update TS 102 796 1.2.1 to 1) use more recent standards incl. HTML5, DVB-DASH,
    HEVC, CI Plus 1.4; 2) add support for companion screen – companion screen launching
    app on TV, TV launching app on companion screen, communication between app on
    TV and app on companion screen, synchronisation of app on companion screen to
    media on TV; 3) add support for advert insertion, TTML subtitles, synchronisation,
    privacy, push VoD and object carousel caching; 4) various small incremental enhancements
    and bug fixes ; all while retaining backwards compatibility with deployed services.
