abstract:
- language: en
  script: Latn
  content: "The work item shall describe common basic communication procedures required
    by many simulation services, e.g. providing announcements.\r\nThe intention is
    that TISPAN WI3019 should be aligned as much as possible.\r\nFurther, this work
    item shall also document signalling flow of common interest to be referenced by
    other simulation services and that can not be documented in an endorsement TS.\r\nAny
    requirements on MGCF should be documented by the WI 03053 (endorsement of 23.163).\r\n\r\n"
