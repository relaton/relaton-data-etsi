abstract:
- language: en
  script: Latn
  content: "Revision of salt mist test. starting point of the discussion on which
    standard use for the test is CR EE1(13)043003\r\nUpdate of the standard to be
    in line with ETSI editorial rule.\r\nTest Ae (Test Ae: Cold for heat-dissipating
    specimens) and test Be (Test Be: Dry heat for heat-dissipating specimens) are
    missing in ETSI EN 300 019-2-3. The mentioned test are from basic standards IEC
    60 068-2-1 resp. IEC 60 068-2.2. The tests shall be mentioned in the present standard.\r\nAlso
    to clarify the mechanical tests in EN 300 019-2-4 (in table 5 the characteristic
    severities are in line with IEC 60721-3-4 but the test severities are lower)."
