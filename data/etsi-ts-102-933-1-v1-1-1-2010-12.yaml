abstract:
- language: en
  script: Latn
  content: "To specify the improved mobile receiver parameters (blocking capability,
    IM3, ACS, etc.) needed by GSM-R for nearly-interference- free usage in Europe.
    \r\nThe specification will be based on:\r\n- 3GPP TS 51.021;  ETSI TS 101 087
    \ \"Digital cellular telecommunications system (Phase 2 & Phase 2+); Base Station
    System (BSS) equipment specification; Radio aspects;\r\n- 3GPP TS 51.010-1; ETSI
    TS 151 010-1 \"Digital cellular telecommunications system (Phase 2+); Mobile Station
    (MS) conformance specification; Part 1: Conformance specification;\r\n- 3GPP TS
    45.005; ETSI TS 100910 Digital cellular telecommunications system (Phase 2+);
    Radio Transmission and Reception.\r\nThe specification will identify improved
    receiver characteristics.\r\nIt may consider the concept of external filters,
    installation requirements (e.g. for cab radios) for both receive and transmit
    sections."
