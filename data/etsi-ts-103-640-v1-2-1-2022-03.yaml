abstract:
- language: en
  script: Latn
  content: "The present document specifies test methods, technical parameters and
    performance requirements for assessment of the Quality of Experience when using
    Active Noise Cancellation Headsets with speech and music content.\r\nThis revision
    extends the present document with new test methods for adaptive ANC and transparency
    modes, additional simulated background noise conditions for testing, and other
    enhancements to further ensure test repeatability"
