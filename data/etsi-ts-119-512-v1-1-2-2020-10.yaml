abstract:
- language: en
  script: Latn
  content: "1 .Specify an architecture for the long-term preservation of data based
    on SR 019 510. This architecture shall contain an interface between a client and
    the long-term data preservation service, which may or may not provide storage
    functionality, and support the transfer of content and evidence-related data from
    one long-term data preservation service to another one.\r\n2. Provide a high level
    specification of methods and data objects outlining a generic protocol between
    a client and a long-term data preservation service and two long-term data preservation
    services for the export and import of content and evidence-related data. The protocols
    cover data preservation services which may or may not provide data storage functionalities.\r\n3.
    Specify data objects (including the formats of the preservation evidence based
    on existing standards) and transport protocols as well as the binding between
    the exchanged data objects and transport protocols based on widely acknowledged
    standards and state of the art protocol technology aiming at interoperability
    using for example XML / SOAP and JSON / REST.\r\n"
