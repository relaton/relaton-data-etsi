abstract:
- language: en
  script: Latn
  content: 'This technical report will address the efficient acquisition and management
    of context information and suitable equipment configuration in a heterogeneous
    radio environment. In particular, an eco-system within the equipment will be defined
    in order to achieve this objective. Such an eco-system may comprise entities such
    as Context Information Acquisition Entity, Context Management Entity, Configuration
    Management Entity, Flexible Modulation Entity, and others. Context information
    may typically comprise information on the heterogeneous radio environment (e.g.
    which RATs are available), location information, etc., including information gathered
    from sensors. The work will comprise in particular the following steps: 1. Identification
    of the target applications (e.g. front-end configuration, location based services),
    usage opportunities and use cases 2. Identification of the radio interface engine
    reconfigurability 3. Identifying challenges (e.g. physical layer security and
    localisation signal design and algorithms) 4. Identification of potential system
    requirements 5. Possible usage in a satellite, Mobile Broadband, IoT, and other
    context'
