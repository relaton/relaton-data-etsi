  script: Latn
  content: "This European Telecommunication Standard (ETS) specifies the digital\r\ntest
    sequences for the GSM enhanced full rate speech codec. These\r\nsequences test
    for a bit exact implementation of the enhanced full rat\r\nspeech transcoder (GSM
    06.60 (ETS 300 726) [2]), Voice Activity\r\nDetection (GSM 06.82 (ETS 300 730)
    [6]), comfort noise (GSM 06.62 (ETS\r\n300 728) [4]) and the discontinuous transmission
    (GSM 06.81 (ETS 300\r\n729) [5]).\r\n  "
