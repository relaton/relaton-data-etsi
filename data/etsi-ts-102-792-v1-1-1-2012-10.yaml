abstract:
- language: en
  script: Latn
  content: Without the use of special mitigation techniques, European CEN Dedicated
    Short Range Communication (DSRC) equipment operating in the frequency range from
    5 795 MHz to 5 815 MHz can suffer from harmful interference caused by Intelligent
    Transport Systems (ITS) using adjacent frequency bands. The produced document
    will specify  procedures on how to avoid this interference.
