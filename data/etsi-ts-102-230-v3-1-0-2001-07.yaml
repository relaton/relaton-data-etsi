abstract:
- language: en
  script: Latn
  content: "The present document specifies the interface test for the Terminal / UICC,
    as defined in ETSI TS 102 221. The tests cover:\r\n-physical characteristics of
    the UICC;\r\n-the electrical interface between the UICC and the Terminal;\r\n-the
    initial communication establishment and the transport protocols;\r\n-the application
    independent procedures.\r\n\r\nThis specification is based on work originally
    done in the 3GPP T3 in 3GPP TS 31.120.\r\n"
