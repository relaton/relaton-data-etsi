abstract:
- language: en
  script: Latn
  content: "To specify the interface between the UICC and the Terminal. In particular,
    this covers:\r\nthe requirements for the physical characteristics of the UICC;\r\nthe
    electrical interface between the UICC and the Terminal;\r\nthe initial communication
    establishment and the transport protocols;\r\nthe model which serves as a basis
    for the logical structure of the UICC;\r\nthe communication commands and the procedures;\r\nthe
    application independent files and protocols.\r\nThe administrative procedures
    and initial card management will not be part of the present document.\r\n"
