abstract:
- language: en
  script: Latn
  content: "One of the challenges for a successful commercial deployment of Reconfigurable
    Radio Systems (RRS) technologies is to provide an adequate level of security.
    While RRS should guarantee the same level of security of conventional wireless
    communication systems, they may also present new vulnerabilities or security threats.
    \r\nThe scope of this work item is to identify security related use cases and
    threats in the deployment and operation of Reconfigurable Radio Systems. \r\nThe
    objective of this work item is to provide a Technical Report, which will address
    the following topics:\r\n1)\tInvestigate use cases and related security threats,
    which may impact the availability and services provision of RRS networks and equipment.
    \r\n2)\tInvestigate use cases and related security threats, which may cause wireless
    interference to incumbent services. \r\n3)\tInvestigate use cases and related
    security threats to the functionality of download and activation of software modules
    on RRS.\r\n"
