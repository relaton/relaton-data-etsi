abstract:
- language: en
  script: Latn
  content: "This specification takes notice of the Security Principles and Objectives
    as set out in [1]. It contains an evaluation of perceived threats to 3GPP and
    produces subsequently a list of security requirements to address these threats.
    \r\nAs teleservices and applications will not, in general, be standardised, it
    is difficult to predict their exact nature. Therefore, this specification considers
    all security threats and aims at listing generic security requirements that shall
    be applicable irrespective of the actual services offered. The list of threats
    and requirements may however need to be updated as the 3GPP system evolves.\r\nThe
    threat analysis performed relies to a large extent on previous experiences with
    2G systems, in particular GSM, and takes into account known problems from that
    area. \r\nThe security requirements listed in this specification shall be used
    as input for the choice of security features and the design of the 3GPP security
    architecture as specified in [2]. \r\nThe structure of this technical specification
    is as follows:\r\nclause 2 lists the references used in this specification;\r\nclause
    3 lists the definitions and abbreviations used in this specification;\r\nclause
    4 contains a reference to the general objectives for 3G security;\r\nclause 5
    contains an overview of the context in which the security architecture of 3G is
    designed;\r\nclause 6 contains a list of identified security threats to 3G, and
    gives some results from the threat analyses that have been performed;\r\nclause
    7 contains an overview of the risk assessment resulting from the threat analyses
    performed\r\nclause 8 contains the resulting list of security requirements for
    3G and indicates how these requirements relate to the threats and the security
    objectives .\r\nFinally, Annex A gives some more detailed information on threats
    and risks connected to so called false base station attacks.\r\n"
