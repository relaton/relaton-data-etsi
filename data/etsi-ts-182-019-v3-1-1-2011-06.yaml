abstract:
- language: en
  script: Latn
  content: "In relationship with the unicast stored (e.g; content download) and streaming
    (e.g. CoD) services as defined in TS 181 016, the scope of this work item is the
    following:\r\n·Define the CDN functional entities and related reference points.\r\nFor
    the IMS-based Subsystem:\r\n·Define the interconnection with IMS-based IPTV solution\r\n·Define
    user session procedure at the CDN level.\r\nFor the Integrated Subsystem:\r\n·Define
    the interconnection with Integrated IPTV solution\r\n·Define user session procedures
    at the CDN level.\r\n"
