abstract:
- language: en
  script: Latn
  content: "This specification defines the security architecture, i.e., the security
    features and the security mechanisms, for the third generation mobile telecommunication
    system.\r\nA security feature is a service capabilities that meets one or several
    security requirements. The complete set of security features address the security
    requirements as they are defined in \"3G Security: Threats and Requirements\"
    (21.133 [1]). A security mechanism is an element that is used to realise a security
    feature. All security features and security requirements taken together form the
    security architecture.\r\nAn example of a security feature is user data confidentiality.
    A security mechanism that may be used to implement that feature is a stream cipher
    using a derived cipher key. \r\n\r\n"
