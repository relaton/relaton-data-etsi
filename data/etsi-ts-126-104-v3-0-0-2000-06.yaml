abstract:
- language: en
  script: Latn
  content: "the ANSI-C code for a floating-point implementation of the Adaptive Multi-Rate
    codec. This floating-point codec specification is mainly targeted to be used in
    multimedia applications such as the 3G-324M terminal specified in 3G TS 26.110,
    or in packet-based (e.g., H.323) applications. The bit-exact fixed-point ANSI-C
    code in 3G TS 26.073 remains the preferred implementation for all applications,
    but the floating-point codec may be used instead of the fixed-point codec when
    the implementation platform is better suited for a floating-point implementation.
    It has been verified that the fixed-point and floating-point codecs interoperate
    with each other without any artifacts.\r\nThe fixed-point specification in 26.073
    shall remain the only allowed implementation for the 3G mandatory speech service
    and the use of the floating-point codec is strictly limited to other services."
