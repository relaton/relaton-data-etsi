abstract:
- language: en
  script: Latn
  content: "·Change cardinality of Title and Synopsis to 'unbounded' in InstanceDescriptionType\r\n·Add
    'mini-series' as a ProgramGroupTypeType\r\n·Add SampleFrequency and BitsPerSample
    to AudioAttributesType\r\n·Add FragmentExpirationDate to FragmentIdentification\r\n·In
    SegmentInformation, change SegmentLocator cardinality to optional\r\n·Add a 'DRM'
    complex element in PurchaseItem with a choice between a LicenseLocator or a LicenseExpression\r\n·Clarification
    on regionalisation of classification schemes (CS), use of CSs, extensions of existing
    CSs and creation of new CSs\r\n·Create TVAParentalGuidanceType\r\n·Create a GenericDerivationReasonType\r\n·Addition
    of a 'closed' attribute of boolean type to SignLanguageType\r\n·Create new CaptioningAttributesType
    in AVAttributesType\r\n·Add serviceIdRef in OnDemandProgramType and associated
    text on the use of fragmentId\r\n·Add optional RelatedMaterial to ServiceInformation\r\n·Create
    a TVAPlaceType and change the name of DepictedLocation to TVAPlaceType\r\nAdd
    clarification not on the use of Crid in SegmentInformationType"
