abstract:
- language: en
  script: Latn
  content: "This document provides guidance for the selection of cryptographic suites
    for given business requirements.\r\nInteroperability of eSignature within Europe
    matters. Security requirements differ from one country to another. Therefore it
    is necessary to define what is mandated to address security requirements in various
    business cases. These business cases deal with the different components, devices
    and applications, used in the context of electronic signature.\r\nA general approach
    to the business guidance will be produced based on guidance from the viewpoint
    of signature creation and validation.  From this general approach, guidance for
    each of the other areas will be produced."
