abstract:
- language: en
  script: Latn
  content: "The present document provides guidance on the quality parameters that
    need to be considered at the \r\nSegment-connection of Voice over IP (VoIP) services
    and voice band data (VBD) services in an NGN. The document provides guidance on
    objectives for voice and data parameters.\r\nInside the TISPAN based NGN and 3GPP
    including  LTE overall architecture (see figure 1 to figure 1E), the present document
    considers only the transport layer. \r\n"
