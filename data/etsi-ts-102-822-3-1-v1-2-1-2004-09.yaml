abstract:
- language: en
  script: Latn
  content: "This work item will cover the following revisions:\r\nImprovement of segment
    description and related timing issues\r\nCreation of a new TimeBaseReference of
    TimeBaseReferenceType for use in SegmentInformationType and SegmentGroupInformationType
    \r\nRemoval of original TimeBaseReference from SegmentInformationTableType.\r\nAccordingly,
    creation of a new TVAMediaTimeType and TVAMediaRelIncrTimePointType\r\nRevision
    of RelatedMaterialType support related segments introducing a new SegmentReference
    of SegmentReferenceType\r\nGlobalisation of type declaration for easier profiling,
    extensibility and wider adoption of the specification as by DVB.\r\nRevision of
    CaptionAuthors in TVARoleCS for mapping to SMPTE MXF's DMS1 dictionary for production\r\nRevision
    of « AV attributes » and associated descriptions to improve content description\r\nAudio
    attributes: maxOccurs becomes \"unbounded\" to support more than one audio track
    per programme\r\n« Original or dubbed » and « main or supplemental » covered by
    the mpeg7 language type in Audio attributes\r\nAddition of « description » in
    audio attributes\r\nAddition of « Duration » in BasicContentDescription\r\n"
