abstract:
- language: en
  script: Latn
  content: To provide a basis to test DECT equipment claiming conformance to EN 301
    649 DPRS, giving a high probability of inter-operability between different manufacturer's
    DECT equipment. TTCN should not be used as it is covered in EN 301 469. Test equipment
    should not be expected rather utilisation of monitoring devices should be foreseen.
    Tests should be based on the assumption of presence of reference terminals complying
    with the DPRS specification requirements.
