abstract:
- language: en
  script: Latn
  content: "The goal of TS 103 433-2 V1.1.1 was to standardize a single layer enhancement
    for HDR systems using a SMPTE ST 2084 transfer function, enabling high performance
    display adaptation. \r\nThe goal of the present work item is to produce a revision
    of the referenced standard that includes some fixes and an enhancement that enables
    a more flexible HDR to HDR signal reconstruction. \r\nNote that the functionality
    described in TS 103 433-2 V1.1.1 and the associated syntax/semantics of the SEI
    message in Annex A will not be changed."
