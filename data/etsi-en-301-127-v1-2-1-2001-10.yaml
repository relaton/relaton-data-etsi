abstract:
- language: en
  script: Latn
  content: "Addition of a category with relaxed spectrum mask, suitable for systems
    which are not intended for large multichannel trunk systems, and are without compatibility
    constrain with other manufacturer systems under the same branching/antenna system.
    XPIC operation for frequency reuse will be considered an optional, non compulsory
    feature.\r\nThe technical specifications will be derived from the merging of the
    present systems and of category 5b systems in EN 300 430 V1.2.1"
