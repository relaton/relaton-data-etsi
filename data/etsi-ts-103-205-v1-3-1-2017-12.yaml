abstract:
- language: en
  script: Latn
  content: 'The present document specifies new features for CI Plus V1.4 specification.
    The main new features are: editorial fixes, Operator profile V3 (added mechanism
    to query Host decoding capabilities), CICAM Player V2 (added mechanism to query
    Host decoding capabilities), URI V5 (added Enhanced Content Protection extensions)
    and clarification on the support of multiple Root Of Trust.'
