abstract:
- language: en
  script: Latn
  content: "This document specifies procdures for creation and validation of a digital
    signature within a given policy context. This document specifies support for validation
    of XAdES (XML Advanced Electronic Signature), CAdES (CMS Advanced Electronic Signature)
    and PAdES (PDF Advanced Electronic Signature) signatures taking into account usage
    of Trusted Lists.\r\n\r\nThis TS evolves ETSI TS 102 853: \"Signature verification
    procedures and policies\" regarding the signature validation and will incorporate
    requirements for signature creation procedures. "
