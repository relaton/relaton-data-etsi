abstract:
- language: en
  script: Latn
  content: "This ETS describes the requirements for the signalling system and the\r\nprocedures
    needed at the application level in order to fulfil these\r\nsignalling needs.\r\nClauses
    1 to 4 are related to general aspects such as terminology,\r\nmobile network configuration
    and other protocols required by MAP.\r\nMAP consists of a set of MAP services
    which are provided to MAP\r\nservice-users by a MAP service-provider.\r\nClauses
    5 to 10 of this ETS describe the MAP services.\r\nClauses 11 to 14 define the
    MAP protocol specification and the\r\nbehaviour of service provider (protocol
    elements to be used to provide\r\nMAP services, mapping on to TC service primitives,
    abstract\r\nsyntaxes...).\r\nClauses 15 to 21 describe the MAP user procedures
    which make use of MA\r\nservices.\r\n "
