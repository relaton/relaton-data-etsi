abstract:
- language: en
  script: Latn
  content: "a) This GS specifies normative architectural extensions for the Autonomous Agent Identity Management framework referenced in ZSM020, enabling secure, verifiable agent identities within the Zero-touch network and Service Management (ZSM) framework.\r\nb) It defines use cases involving autonomous agent identity management for secure authentication, dynamic credential management, and trusted cross-domain discovery in multi-agent environments.\r\nc) This GS specifies requirements for autonomous agent identity management that support scalable and interoperable identity operations, including mechanisms for decentralized identifier (DID) issuance, verifiable credential binding, identity revocation, and real-time status synchronization.\r\nd) Collaboration with other SDOs (e.g. IETF, ITU-T SG11, SG13, TM Forum) will be pursued where appropriate to ensure alignment and synergy.\r\n"
