abstract:
- language: en
  script: Latn
  content: "To produce a new EN, using EN 300 197 as a reference document for full
    duplex digital point-to-point systems.  To include all PDH and SDH capacities,
    1-4 spectrum efficiency classes, co- and adjacent channel interference sensivity
    figures and transmitter spectrum masks, where defined, within EN 300 197.  The
    mode of operation shall be limited to full duplex.\r\n\r\n"
