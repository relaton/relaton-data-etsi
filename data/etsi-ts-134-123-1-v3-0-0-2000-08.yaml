abstract:
- language: en
  script: Latn
  content: "TSG-T WG1/SIG: User Equipment (UE) protocol conformance specification
    (Prose description); \r\nPart 1: Protocol conformance specification\r\n\r\nAbstract
    of document:\r\nThis specification is the first part of a multi-part specification
    describing in prose a suite of conformance tests for 3rd Generation User Equipment
    (UE). The tests are intended to ensure that User Equipment for 3GPP systems conform
    to the relevant 3GPP Technical Specifications.\r\nThe other parts of the multi-part
    specification are TS 34.123-2, which contains a pro-forma for the Implementation
    Conformance Statement (ICS), and TS 34.123-3, which contains a detailed and executable
    description of the test cases written in a standard testing language, TTCN.\r\nContentious
    Issues:\r\nTimely completion of this specification depends upon the availability
    of the core specifications for which it provides conformance tests.\r\nSpecifications
    with the largest impact are TS 24.008, TS 24.331, TS 24.321 and TS 24.322.\r\n"
