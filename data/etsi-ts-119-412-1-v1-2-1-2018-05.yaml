abstract:
- language: en
  script: Latn
  content: "Update to EN 319 412- 1 in TS to include PSD 2 Identifier as legal person
    identifier\r\n\r\nDetails of changes\r\n1. clause 5.1.4 Legal person semantics
    identifier add to list of initial characters.\r\n3)  “PSD” for identification
    based on national authorisation number of a payment service provider under Payment
    Services Directive (EU) 2015/2366.  This shall use the extended structure as defined
    in TS 119 495 clause 5.2.1.  \r\n2.  clause 5.1.4 change numbering of current
    item 3) to item 4)\r\n3.  Add to 2.1 Normative references:\r\n ETSI TS 119 495
    Electronic Signatures and Infrastructures (ESI);  Sector Specific Requirements;
    Qualified Certificate Profiles and TSP Policy Requirements under the payment services
    Directive 2015/2366/EU\r\n"
