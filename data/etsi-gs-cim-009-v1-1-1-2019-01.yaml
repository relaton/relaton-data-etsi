abstract:
- language: en
  script: Latn
  content: This Group Specification provides additions and corrections to the GS-004
    prelimAPI specification, based on feedback about GS-004 received from other SDOs
    as well as developers in the linked-data, internet-of-things, and mobile-apps
    and smart-applications communities, as well as from end users and stakeholders.
    In particular open issues and proposed features in Annexes of the GS-004 document,
    including the topics of privacy/security, will be considered for inclusion as
    part of this specification.
