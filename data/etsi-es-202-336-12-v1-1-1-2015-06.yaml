abstract:
- language: en
  script: Latn
  content: "Define the control/monitoring interface layer of power consumption of
    Telecom/ICT equipment either inside or outside at the power input (interface A
    or A3) based on generic ES 202 336-1 XML interface. Define other measurement that
    could be associated such as environmental parameters (e.g. temperature) or Telecom/ICT
    parameters (traffic, flowrate, number of connected lines, radio setting, ...)\r\nSolutions
    for the association of monitored data (power consumption and environmental values)
    with the data about the telecom configuration and settings would be defined at
    the remote management system level.\r\n"
