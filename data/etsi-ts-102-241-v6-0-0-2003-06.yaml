abstract:
- language: en
  script: Latn
  content: "The specification will be based on the “UICC Application Programming Interface”
    see WI proposal in (SCP-010227)\r\nThe use of the Java Card™ technology will ensure
    the backward compatibility, to the existing 3GPP TS 03.19 compliant cards, and
    support the installed base of these “JavaSIM” card.\r\nDeliverables:\r\nDefine
    a Java API for UICC / CAT, based on the Java Card™ 2.1 platform"
