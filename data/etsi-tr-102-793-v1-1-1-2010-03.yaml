abstract:
- language: en
  script: Latn
  content: 'This document provides a state of art concerning definitions of call establishment
    delay existing in standardization. As call establishment in PSTN context and in
    IP context differ, this document defines a new term of call establishment delay
    which better reflects the course of call establishment in VoIP networks. The call
    establishment delay can be reflected by two parameters: Call Setup Delay and Media
    Establishment Delay.'
