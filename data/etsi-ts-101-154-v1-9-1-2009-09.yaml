abstract:
- language: en
  script: Latn
  content: "The present document provides implementation guidelines for the use of
    audio visual coding in satellite, cable and terrestrial broadcasting distribution
    systems that utilize MPEG 2 Systems. Both Standard Definition Television (SDTV)
    and High Definition Television (HDTV) are covered. MPEG 2, H.264/AVC, SVC and
    VC 1 video coding systems are covered. MPEG 1 Layer I, MPEG-1 Layer II, MPEG 2
    Layer II backward compatible, Dolby AC 3, Enhanced AC 3, DTS, MPEG 4 HE AAC and
    MPEG 4 HE AAC v2 audio coding systems are covered. Furthermore, the combination
    of MPEG-1 Layer II with MPEG Surround and the combination of MPEG-4 AAC or MPEG-4
    HE AAC or MPEG-4 HE AAC v2 with MPEG Surround are covered.\r\n"
