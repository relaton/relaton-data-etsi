abstract:
- language: en
  script: Latn
  content: "Revision of ETR 288 in order to cope with the Enhanced EPG\r\n(revision
    of ETS 300 707).\r\nJTC approved revision work items (EN 300 707) in order to
    include EPG25v13.doc (Enhanced EPG) as proposed by Mr van Lier (EACEM).\r\nIn
    this context, ETR 288 (EPG CoP) needs to be updates as well. Enhan\r\nced Display
    Capabilities for Electronic Programme Guide is an extensio\r\nn to the current
    EPG standard, ETS 300 707 Edition 1, with level 2.5 a\r\nnd 3.5 display capabilities
    as known from the Enhanced Teletext Specif\r\nication ETS 300 706.\r\n"
