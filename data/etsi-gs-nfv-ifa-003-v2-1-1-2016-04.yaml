abstract:
- language: en
  script: Latn
  content: 'The scope of this work item includes the following deliverables:  - Define
    performance benchmarking parameters for virtual switching in the usage models
    provided in the companion work item “Overview & Use Cases”. - Define requirements
    for virtual switch acceleration, and quantify possible gains in performance, latency
    & SLA metrics. - Define deployment scenarios for compute node based virtual switching
    that is supportable in any virtual switch data path or in any intelligent NIC,
    in a consistent manner across multiple vendor implementations. - Define requirements
    for common virtual switching functions across usage models such as packet delivery
    into VNFs,  network overlay and tunnel termination, stateful NAT, service chaining,
    load balancing and, in general, match-action based policies applied to network
    functions running in VMs.   - Recommendations for potential follow-on PoCs to
    demonstrate feasibility.  The deliverable''s will contain both normative provisions
    and informative material.'
