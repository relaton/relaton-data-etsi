abstract:
- language: en
  script: Latn
  content: "This Global System for Mobile communications Technical Specification (\r\nGTS)
    specifies the stage 1 description for the first phase of the CAME\r\nL feature
    (Customized Applications for Mobile network Enhanced Logic)\r\nwhich provides
    the mechanisms to support services consistently indepen\r\ndently of the serving
    network. The CAMEL features shall facilitate ser\r\nvice control of operator specific
    services external from the serving P\r\nLMN. The CAMEL feature is a network feature
    and not a supplementary se\r\nrvice. It is a tool to help the network operator
    to provide the subscr\r\nibers with the operator specific services even when roaming
    outside th\r\ne HPLMN.\r\nThe CAMEL feature is applicable to mobile originated
    and mobile termin\r\nated call related activities.\r\nThe mechanism described
    addresses especially the need for information\r\nexchange among the VPLMN, HPLMN
    and the CAMEL Service Environment (CSE\r\n) for support of such operator specific
    services. Any user procedures\r\nfor operator specific services are outside the
    scope of this standard.\r\nThe specification of operator specific services in
    HPLMN are outside t\r\nhe scope of this standard. This specification describes
    only the inter\r\nactions between the VPLMN, HPLMN, IPLMN and the CSE.\r\n  "
