abstract:
- language: en
  script: Latn
  content: "Update the current AML data fields to adapt it to the needs of the users.
    Mainly and not restricted to:\r\n- replace the “time of positioning” by the “time
    of emergency call” in the SMS string. A new parameter would also be added to the
    SMS consisting in a location time delta, i.e. the time of the location - in seconds
    -after the emergency call is launched\r\n- add a new parameter to the SMS: “vertical
    location”\r\n- add a method to establish the link between https message and the
    voice call\r\n- update the solution for AML roaming\r\n- add to the https message
    fields the language of the settings of the smart phone\r\n- add to the https message
    fields the dialled emergency number"
