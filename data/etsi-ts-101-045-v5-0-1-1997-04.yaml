abstract:
- language: en
  script: Latn
  content: "This standard specifies the technical realisation of the first phase o\r\nf
    the network feature Support of Optimal Routeing (SOR). The first pha\r\nse of
    SOR provides:\r\n- a method to route a call from one mobile subscriber directly
    to anot\r\nher mobile subscriber who is in the same country as the calling mobile\r\nsubscriber
    or in the called mobile subscriber’s home country, without\r\nneeding to connect
    the call via the HPLMN of the called subscriber, e\r\nven though the called mobile
    subscriber has roamed outside his HPLMN;\r\n - a method to forward calls when
    a called mobile subscriber who has ro\r\named outside his home country is busy,
    or is not reachable, or does no\r\nt reply, to a forwarded-to destination in the
    HPLMN country of the cal\r\nled subscriber or the VPLMN country of the called
    subscriber, without\r\nneeding to connect the forwarded call via the VPLMN of
    the called subs\r\ncriber;\r\n - a method to combine the optimal routeing described
    in the first bull\r\net point above with the optimal routeing described in the
    second bulle\r\nt point above.\r\n OR of a call is permitted only if all entities
    involved in handling th\r\ne call support OR.\r\nOther cases of optimal routeing
    (e.g. calls where the calling and call\r\ned subscribers are in different countries,
    forwarding to a mobile subs\r\ncriber or multiple forwarding) will be considered
    for inclusion in lat\r\ner phases.\r\n "
