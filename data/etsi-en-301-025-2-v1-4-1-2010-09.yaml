abstract:
- language: en
  script: Latn
  content: " The present document covers the minimum requirements for general communication
    for shipborne fixed installations using a VHF radiotelephone operating in certain
    frequency bands allocated to the maritime mobile service using both 25 kHz and
    12,5 kHz channels with associated equipment for DSC - class D.\r\nThe present
    document is intended to cover the provisions of Directive 1999/5/EC [1] (R&TTE
    Directive) Article 3.2, which states that \"… radio equipment shall be so constructed
    that it effectively uses the spectrum allocated to terrestrial/space radio communications
    and orbital resources so as to avoid harmful interference\".\r\nIn addition to
    the present document, other ENs that specify technical requirements in respect
    of essential requirements under other parts of Article 3 of the R&TTE Directive
    [1] may apply to equipment within the scope of the present document.\r\n"
