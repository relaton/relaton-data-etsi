abstract:
- language: en
  script: Latn
  content: This guide contains harmonised definitions and measurement methods for
    a range of user perceivable Quality of Service (QoS) parameters. Part 1 of this
    EG contains general user related QoS parameter definitions and measurement methods
    that can be applied to any telecommunications service. The purpose of these parameters
    is to define objective and comparable measures of the Qos delivered to users/customers
    for use by users/customers.
