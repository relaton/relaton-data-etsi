abstract:
- language: en
  script: Latn
  content: The document describes profiles of the main IPTV specification from DVB,
    TS 102 034 designed to aid the implementation. In the document a “profile” is
    defined as a collection of functionalities making use of a set of options taken
    from the modules in TS 102 034, that define a point of interoperability for DVB-IP
    ecosystems.
