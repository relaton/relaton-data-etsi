abstract:
- language: en
  script: Latn
  content: "A subgroup (WG Payment) within EP M-Commerce shall be established with
    the following work programme:\r\n4. Analyse the business models for up to 5 (10)
    largest / most interesting Payment Service Providers for m-commerce in Europe
    (World wide?) utilising\r\n- Use Cases (user orientation)\r\n- Interview of Payment
    of Service Provider (internal orientation)\r\n\r\n5. Create a report covering
    the following content for each business model\r\n- Description of Payment Services
    offered\r\n- Category of Business (B2B, B2C...)\r\n- Detailed description of mobile
    technology used or intentions to use (including infrastructure)\r\n- Requirements
    of Payment Service Provider from new / used mobile technology\r\n- List of all
    bodies / committees where the Payment Service Provider expects support / guidance
    from\r\n6. Work Group structure\r\n- headed by WG chairman\r\n- Scheduled meeting
    dates\r\n- Progress report to each EP M-Commerce assembly\r\n- Ad-hoc information
    exchange with WG content"
