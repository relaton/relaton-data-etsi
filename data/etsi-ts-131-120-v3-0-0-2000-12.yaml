abstract:
- language: en
  script: Latn
  content: "T3#8: Rapporteur to be provided by Orga (subject to confirmation).\r\n___________________\r\n-
    Justification and scope\r\nThis work item (Tdoc T3-99320) creates a terminal test
    specification for the interface between the UICC and the terminal based on R99
    \"Core\" spec. \r\nIt will be based on the tests currently contained in GSM 11.10-1
    clause 27.\r\n- 3GPP work area: TSG Terminals, WG3 (USIM)\r\n- Linked work items:
    3G TS 31.101 \"UICC / terminal interface; Physical and logical characteristics\",
    3G TS 31.102 \"Characteristics of the USIM application\"\r\n- Service aspects:
    None.\r\n- MMI-aspects: None.\r\n- Charging aspects: None.\r\n- Security Aspects:
    None.\r\n- Secondary responsible working parties: 3GPP TSG-T  WG1\r\n- NOTE:  The
    above time scales are dependent on the provision of funding for a project team
    to write this specification as requested by TSG-T to PCG in SP-99277.\r\n___________________\r\nSupporting
    organisations: Aspects Software, Ericsson, G&D, Nokia, NTT DoCoMo, Orga, Schlumberger\r\n"
