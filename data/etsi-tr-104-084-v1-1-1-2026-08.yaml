abstract:
- language: en
  script: Latn
  content: This TR studies existing network energy efficiency metrics and outlines
    proposals how network energy efficiency metrics capturing multiple performance
    dimensions (service volume, service quality, service availability, etc.) could
    be formulated. These can be combinations of existing energy efficiency metrics,
    but also new proposals capturing performance dimensions not considered today.
