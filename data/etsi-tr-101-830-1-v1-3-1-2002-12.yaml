abstract:
- language: en
  script: Latn
  content: "To extend and improve the definitions, signal library and measurement
    methods for Spectral Management purposes, as brought together in TR 101 830-1
    version v1.2.1 (part1). This includes the addition of new signals for FDD-ADSL
    (over POTS and over ISDN), and for VDSL.\r\n\r\nObjective: To be a clear reference
    to simplify & harmonize the description of network specific spectral management
    documents, without making any specific choice on the technology mix that may use
    the access network."
