abstract:
- language: en
  script: Latn
  content: "This document provides a study which proves the feasibility of\r\nISDN-based
    DECT/GSM interworking to support roaming of users of\r\ncordless DECT terminals
    between public GSM networks and private DECT\r\nnetworks via an ISDN-based interface.
    The study is aiming at\r\nteleservice speech and supplementary services. Data,
    fax and other\r\nteleservices are out of scope. In order to limit the amount of
    work\r\nfor subsequent specifications to what is achievable within a\r\nreasonable
    timeframe, this feasibility study considers very complex\r\nfunctionality, e.g.
    inter-network handover, to be out of scope.\r\nCommercial viability and demand
    has to be considered by GSM MoU.\r\n  "
