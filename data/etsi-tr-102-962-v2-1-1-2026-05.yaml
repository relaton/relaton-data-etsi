abstract:
- language: en
  script: Latn
  content: "To update the TR 102 962 V1.1.1 (2012-02) based on the recent development
    of mobile network technologies, particularly considering:\r\n   1. Technology
    development of 3GPP network architecture and the Uu interface of LTE and NR including
    V2X features;\r\n   2. C-ITS operation with V2N communication in cross-border
    and cross-mobile operator scenarios; \r\n   3. Support to new ITS services and
    applications that are studied in ETSI ITS; \r\nBackward compatibility will be
    ensured.\r\n"
