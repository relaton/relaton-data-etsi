abstract:
- language: en
  script: Latn
  content: "The purpose of this ETS is to present the possible architectures of\r\nthe
    mobile system. Clause 3 of this ETS contains a definition of the\r\ndifferent
    functional entities needed to support the mobile service. In\r\nclause 4, the
    configuration of a PLMN is described as well as the\r\norganisation of the functional
    entities; the configuration presented\r\nis the most general in order to cope
    with all the possible\r\nimplementations which can be imagined in the different
    countries. To\r\nillustrate that purpose, some examples of possible configurations
    are\r\npresented. Clause 5 of this ETS contains a brief description of the\r\ninterfaces
    involved which shows the principle of the organisation\r\nconsidered.\r\n "
