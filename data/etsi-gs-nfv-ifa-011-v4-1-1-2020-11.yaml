abstract:
- language: en
  script: Latn
  content: "This revision of NFV-IFA 011 propagates the deliverable into NFV Release
    4. This edition will add requirements to support Release 4 features (listed in
    the Release 4 Definition) and will extend the scope of the former Release 3 edition
    summarized hereafter:\r\nNFV-IFA 011 provides requirements for the structure and
    format of a VNF Package to describe the VNF properties and associated resource
    requirements in an interoperable template. The focus is on VNF packaging, meta-model
    descriptors (e.g. VNFD) and package integrity and security considerations. \r\n"
