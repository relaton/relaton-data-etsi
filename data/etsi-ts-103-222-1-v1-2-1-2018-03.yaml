abstract:
- language: en
  script: Latn
  content: "The offer of new NGN services requires new KPI, QoS measurement and benchmarking
    methods which are needed to ensure the quality of new services. To ensure the
    comparability of test results, reference benchmarking methods and background traffic
    load profiles are specfied.\r\nThis revision aims to update related measurement
    methods."
