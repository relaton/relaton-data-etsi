abstract:
- language: en
  script: Latn
  content: "This standard specifies the stage 1 description for the first phase of\r\nthe
    CAMEL feature (Customised Applications for Mobile network Enhanced\r\nLogic) which
    provides the mechanisms to support services consistently\r\nindependently of the
    serving network. The CAMEL features shall\r\nfacilitate service control of operator
    specific services external from\r\nthe serving PLMN. The CAMEL feature is a network
    feature and not a\r\nsupplementary service. It is a tool to help the network operator
    to\r\nprovide the subscribers with the operator specific services even when\r\nroaming
    outside the HPLMN.\r\nThe CAMEL feature is applicable to mobile originated and
    mobile\r\nterminated call related activities.\r\nThe mechanism described addresses
    especially the need for information\r\nexchange among the VPLMN, HPLMN and the
    CAMEL Service Environment\r\n(CSE) for support of such operator specific services.
    Any user\r\nprocedures for operator specific services are outside the scope of\r\nthis
    standard.\r\nThe specification of operator specific services in HPLMN are outside\r\nthe
    scope of this standard. This specification describes only the\r\ninteractions
    between the VPLMN, HPLMN, IPLMN and the CSE.\r\n  "
