abstract:
- language: en
  script: Latn
  content: "This revision of NFV-SOL 004 continues the development of the specification
    as part of the NFV Release 3. This edition will add requirements and specification
    of interfaces to support the Release 3 features. The scope of the former Release
    3 published edition is summarized hereafter:\r\nNFV-SOL 004 specifies the structure
    and format of a VNF package file and its constituents, fulfilling the requirements
    specified in ETSI GS NFV-IFA 011 for a VNF package. NFV-SOL 004 also specifies
    the structure and format of a PNFD archive file and its constituents, fulfilling
    the requirements specified in ETSI GS NFV-IFA 014 for a PNFD archive."
