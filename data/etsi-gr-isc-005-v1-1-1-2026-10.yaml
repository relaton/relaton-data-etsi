abstract:
- language: en
  script: Latn
  content: "The work item will: \r\n(i)\tIdentify the key issues and/or opportunities
    in ISAC computing and their relation to the ISAC Use Cases;\r\n(ii)\tStudy potential
    computational frameworks applicable-to/compatible-with the ISG’s 6G ISAC for the
    computing tasks; \r\n(iii)\tDifferent forms of computing integration will be studied,
    in particular: sensing + computing, communications + computing, and/or ISAC +
    computing, without overlapping architectural considerations made in WI#3.\r\n(iv)\tDescribe
    the key challenges in the proposed computing infrastructure frameworks variants
    to enable multi-modal and/or multi-stream approach in ISAC to support;\r\n(v)\tAnalyze
    the interaction between computing, sensing and communication functions for best
    system performance and convergence."
