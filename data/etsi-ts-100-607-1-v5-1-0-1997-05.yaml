abstract:
- language: en
  script: Latn
  content: "This  TS describes the\r\ntechnical characteristics and methods of test
    for Mobile Stations\r\n(MS), for the Pan European digital cellular communications
    system and\r\nPersonal Communication Systems (PCS) operating in the 900 MHz and
    1800\r\nMHz band (GSM900 and DCS1800), standardized by ETSI Technical\r\nCommittee
    Special Mobile Group (SMG).\r\nThis ETS with methods of test is produced as a
    draft ETS. A subset of\r\nthe tests is referenced in the GSM Common Technical
    Regulations (CTRs)\r\nand is used for regulatory conformance testing according
    to the EEC\r\nprocedures for Telecommunications Terminal Equipment (TTE) type\r\napproval
    (EC Directive 91/263/EEC; also known as the \"Terminal\r\nDirective\" or \"Second
    Phase Directive\"). The remaining tests can be\r\nused to verify conformance with
    the GSM core technical specifications\r\nfor those requirements that are not considered
    \"essential\" in the\r\nsense of the EC Directive 91/263/EEC (Article 4).\r\nThis
    ETS covers the minimum characteristics considered necessary in\r\norder to provide
    sufficient performance for mobile equipment and to\r\nprevent interference to
    other services or to other users, and to the\r\nPLMNs.\r\nIt does not necessarily
    include all the characteristics which may be\r\nrequired by a user or subscriber,
    nor does it necessarily represent\r\nthe optimum performance achievable.\r\nIt
    applies to the public land mobile radio service in the GSM900 and\r\nDCS1800 systems,
    using constant envelope modulation and operating on\r\nradio frequencies in the
    900 and 1800 MHz bands respectively with a\r\nchannel separation of 200 kHz and
    carrying 8 full rate channels or 16\r\nhalf rate channels per carrier according
    to the TDMA principle.\r\nThis ETS is part of the GSM-series of technical specifications.
    This\r\nETS neither replaces any of the other GSM technical specicications or\r\nGSM
    related ETS, nor is it created to provide full understanding of\r\n(or parts of)
    the GSM900 and DCS1800 systems. This ETS lists the\r\nrequirements, and provides
    the methods of test for testing a MS for\r\nconformance to the GSM standard.\r\nFor
    a full description of the system, reference should be made to all\r\nthe GSM technical
    specifications or GSM related ETSs. Clause 2\r\nprovides a complete list of the
    GSM technical specifications, GSM\r\nrelated ETSs, and ETRs, on which this conformance
    test specifications\r\nis based.\r\nThis ETS applies to the unit which includes
    the hardware to establish\r\na connection across the radio interface.\r\nIf there
    is a difference between this conformance test ETS, and any\r\nother GSM technical
    specification or GSM related ETS, then the other\r\nGSM technical specification
    or GSM related ETS shall prevail.\r\n "
