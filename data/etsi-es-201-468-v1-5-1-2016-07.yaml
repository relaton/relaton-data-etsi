abstract:
- language: en
  script: Latn
  content: "Changes are addressed in:\r\n-\tReferences: to be updated with the latest
    basic standards\r\n-\tDefinitions: it needs to use the same definition of “public
    network” that is adopted for the EN 300 386\r\n-\tTests methods: Test method for
    surge immunity to be possibly aligned with latest EN 61000-4-5\r\n-\tRadiated
    immunity: frequency range to be extended up to 6 GHz to cover the immunity requirements
    of radio services in the frequency range 2,7-6 GHz; test levels should be also
    revised to consider close proximity of mobile phones\r\n-\tEFT pulse repetition
    rate on signal ports: 100 kHz frequency to be adopted for xDLS ports"
