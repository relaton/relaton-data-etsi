abstract:
- language: en
  script: Latn
  content: "Identify the spectrum requirements for RFID and SRDs operating in the
    UHF frequency band. A wide variety of applications for RFID are anticipated, such
    as automatic article identification, asset tracking, airline baggage handling,
    management of logistics, security and alarm systems, waste management, proximity
    sensors, anti-theft systems, location systems, data transfer to handheld devices
    and wireless control systems. The development of devices based on ultra high frequency
    (UHF) RFID in the EC will contribute to development of the information society
    and to the promotion of innovation.\r\nSimilarly the rapid expansion of the market
    for SRDs at UHF necessitates the designation of additional spectrum  \r\nPart
    2: (UHF) RFID and SRDs  - Additional spectrum requirement. \r\nThe documents will
    be created jointly by ERM TG 34 and TG28\r\n"
