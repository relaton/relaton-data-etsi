abstract:
- language: en
  script: Latn
  content: "The scope for ETSI SPAN-NM/DTS-00012 is to come up with a Technical Specification
    for Identification of Telecommunication Equipment. The TS is focused on both vendors
    and operators needs when exchanging information and/or internally in their processes
    if implemented. Information needs to be divided into required equipment identification
    and additional information (for example in the installation guide).\r\n\r\nWorking
    activities will follow:\r\n\r\n·Step 1. Define the concept and usage of “Identification
    of Telecommunication Equipment”\r\n·Step 2. Collect what are “needed information”
    from vendors and operators (December 02)\r\n·Step 3. Define what information to
    be mandatory/optional based on step 2\r\n·Step 4. Create a technical report based
    on step 1-3 (March-April 03)\r\n"
