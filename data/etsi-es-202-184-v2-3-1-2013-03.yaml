abstract:
- language: en
  script: Latn
  content: A review of the previous publication has identified a small number of errata,
    spelling or missing terms. With the publication of DTG D-Book 7 part A v2 a small
    number of corrigenda have been identified that will improve the comprehension
    of the specification which we propose to apply. DTG D-Book 7 part B includes a
    specification for signalling MHEG via AIT tables and launching applications in
    other presentation systems within a device. We propose these as additional specifications
    to promote co-existence of MHEG with other Connected TV APIs such as HbbTV, along
    with an ETSI published MIME type for MHEG.
