abstract:
- language: en
  script: Latn
  content: "TSG-T WG1/RF: The present document contains definitions of reference conditions
    and test signals, default parameters, reference Radio Bearer configurations, common
    requirements for test equipment and generic set-up procedures for use in UE conformance
    tests.\r\nThe content of this specification is directly related to common contents
    in RF and Signalling tests in [1] TS 34.123-1, [2] TS 34.121, [3] TS 34.122, [4]
    TS 34.124, [5] TS 34.109.\r\n\r\nPurpose\r\nIn general, test cases for signalling
    [1], RF [2][3] and EMC [4] conformance require the UE to be in a well defined
    state prior to executing the test sequence.\r\nThere are a large number of test
    cases, and a much smaller number of starting states, with many test cases starting
    from identical, or similar, states.\r\nBecause of the commonality between starting
    states and other initial and environmental parameters for executing the test cases,
    it is desirable to maintain these items in a single, common, specification that
    can be reference by test cases in [1], [2], [3] and [4].\r\n\r\nSupporting organisations:
    ANRITSU Ltd., Ericsson, Anite Telecoms, Sony.\r\n"
