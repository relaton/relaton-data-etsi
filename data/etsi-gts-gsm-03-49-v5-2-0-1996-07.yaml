abstract:
- language: en
  script: Latn
  content: "No mandatory protocol between the Cell Broadcast Centre (CBC) and the\r\nBase
    Station Controller (BSC) is specified by GSM; this is a matter of\r\nagreement
    between CBC and PLMN operators.\r\nThis report specifies three alternative approaches
    to the\r\nspecification of protocol stacks of communication protocols for the\r\npurpose
    of fulfilling the service requirements of the primitives\r\nspecified for the
    CBC - BSC interface in GSM 03.41.\r\nOne approach is based upon the use of the
    complete OSI reference model\r\n(see X.200), another approach is based upon the
    use of only the lower\r\n3 OSI layers, and another approach is based upon the
    use of CCITT\r\nSignalling System No. 7 (see Q.700).\r\nSpecifications are based
    upon individual contributions. Any judgement\r\nconcerning functionality, completeness
    and advantages/disadvantages of\r\nimplementation is intentionally omitted.\r\n "
