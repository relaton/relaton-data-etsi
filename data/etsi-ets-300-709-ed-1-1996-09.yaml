abstract:
- language: en
  script: Latn
  content: "The current ETS 300 382 can be used by dedicated videotex terminals\r\nand
    by PCs (Personal Computers). In order to make use of all\r\npossibilities of PCs,
    such as local storage, processing and GUIs\r\n(Graphical User Interfaces), ETS
    300 382 will be extended. The aim is\r\nthat all extensions should be upwards
    compatible. However, it is clear\r\nthat some functionalities are specific to
    PC based terminals. The\r\ncurent 7 bit coding needs to be extended to fulfill
    the functional\r\nrequirements identified hereafter (bit maps, sound etc...).
    An\r\nenhanced coding (for 8 bit coding environments, possibly for 7 bit\r\nenvironments)
    providing compatibility with the existing one (upwards\r\ncompatible profile mechanism,
    selection of an enhanced coding via 7\r\nbit command,..) will be developed. Proposals
    for the extensions are\r\nalready given in ETS 300 382, Annex B and TD51 (TE1
    Chur (CH)). These\r\ninclude: Text attributes, bitmaps, other contents of the
    PC world, NDC\r\ndimensioning (further discussion necessary), local action management,\r\nlocal
    storage object, in text attributes, text box, operative object,\r\nset of object
    concepts.\r\n "
