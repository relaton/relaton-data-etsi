abstract:
- language: en
  script: Latn
  content: Add improvements to SDSL taking into account deployment experience (for
    example possible interoperability problems). Fold the already existing stydy points
    identified for the potential revisions of part 1 and part 2, which are not covered
    by work item RTS/TM-06018, into this new work item. Determine the coordination
    level with ITU regarding the provision of input to ITU and the relation between
    the ETSI SDSL document and the ITU G.shdsl document.
