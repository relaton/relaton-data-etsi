abstract:
- language: en
  script: Latn
  content: "This document outlines the working methods [to be] used by the 3GPP Technical
    Specification Groups and their sub-groups and by the 3GPP Support Team in relation
    to document management, i.e. handling of specifications, updating procedures,
    change request procedures, version control mechanisms, specifications status information
    etc. It complements the rules and procedures defined for 3GPP. This document does
    not stipulate the details of the internal working of the TSG sub-groups. From
    the Technical Specification Group point of view, a task and responsibility is
    given to a Working Group (WG) directly answering to the Technical Specification
    Group. In practice, the work/task may be carried out in a subgroup of that WG.\r\n"
