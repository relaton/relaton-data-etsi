abstract:
- language: en
  script: Latn
  content: "Specification of the procedures and features for the realisation of session
    Transfer in a TISPAN NGN environment, that enables the transfer of a whole session
    or certain media of that session from a Sip Endpoints, and the retrieval of the
    session/media to the original Sip Endpoints.\r\nThe session Transfer procedures
    shall be extended by a mechanism which can handle REFER requests for not REFER
    compatible SIP Endpoints."
