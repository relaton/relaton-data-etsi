abstract:
- language: en
  script: Latn
  content: "1)\tProfiles of qualified certificates for electronic seals and web sites
    for payment service providers meeting the requirements of [see ref below] for
    providing evidence with legal assumption of a transaction, identification and
    authentication of the communicating parties and securing communications.  Communicating
    parties may be Payment Initiation Service Provides, Account Information Service
    Providers, Payment Instrument Issuer Payment Service Provider and Account Servicing
    Payment Service Provider.\r\nThese profiles will be based on :\r\nETSI EN 319
    412-1 V1.1.1 (2016-02)\r\nETSI EN 319 412-3 V1.1.1 (2016-02)\r\nETSI EN 319 412-4
    V1.1.1 (2016-02)\r\nETSI EN 319 412-5 V2.2.0 (2017-08)\r\n\r\n2)\tExtended TSP
    policy requirements for management (including verification and revocation) of
    additional certificate attributes as required by above profiles.\r\nThese policy
    requirements will extend the requirements in:\r\nETSI EN 319 411-1 and EN 319
    411-2.\r\n\r\n(Ref: Commission intention to amend the draft regulatory technical
    standards\r\non strong customer authentication and common and secure open\r\nstandards
    of communication submitted by the EBA in accordance with\r\nArticle 98(4) PSD2)\r\n"
