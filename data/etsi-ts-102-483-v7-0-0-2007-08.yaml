abstract:
- language: en
  script: Latn
  content: "WID approved during SCP#23\r\n\r\ndocument number of approved WID SCP-050453\r\n\r\nThis
    work item will investigate the technical issues related to providing Internet
    connectivity to the UICC over NUT Interface and deliver  a Technical Specification
    (TS)  defining technical solutions in at least the following areas:\r\n·Higher
    level protocols needed by UICC internet applications over NUT Interface\r\n·Addressability
    of card over IP network and in the terminal\r\n·Sharing terminal network connections
    with the UICC\r\n·Internet name resolution\r\nThis work item will not address
    specific applications but only connectivity solutions."
