abstract:
- language: en
  script: Latn
  content: "04.08 version 5.5.0 created at SMG#21 as a result of:\r\nChanges of CC
    parts for HSCSD;\r\nIndication of Multislot class;\r\ncompression bit in BC-IE;\r\nDifferentiation
    of sequence numbering on a PD basis;\r\nUCS2 alphabet support indication in the
    classmark;\r\nCondition Holding for T3212;\r\nV.120;\r\nClarification on MM connection
    establishment;\r\nHandling of multiple frequency redefinitions;\r\nReserved values
    in IMM Assignment message;\r\nSI6;\r\nMM info;\r\nIntroduction of R band in classmark
    handling;\r\nOption reduction for VGCS/VBS cell selection;\r\nSupport of 14.4
    kbit/s (Radio interface related);\r\neditorial revisons.\r\nversion 5.6.0\r\nSUBJECT\r\nDeletion
    of Notification Type 2\r\nClarification of the usage of Priority level IE\r\nCorrection
    of Channel mode modify acknowledge message description\r\nASCI MS never knows
    the Group call area\r\nHandling of classmark information at band change\r\nInterpretation
    of Bearer Capability by an old network\r\nInconsistency between v5.5 and 4.17\r\nDeletion
    of code points for 7.2 service\r\nCoding of classmark information for multiband
    mobiles\r\n  "
