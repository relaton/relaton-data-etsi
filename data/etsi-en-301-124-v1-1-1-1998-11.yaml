abstract:
- language: en
  script: Latn
  content: "The scope of this work item covers the following point-to-multipoint\r\n(P-MP)
    applications: Voice, fax, voiceband data, Telex, Data up to 8\r\nMbit/s, ISDN.
    \r\nThe main field of application of P-MP systems is to provide access to\r\nboth
    public and private networks, particulary for remote subscribers.\r\nBy means of
    P-MP systems the network service area may be extended to\r\ncover both distant
    and scattered subscriber locations.\r\n Subscribers to be offered a full range
    of services by the\r\npublic/private network and to have access via various standard\r\ninterfaces
    (2 wire loop, ISDN,....).\r\n The frequency bands above 3GHz are particularly
    suitable for the\r\nextension of telecomms. services to rural and suburban subscribers.\r\nP-MP
    systems provide standard network interfaces and transparently\r\nconnect subscribers
    to the appropriate network node. These systems\r\nallow a service to be connected
    to a number of subscribers ranging\r\nfrom a few users to several hundred and
    over a range of distances.\r\n P-MP systems are generally, but not necessarily,
    configures as\r\npre-assigned systems or as Demand Assigned Multiple Access (DAMA)\r\nradio
    systems.\r\n The essential features of a typical P-MP DAMA radio system are:\r\n-
    \  efficient use of the radio spectrum;\r\n-   concentration;\r\n-   transparency.\r\n
    Radio is often the ideal way of obtaining communications at low cost\r\nand almost
    independent of distance and difficult topography. Moreover\r\na small number of
    sites are required for these installations thus\r\nfacillitating rapid implementation
    and minimising maintenance\r\nrequirements of the systems.\r\n Concentation means
    that m subscribers can share n radio channels (M\r\nbeing > n) allowing a better
    use to be made of the available\r\nfrequency spectrum and at a lower equipment
    cost. The term\r\n\"multi-access\" derives from the fact that every subscriber
    has access\r\nto every channel (instead of a fixed assignment as in most multiplex\r\nsystems).
    When a call is terminated the channel is released for\r\nanother call. Concentration
    requires the use of distributed\r\nintelligent control which in turn allows many
    other operation and\r\nmaintenance functions to be added.\r\n Transparency means
    that the exchange and the telephone communicate\r\nwith each other without being
    aware of the radio link.\r\n"
