abstract:
- language: en
  script: Latn
  content: "Write a thermal management standard for outdoor enclosure defined in EN
    301 169-1, \r\nThe idea is, that depending on the cooling solution adopted, to
    define:\r\nCooling capacitance for cabinets depending on cabinet dimension\r\nCabinet
    dissipation class\r\nMaximum acceptable Delta T between ambient temperature and
    inside temperature\r\nPreferable air flow\r\nOn this way will be more easy define
    the responsability of equipment manufactures, cabinet manufactures and integrators.\r\n"
