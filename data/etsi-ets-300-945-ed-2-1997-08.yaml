abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) defines the rate adapta\r\ntion
    functions to be used in GSM PLMN Mobile Stations (MS)s for adapti\r\nng terminal
    interface data rates to the Mobile Station - Base Station\r\nSystem (MS-BSS) interface
    data rates in accordance with GSM 03.10 [2].\r\nThe provision of these functions
    will depend on the services a particu\r\nlar station is designed to support.\r\nNOTE:\tThis
    ETS should be considered together with GSM 08.20 [9] (Rate\r\nAdaptation on the
    BSS-MSC Interface) to give a complete description of\r\nPLMN rate adaptation.\r\n"
