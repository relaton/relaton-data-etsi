abstract:
- language: en
  script: Latn
  content: "The reference point Ve-Vnfm described as part of the NFV architecture
    framework in GS NFV002 is actually further split in the informative GS NFV MAN001
    \ in two reference points – one between the VNF Manager and a VNF (Ve-Vnfm-vnf)
    and one between the VNF Manager and an EM associated with that VNF (Ve-Vnfm-em);
    these reference points are mainly used for the lifecycle management of that VNF.
    \ The scope of the Work Item will include the functional and information requirements
    of all VNF management interfaces over the reference points between the VNFM and
    theVNF/EM, based on which complete interfaces technical specifications can subsequently
    be defined, for interoperability purposes..  The results of the work item will
    include: • Detailed description of interfaces and its operations functionality.
    • Detailed information model requirements of related VNF lifecycle management
    interfaces, for: – Lifecycle management of VNFs, including the instantiation,
    modification, update, scaling, healing and termination of VNFs. – Lifecycle change
    notifications of VNFs. • Detailed information model requirements of other related
    generic VNF management interfaces, for: – VNF fault management. – VNF performance
    management. – VNF configuration • Detailed information model requirements of any
    other generic VNF management interfaces (new and/or previously described in GS
    NFV MAN 001) needed to be exposed between  in support of VNF/EM and VNFM, in support
    of necessary VNF-related management operations. • Validation of interface operations
    and information model requirements against end-to-end flows. Data models/schemas
    and protocols needed to implement the detailed functional requirements are not
    covered in this deliverable. The WI will leverage  GS NFV MAN001 and will consider
    any applicable other guidelines, studies and requirements as appropriate, in close
    collaboration with the other organizations working on these aspects, such as 3GPP
    SA5 and TMF. The deliverable will contain normative provisions.\r\n\r\n"
