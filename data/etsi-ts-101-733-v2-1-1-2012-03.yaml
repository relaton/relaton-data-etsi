abstract:
- language: en
  script: Latn
  content: "-\tSTF 426 (CAdES Baseline Profile) raised issues regarding the requirement
    to indicate the type of the signed document using MIME types. A revision of TS
    101 733 v1.8.3 may be needed to support this requirement.\r\n-\tAnnex B (Extended
    Forms of Electronic Signatures, informative) needs clarification to allow building
    CAdES-A without including certificate and revocation references. This issue raised
    from previous CAdES plugtests and may as well impact the long term profiles in
    STF 426.\r\n-\tDuring the last CAdES Remote Plugtest (October 2010), it appeared
    that there is a certain range of interpretation between annex K (informative)
    and section 6.4.1 (normative) for the archive time-stamp digest calculation. This
    led to significant interoperability issues. A possible solution is to clarify
    the tables in annex K to be aligned with the information in section 6.4.1.\r\n"
