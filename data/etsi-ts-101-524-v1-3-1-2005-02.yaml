abstract:
- language: en
  script: Latn
  content: "Extension of existing single-pair and two-pair SDSL systems to multiple
    pairs. this work should answer the following questions:\r\n1. What are the user
    requirements? These should include total nit-rates, reach, latency etc.\r\n2.
    What are the limits on the number of pairs to be used.\r\n3. What scheme(s) should
    be used for combining the data on the pairs?\r\n4. Are new noise models required?
    If so, what are they?\r\n5. Are new test methods required? If so, what are they?\r\n6.
    Should the bit rates per pair be equal?\r\n7. Should there be a mechanism for
    dynamically adapting the scheme to cater for changing\r\n    channel"
