abstract:
- language: en
  script: Latn
  content: "This revision of NFV-SOL 009 propagates the deliverable into NFV Release
    4. This edition will add protocol and data models to support the Release 4 features,
    and it will extend the scope of the former Release 3 edition summarized hereafter:\r\n\r\nNFV-SOL
    009 specifies a set of RESTful protocols and data models fulfilling the requirements
    specified in ETSI GS NFV-IFA 031 for the interfaces that enable the management
    of NFV-MANO functional entities."
