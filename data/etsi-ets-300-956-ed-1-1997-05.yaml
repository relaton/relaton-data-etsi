abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) specifies the procedure\r\ns
    used at the radio interface (reference point Um as defined in GSM 04\r\n.02) for
    normal operation, registration, erasure, activation, deactiva\r\ntion, invocation
    and interrogation of call offering supplementary serv\r\nices. Provision and withdrawal
    of supplementary services is an adminis\r\ntrative matter between the mobile subscriber
    and the service provider\r\nand cause no signalling on the radio interface.\r\nIn
    GSM 04.10 the general aspects of the specification of supplementary\r\nservices
    at the layer 3 radio interface are given.\r\nGSM 04.80 specifies the formats and
    coding for the supplementary servi\r\nces.\r\nDefinitions and descriptions of
    supplementary services are given in GS\r\nM 02.04, GSM 02.8x and 02.9x-series.\r\nTechnical
    realization of supplementary services is described in GSM 03\r\n.11, GSM 03.8x
    and 03.9x-series.\r\nThe procedures for Call Control, Mobility Management and
    Radio Resourc\r\ne management at the layer 3 radio interface are defined in GSM
    04.07 a\r\nnd GSM 04.08.\r\nThe following supplementary services belong to the
    call restriction su\r\npplementary services and are described in this ETS:\r\n-\tBarring
    of outgoing calls\t\t(clause 1):\r\n-\tBarring of all outgoing calls\t(BAOC)\t(Barring
    program 1);\r\n-\tBarring of outgoing international calls\t(BOIC)\t(Barring program
    2);\r\n-\tBarring of outgoing international calls EXCEPT those directed to the\r\nhome
    PLMN country\r\n\t\t(BOIC-exHC)\t(Barring program 3).\r\n-\tBarring of incoming
    calls\t\t(clause 2):\r\n-\tBarring of all incoming calls\t(BAIC)\t(Barring program
    1);\r\n-\tBarring of incoming calls when roaming outside the home PLMN country\r\n\t\t(BIC-Roam)\t(Barring
    program 2).\r\n"
