abstract:
- language: en
  script: Latn
  content: The purpose of this Group Report is to explain with examples the usage
    of NGSI-LD  information model and API, as defined in GS-004 prelimAPI, and considering
    also some use cases from GR-002  for ICT professionals. Worked examples are provided,
    with code fragments made available in a public repository. No changes in the GS-004
    prelimAPI specification can be introduced or proposed in this document.
