abstract:
- language: en
  script: Latn
  content: "Addition of new features, including:\r\n- Support for the new image_icon_descriptor
    has been provided in the Related Content Table to allow broadcasters to alert
    viewers using a custom icon;\r\n- A metadata_service_identifier has been introduced
    to allow receivers to identify identical metadata services or subsets;\r\n- The
    BroadcastEvent fragment is now supported to allow the promotion of individual
    programmes outside the continuous schedule period;\r\n- IP-based and on-demand
    content is now fully supported in the content referencing information.\r\n\r\nAnd
    the following fixes:\r\n- The ControlledTermCodec has been extended to support
    future extensibility;\r\n- The HowRelated field in the Related Content Table has
    been amended to support future extensibility. Extension harmonised with upcoming
    TV-Anytime revision;\r\n- The DVB locator syntax for timed events has been clarified;\r\n-
    Explicit signalling of event completion has been added to the TVA_id descriptor.\r\n"
