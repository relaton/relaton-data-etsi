abstract:
- language: en
  script: Latn
  content: "The scope of this WI is restricted to the methodology for defining scenarios
    and quantifying the performance of equipment within such a scenario. All judgement
    on what performance is acceptable or not, is beyond the scope of the present work
    item. the same applies for how realistic the example scenarios are.\r\nThe objectives
    for the present work item is to provide the technical means for evaluating the
    performance from achosen scenario, such as calculations and measurements. This
    includes:\r\n- the definition of performance properties of equipment, e.g. being
    compliant to\r\n  international product standards from ETSI, ITU, ANSI or any
    other other equipment\r\n  of interest, such as in Part 1 (TS 101 830-1)\r\n-
    Examples that help people to apply this methodology, such as examples on how\r\n
    \ to define the configuration and the conditions of a scenario in an unambiguous
    way.\r\n  The distinction is that a configuration can be contolled by access rules
    (e.g.\r\n   technology mix, cable fill) while the conditions cannot (e.g. cable
    properties).\r\nThese objectives enable a consistent presentation of reproducable
    tests results, while studying the impact of changing various spectral management
    parameters. Another possible application is a clear methodology for evaluating
    spectral compatibility between equipment (existing as well as newly defined)."
