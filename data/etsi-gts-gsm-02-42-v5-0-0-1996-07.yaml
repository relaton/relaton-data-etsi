abstract:
- language: en
  script: Latn
  content: "This GSM specification describes the feature Network Identity and\r\nTimezone
    (NITZ).\r\nThe feature provides the means for serving PLMNs to transfer current\r\nidentity
    and the local timezone to mobile stations, and for the mobile\r\nstations to store
    and use this information.  This enhances roaming by\r\npermitting accurate indication
    of PLMN identities that are either\r\nnewer than the ME or have changed their
    name since the ME was sold.\r\nAdditionally timezone information can be utilized
    by MEs as desired.\r\n "
