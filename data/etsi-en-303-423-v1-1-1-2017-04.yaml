abstract:
- language: en
  script: Latn
  content: "This standard will cover networked products (as defined by Regulation
    801/2013) and will reference network standards defined elsewhere.\r\nThe method
    used for measuring power consumed from the a.c. mains supply will make reference
    to the standard developed for the original EU Standby Regulation, 1275/2008, i.e.
    CENELEC EN 50564:2011 and to the ETSI standard EN 301 575.\r\nNote 2: Electrical
    and electronic household and office equipment placed on the market with an external
    low voltage power supply is excluded (see EU regulation 278/2009).\r\n\r\nEU Regulation
    1275/2008 has been amended by EU Regulation 801/2013; the resulting new Regulation
    also has power limits that need to be met, but adds a requirement that these limits
    need to be complied with when the equipment under test is connected to a network,
    either wired or wireless. Therefore it is necessary to produce the HS which specifies
    appropriate network configurations, which is the purpose of the standard to which
    this new work item relates.\r\n\r\nThis work item is prepared in co-operation
    with TC ATTM, TC Cable, TC DECT, TC PLT. Furthermore this work item is also co-ordinated
    with CENELEC more specifically JWG 100X/59X."
