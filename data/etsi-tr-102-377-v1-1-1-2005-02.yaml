abstract:
- language: en
  script: Latn
  content: This document is supplementary to the earlier document ETSI TR 101 190
    “Implementation guidelines for DVB terrestrial services; Transmission aspects”.
    This document extends the scope of the implementation guidelines to include  handheld
    reception as defined by ETSI EN 302 304 “Transmission System for Handheld Terminals
    (DVB-H)”. Many of the items specified in ETSI TR 101 190 are not reproduced in
    this document, as they are already available, even though they may be relevant
    to the implementation of a DVB-H network
