abstract:
- language: en
  script: Latn
  content: "This document specifies access requirements that service providers have
    in delivering telephony services over one or more operator's networks.\r\nScope
    of deliverables: Identify reference points from the network architecture framework;
    Generic functional requirements/capabilities (including information flows); Aspect
    of service provider access (ref. ETR 244 section 5.33);  Behaviour constraints:
    e.g. network integrity.\r\nLiaison: take input from NA8; liaise output to TC SPS;
    liaison with TC SMG, ECTRA TRIS and EIF; liaison on work planning to TCs SPS and
    NA\r\nReference documents: ETR 244, ETR 339, DES/NA-061205, DES/NA-061206\r\n"
