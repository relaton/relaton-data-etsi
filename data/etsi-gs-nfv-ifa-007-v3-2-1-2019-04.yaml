abstract:
- language: en
  script: Latn
  content: "This revision of  NFV-IFA 007 continues the development of the specification
    as part of the NFV Release 3. \r\nThis edition will add requirements and specification
    of interfaces and associated information model to support the Release 3 features,
    and it will extend the scope of the former Release 2 edition summarized hereafter:\r\n\r\nThe
    scope of the Work Item will include the complete functional requirements for interfaces
    on the Or-Vnfm reference point between the VNFM and the NFVO, to address the functions
    specified in GS NFV MAN 001.\r\nThe results of the work item will include:\r\n1)
    Detailed description of interfaces and its operations functionality.\r\n2) Information
    flows and information elements of:\r\na) VNF lifecycle management interfaces,
    for:\r\ni) Lifecycle management of VNFs, including the instantiation, modification,
    update, scaling and termination of VNFs.\r\nii) Lifecycle change notifications
    of VNFs.\r\nb) VNF orchestration interfaces, for:\r\ni) Lifecycle operation and
    resource granting.\r\nc) Other related VNF management interfaces, for:\r\ni) VNF
    fault information retrieval and management.\r\nii) VNF performance information
    retrieval and management.\r\niii) VNF package management.\r\niv) Policy management.\r\nThe
    resulting deliverable will contain normative provisions.\r\n\r\nThis revision
    of NFV-IFA 007 will address the Release 3 candidate features listed in Annex B
    of the Release 3 Definition (v0.10.0). Where needed, it will continue the previous
    version to enhance and complete the specified Release 3 features.\r\nThis revision
    will reflect the maintenance performed to NFV Release 2 documentation and of already
    specified Release 3 features."
