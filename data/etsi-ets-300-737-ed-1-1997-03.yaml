abstract:
- language: en
  script: Latn
  content: "When 64 kbit/s traffic channels are used on the Abis interface the\r\nspeech
    shall be coded according to CCITT Recommendation G.711 and the\r\ndata rate adaption
    shall be as specified in GSM 04.21 and GSM 08.20.\r\nIn the case where 16 kbit/s
    traffic channels are used for full rate\r\nspeech or Enhanced Full Rate speech
    or full rate data service, then\r\nthis specification shall apply for frame structure
    and for control of\r\nremote transcoders and additional rate adaptors.\r\nThe
    use and general aspects of the Abis interface are given in GSM\r\n08.51.\r\nNOTE:\tThis
    specification should be considered together with the GSM\r\n06 series of specifications,GSM
    04.21 (Rate Adaption on the MS-BSS\r\nInterface) and GSM 08.20 (Rate Adaption
    on the BS/MSC Interface).\r\n  "
