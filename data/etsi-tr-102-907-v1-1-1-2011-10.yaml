abstract:
- language: en
  script: Latn
  content: "The scope of this work item is to provide a Technical Report describing
    on how radio networks can operate, on a secondary basis, in frequency bands assigned/licensed
    to one (or several) primary users(s),\r\nIn particular, the work item will investigate
    the following topics: \r\n·Operation of Cognitive Radio Systems in UHF White Space
    Frequency bands\r\n·Methods for protecting the primary/incumbent users (TV broadcasts,
    wireless microphone transmissions)\r\nSystem Requirements and Use Cases (including
    but not limited to the situation in Europe)"
