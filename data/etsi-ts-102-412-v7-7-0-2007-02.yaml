abstract:
- language: en
  script: Latn
  content: "R7 requirements will introduce a new UICC-Terminal interface which is
    able to exchange large amount of data between the terminal and the UICC. This
    feature associated with the requirements on the introduction of high density memory
    will make that R7 UICC is ready to manage new types of data, such as multimedia,
    configuration data, web pages. This kind of data (regarding volume and diversity)
    might not be appropriately managed using traditional elementary files or BER-TLV
    files. In addition the identification of such files (e.g. EF 3F21) is not suitable
    with multimedia services. Within the scope of this WI, the security mechanisms
    related to applications and file systems over the NUT interface may be re-evaluated.
    \r\nThe WI will produce CRs containing use cases and requirements related to the
    management of these data, covering the following aspects :\r\n\r\n- Storage of
    these data (format, extension, naming/label)\r\n- Security for these data (access
    rights, user profile, identification and authentication of requester)\r\n- Access
    to these data (direct access or through dedicated application such as ftp server
    residing in UICC)\r\n- Development of interoperable services based on the use
    of these data (API)\r\nThe result of this work could enhance support for existing
    work owned by other standardisation body (e.g.: 3GPP and 3GPP2). It should not
    adversely affect any mechanism already in place (e.g. 3GPP Phone Book).\r\nThe
    aim of this work item is to define use cases and requirements related to the migration
    of remote management in accordance with the new capability of the card, i.e. IP.
    \r\nThe following area under ETSI SCP scope shall be analyzed : \r\n·Commands
    for remote management: the definition of the secured packed structure mechanisms
    should be reviewed, considering new protocols.\r\n·Security model: current remote
    management relies partly on Global Platform specifications. SCP REQ should re-assess,
    and if necessary, re-define the security needs. \r\nThis WI should also take into
    account the backward compatibility constraint, such as management of applications
    and data defined in previous releases. \r\nThis WI is targeting Rel-8 timescale."
