abstract:
- language: en
  script: Latn
  content: 'This work item provides requirements for implementing Human-to-Human Online
    Preventative Security, which complements TR 104 137 ''Human-to-Human Online Preventative
    Security''. The principles included in this work item are: secure by design, safety
    by design, and privacy by design. These are supported by annexes covering balancing
    the different requirements for Human-to-Human Online Preventative Security, demography,
    education and digital literacy.  '
