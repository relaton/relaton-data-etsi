abstract:
- language: en
  script: Latn
  content: "The present document contains requirements for the output of the AC power
    supply feeding interface\tand the input of the telecommunications and datacom
    (ICT) equipment connected to AC interface. The AC interface in single phase and
    three phase AC is defined in narrow and wide voltage range categories to comply
    with nominal European AC voltages and worldwide nominal AC voltages.\r\nThe area
    of application covers telecommunication centers, Radio Base Stations, datacenters
    and customer premises to facilitate interworking of different types of loads and
    power supply of different origins and generations.\r\nGeneral requirements for
    safety and EMC are out of the scope of the present document series unless specific
    requirement not defined in existing safety or EMC standards.\r\nThe document was
    started as REN0257 (EN 300 132-3-2) "
