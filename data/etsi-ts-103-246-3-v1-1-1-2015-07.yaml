  script: Latn
  content: "Define the location system minimum performance requirements, through the
    definition of:\r\n - classification of the location systems function of the selected
    technological enablers\r\n - reference environments applicable to the location
    system specification\r\n - the “key features” potentially  supported by the location
    system\r\n - the applicable minimum performance requirements, function of the
    terminal type, operational environment and key feature considered.\r\n"
