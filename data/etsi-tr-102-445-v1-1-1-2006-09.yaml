abstract:
- language: en
  script: Latn
  content: "Given the critical importance of emergency communications, EMTEL recognises
    the need for and shall establish network requirements that will ensure robust,
    reliable, fault-tolerant, fully available voice and data network components and
    facility transport for emergency communications.\r\nThe work effort will encompass:\r\n•Redundancy
    Concepts\r\n•Diversity Concepts\r\n•Fault-Tolerant Application Concepts\r\n•Default/Alternate
    Routing Concepts\r\n•Catastrophic Failure Prevention and Recovery Concepts\r\nPrimary
    focus will be on those network elements and transport facilities from the end
    office, mobile switching center, or other point of access to the dedicated emergency
    network, through to the Emergency Control Centre.  The scope will also encompass
    the resiliency of mobile radio and/or other forms of emergency communications
    to/from the emergency responding units.\r\nThe effort will address the resiliency
    of emergency communications, the availability of adequate capacity during periods
    of network component/facility failure or periods of high capacity demands due
    to disasters, terrorism or similar events, and expedited restoration during major
    service interruptions.\r\n"
