abstract:
- language: en
  script: Latn
  content: "To produce a new guidance document for the thermal management of racks,
    cabinets and locations.\r\nScope of this guide would be to give the integrator
    a set of solutions for the coexistence of equipment delivered by different suppliers
    in the same facility or ETSI rack.  The possible solutions would be: power limitation
    on a rack; add fan shelves, any other possible solution.\r\nThis guide also defines
    a minimum set of physical parameters needed for the evaluation of the layout and
    the thermal management of the complete room by the integrator.\r\nThe guide should
    examine the relationship between air inlet temperature for sub-racks and ETSI
    ambient temperature standards."
