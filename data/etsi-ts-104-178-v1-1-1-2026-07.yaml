abstract:
- language: en
  script: Latn
  content: This WorkItem specifies the NGSI-LD Information Model, to be used together
    the NGSI-LD API. The NGSI-LD Information Model is conceptually a Property Graph
    model about entities, their properties and relationships to other entities, including
    metadata. It is based on the Linked Data principles. Additional properties and
    relationships extend the base model for supporting cross-domain interoprability.
