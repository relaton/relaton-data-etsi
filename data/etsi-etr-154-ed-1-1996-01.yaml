abstract:
- language: en
  script: Latn
  content: "Implementation guidelines for the use of MPEG-2 systems, Video and\r\nAudio
    in Satellite and Cable application in Europe covering\r\nconventional resolution
    digital television.It will not cover\r\napplications such as terrestrial broadcasting,
    interactive services or\r\nHDTV.\r\nAn ETR is planned as a first step in order
    not to block future\r\ntechnological progress following that, based upon experience,\r\nan
    ETS should finally be produced.\r\n "
