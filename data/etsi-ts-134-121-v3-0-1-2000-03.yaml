abstract:
- language: en
  script: Latn
  content: "TSG-T WG1/RF: The present document specifies the measurement procedures
    for the conformance test of the mobile station that contain transmitting characteristics,
    receiving characteristics and performance requirements in FDD mode.\r\n\r\nAbstract
    of document:\r\nContaining test specifications about\r\n1)Transmitter Characteristics\r\n2)Receiver
    Characteristics\r\n3)Performance Requirements\r\nCore specification for this document:\r\n1)TS
    25.101 UE Radio transmission and Reception (FDD)\r\n2)TS 25.103 RF Parameters
    in Support of Radio Resource Management\r\n\r\nContentious Issues:\r\n1)Core specification
    for RRM is unstable. RAN WG4 decided the replacement of TS 25.103 with TS 25.133(new).
    The scope of TS 25.133 and its impact for TS 34.121 is unclear.\r\n\r\n"
