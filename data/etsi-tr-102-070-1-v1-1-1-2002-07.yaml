abstract:
- language: en
  script: Latn
  content: "This TR will address technical difficulties and set out recommendations
    for the assessment of combined products for compliance to articles 3.1b and 3.2
    of the R&TTE directive 1999/5/EC.\r\nThis part of the TR will provide guidance
    on the application of EMC standards for combined products.\r\nExamples to be covered
    include: multiple transmitters, radio in IT/domestic equipment etc. where there
    may be differences in emissions limits and conformance assessment for immunity.\r\nThe
    recommendations made in this TR may lead to amendment of the EMC standard EN 301
    489-1 (and other parts if necessary)"
