abstract:
- language: en
  script: Latn
  content: "This work will address the following points:\r\n- Give a survey on the
    existing network performance-related IETF standards and how these standards can
    be applied to end-to-end network performance measurements\r\n- Define performance
    metrics in IP networks, referring when possible to existing work done in IETF
    and ITU-T\r\n- Define measurement methods for selected performance metrics in
    IP networks, addressing both active and passive methods. Clarification of Requirements
    and Constraints will be given\r\n"
