  script: Latn
  content: "The TV Anytime Forum has established a multi-part series of specifications,
    together known as \"Phase 1\", which describe features enabling: search, select,
    acquire and rightful use of content on local and/or remote personal storage systems
    from both broadcast and online services.\r\nPart 6 describes Metadata services
    over a bi-directional network."
