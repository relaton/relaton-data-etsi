abstract:
- language: en
  script: Latn
  content: "1) Harmonize output power and frequency tolerances (common values in the
    main body).\r\n2) Remove the obsolete systems (A.1 through E.8) notations in the
    Annexes A to E.\r\n3) Revision and updating of Annex G (Normative) for test report
    requirements of multi-rate and mixed-mode systems.\r\n4) Revision of relevant
    test procedures in section 5 and relationship with EN 301 126-1.\r\n5) Revision
    and updating of Annex I (Informative) for impact of mixed-mode systems on fade
    margin definition.\r\n6) System characteristics for CS 112 MHz in bands ³18 GHz
    (NOTE)\r\n7) Possible change of “hierarchic” bit rates as “nominal” capacity with
    more generic minimum bit rates (NOTE)\r\nNOTE: inclusion of these arguments pending
    suitably agreed contributions\r\n8) Add Spectrum Efficiency Class 7 typically
    corresponding to 1024 QAM.\r\n9) Add system parameters for coordinated use of
    P-P links in the band 71-76/81-86 GHz.\r\n10) System parameters limited to for
    CS = 250, 500, 750, 1000, 1250, 1500, 1750 and 2000 MHz.\r\n11) FDD systems only\r\nNote:
    Additional constraint presently in Annex UC of EN 302 217-3 should still be fulfilled.\r\n12)
    Introduction of class 8 (2048QAM) for 14 <= CS <= 112 MHz and bands from 13 GHz
    to 42 GHz."
