abstract:
- language: en
  script: Latn
  content: "To use key performance indicators defined in the Part 2 for network based
    measurements\r\nThere is a need for standardized performance indicators for network
    based measurements. Other standardization fora, like 3GPP, have started to reference
    the work of ETSI STQ Mobile; but for network based measurements.\r\nThe scope
    of this work item is to:\r\n- Define what KPIs that can be measured with network
    based measurements\r\n- Create a new document describing network based measurements
    (part 7)\r\n- Investigate how different measurement points will deviate in results"
