abstract:
- language: en
  script: Latn
  content: "This TS specifies the Radio Frequency (RF) test methods and conformanc\r\ne
    requirements for GSM 900 and DCS 1800 Base Station Systems (BSS)s. T\r\nhese have
    been derived from, and are consistent with, the core GSM spe\r\ncifications specified
    in the requirements reference subclause of each\r\ntest.\r\nFor each test, two
    conformance requirements are specified:\r\n-\tessential conformance requirements;\r\n-\tcomplete
    conformance requirements.\r\nEssential conformance requirements are those which
    are required:\r\na)\tto ensure compatibility between the radio channels in the
    same cell\r\n;\r\nb)\tto ensure compatibility between cells, both co-ordinated
    and uncoor\r\ndinated;\r\nc)\tto ensure compatibility with existing systems in
    the same or adjace\r\nnt frequency bands;\r\nd)\tto verify the important aspects
    of the transmission quality of the\r\nsystem.\r\nEssential conformance requirements
    are sufficient to verify the perfor\r\nmance of the equipment for radio type approval
    purposes, in countries\r\nwhere this is applicable.\r\nComplete conformance requirements
    may be tested to verify all aspects\r\nof the performance of a BSS. These requirements
    are intended to be use\r\nd by manufacturers and operators to allow conformance
    and acceptance t\r\nesting to be performed in a consistent manner; the tests to
    be perform\r\ned should be agreed between the parties.\r\nIn some tests there
    are separate requirements for micro-BTS and BTS. I\r\nf there is no separate requirement
    for a micro-BTS, the requirements f\r\nor the BTS apply to a micro-BTS.\r\nIn
    this TS, the reference point for RF connections (except for the mea\r\nsurement
    of mean transmitted RF carrier power) is the antenna connecto\r\nr, as defined
    by the manufacturer. This TS does not apply to repeaters\r\nor RF devices which
    may be connected to an antenna connector of a BSS\r\n.\r\n  "
