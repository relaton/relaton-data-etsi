abstract:
- language: en
  script: Latn
  content: "SUBJECT (version 5.4.0 - 5.5.0)\r\nSection 29.3 Testing of non transparent
    data services (RLP tests)\r\nCR to 29.3.2.2.3 and 29.3.2.3.2 Busy condition (RLP
    tests)\r\nCR to 29.3.2.5.2 Retransmission of REJ or SREJ frames (RLP tests)\r\nCR
    to 29.3 Testing of non transparent data services (RLP tests) short version\r\nCR
    to 26.7.4.1 new sub test on SysInfo 2ter and L2 pseudolength\r\nCR to 26.6.8.4
    on ciphering mode/change of mode algorithm and key.\r\nCR to 26.13.1.1.2 HSCSD
    Multislot signalling/RR/Measurement/asymmetric/change of the worst subchannel\r\nCR
    to 26.11.21.1 Multiband signalling expected sequence\r\nDelay of at least 1 sec
    between Channel Release and paging\r\nCR to section 26, addition of R-GSM band
    references \r\nCR to section 26.10 addition of R-GSM signalling tests\r\nCR to
    section 3.2.2 Table 3.1, Applicability of section 26.10and 31.12\r\nNew Section
    31.12 containing five eMLPP tests\r\nAddition of section 18.2Temporary reception
    gaps\r\nAddition of section 13.7 Transmitter output power and burst timing in
    multislot configuration\r\nCR to section 21.5 Received signal measurements test
    ( HSCSD)\r\nCR to section 14.9 Paging performance at high input levels\r\nSection
    14, Table 14-3 editorial modification \r\nSection 14, Table 14-5 editorial modification\r\nSection
    27.20 Timing of call termination on removal of SIM\r\n\r\n\r\n"
