abstract:
- language: en
  script: Latn
  content: "This specification contains a stage 1 like description of the interception
    information in relation to the process of sending and receiving asynchronous messages.
    The present document also contains a stage 2 like description of when Intercept
    Related Information (IRI) and Content of Communication (CC) need to be sent, and
    what information it needs to contain.\r\nThis revision is to make a correction
    to the scope."
