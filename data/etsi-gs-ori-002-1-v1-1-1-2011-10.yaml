  script: Latn
  content: "The specification aims to define low layer protocol aspects and interface
    baseline configuration of the Open Radio equipment Interface (ORI) for Release
    1.\r\nLower layer protocol aspects are those expected to be hardware related such
    as radio technologies, topology and link configuration, link set-up, layer 1 characteristics
    and frame structure and IQ data format.\r\n\r\n"
