abstract:
- language: en
  script: Latn
  content: "This document specifies procdures for creation and validation of an Advanced
    Electronic Signature within a given policy context. This document specifies support
    for validation fo XAdES (XML Advanced Electronic Signature), CAdES (CMS Advanced
    Electronic Signature) and PAdES (PDF Advanced Electronic Signature) signatures
    taking into account usage of Trusted Lists.\r\n\r\nThis EN will evolve ETSI TS
    102 853: \"Signature verification procedures and policies\" regarding the signature
    validation and will incorporate requirements for signature creation procedures.
    \r\n\r\nDeliverable: Draft EN for approval by TC ESI before to start EN approval
    procedure"
