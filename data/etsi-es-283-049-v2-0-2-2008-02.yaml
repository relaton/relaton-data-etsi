abstract:
- language: en
  script: Latn
  content: "This revision of the document will endorse 3GPP TS 29.332 Rel-7 on Media
    Gateway Control Function (MGCF) - IM Media Gateway; Mn Interface with possible
    changes. Compatibility with ES 283 024 Release 1 will be ensured.\r\nFurthermore
    small ambiguities between 3GPP TS 29.332 and ETSI ES 283 024 shall be harmonized.
    Also the effects of new requirements that will be produced in TISPAN Release 2
    will be included in the revision. Also capabilities to interoperate with 3GPP
    CS video calls will be endorsed when defined in 3GPP."
