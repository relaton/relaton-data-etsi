abstract:
- language: en
  script: Latn
  content: "Produce as an ES the associated conformance test specifications for the
    API for Open Service Access (OSA) control protocol defined in ES 201 915 Parts
    1 to 12.\r\nThe work content is the following:\r\ni) protocol conformance implementation
    statements based on the service properties defined;\r\nii) test configurations
    for both the application and service capability (gateway) side;\r\niii) test purposes
    in the form of sequence diagrams detailing the test scripts to be provided;\r\niv)
    test suite structure (including valid and invalid behaviou)."
