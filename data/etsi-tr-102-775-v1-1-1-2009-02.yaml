abstract:
- language: en
  script: Latn
  content: "This document defines the quality parameters that need to be considered
    at the interconnection of Voice over IP (VoIP) services and provides provisional
    objectives for these parameters. There is an urgent need in the industry for VoIP
    interconnect quality parameters and related objectives. Since further work is
    underway in this area, it is intended to update this document in accord with feedback
    of experience from the industry.\r\nThis document is intended to form a part of
    STQ's roadmap with respect to Quality aspects of TISPAN NGN.\r\n"
