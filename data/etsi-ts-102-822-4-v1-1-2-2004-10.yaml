abstract:
- language: en
  script: Latn
  content: "RFC2396, the IETF specification for URI, is currently being revised for
    the sake of streamlining the current URI syntax. Once revision work is completed,
    the current URI RFC will become obsolete and according to IETF rules all specifications
    should not refer to an obsolete RFC. The purpose of this corrigendum is to modify
    the URI-based definition of the CRID in ETSI TS 102 822-4 to conform to the new
    URI specification. \r\n"
