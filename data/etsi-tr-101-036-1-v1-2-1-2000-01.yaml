abstract:
- language: en
  script: Latn
  content: "Revision of TR 101 036-1.\r\nTo provide further guidance for the generation
    of spectrum masks for TM4 DRRS standards. This will take the form of an annex
    to the existing TR. \r\nTo include an equipment class definition which effectively
    removes the direct link which currently exists between modulation level and equipment
    class. To amend the current text for EMC and spurious emissions. Revision of 5.3.6
    - Spectral lines at the symbol rate."
