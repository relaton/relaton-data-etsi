abstract:
- language: en
  script: Latn
  content: "This ETSI Specification defines an Interface Description Language (IDL)
    specification for a set of APIs from the SCF/Gateway function to 3rd Party Service
    Application Interface utilising Object oriented techniques, namely UML.  It is
    based upon a set of Interface Class descriptions in UML provided by NA6.  The
    specification aims to provide a suitable generic solution to the ETSI Service
    Provider Access requirements (SPAR).  The specification will be provided in two
    parts.  Part 1 providing the Generic IDL and the Part 2 providing a mapping between
    existing INAP operations and IDL to ensure, for example, that existing IN service
    Call Control capabilities are catered for on the 3rd party service application
    interface.  As the specification evolves there will be a need to ensure that any
    new service capabilities provided on the 3rd party service application interface
    are reflected over the IN interfaces.  (See second page for architecture and further
    clarification). This Part 1 defines the Interface Description Language (IDL) specification
    for a set of APIs from the SCF/Gateway function to 3rd Party Service Application
    Interface.\r\n\r\n"
