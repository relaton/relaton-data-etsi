abstract:
- language: en
  script: Latn
  content: Definition of a link layer encapsulation protocol named "Return Link Encapsulation"
    (RLE). RLE is based on the "Generic Stream Encapsulation" (GSE) which has already
    proven to offer higher performances than other encapsulation protocols such as
    MPEG/MPE, MPEG/ULE or ATM/AAL5. RLE is a modification of GSE so that it better
    fits the typical satellite return link requirements and conditions. RLE is already
    adopted in DVB-RCS2 and in S-MIM specifications.
