abstract:
- language: en
  script: Latn
  content: "Revision of  TS 101 903 v1.3.2.\r\nThis TS defines XML formats for advanced
    electronic signatures, based on W3C XML-Sig format, which remain valid over long
    periods, are compliant with the European Directive and incorporate additional
    useful information in common uses cases. This includes evidence as to its validity
    even if the signer or verifying party later attempts to deny (repudiates) the
    validity of the signature. This is achieved by defining new XML Schema types able
    to carry qualifying information of the basic signature, and by specifying ways
    for incorporating this information to the signatures."
