abstract:
- language: en
  script: Latn
  content: 'As the AI computing platform acts as the key fundamental infrastructure
    which provides an execution environment and related resources for supporting/hosting
    AI applications in an AI system, this work item will specify: (1) security requirements
    and associated security functions of the AI computing platform to mitigate security
    threats against the platform and its associated assets (e.g. models and data),
    and (2) security components and service interfaces incorporated in AI computing
    platform to achieve the security requirements and security functions. This work
    item will extend from SAI GR-009. '
