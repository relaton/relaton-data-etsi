abstract:
- language: en
  script: Latn
  content: "This revision of  NFV-IFA 027 propagates the deliverable into NFV Release
    3. \r\nThis edition will add functional requirements and specification of the
    information model to support the Release 3 features, and it will extend the scope
    of the former Release 2 edition summarized hereafter:\r\n\r\nSpecify the performance
    measurements (i.e. performance metrics, performance values) and use cases for
    descriptors and interfaces, including Or-Vnfm reference point, Ve-Vnfm reference
    point, Vi-Vnfm reference point, Or-Vi reference point, and Os-Ma-nfvo reference
    point, based on the performance metrics collected from NFVI.\r\n\r\nThis revision
    of NFV-IFA 027 will address the Release 3 candidate features listed in Annex B
    of the Release 3 Definition.\r\nThis revision will reflect the maintenance performed
    to NFV Release 2 documentation."
