abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) specifies the stage 1\r\ndescription
    of Completion of Calls to Busy Subscriber (CCBS) from the\r\nsubscriber s and
    user s points of view; in particular:\r\n-the procedures for normal operation
    with successful outcome;\r\n-the action to be taken in exceptional circumstances;\r\n-the
    interaction with other GSM supplementary services;\r\nThis ETS does not deal with
    the Man-Machine Interface (MMI)\r\nrequirements, but makes reference to the appropriate
    GSM\r\nspecifications.\r\nThe charging principles applied to CCBS are outside
    of the scope of\r\nthisETS.\r\nThis ETS is applicable to the digital cellular
    telecommunication\r\nsystem Global System for Mobile communications (GSM). Any
    interactions\r\nwith other networks not dealt with in clause 9 are outside the
    scope\r\nof this ETS.\r\n  "
