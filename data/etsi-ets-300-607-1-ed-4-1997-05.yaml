abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) describes the technical\r\ncharacteristics
    and methods of test for Mobile Stations (MS), for the\r\nPan European digital
    cellular communications system and Personal Comm\r\nunication Systems (PCS) operating
    in the 900 MHz and 1 800 MHz band (G\r\nSM 900 and DCS 1 800), standardized by
    ETSI Technical Committee Specia\r\nl Mobile Group (SMG).\r\nA subset of the tests
    is referenced in the GSM Common Technical Regula\r\ntions (CTRs) and is used for
    regulatory conformance testing according\r\nto the EEC procedures for Telecommunications
    Terminal Equipment (TTE)\r\ntype approval (EC Directive 91/263/EEC; also known
    as the \"Terminal Di\r\nrective\" or \"Second Phase Directive\"). The remaining
    tests can be used\r\nto verify conformance with the GSM core technical specifications
    for\r\nthose requirements that are not considered \"essential\" in the sense of\r\nthe
    EC Directive 91/263/EEC (Article 4).\r\nThis ETS covers the minimum characteristics
    considered necessary in or\r\nder to provide sufficient performance for mobile
    equipment and to prev\r\nent interference to other services or to other users,
    and to the PLMNs\r\n.\r\nIt does not necessarily include all the characteristics
    which may be r\r\nequired by a user or subscriber, nor does it necessarily represent
    the\r\noptimum performance achievable.\r\nIt applies to the public land mobile
    radio service in the GSM 900 and\r\nDCS 1 800 systems, using constant envelope
    modulation and operating on\r\nradio frequencies in the 900 and 1 800 MHz bands
    respectively with a\r\nchannel separation of 200 kHz and carrying 8 full rate
    channels or 16\r\nhalf rate channels per carrier according to the TDMA principle.\r\nThis
    ETS is part of the GSM-series of technical specifications. This E\r\nTS neither
    replaces any of the other GSM technical specificotions or G\r\nSM related ETS,
    nor is it created to provide full understanding of (or\r\nparts of) the GSM 900
    and DCS 1 800 systems. This ETS lists the requi\r\nrements, and provides the methods
    of test for testing a MS for conform\r\nance to the GSM standard.\r\nFor a full
    description of the system, reference should be made to all\r\nthe GSM technical
    specifications or GSM related ETSs. Clause 2 provide\r\ns a complete list of the
    GSM technical specifications, GSM related ETS\r\ns, and ETRs, on which this conformance
    test specifications is based.\r\nThis ETS applies to the unit which includes the
    hardware to establish\r\na connection across the radio interface.\r\nIf there
    is a difference between this conformance test ETS, and any ot\r\nher GSM technical
    specification or GSM related ETS, then the other GSM\r\ntechnical specification
    or GSM related ETS shall prevail.\r\n"
