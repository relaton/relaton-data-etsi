abstract:
- language: en
  script: Latn
  content: "This work item focuses on the definition of key scenarios that are required
    to support key existing defined next generation use cases in order to identify
    issues that may give rise to a need for improvements leading to next generation
    network protocols. The work aims to define a set of key reference scenarios against
    which to compare and contrast the network protocol landscape today with new protocols
    and modifications to existing protocols that are proposed for the next generation
    of networks.\r\nNote: \r\ni)\twhilst the WI references the extensive next generation
    use case work that has been done to date, if new next generation key use cases
    emerge during the project then these may be considered for addition to the WI
    scope, in the usual way, via new contributions to the WI.\r\n"
