abstract:
- language: en
  script: Latn
  content: "This revision of  NFV-SOL 004 propagates the deliverable into NFV Release
    3. \r\nThis edition will add protocol and data models to support the Release 3
    features, and it will extend the scope of the former Release 2 edition summarized
    hereafter:\r\n\r\nThis document specifies the structure and format of a VNF package
    file and its constituents, fulfilling the requirements specified in ETSI GS NFV-IFA
    011 for a VNF package.\r\nThis document also specifies the structure and format
    of a PNFD archive file and its constituents, fulfilling the requirements specified
    in ETSI GS NFV-IFA 014 for a PNFD archive.\r\n\r\nThis revision of NFV-SOL 004
    will address the Release 3 candidate features listed in Annex B of the Release
    3 Definition (v0.10.0). \r\nThis revision will reflect the maintenance performed
    to NFV Release 2 documentation."
