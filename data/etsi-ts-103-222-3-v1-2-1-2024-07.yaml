abstract:
- language: en
  script: Latn
  content: "The offer of new NGN services requires new KPI, QoS measurement and benchmarking
    methods which are needed to ensure the quality of new services. To ensure the
    comparability of test results, the present document specifies reference benchmarking
    methods and background traffic load profiles.\r\nThis revision is to add VoNR
    to the title as well as related technical content in the specification."
