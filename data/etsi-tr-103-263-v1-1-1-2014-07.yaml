abstract:
- language: en
  script: Latn
  content: Identify the potential regulatory impacts associated to the operation of
    SatCom solutions implementing cognitive radio techniques. In particular it will
    address different scenarios in Ka band (17.3 – 20.2 GHz for space to earth and
    27.5 – 30 GHz for earth to space) where the SatCom service shall not create any
    harmful interference to another incumbent whether terrestrial or satellite service
    entitled to use the same spectrum on a primary basis.
