abstract:
- language: en
  script: Latn
  content: "The specification is a flexible defined architecture and set of protocols
    to support remote management (RMS) and firmware update (FUS) for managed and unmanaged
    populations of home devices in IPTV networks.\r\nThe specification includes several
    operational modes:\r\n- RMS only (managed population);\r\n- RMS with FUS (managed
    or mixed managed/unmanaged population);\r\n- FUS only (unmanaged population)."
