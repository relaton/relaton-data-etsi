abstract:
- language: en
  script: Latn
  content: "This European Telecommunications Standard specifies the Abstract Test\r\nSuite
    (ATS) and partial PIXIT proforma for the Network Layer (Layer 3)\r\nat the mobile
    radio interface of the GSM or DCS (phase 2) mobile\r\nstations (MS) conforming
    to the ETSs for the Radio Resource\r\nmanagement, the Mobility Management, the
    circuit-switched Call\r\nControl, the Supplementary Services and Short Message
    Services for the\r\nEuropean digital cellular telecommunications systems (Phase
    2).\r\nThe ISO standards for the methodology of conformance testing are used\r\nas
    the basis for the test specifications.\r\n"
