abstract:
- language: en
  script: Latn
  content: "This TR applies to any Base Station System type or part of a Base Sta\r\ntion
    System and co-located equipment and equipment sites, unless other\r\nwise stated.\r\nIt
    applies regardless of ownership or responsibility for installation\r\nand maintenance
    of the equipment or network.\r\nThe document does assume some previous knowledge
    of the subject matter\r\nand in some areas specialist understanding may be required.\r\nThis
    ETR addresses the following information:\r\n- Product requirement overview\r\n-
    Equipment sites and installations\r\n- General applicable specifications\r\n-
    Acoustic noise\r\n- Construction\r\n- Earthing and bonding\r\n- Environmental
    Conditions\r\n- Lightning protection\r\n- Power supplies\r\n- Reliability/Dependability\r\n-
    Specific applicable specifications for product release\r\n- EMC\r\n- Safety\r\n-
    Type approval\r\n  "
