abstract:
- language: en
  script: Latn
  content: "The document establishes guidance in implementation and usage of the functionality
    described in the STI standard EN 300 797.  Subsets of the STI standard are defined
    in order to make interoperable solutions possible for different suppliers of STI
    devices. The subsets are called STI Levels. Interoperability is ensured if the
    STI Logical Interface (LI)  and STI Physical Interfaces (STI-PI,X) are the same
    for entities transporting DAB Service Components, Service Information and control
    messages in a DAB collection network. The present document only particularises
    the Logical Interface (LI) layer of the STI, i.e. the syntax for STI-D frames
    and STI-C messages, to provide interoperability.\r\nThe document defines a functional
    hierarchy of levels. Higher levels comprise lower levels. Three levels are specified
    where the highest STI Level does not comprise all STI functionality that could
    be implemented using EN 300 797. Some of the functionality is not included due
    to the fact that it is not assumed to be widely used. This functionality may optionally
    be added to any of the defined STI Levels.\r\nThe document defines the minimum
    functionality an upstream or downstream entity shall provide on each level to
    be considered compliant with that level."
