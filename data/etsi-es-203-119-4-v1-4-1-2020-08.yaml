abstract:
- language: en
  script: Latn
  content: "This extension package for TDL defines means for the refined and formalised
    test objective specification within TDL by incorporating concepts and a syntactical
    notation related to TPLan. Activities in this work item will include the definition
    of abstract syntax and semantics extensions for TDL, as well as a concrete syntax
    covering these extensions. Future work may pursue activities towards guidelines
    for realising test objectives in test descriptions and validation constraints
    for ensuring consistency between test descriptions and realised test objectives.\r\n"
