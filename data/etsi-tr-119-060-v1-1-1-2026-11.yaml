abstract:
- language: en
  script: Latn
  content: "The present document analyses the standardisation requirements arising from the draft Regulation on the establishment of European Business Wallets, identifying:\r\n-\texisting ETSI ESI standards directly applicable to European Business Wallets without modification;\r\n-\texisting ESI standards requiring adaptation, profiles or extensions to accommodate European Business Wallet use cases;\r\n-\tgaps where new standards are needed for European Business Wallet ecosystem operability.\r\nThe analysis focuses on technical, protocol and policy requirements at the standardisation level rather than specific business implementations. The document does not prescribe European Business Wallet specific deployment scenarios but provides a systematic mapping of regulatory requirements to standardisation deliverables, including coordination considerations with EC technical specifications developed for EUDIW."
