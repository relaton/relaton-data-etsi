abstract:
- language: en
  script: Latn
  content: "The present document describes a generic Handover Interface (HI) for the
    request and delivery of retained subscriber and traffic data from a Network Operator,
    an Access Provider or a Service Provider (NWO/AP/SvP) to the Requesting Authority.
    \ The request and delivery of retained data are requirements of Directive 2006/24/EC
    of the European Parliament and of the Council of 15 March 2006 on the retention
    of data\r\n"
