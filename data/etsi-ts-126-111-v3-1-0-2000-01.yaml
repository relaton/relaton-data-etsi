abstract:
- language: en
  script: Latn
  content: "In ITU-T recommendation H.324 with Annex C describes a generic multimedia
    codec for use in error-prone, wireless networks. The scope of this document are
    the changes, deletions, and additions to those texts necessary to fully specify
    a multimedia codec for use in 3GPP networks. Note that this implicitly excludes
    the network interface and call setup procedures. Also excluded are any general
    introductions to the system components.\r\n"
