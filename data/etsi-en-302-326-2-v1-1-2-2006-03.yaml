abstract:
- language: en
  script: Latn
  content: "Whilst the approved work item doesnot , in principle,propose to change
    any exisiting technical parameter values, beyond the re-presentation of data/information
    t enhance understanding and and usability, the key objectives are of the approved
    WIs are:\r\n- Rationalise the num,ber of existing stds. and where practicable,
    eradicate the various segmentation methods currently associated with ETSI TM (WG
    TM4) standards,\r\n- Ensure the solution addresses both essential requirements
    of article 3.2 of the R&TTE Directive and non-essential requirements,\r\n- place
    greater emphasis on systems, rather that on equipment and antennas as in the traditional
    ETSI TC TM (WG TM4) radio standards,\r\n- Significanlty reduce the future cost
    of maintenance of the large number of existing ENs,\r\n- Identify Technical inconsistencies
    among the different standards and as they arise recommend solutions and\r\n- Make
    any recommendations for possible improvement to the techical body's working methods.\r\nConsiderations
    on possible withdrawal of previous standards after publication of the new ENs
    will be taken into account."
