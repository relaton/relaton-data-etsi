abstract:
- language: en
  script: Latn
  content: "This work aims at  specifying the interfaces for multi-site connectivity
    services produced by a WAN Infrastructure Manager (WIM).  The document will also
    describe the operations and  the information elements exchanged over those interfaces.\r\n\r\nThe
    interfaces are a subset, with possible modifications and/or extensions, of Or-Vi
    reference point. They will focus on management aspects for enabling inter-connectivity
    between, and management of network services across, multiple NFVI-PoPs over WAN
    infrastructure.\r\n\r\nThe following aspects will be addressed for the management
    of Wide Area Network Virtualised Resources:\r\n•\tResources Management (e.g. allocate,
    query, update, terminate);  \r\n•\tResources Reservation (e.g. create, query,
    update, terminate);  \r\n•\tCapacity Management (e.g. subscribe, notify, query);
    \ \r\n•\tInformation Management (e.g. subscribe, notify, query);  \r\n•\tPerformance
    Management (e.g. subscribe, notify, get for performance information);  \r\n•\tFault
    Management (e.g. create, delete, query, subscribe, notify for fault information).\r\n.\r\n\r\n\r\n
    The work item will use the outcomes from ETSI GR NFV-IFA 022 as baseline. The
    resulting deliverable will contain normative provisions.\r\n"
