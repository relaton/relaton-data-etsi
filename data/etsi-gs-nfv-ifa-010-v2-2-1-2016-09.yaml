abstract:
- language: en
  script: Latn
  content: "The scope of this work is the revision of IFA10 specification  in order
    to conduct maintenance and add new functional requirements that may be identified
    during the continued development of the release 2 interface specifications.\r\nThe
    resulting specification will contain a complete set of normative functional requirements
    for NFV management and orchestration. The requirements on interfaces related to
    reference points  are not in scope of this WI. "
