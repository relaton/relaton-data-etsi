    the interfaces and necessary information elements enabling the fault, configuration
    and information, performance, state and log management of NFV-MANO functional
    entities.\r\nThe work item will use the outcomes from ETSI GR NFV-IFA 021 as baseline.\r\nThe
    resulting deliverable will contain normative provisions.\r\n"
