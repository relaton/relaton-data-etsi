abstract:
- language: en
  script: Latn
  content: The Radiation Pattern Envelope (RPE) of  EN 302 217-4-2 v1.3.1 range 7
    is based on a relative mask, while the RPS's for the other frequency bands are
    absolute masks. Evaluation of possible systems in the 71 GHz to 86 GHz range has
    shown, that the relative RPE mask is less appropriate both for the intended smaller
    antenna diameters as well as for interference into EESS. This new WI will define
    adequate RPE classes in the  range 71 GHz to 86 GHz.
