abstract:
- language: en
  script: Latn
  content: "This revision of NFV-SOL 006 continues the development of the specification
    as part of the NFV Release 3. This edition will add requirements and specification
    of interfaces to support the Release 3 features, and it will extend the scope
    of the former Release 2 edition summarized hereafter:\r\n\r\nNFV-SOL 006 specifies
    the YANG models for representing Network Functions Virtualisation (NFV) descriptors,
    fulfilling the requirements specified in ETSI GS NFV-IFA 011 and ETSI GS NFV-IFA
    014 applicable to a Virtualised Network Function Descriptor (VNFD), a Physical
    Network Functions Descriptor (PNFD) and a Network Service Descriptor (NSD)."
