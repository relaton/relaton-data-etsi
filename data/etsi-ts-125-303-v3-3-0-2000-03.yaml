abstract:
- language: en
  script: Latn
  content: "This document defines the UE States and the principal tasks undertaken
    by the UE when in Connected Mode. It includes informative interlayer procedures
    for the UE to perform the required tasks.\r\n\r\nThis document attempts to provide
    a comprehensive overview of the different states and transitions within the connected
    mode of a UMTS terminal. The applicable set of states for a given service may
    be a subset of the total set of possible states.\r\n\r\nIn addition to describing
    the states and related transitions, this document describes all procedures that
    assign, reconfigure and release radio resources. Included are e.g. procedures
    for transitions between different states and substates, handovers and measurement
    reports. The emphasis is on showing the combined usage of both peer-to-peer messages
    and interlayer primitives to illustrate the functional split between the layers,
    as well as the combination of elementary procedures for selected examples. The
    peer-to-peer elementary procedure descriptions are described in the related protocol
    descriptions /1, 2, 3/ and they are thus not within the scope of this document.\r\n\r\n\r\n"
