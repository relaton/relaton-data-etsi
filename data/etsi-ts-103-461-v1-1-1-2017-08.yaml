abstract:
- language: en
  script: Latn
  content: This document describes the minimum requirements for digital radios, both
    domestic and in-vehicle, and the necessary test methods that lead to compliance
    with the requirements.  It may be used as the technical basis for a Digital Radio
    Certification Mark scheme.  A Digital Radio Certification Mark is designed to
    be used on product packaging and provides an easily recognised mark to correspond
    to public information campaigns on the necessary requirements for consumers to
    make a switch to digital radio.  Manufacturers are, of course, free to include
    additional features or increased performance compared to the minimum requirements
    specified in this document.
