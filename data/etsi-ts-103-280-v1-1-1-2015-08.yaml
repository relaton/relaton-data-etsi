abstract:
- language: en
  script: Latn
  content: "The TC-LI deliverables each define their own requirements on commonly
    used parameters. Both in textual and technical descriptions. To reduce the amount
    of overhead in defining these parameters, this specification aims to provide an
    easy way to introduce commonly used parameters in other specifications.\r\n\r\nScope
    of work:\r\n\r\n- Provide a data dictionary for parameters used across multiple
    specifications\r\n- Provide technical means (e.g. by exporting an ASN.1 object
    and/or XSD schema definition) to be included in other specifications"
