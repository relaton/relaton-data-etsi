abstract:
- language: en
  script: Latn
  content: Create Functional Requirements for licence-exempt FWA based on existing
    HIPERMAN documents. Include a basic sharing and interference study to investigate
    feasibility of licence exempt FWA in Band C (5,725-5,875 GHz). Propose terms for
    this sharing and deliver a generalised System Reference Document for further sharing
    and co-existence studies. Liaison with TM4 on co-existence studies. Liaison with
    ERM-RM on spectrum issues.
