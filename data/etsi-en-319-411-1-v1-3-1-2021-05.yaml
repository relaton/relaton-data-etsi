abstract:
- language: en
  script: Latn
  content: "(i) address the problems with interpreting EN 319 411-1, \r\n(ii) address
    the difficulties when trying to comply to eIDAS and CA/B forum with the EN and
    use this occasion to up-date the EN with latest CAB Forum Baseline and EV guidelines,
    \r\n(iii) enhance harmonisation with other norms requiring secure enrolments (CEN
    419 241-1,  CIR 2015/1502).\r\n(iv) Support \"short term\" certificates\r\n\r\nRationales
    for this work: since the publication of the EN 1 year ago, ESI received feedback
    from the market. It relates most of the time to difficulties in applying or interpreting
    the standard, sometime to requirements perceived as too severe. TSPs also have
    difficulties when trying to comply to eIDAS and CA/B forum requirements at the
    same time when using the EN. In the framework of the NWI ESI experts will seek
    for further comments to deal with.\r\n\r\nSee: ESI(19)67_020  for initial list
    of issues"
