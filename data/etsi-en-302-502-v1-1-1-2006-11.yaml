abstract:
- language: en
  script: Latn
  content: "To prepare a Harmonised EN covering the essential requirements for Fixed
    Broadband Data Transmitting Systems operating in the frequency range 5725 - 5875
    MHz. It is intended to cover the provisions of Directive 1999/5/EC  (R&TTE Directive)
    Article 3.2, which states that: \"... radio equipment shall be so constructed
    that it effectively uses the spectrum allocated to terrestrial/space radio communications
    and orbital resources so as to avoid harmful interference\".     \r\n"
