abstract:
- language: en
  script: Latn
  content: 'The SRdoc is aimed to  provid information on the intended applications,
    the technical parameters, the relationship to the existing spectrum regulation
    (Decision (EU) 2025/105 and ERC REC 70-03 Annex 6) and new radio spectrum requirements
    for Ground Based Synthetic Aperture Radars.  A proper bandwidth is required and
    could be accommodated in the frequency range between 33,4 and 35,2 GHz. The SRdoc
    will include necessary information to support the co-operation between ETSI and
    the Electronic Communications Committee (ECC) of the European Conference of Post
    and Telecommunications Administrations (CEPT), including: • Detailed market information
    (annex A); • Technical information (annex B); • Relationship to the existing spectrum
    regulation (annex C); • Preliminary  compatibility feasibility analysis (annex
    D).  GBSAR requirements in respect to the intended applications will be provided
    e.g to measure and monitor the deformation of building either to assess the stability
    of a building, or to control instabilities induced by external cause, such as
    earthquake, underground construction close or under the building, etc. Another
    key application is monitoring the deformation evolution of natural landslide,
    with the goal to provide early warning alert in case of failure precursor.'
