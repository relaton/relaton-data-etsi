- language: en
  script: Latn
  content: "This revision of NFV-SOL 002 continues the development of the specification
    as part of the NFV Release 3. This edition will add requirements and specification
    of interfaces to support the Release 3 features. The scope of the former Release
    3 published edition is summarized hereafter:\r\nNFV-SOL 002 specifies a set of
    RESTful protocols fulfilling the requirements specified in ETSI GS NFV-IFA 008
    for the interfaces used over the Ve-Vnfm reference point."
