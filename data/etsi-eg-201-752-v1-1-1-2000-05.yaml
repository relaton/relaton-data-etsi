abstract:
- language: en
  script: Latn
  content: "To produce a \"generic standard\", candidate for harmonisation, which
    identify  the essential parameters relevant to fixed radio systems, and by cross-referencing
    to the relevant clauses in present equipment and antennas ENs produced by TM4,
    provides the actual value of the required essential parameters as in article 3.1
    of the RTTE Directive. The essential parameters will be derived from the guidance
    given in EG 201 399 and from further specific adaptation to Fixed Radio Systems
    given in DTR/TM-04089. \r\n \r\n"
