abstract:
- language: en
  script: Latn
  content: "The present document defines the GEM platform. GEM is applicable for specifications
    and standards based on the GEM APIs, content formats, and semantic guarantees.\r\nSince
    the current business models for delivery of DVB services via broadband IP networks
    are more operator controlled than was assumed for the original GEM, the present
    document extends GEM with support for operator supplied applications which run
    all the time that the GEM environment is running. There is also the possibility
    that where an operator has subsidised the GEM terminal, applications from that
    operator may have specially privileges not available to normal applications."
