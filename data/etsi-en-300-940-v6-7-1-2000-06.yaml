abstract:
- language: en
  script: Latn
  content: "SUBJECT\r\nCC procedures for CCBS recall\r\nMessages and IEs for CCBS\r\nMM
    procedures for CCBS recall\r\nStructured procedures for CCBS recall\r\nSection
    8 procedures for CCBS recall\r\nCall Control timers for CCBS recall\r\nIndication
    of CCBS possible\r\nGPRS, RR sub-layer\r\nInclusion of GPRS session and mobility
    management \r\nNew call state values\r\nNetwork controlled allocation of GPRS
    resource\r\n\r\n\r\nVersion 6.2.0:\r\nSUBJECT\r\nDeletion of the STANDBY timer\r\nAddition
    of downlink single block assignment for GPRS\r\nCorrection of packet downlink
    assignment procedure\r\nRadio priority level signalling for MO SMS\r\nClassmark
    split\r\nScheduling of SI-13\r\nMS initiated detach procedure collision handling\r\nDefinition
    of IEI values for optional information elements\r\nClarification of the Classmark
    3 IE\r\nVarious corrections to GSM 04.08\r\nSAPI negotiation at AA PDP context
    activation\r\nAddition of Network Operation mode in SI 13\r\nClarification of
    the GMM cause code handling\r\nDeletion of Mac Mode  in SI 13\r\nModification
    of PDP address IE coding\r\nAllows Fixed or Dynamic Access mode in one phase packet
    access mode for Uplink TBF\r\nClarifications in the negotiation of the READY Timer
    value\r\nPb parameter defined in SI 13 used only on PCCH misplaced\r\n"
