abstract:
- language: en
  script: Latn
  content: "Scope of the work is to adapt the current 3GPP VCC stage 2 to the TISPAN
    environment (e.g. for xDSL).\r\nThe current VCC solution explained in 3GPP TS
    23.206 is essentially defined for a core IMS provider that is a mobile operator
    (that has also CS domain), but needs to be extended to a generic IMS operator
    (e.g. when fixed network operator and CS mobile network operator are separate
    organisations ). \r\nIf specific impacts on user devices are identified, they
    should be analysed in order to evaluate possible collaboration with WG5.\r\nThe
    current mode of cooperation between TISPAN and 3GPP shall be followed for potential
    modifications to the 3GPP stage 2 description."
