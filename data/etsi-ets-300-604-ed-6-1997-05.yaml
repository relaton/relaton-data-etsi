abstract:
- language: en
  script: Latn
  content: "The purpose of this European Telecommunication Standard (ETS) is to id\r\nentify
    the Mobile-services Switching Centre (MSC)/Interworking Functio\r\nns (IWFs) and
    requirements to support interworking between:\r\ni)\tPLMN and PSTN\r\nii)\tPLMN
    and ISDN\r\n It is not possible to treat ISDN and PSTN as one type of network,
    even\r\nwhen both ISDN and PSTN subscribers are served by the same exchange b\r\necause
    of the limitations of the PSTN subscribers access i.e. analogue\r\nconnection
    without D-channel signalling.\r\nWithin this ETS, the requirements for voice and
    non-voice (data) calls\r\nare considered separately.\r\n"
