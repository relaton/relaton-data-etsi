abstract:
- language: en
  script: Latn
  content: "This document will provide security requirements and assessment criteria
    covering all elements defined in CRA Annex I Part 1 for Internet connected toys
    covered by Directive 2009/48/EC that have social interactive features (e.g. speaking
    or filming) or that have location tracking features, as mentioned in CRA Annex
    III Class I important products.\r\nThis work item intends to produce an EN as
    candidate for harmonisation, under the standardisation request in support of the
    implementation of the CRA (M/606). Once adopted, it is planned that this work
    item will replace work item DTS/CYBER-EUS-001 (TS ) of the CYBER-EUSR Work Programme
    that should be stopped.  \r\n"
