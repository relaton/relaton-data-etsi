abstract:
- language: en
  script: Latn
  content: "This GR represents a mainly qualitative analysis of the possibilities to reduce \r\nenergy consumption in particular in operation of ICT equipment and infrastructure. \r\nThe analysis does only partially covers the energy needed to produce and put in place the\r\nnecessary ICT equipment and infrastructure. \r\nThe analysis looks at the effects of the behaviour of telecom users: apart from the energy \r\nconsumption of the terminal equipment, notably related to processing and display energy \r\nconsumption, user behaviour such as using ‘always on’ or ‘always connected’ may complicate \r\nthe use of energy saving operating modes in the ICT infrastructure\r\nAt the same time, there are developments disallowing complete or partial use of ICT \r\nequipment and/or services, e.g. in educational facilities, and the right not to be disturbed, \r\nthat introduce another type of issues, related to accessibility in case of emergencies\r\nThe analysis tries to take into consideration the possible consequences of related\r\ndevelopments, such as the AI wave for energy, behaviour, and equipment"
