abstract:
- language: en
  script: Latn
  content: "New features include:\r\n- Support for Remote Management and Firmware
    Update Services (RMS-FUS) (c.f. TS 102 824);\r\n- Regionalisation metadata to
    enable a Home Network End Device to acquire the region in which it is located;
    CellID assignment \r\n- Optional retransmission mechanism to provide for protection
    against packet loss of RTP streams\r\n- Support for Content Download Services
    for user (pull download) or service provider (push download) initiated download
    of content items to the HNED\r\n\r\nSignalling of these new functionalities and
    the configuration of required new parameters"
