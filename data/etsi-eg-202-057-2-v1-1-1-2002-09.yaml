abstract:
- language: en
  script: Latn
  content: "This guide contains harmonised definitions and measurement methods for
    a range of user perceivable Quality of service (QoS) parameters. This part of
    the EG contains user related QoS parameter definitions and mùeasuremnts methods
    for voice telephony, group 3 fax and modem data services. The parameter definitions
    and measurements for modem data are intended to be suitable for V.90 modems.\r\nThe
    purpose of these parameters is to define objective and comparable measures of
    the QoS delivered to users/customers for use by users/customers."
