abstract:
- language: en
  script: Latn
  content: "Transfer of GSM 07.10 to 3GPP. \r\n___________________\r\nThis TS defines
    a multiplexing protocol between a mobile station and a terminal. The multiplexing
    protocol can be used to send any data, for instance voice, SMS, USSD, fax etc.
    The present document describes the protocol, but not the commands or data transported
    with it."
