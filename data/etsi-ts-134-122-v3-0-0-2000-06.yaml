abstract:
- language: en
  script: Latn
  content: "TSG-T WG1/RF: The present document specifies the measurement procedures
    for the conformance test of the mobile station that contain transmitting characteristics,
    receiving characteristics and performance requirements in TDD mode.\r\n\r\nAbstract
    of document:\r\nTerminal Conformance Specifications; Radio transmission and reception
    (TDD)\r\nContaining test specifications about\r\nTransmitter Characteristics\r\nReceiver
    Characteristics\r\nPerformance Requirements\r\nCore specification for this document
    are:\r\nTS25.102 (UTRA (UE) Radio Transmission and Reception)\r\nTS 25.123   (Requirements
    for Support of Radio Resource Management (TDD))\r\nServing specifications for
    this document are:\r\nTS34.109 (Terminal logical test interface (FDD/TDD))\r\nTS
    34.108 (Common Test Environment)\r\nPeer specifications with respect to this document
    are:\r\nTS 34.121 (Terminal Conformance Specifications; Radio Transmission and
    Reception (FDD)\r\nTS 25.142  (Base Station Conformance Testing (TDD))\r\nTS 25.141
    \ (Base Station Conformance Testing (FDD))\r\nContentious Issues:\r\nNo serious
    contention issues are known.\r\nThe scope of the document,  currently  comprising
    \r\nTransmitter Characteristics, Receiver Characteristics and Performance Requirements
    will be extended in future due to acceptance of TS 25.123 as a core specification.
    \r\n"
