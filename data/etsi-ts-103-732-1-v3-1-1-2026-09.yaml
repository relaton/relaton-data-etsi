abstract:
- language: en
  script: Latn
  content: "To update the TS 103 732-1 Protection Profile based on the following information:\r\n\r\n•\tUpdate the PP to conform to the latest revision of the Common Criteria (currently CC:2022) that will be required for the PP to be in compliance with EUCC and CRA requirements.\r\n\r\n•\tIncorporate any essential changes to accommodate relevant recommendations from ENISA on fulfilling CRA requirements\r\n\r\n•\tReview the feedback from GSMA liaison (CYBER(24)37e016r2) and incorporate essential changes as appropriate for SFRs and SARs..\r\n\r\n•\tIncorporate any necessary changes to ensure consistency with the update of TS 103 732 Part 2, Part 3, Part 4 and Part 5.\r\n\r\nNOTE: Dedicated NWIs will be created for the PP Modules update."
