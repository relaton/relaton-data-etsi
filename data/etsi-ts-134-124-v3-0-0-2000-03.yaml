abstract:
- language: en
  script: Latn
  content: "TSG-T WG T1/EMC: 3GPP EMC standards need to meet global/regional requirements,
    difficulties in incorporating in 3GPP specifications.\r\nEMC regulatory requirements
    for each region/country should be handled as separate annexes of the same deliverable.\r\nEquipment
    intended for sell in more than one country/region will then need to be tested
    against the relevant annexes, and the results submitted to each region/country's
    regulatory/certification body.\r\nInside 3GPP: RAN4 and T1/EMC to proceed independently.
    T1 to harmonize EMC specifications for global circulation of 3G terminal equipment.
    \r\nOutside 3GPP: to liaise with CISPR. EMC requirements above 1 GHz are being
    developed by CISPR/IEC, with a longer timeframe than 3GPP's. LS from T1/EMC to
    CISPR should get \"green light\" from PCG (04/99)."
