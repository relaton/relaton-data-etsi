abstract:
- language: en
  script: Latn
  content: "Provision of test methodologies and maximum levels for short term and
    long term noise exposure and Time-Weighted Average (TWA).\r\nRevised version to
    address:\r\n1. In Long Duration Noise Limit Measurement current change noise signal
    \"at 15 dBV\" to noise signal \"up to 15 dBV\".\r\n2. Add detail in Maximum Acoustic
    Output Detect Method:\r\n- For each 1/12 octave band of test signal measure the
    RMS SPL from the whole frequency range\r\n- For each 1/12 octave band of test
    signal record the whole frequency range wave file, after all wave files of each
    1/12 octave band are recorded calculate the total RMS SPL from all wave files
    at each 1/12 octave band\r\n- ...\r\n3. Add discussion concerning TWA Measurement
    Method for Wireless Terminals\r\n4. Other needed updates"
