abstract:
- language: en
  script: Latn
  content: "Introducing in the existing specification an additional test methodology
    based on specified static test models reported below:\r\n\r\n-\tUnique PDSCH load
    profiles over time (LTE and NR)\r\n-\tUnique PDSCH frequency allocation\t(LTE
    and NR)\r\n-\tUnique PDCCH specification (LTE and NR)\r\n-\tSSB case related information
    and positions (NR)\r\n-\tPosition and size of SIB1 (NR)\r\n\r\nCare shall be taken
    that defined models do not prevent effects of advanced energy saving features
    to be captured.\r\n\r\nThe objective of this additional test methodology is to
    improve the measurement reproducibility and comparability of the power consumption
    measurements of different base stations.\r\n\r\n\r\n\r\n"
