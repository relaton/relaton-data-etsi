abstract:
- language: en
  script: Latn
  content: "Define the topology and level of analysis to assess the energy efficiency
    of mobile network (scope that could include radio base stations,  backhauling
    systems, radio controllers, other infrastructure radio site equipment)\r\nThe
    covered technology will be GSM, UMTS, LTE\r\nDefine metrics for radio access network
    EE\r\nDefine methods for assessing (measuring) EE in operational networks\r\nStarting
    point for this WI is the TR developped   DTR/EE-EEPS004"
