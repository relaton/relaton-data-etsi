abstract:
- language: en
  script: Latn
  content: "SUBJECT\r\nSuppress announcements even when the called party number has
    been changed by the CSE\r\nAllow CSE to send an NI alerting pattern to the IPLMN
    during the incoming call request procedure.\r\nTreating GSM Forwarding and CSE
    Forwarding in the same way.\r\nRemoval of restriction on number of Follow-on calls
    and/or call re-attempts.\r\nEditorial change of \"call segment\" to \"call period\"
    due to different meaning in ITU-T standards.\r\n"
