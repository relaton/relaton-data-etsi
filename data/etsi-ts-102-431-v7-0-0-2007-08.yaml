abstract:
- language: en
  script: Latn
  content: "The TS 102 127 specifies the Transport Protocol for CAT Applications.
    In order to facilitate the interoperability, a test specification is needed to
    validate the CAT_TP mechanisms, features and performances.\r\nThe purpose of this
    work item is:\r\nThe definition of test cases and scenarios in order to validate
    the CAT_TP specification.\r\nThe creation of a Technical Specification describing
    those test cases and scenarios.\r\nA test suite (testing real implementations)
    might be necessary but is out of the scope of this work item."
