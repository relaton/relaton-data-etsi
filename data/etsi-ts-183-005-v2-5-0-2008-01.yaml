abstract:
- language: en
  script: Latn
  content: "Description of the following enhancements of TS 183 005 CONF:\r\n-Improvements
    in the activation of a 3PTY conference (reuse of established dialogs for the conference,
    fault clearance regarding the interworking to the PSTN).\r\n-Adding of 3PTY conferencing
    application scenarios.\r\n-Simplification of a conference activation\r\n-Service
    interaction procedures for 3PTY conferencing (e.g. regarding AoC).\r\nThese enhancements
    for NGN R2 are expected o be based on the evolving 3GPP TS 24.147, hence this
    is a revision of TS 183 005 for NGN r2.The TISPAN NGN release 1 definition also
    provides for the support of a conferencing capability as defined by 3GPP in 3GPP
    TS 24.147. It should be considered if the capabilities defined  within TS 24.147
    fits the requirements needed by this WI then the Stage 3 description should be
    adopted to the principles for TISPAN IMS."
