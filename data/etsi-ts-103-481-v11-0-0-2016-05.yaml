abstract:
- language: en
  script: Latn
  content: "ETSI TS 102 226 defines the remote management of the UICC based on any
    of the secured packet structures specified in TS 102 225. This technology is used
    for the remote management of services based on UICCs.  \r\nOne UICC conformance
    test specification will be developed. The specified test cases will verify the
    requirements for the following features/formats but not limited to those: \r\nRemote
    APDU format :\r\n-Remote Application data format \r\n-Expanded Remote Application
    format \r\nSecurity parameters assigned to applications\r\nRemote file management
    \r\nRemote application management \r\nAdditional command for push\r\nConfidential
    application management"
