abstract:
- language: en
  script: Latn
  content: "This revision of  NFV-SOL 005 propagates the deliverable into NFV Release
    3. \r\nThis edition will add protocol and data models to support the Release 3
    features, and it will extend the scope of the former Release 2 edition summarized
    hereafter:\r\n\r\nSOL 005 specifies a set of Restful protocol specifications and
    data models fulfilling the requirements specified in ETSI GS NFV-IFA 013 for the
    interfaces used over the Os-Ma-nfvo reference point.\r\n\r\nThis revision of NFV-SOL
    005 will address the Release 3 candidate features listed in Annex B of the Release
    3 Definition (v0.10.0). \r\nThis revision will reflect the maintenance performed
    to NFV Release 2 documentation."
