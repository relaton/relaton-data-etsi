abstract:
- language: en
  script: Latn
  content: This EN will cover ECSS E-50 level 3 document, in cooperation with ECSS.
    ETSI TC SES WG on ECSS, with the help of STF 165, will produce the part of the
    ECSS standards concerning the communications satellites, which are part of the
    commercial market. ECSS will produce the part of the ECSS standards concerning
    mainly Space Agencies programmes. Nevertheless, for synergy reasons a common standard
    can be envisaged when preparing the standard.
