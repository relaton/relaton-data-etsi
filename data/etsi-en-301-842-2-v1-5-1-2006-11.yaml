abstract:
- language: en
  script: Latn
  content: "This EN will cover the updating of a previous document on VHF aeronautical
    radio equipment operating at 25 kHz channel spacing in the aeronautical band 112-137
    MHz. It covers ground-based, fixed and mobile data communication, VHF Digital
    Link (VDL) mode 4. Reference documents:  ICAO SARPS and Technical Manual on VDL
    Mode 4, and ETSI Draft EN's 302 842-1 both released in June 2004. Technical specifications
    on ADS-B, FIS-B, TIS-B and GRAS from European Commission funded projects including
    NUP, MEDUP/MFF.\r\nSeveral minor technical clarifications and some editorial changes
    are \r\nnecessary in the light of practical experience.\r\nReview to check conformance
    with the SES regulation 552/2004.\r\n"
