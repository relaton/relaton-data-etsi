abstract:
- language: en
  script: Latn
  content: "This Global System for Mobile communications Technical Specification (\r\nGTS)
    defines the interface between the Subscriber Identity Module (SIM\r\n) and the
    Mobile Equipment (ME), and mandatory ME procedures, specific\r\nally for \"SIM
    Application Toolkit\".\r\nSIM Application Toolkit is a set of commands and procedures
    for use du\r\nring the network operation phase of GSM, in addition to those defined\r\nin
    GSM 11.11 [14].\r\nSpecifying the interface is to ensure interoperability between
    a SIM a\r\nnd an ME independently of the respective manufacturers and operators.\r\nThe
    concept of a split of the Mobile Station (MS) into these elements\r\nas well as
    the distinction between the GSM network operation phase, wh\r\nich is also called
    GSM operations, and the administrative management p\r\nhase are described in GSM
    02.17 [3].\r\nThis Technical Specification defines:\r\n-\tthe commands;\r\n -\tthe
    application protocol;\r\n -\tthe mandatory requirements on the SIM and ME for
    each procedure.\r\n Unless otherwise stated, references to GSM also apply to DCS
    1 800.\r\nThis standard does not specify any aspects related to the administrati\r\nve
    management phase. Any internal technical realization of either the\r\nSIM or the
    ME are only specified where these reflect over the interfac\r\ne. This standard
    does not specify any of the security algorithms which\r\nmay be used.\r\nThis
    Technical Specification defines an enhancement for GSM Phase 2+ o\r\nf the SIM/ME
    interface for GSM Phase 2. While all attempts have been m\r\nade to maintain phase
    compatibility, any issues that specifically rela\r\nte to Phase 1 should be referenced
    from within the relevant Phase 1 sp\r\necification.\r\n "
