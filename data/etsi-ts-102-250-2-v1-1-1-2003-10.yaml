abstract:
- language: en
  script: Latn
  content: The present document defines QoS parameters and their computation for popular
    services in GSM and 3G networks. The technical QoS indicators, listed in document
    TS 103 xyz-1, are the basis for the parameter set chosen. The parameter definition
    and the generic description of the measurement method with the respective trigger
    points. Only measurement methods not dependent on any infrastructure provided
    are described in this document. The harmonised definitions given in this document
    are considered as the prerequisites for comparison of QoS measurement results.
