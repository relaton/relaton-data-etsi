abstract:
- language: en
  script: Latn
  content: "This revision of NFV-SOL 005 propagates the deliverable into NFV Release
    4. This edition will add protocol and data models to support the Release 4 features,
    and it will extend the scope of the former Release 3 edition summarized hereafter:\r\n\r\nNFV-SOL
    005 specifies a set of RESTful protocol specifications and data models fulfilling
    the requirements specified in ETSI GS NFV-IFA 013 for the interfaces used over
    the Os-Ma-nfvo reference point."
