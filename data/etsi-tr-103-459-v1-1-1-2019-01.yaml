  script: Latn
  content: "\r\n1.To provide a reference model of FRMCS system architecture from a
    functional point of view. \r\n2.To provide a high level description of the functions
    that address FRMCS requirements (as specified by FRMCS URS and Use Cases).\r\n3.To
    define internal and external boundaries of the FRMCS system (e.g. transport versus
    applications, external systems, external networks, etc.).\r\n4.To define further
    potential steps.\r\n"
