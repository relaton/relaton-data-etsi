abstract:
- language: en
  script: Latn
  content: "This paper explains the different standards for Digital Audio Broadcasting
    (DAB) that exist, what they cover and how they are intrerelated.  The main DAB
    standard ETS 300 401 is explained first of all and the remaining documents are
    grouped into standards/documents related to the DAB receivers, DAB networks along
    with transmitters and data transmission via DAB. Sources where one can obtain
    these documents and a brief overview of general literature about DAB is also given\r\n"
