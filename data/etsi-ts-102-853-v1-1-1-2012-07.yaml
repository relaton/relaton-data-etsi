abstract:
- language: en
  script: Latn
  content: "This specification will contain guidance on how to verify a digital signature
    within a given policy context. Specifically, it will \r\na) provide requirements
    for conducting advanced electronic signatures verification\r\nb)  define, how
    the different aspects and related standards are brought together to make a verification
    decision, particularly when verifying signature held over the medium to long term;\r\nc)
    discuss how to support the creation and validation processes with information
    on algorithm/key length strength resp. weaknesses. This relates to questions like
    how to handle validation on a date beyond which use of the algorithm or key length
    used is not recommended.  \r\nThis document will supersede CEN CWA 14171 (except
    aspects related to protection profile that will be addressed by CEN) which has
    expired\r\n"
