abstract:
- language: en
  script: Latn
  content: The update includes Change Requests to correct errors and add clarifications
    to the current standard version. Some of the CR's are originated from TCCA OUA
    service overviews. The CR’s include e.g. introduction of new subscriber class
    type (unpreferred subscriber class) and mobility rules between subscriber class
    types, MS behaviour when essential services cannot be satisfied, adding hysteresis
    to GSDM cell reselection rules, and several other corrections and clarifications.
