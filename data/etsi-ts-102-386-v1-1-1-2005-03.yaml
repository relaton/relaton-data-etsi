abstract:
- language: en
  script: Latn
  content: The present document defines a system for adding a limited amount of service
    information to analogue broadcasts in the frequency bands below 30MHz in a complementary
    way to the Digital Radio Mondiale (DRM) system.  It is intended to be used by
    broadcasters in the transition to all digital transmission by providing labelling
    and frequency information for a better user experience.
