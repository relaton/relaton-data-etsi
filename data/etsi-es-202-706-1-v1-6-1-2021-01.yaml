abstract:
- language: en
  script: Latn
  content: "To define 5G base station energy consumption and energy performance KPI’s,
    measurement methods with static load. Typical 5G configurations shall be considered.
    The final work will be an enhancement in ETSI ES 202 706-1. \r\nPart 1 will be
    updated to include energy performance KPI’s – i.e. power consumption and energy
    performance.\r\nRelevant Energy Efficiency metrics and KPI’s of 3GPP and ETSI
    EE standards should be considered"
