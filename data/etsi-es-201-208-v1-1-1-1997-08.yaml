abstract:
- language: en
  script: Latn
  content: "To specify telecommunications features further to those already\r\ncovered
    by EN 726-6. The telecommunication features to be covered are:\r\n1) Service access
    control\r\n2) Logging of call data\r\n3) General identification/authentication\r\n4)
    Third party cards in telecommunications terminals\r\n5) Last numbers storage\r\n6)
    User data backup\r\nFurther information can be found in ETSI STC TE9(93)115\r\n"
