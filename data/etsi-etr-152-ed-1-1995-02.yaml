abstract:
- language: en
  script: Latn
  content: "This ETR defines the HDSL technique providing transparent capacity of\r\n748
    kbit/s over an expected range of 2,75 km with 0,4 mm wires and 3,6\r\n6 km with
    0,5 mm or about 1 Mbit/s over one pair of the existing coppe\r\nr local line network.
    It can be used to realise ISDN primary rate acce\r\nss digital section given in
    ETS 300 233. HDSL allows an economical imp\r\nlementation of primary rate over
    3 or 2 pairs (compaired to 2 pairs fo\r\nr the traditional 2048 kbit/s transmission
    technique) over more than d\r\nouble the range without a regenerator. Will support
    the penetration of\r\nISDN with existing network structures and technology.\r\nThe
    work will define application scenarios, identify implementations o\r\nn the V3
    and user-network interface (ETS 300 011), multiplex technique\r\nfor splitting
    and recombining 2048 kbit/s to/from HDSL. It requires a\r\nmaintenance concepts
    to be identified and taken into account in the m\r\nultiplexer specifications.\r\n
    HDSL may be used for other types of access with lower bit rates. The n\r\need
    for this is to be identified and the general concept is to be esta\r\nblished
    by NA.\r\n  "
