abstract:
- language: en
  script: Latn
  content: "This revision of NFV-SOL 014 propagates the deliverable into NFV Release
    3. This edition will add protocol and data models to support the Release 3 features,
    and it will extend the scope of the former Release 2 edition summarized hereafter:\r\n\r\nNFV-SOL
    014 specifies a set of YAML-based data models for descriptor-based virtualised
    resource management fulfilling the requirements concerning the input and output
    information exchanged over the virtualised resource management interfaces specified
    in the ETSI GS NFV-IFA 005, and the ETSI GS NFV-IFA 006. The document focuses
    on data models used in the virtualised resource descriptors for the Virtualised
    Compute interfaces, Virtualised Network interfaces and Virtualised Storage interfaces,
    which are used to perform orchestration and lifecycle management for consumable
    virtualised resources comprised of compute, network and storage. Other virtualised
    resource management interfaces, as well as data models for information specified
    in ETSI GS NFV IFA 011 and ETSI GS NFV-IFA 014, are out of the scope of the present
    document."
