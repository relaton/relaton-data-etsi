abstract:
- language: en
  script: Latn
  content: The WI will define the Stage 2 customer devices specification, including
    architectural building blocks to be included in the customer devices to support
    the interworking with NGN architecture, both for the transport layers (NASS, RACS)
    and for the service layer. The WI will also define the interfaces between the
    customer network internal architectural blocks and the corresponding customer
    devices  functions here defined (for the where the CNG will be transparent for
    the service and/or transport layer), as well as between the customer devices functions
    and the CNG when appropriate. The WI will perform, as first step, a categorisation
    of the different user equipment with reference to the type of service supported
    and the different levels of implementation of the related functionalities. Any
    potential impact to the already defined interfaces to NGN architecture will be
    handled in other WGs or committees and are thus considered outside the scope of
    this work.
