- language: en
  script: Latn
  content: In 2015 several TTCN-3 language CRs  have been received requesting new
    ways of message matching, including user-defined matching, combinations of existing
    matchings etc. As these features go beyond the core language - containing basic
    mechanisms sufficient for the majority of users – a language extension has been
    decided.
