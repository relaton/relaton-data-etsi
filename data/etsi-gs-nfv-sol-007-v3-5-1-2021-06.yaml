  script: Latn
  content: "This revision of NFV-SOL 007 continues the development of the specification
    as part of the NFV Release 3. This edition will add requirements and specification
    of interfaces to support the Release 3 features, and it will extend the scope
    of the former Release 2 edition summarized hereafter:\r\n\r\nNFV-SOL 007 specifies
    the Network Service Descriptor file structure and naming conventions for the different
    files, fulfilling the requirements specified in ETSI GS NFV-IFA 014."
