abstract:
- language: en
  script: Latn
  content: "This revision of  NFV-IFA 017 propagates the deliverable into NFV Release
    3. \r\nThis edition will add guidelines for information modeling to support the
    Release 3 features, and it will extend the scope of the former Release 2 edition
    summarized hereafter:\r\n\r\nThis Work Item will produce guidelines for the development
    of a protocol-neutral UML (Unified Modeling Language) information model for ETSI
    NFV.  This Work Item will build upon the internal document NFV UML Modeling Guidelines
    developed as part of IFA015. This Work Item will address closer alignment with
    corresponding UML modelling guidelines from ONF and may be influenced by other
    partners cooperating with NFV. The deliverable will be informative.\r\n\r\nThis
    revision of NFV-IFA 017 will address the Release 3 candidate features listed in
    Annex B of the Release 3 Definition (v0.8.0).\r\nThis revision will also reflect
    the maintenance performed to NFV Release 2 documentation."
