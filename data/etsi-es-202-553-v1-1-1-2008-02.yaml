abstract:
- language: en
  script: Latn
  content: "This ETSI Standard specifies the syntax and use of a notation for the
    definition of Test Purposes, TPLan. This notation provides a structure and a common
    set of English keywords for the specification of Test Purposes. The basic notation
    is oriented towards  testing of reactive, black-box communication systems and
    uses terminology derived from ISO 9646 1 [4]. However, facilities are also included
    to allow users to extend the notation with application specific keywords of their
    own.\r\nThe use of TPLan as the means of specifying Test Purposes is optional
    but, if it is used, the requirements specified in the present document shall be
    met."
