abstract:
- language: en
  script: Latn
  content: "The work item will provide guidance to NFV on the use of certificates
    and Certificate Authorities.  It will look at various certificate deployment scenarios
    and describe certificate specific use cases, threats to the certificate management
    structure, and resulting requirements for NFV.\r\nIn addition, this work will
    provide an overall certificate management guidance and trust validation applied
    for Virtual Machines and Virtualized Network Functions."
