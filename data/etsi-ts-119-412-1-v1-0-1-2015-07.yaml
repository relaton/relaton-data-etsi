abstract:
- language: en
  script: Latn
  content: "The present document provides an overview of the X.509 | ISO/IEC 9594-8
    based certificate profiles and the statements for qualified certificates specified
    in other parts of 119 412. It specifies common data structures that are referenced
    from other parts of 119 412.\r\nThe profiles specified in this multi-part document
    aim to support both the Regulation (EU) No 910/2014 and use of certificates in
    a wider international context. Within the European context, it aims to support
    both EU qualified certificates and other forms of certificate. \r\n"
