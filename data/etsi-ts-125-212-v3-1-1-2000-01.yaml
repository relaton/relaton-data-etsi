  script: Latn
  content: "This specification describes the documents being produced by the 3GPP
    TSG RAN WG1and first complete versions expected to be available by end of 1999.
    This specification describes the characteristics of the Layer 1 multiplexing and
    channel coding in the FDD mode of UTRA.\r\n\r\nThe S1 series specifies Um point
