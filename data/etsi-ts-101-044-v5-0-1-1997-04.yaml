abstract:
- language: en
  script: Latn
  content: "This standard specifies the stage 2 description for the first phase of\r\nthe
    CAMEL feature (Customised Applications for Mobile network Enhanced\r\nLogic) which
    provides the mechanisms to support services of operators\r\nwhich are not covered
    by standardised GSM services even when roaming\r\noutside the HPLMN.\r\nThe CAMEL
    feature is applicable to mobile originated activity, to\r\nterminated traffic,
    and to the ability of the HPLMN to interrogate or\r\nto instruct the VPLMN or
    IPLMN at any time. A PLMN supporting CAMEL\r\nshall also support at least Optimal
    routing for conditionally\r\nforwarded calls.\r\nIn this specification, the CAMEL
    service environment (CSE) is treated\r\nas being part of the HPLMN. The regulatory
    environment in some\r\ncountries may require the possibility that the CSE and
    the HPLMN are\r\ncontrolled by different operators, and the CSE and HLPMN are
    therefore\r\ndistinct entities.\r\nIn the first phase the CAMEL feature supports:\r\n-\tmobile
    originated calls\r\n-\tmobile terminating calls\r\n-\tany time interrogation\r\n
    The mechanism described addresses especially the need for information\r\nexchange
    among the VPLMN or IPLMN and the HPLMN for support of such\r\noperator specific
    services. Any user procedures for the control of\r\noperator specific services
    are outside the scope of this standard.\r\nSubscribers who have subscribed to
    operator specific services and in\r\nturn need the functional support of the CAMEL
    feature shall be marked\r\nin the HPLMN and VPLMN. In case a subscriber is marked
    to need such\r\nsupport, the appropriate procedures which provide the necessary\r\ninformation
    to the VPLMN or to the HPLMN are invoked. It is possible\r\nfor the HPLMN to instruct
    the VPLMN or IPLMN to interact with a GSM\r\nService Control Function which is
    logically distinct from both the\r\nHPLMN and VPLMN, but eontrolled by the HPLMN.\r\nThe
    CAMEL feature is a network feature and not a supplementary\r\nservice. It is a
    tool to help the network operator to provide the\r\nsubscribers with the operator
    specific services even when roaming\r\noutside the HPLMN.\r\nThe specification
    of operator specific services in HPLMN are outside\r\nthe scope of this standard.
    This specification describes only the\r\ninterface between the VPLMN or IPLMN
    and HPLMN (including procedures\r\nto be supported in the VPLMN/IPLMN).\r\n "
