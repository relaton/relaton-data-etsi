abstract:
- language: en
  script: Latn
  content: The present document specifies a coded representation of audio information,
    and specifies the decoding process. Informative information on the encoding process
    is included. The coded representation specified herein is suitable for use in
    digital audio transmission and storage applications. The coded representation
    may convey from 1 to 5 full bandwidth audio channels, along with a low frequency
    enhancement channel. A wide range of encoded bit-rates is supported by the present
    document. A short form designation of the audio coding algorithm specified in
    the body of the present document (whether or not annex D is included) is "AC-3".
    The short form designation of the audio coding algorithm specified in annex E
    is "E-AC-3".
