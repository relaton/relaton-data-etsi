abstract:
- language: en
  script: Latn
  content: "This revision of NFV-IFA 010 propagates the deliverable into NFV Release
    4. This edition will add requirements to support Release 4 features (listed in
    the Release 4 Definition) and will extend the scope of the former Release 3 edition
    summarized hereafter:\r\nNFV-IFA 010 specifies functional requirements for NFV
    management and orchestration, and general guidelines and requirements for NFV
    management and orchestration interface design. NFV-IFA 010 does not cover the
    functional requirements on interfaces."
