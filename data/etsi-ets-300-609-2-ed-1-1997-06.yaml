  content: "This ETS  contains the signalling aspects of the Base Station System\r\nfor
    GSM.  The set of signalling tests cover  major areas of\r\nfunctionality  on the
    \ air, a-bis and A interfaces, but is not\r\ndesigend to be a complete set  of
    all the possible scenarios.\r\nThe tests were designed from the set of core recommendations
    that\r\nexist for the GSM network and any changes that occur these\r\nrecommendations
    will be reflected in the test set  documented within.\r\n  "
