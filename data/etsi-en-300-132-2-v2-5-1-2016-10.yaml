abstract:
- language: en
  script: Latn
  content: "The following items should be revised in the present EN 300 132-2 V2.4.6:\r\n1)Clause
    4.3.2 “Abnormal conditions: voltage variations, dips and short interruptions”
    in order to cover the fault conditions on the DC network (e.g. 10 ms dips)\r\n2)Clause
    4.9 “Conducted emissions requirements of the telecommunications and datacom (ICT)
    equipment at interface \"A\"”. Clarify the applicability of this test when there
    are no analog ports.\r\n3)      To correct the capacitor value of figure 5 \r\n4)
    \     to revise inrush current requirement in clause 4.7 and Annex C in line with
    EN 300 132-3-1"
