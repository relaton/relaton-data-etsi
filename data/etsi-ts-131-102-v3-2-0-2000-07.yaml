abstract:
- language: en
  script: Latn
  content: "T3#6: Joint rapporteurs: Makoto.Kobayashi2@NRJ.ERICSSON.SE (Nippon Ericsson)
    and Christian Heim (Giesecke & Devrient).\r\n__________\r\nJustification and scope\r\nThis
    work item creates the specification for the USIM on a UICC. The document defines
    the USIM specific command parameters, file structures, contents of EFs (Elementary
    Files), security functions and application protocol to be used on the interface
    between UICC (USIM) and terminal. Note: General UICC physical and logical characteristics
    are specified in the work item \"UICC physical and logical characteristics\"\r\n3GPP
    Work Area: - TSG-T WG3.\r\nLinked work items: - UICC and USIM requirements; -
    UICC physical and logical characteristics \r\nService Aspects: - None \r\nMMI-Aspects:
    - None\r\nCharging Aspects: - None\r\nSecurity Aspects: - Security requirements
    from TSG-SA WG3 shall be taken into account.\r\nImpacts: - Affects: - USIM; -
    ME\r\nPrimary responsibility: - 3GPP TSG-T  WG3 (USIM)\r\nSecondary responsibility:
    - 3GPP TSG-T WG2 (Terminal capabilities); - 3GPP TSG-SA WG3 (Security)\r\n"
