abstract:
- language: en
  script: Latn
  content: "The present document states the minimum operational and performance requirements
    for shipborne receivers intended to be connected to an external installation,
    including a decoder for DSC, and used as receivers for watchkeeping DSC on board
    ships operating in the mobile MF, MF/HF and VHF band allocated in the ITU Radio
    Regulations [1] to the maritime mobile service, both in connection with distress
    and safety communication and in connection with general communication.\r\nThese
    requirements include the relevant provisions of the ITU Radio Regulations [1],
    ITU-R Recommendations M.493-11 [3], M.541-9 [11], M.489-2 [10] and the IMO Resolutions
    A.803(19), A.804(19), A.806(19) and A.694(17).\r\nThe present document specifies
    also technical characteristics, methods of testing and required test results for
    dedicated watchkeeping receivers for use with radio installations in the GMDSS
    as required by chapter IV of the SOLAS.\r\nIt covers both receivers with analogue
    output or with digital DSC signal output interfaces or with both.\r\nDSC watchkeeping
    receivers may be a separate equipment or be integrated with a DSC or radiotelephone
    equipment.\r\nFor integrated equipment the present document specifies the requirements
    and methods of testing of the DSC watchkeeping receivers only.\r\nDSC watchkeeping
    receivers can be either fixed-frequency receivers or, in MF/HF bands, scanning
    receivers.\r\nRequirements for the DSC equipment or radiotelephone equipment are
    given in EN 300 338 [13], EN 300 162-1 [12] and EN 300 373-1 [14] respectively.\r\n\r\n"
