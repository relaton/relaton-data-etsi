abstract:
- language: en
  script: Latn
  content: "The work item looks at the medium access control and routing for Smart
    Body Area Networks (Smart BANs). The work item will define an ultra low power
    medium access control protocol for on-body communications between a \r\nhub and
    sensor nodes. There will also be provision made for relaying of data through a
    relay node to the hub."
