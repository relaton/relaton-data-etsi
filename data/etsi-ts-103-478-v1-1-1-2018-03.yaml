abstract:
- language: en
  script: Latn
  content: "There are presently hundreds of emergency calling applications in use
    across Europe but their use is constrained to the boundaries of the PSAP they
    are integrated with. The aim of PEMEA server side architecture is to solve this
    problem and make possible that the data arrive to the most appropriate PSAP wherever
    the call is made, i.e. the PSAP where the voice call is routed to. This way, users
    will continue  to be able to select an application that meets their needs and
    the accurate location and other information provided by the apps will be sent
    to the most appropriate PSAP in a time of need. \r\nThe document will cover:  -
    requirements and functional architecture: definition of the functional architecture
    and assignment responsibilities to each of the identified entities. Definition
    of the information exchange formats between entities where interoperability between
    different organisations is required.   - data flow, protocol definitions and procedures:
    XML schema implementing the message flows, specification of the transport protocol
    and associated security measures."
