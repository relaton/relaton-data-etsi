abstract:
- language: en
  script: Latn
  content: "The purpose of this document is to define quantitative evaluation criteria
    of network autonomicity categories, which are defined in the published GR ENI
    007. \r\nThis document is composed of three components: (1) to further define
    the categories and quantitative factors determining the network autonomicity categories;
    (2) to define a framework of quantitative evaluation process and a scoring criteria;
    (3) to describe several scenario examples of quantitative evaluation criteria.\r\n"
