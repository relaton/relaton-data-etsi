abstract:
- language: en
  script: Latn
  content: "Define the control procedures for trunk gateways when PSTN/ISDN emulation
    and PSTN/ISDN simulation services in an NGN Network require interworking with
    a ETSI PSTN/ISDN services in a BICC/ISUP network.\r\nExisting profiles will be
    evaluated, in order to determine if they can be re-used, with possible modifications,
    or if a completely new profile is to be defined."
