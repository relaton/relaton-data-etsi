  content: "SUBJECT\r\nCR for removal of checks on Classmark 1,2,3 in the PIXIT statements
    (Tdoc SMG7 350/98)\r\nCR on Introduction of cell change tests for VGCS/ VBS\r\nCR
    on UA frame with different information field\r\nCR to section 3.2.2 on Applicability
    of R-GSM RF tests\r\nCR to section 26.6.3.6  Measurement reporting 20s requirement
    in multi band environment\r\nCR to section 32.12.x Intra cell channel change from
    TCH/FS to a TCH/HS\r\nCR to section 34.3.3 Correction of the content of the Cell
    Broadcast message\r\nCR for Clarification on 34.2.1 TC testing of TC1M\r\nCR to
    section 26.1.2.2.1 EFR signalling/Handover/active call/successful case\r\nCR to
    section 32.11.x Intra cell channel change from TCH/HS to a TCH/FS\r\nCR to section
    26.6.3.2  Measurement reporting 20s requirement in single band environment\r\nCR
    to section 3.2.2 Addition of ASCI cell change signalling tests Applicability\r\nCR
    to section 14.7 blocking and spurious response\r\nCR to section 26.11.2.2.3.3
    Multiband BCCH / Intercell Handover\r\nCR to section 26.6.15 DCS HO Tests, NCD
    to include missing BCCH ARFCH\r\n"
