abstract:
- language: en
  script: Latn
  content: "This Technical Specification defines the stage two\r\ndescription of the
    Shared Inter Working Function (SIWF) on Global Syst\r\nem for Mobile communications
    (GSM).\r\nA stage one description does not exist because this service is not vis\r\nible
    to the service subscribers and users.  This stage two identifies\r\nthe functional
    Capabilities and information flows needed to support th\r\ne service. The signalling
    system protocols and switching functions nee\r\nded to implement this service
    are defined in the relevant specificatio\r\nns.\r\nInterworking with other networks
    (e.g. PSTN) needs the presence of spe\r\ncific functions associated with the MSC,
    known as interworking functio\r\nns (IWF). The IWFs depend on the type of network
    with which it is desi\r\nred to interconnect and the type of service desired.\r\nA
    Shared Inter Working Function is a network function that may be used\r\nby any
    MSC in the same PLMN to provide interworking for a data/fax ca\r\nll. Whereas
    an IWF can only be used by its MSC, the SIWF can be used b\r\ny several other
    network nodes e.g. any MSC within the same PLMN.  SIWF\r\nis applied to data services
    in GSM phase 2 and GSM phase 2+ (as defi\r\nned in GSM 02.02, GSM 02.03 and GSM
    02.34).\r\nThe usage of a SIWF requires no additional manipulation at the MS.\r\nThere
    is an interest to have a Shared  Interworking Function (SIWF) fo\r\nr the following
    reasons:\r\n- possibility to  fabricate/obtain  the specific functionality needed\r\nfor
    data services  in areas where data traffic is expected to be low,\r\n- handling
    of data calls in case of local overload of the data traffic\r\n,\r\n- quick introduction
    and roll-out of new data services.\r\n"
