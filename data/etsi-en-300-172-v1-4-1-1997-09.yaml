abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) defines the layer 3\r\nprotocol
    for signalling for the support of circuit-mode bearer\r\nservices (used either
    on their own or in support of teleservices) at\r\nthe Q reference point between
    Private Integrated services Network\r\neXchanges (PINX) connected together within
    a Private Integrated\r\nServices Network (PISN). The Q reference point is defined
    in\r\nETS 300 475-1.\r\n  "
