abstract:
- language: en
  script: Latn
  content: "This revision of NFV-SOL 014 continues the development of the specification
    as part of the NFV Release 3. This edition will add requirements and specification
    of interfaces to support the Release 3 features. The scope of the former Release
    3 published edition is summarized hereafter:\r\nNFV-SOL 014 specifies a set of
    YAML-based data models for descriptor-based virtualised resource management fulfilling
    the requirements concerning the input and output information exchanged over the
    virtualised resource management interfaces specified in the ETSI GS NFV-IFA 005,
    and the ETSI GS NFV-IFA 006. NFV-SOL 014 focuses on data models used in the virtualised
    resource descriptors for the Virtualised Compute interfaces, Virtualised Network
    interfaces and Virtualised Storage interfaces, which are used to perform orchestration
    and lifecycle management for consumable virtualised resources comprised of compute,
    network and storage. Other virtualised resource management interfaces, as well
    as data models for information specified in ETSI GS NFV-IFA 011 and ETSI GS NFV-IFA
    014, are out of the scope of NFV-SOL 014."
