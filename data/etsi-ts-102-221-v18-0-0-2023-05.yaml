abstract:
- language: en
  script: Latn
  content: "When the physical interface is not accessible to an attached test tool,
    alternative methods for the verification of conformance requirements based on
    APDU communication on the UICC-terminal interface are needed. The LS C6-220198/SETTEC(22)000102
    from 3GPP WG CT6 is proposing a new verification method based on toolkit test
    events as one of the recommended test methods.\r\n\r\nThis Work Item defines the
    implementation of the requirements in TS 102 412 for the Test Specific Operating
    Mode and Test Configuration.\r\n \r\nThe usage of the toolkit test event remains
    under the responsibility of the NAA specific test specifications (eg: 3GPP 31.127
    and 3GPP 31.117, currently in development stage).\r\n\r\nThe scope of this Work
    Item is as below.\r\n\r\nTest specific operating mode:\r\n- Implementation of
    the requirements defined in TS 102 412 for the Test Specific Operating Mode\r\n\r\nTest
    configuration:\r\n- Implementation of the requirements defined in TS 102 412 for
    the Test Configuration\r\n"
