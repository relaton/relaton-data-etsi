abstract:
- language: en
  script: Latn
  content: The ZSM framework and architecture is designed to support automated and
    autonomous network operations. This WI will examine the ZSM framework capabilities
    required to support autonomy. In a first part of the WI activity, the differences
    between automation and autonomy, and among levels of autonomy, will be highlighted
    through a review of completed ZSM work and other industry work. The study work
    is driven by scenarios that would benefit from autonomy, it includes an activity
    aimed at identifying the ZSM framework capabilities to fulfil autonomy. Additionally,
    possible service gaps will be addressed. Collaboration with and reference to other
    SDOs (e.g. in TM Forum, IRTF NMRG, 3GPP SA5) will be recommended when appropriate.
