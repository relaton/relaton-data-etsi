abstract:
- language: en
  script: Latn
  content: This work item focuses on the enhancement and maintenance of Mp1 reference
    point between multi-access edge applications and multi-access edge platform, that
    allows those applications to interact with the multi-access edge system. This
    includes both updating the existing features and defining new features. It will
    describe the information flows, required information, and as applicable, will
    specify the necessary operations, data model and data format.
