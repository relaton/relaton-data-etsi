abstract:
- language: en
  script: Latn
  content: "To develop the model, a three-stage approach is used where the first two
    stages use empirical test results to estimate parameters and to substantiate the
    analytical model.\r\nMeasurements are evaluated based on variations in the operational
    environment, which takes into account the uncertainty in an installations location.
    This evaluation points to potential trouble spots and helps in determining strategies
    for alleviating them"
