  script: Latn
  content: New Test Suite Structure and Test Purposes document for the version 1.3.1
    of HiperMAN needs to be developed and later maintained in paralel with the TSS&TP
    for the version 1.2.1 of HiperMAN since both types of products are expected to
    require testing to achieve interoperability. The development needs to cover test
    purposes for PHY independent DLC/MAC functions.
