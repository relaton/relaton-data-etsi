  script: Latn
  content: "The release 1 version of ES 202 737, 202 738 , 202 739 and 202 740 are
    not yet complete with respect to the tests and measurement procedures  in the
    different conversational situations. It is expected that new test methodologies
    are available soon to be integrated in the standards. Furthermore the method described
    in new EG 202 396-3 needs to be integrated. \r\nTherefore the release 2 version
    of the above named documents is planned."
