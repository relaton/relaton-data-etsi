abstract:
- language: en
  script: Latn
  content: "This European Telecommunications Standard (ETS) describes the\r\ntechnical
    characteristics and methods of test for Mobile Stations\r\n(MS),\r\n20/02/97:(ID)
    Version 4.18.0 approved at SMG#21 as a result of :\r\nRXQUAL Static test\r\nInitial
    test conditions\r\nSection 14.1.2.2 Bad frame indication - TCH/HS - Frequency
    hopping and\r\ndownlink DTX\r\nTest 26.6.13.8.1 - T2 not referenced in HANDOVER
    COMMAND\r\nDescription in Proc 4 of 26.7.4.2.4 does not match  Expected sequence\r\nTest
    parameters in 26.6.1 do not match message contents\r\nCorrections to 26.7.4.3.2\r\nCorrection
    to 26.7.3.2\r\nCorrection of expected sequence in section 26.7.4.3.4\r\nApplicability
    of some handover tests\r\nCorrections of ASN.1 message codings\r\nCorrect handling
    of SI 5ter for EGSM mobiles\r\nAOC on a Call HOLD call\r\nTiming requirement in
    section 26.7.4.3.2.3\r\nError in SMS test 34.2.1\r\nMultiband Handover and Mobility
    management\r\nSection 29.3.2.6.8 Retransmission of a sequence\r\nRXLEV selectivity\r\nSection
    29.3.2.6.6 Incorrect response to checkpointing\r\nOutgoing Call / U0 Null state\r\nCorrection
    to message codings in section 31.11  Specific message conte\r\nnts\r\nCorrection
    of default message contents for structured procedures tests\r\nStructured procedures
    / MS originiated call / early assignment\r\nStructured procedures / MS originiated
    call / late assignment\r\ntest duration in 34.2.1 and 34.2.2\r\nCause information
    element default message contents for CC tests\r\nRXQUAL test under TU50 conditions\r\nSections
    26.6.13, 26.6.14, 26.6.15 - Starting time and defaults\r\nCorrect handling of
    SI 2ter for EGSM mobiles\r\nCorrection of 26.9.4 to allow for MS supporting immediate
    connect\r\nClarification of section 26.6.12\r\nDefault page mode\r\n"
