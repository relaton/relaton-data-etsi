abstract:
- language: en
  script: Latn
  content: "Define common architecture and protocol to support home and industrial
    sensors, alarms, telematics and multimedia including F-MMS and machine-to-machine
    messages. The specification should ensure low cost terminals and an easy to use
    application interface. It covers three interfaces: \r\n·DECT air interface, \r\n·tethered
    FP interface to networks and\r\n·tethered PP interface to external equipment\r\n"
