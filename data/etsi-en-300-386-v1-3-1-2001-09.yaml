abstract:
- language: en
  script: Latn
  content: "- to extend the scope to CATV and multimedia equipment with reference
    to EN50083-2 for the appropriate port requirements\r\n- to include Power Line
    Telecommunication equipment with reference to EN55022 for radio frequency limits
    and associated measurement methods\r\n- to include the applicability statement
    given in the EN55024\r\n- to include the specific requirements for EMC testing
    of xDSL Access Systems\r\n- to remove the resistibility requirements\r\n- to include
    the radiated immunity test up to 2GHz\r\n- to align the emission requirements
    to EN55022 \r\n\r\n\r\n"
