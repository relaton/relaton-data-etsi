abstract:
- language: en
  script: Latn
  content: "Stage 3 description for Conference call (CONF) like service in TISPAN
    NGN IMS.\r\nIncluding an analysis of the re-use of the Tool-kit of 3GPP to deliver
    the service. If new capabilities are needed they should be defined in cooperation
    with 3GPP and in accordance with RFC3427.\r\nInteroperability between networks
    must be taken into consideration. \r\nInterworking between NGN and PSTN/ISDN will
    be specified.\r\nNote: This specification covers a CONF service as defined by
    the ISDN/PSTN CONF service description. \r\nThe TISPAN NGN release 1 definition
    also provides for the support of a conferencing capability as defined by 3GPP
    in 3GPP TS 24.147. It should be considered if the capabilities defined  within
    TS 24.147 fits the requirements needed by this WI then the Stage 3 description
    should be adopted to the principles for TISPAN IMS."
