abstract:
- language: en
  script: Latn
  content: "The present document specifies the minimum requirements for shipborne
    radio transmitters and receivers for fixed installations operating in the VHF
    frequency bands between 156 MHz and 174 MHz allocated to the maritime mobile service,
    using both 25 kHz and 12,5 kHz channels and capable of Radiotelephony and Digital
    Selective Calling communications within the Global Maritime Distress and Safety
    System. The present document incorporates the requirements of the relevant resolutions
    of the International Maritime Organization (IMO) and is primarily intended to
    specify equipment suitable for fitting to ships subject to the SOLAS Convention
    [1] and complying with the European Marine Equipment Directive [2].\r\nThe EMC
    parameters defined in the clauses of the present document covering emission tests
    and immunity tests (see clauses 10 and 11) have been selected to ensure an adequate
    level of compatibility for apparatus in marine environments. Should the EMC requirements
    in this standard conflict with those of EN 60945 [17], then the requirements of
    this standard shall take precedence.\r\nCompliance to the EMC requirements of
    the present document does not signify compliance to any safety requirements. However,
    it is the responsibility of the assessor of the equipment to record in their test
    report any observations regarding the test sample becoming dangerous or unsafe
    as a result of the application of the tests called for herein.\r\nThe present
    document does not address the testing of ancillary equipment on a stand-alone
    basis, i.e. separately from the radio equipment with which it is to be used.\r\n\r\n\r\n"
