abstract:
- language: en
  script: Latn
  content: "This revision of  NFV-IFA 032 continues the development of the specification
    as part of the NFV Release 3. The scope of the previous work item is summarized
    hereafter:\r\n\r\nSpecify the interfaces for multi-site connectivity services
    produced by a WAN Infrastructure Manager (WIM). The document will also describe
    the operations and the information elements exchanged over those interfaces. The
    interfaces will focus on management aspects for enabling inter-connectivity between,
    and management of network services across, multiple NFVI-PoPs over WAN infrastructure.\r\n\r\nThis
    revision will also reflect the maintenance needed for the previous version.\r\n"
