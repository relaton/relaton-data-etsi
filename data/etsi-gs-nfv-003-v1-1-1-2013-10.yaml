abstract:
- language: en
  script: Latn
  content: "This document intends to provide terms and definitions for conceptual
    entities with the scope of the NFV work, in order to achieve a “common language”
    across all the NFV working groups and for wider industry discussions on this topic.\r\n\r\nIt
    should be noted, that terminology and architecture very much depend on each others,
    and that this document may need to be revised throughout the process of architecture
    work. In that sense this document shall be understood as a living document, which
    requires regular update and extension, the more granular conceptual entities are
    defined. Workgroups are requested to contribute to this paper to capture the latest
    discussions on conceptual entities being defined in the different Working Groups.\r\n"
