  script: Latn
  content: 'This Work Item develops a revision of ETSI GS MEC028 to address observations
    and issues with the specification that have been indicated by implementors, for
    example the MEC Sandbox, such as:  Measurement Configuration, List Cardinality,
    Data Type Specification (of unspecified types), unused types, and event reporting
    conditions.  It will correct errors and omissions within the specification, update
    terminologies, and provide fixes.'
