abstract:
- language: en
  script: Latn
  content: "This document describes the \"DVB File Format\" - describing the full
    richness of experience that is offered by DVB compliant services. \r\nThe file
    format is derived from the ISO base media file format, and as such provides much
    commonality with many other similarly derived file formats, such as the MP4 file
    format or the 3GP file format. \r\n"
