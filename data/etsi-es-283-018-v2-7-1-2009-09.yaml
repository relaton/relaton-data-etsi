  script: Latn
  content: "1 Interpretation of package support was further clarified by ITU-T SG-16
    after Ia v2 was approved. This means text in Ia v2 needs to be updated correspondingly.
    Affects clause 5.14.\r\n2.Interaction between filters after latching occurred
    was further clarified by ITU-T SG-16 after Ia v2 was approved. This means text
    in Ia v2 needs to be updated correspondingly. Affects clause 5.18.1.1.1.\r\n3.Semantics
    for “ignore” was further clarified by ITU-T SG-16 after Ia v2 was approved. This
    means text in Ia v2 needs to be updated correspondingly. Affects clause 5.15 and
    5.16.\r\n4 Further identified corrections needed."
