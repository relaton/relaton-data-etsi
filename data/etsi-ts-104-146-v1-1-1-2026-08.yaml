abstract:
- language: en
  script: Latn
  content: Produce a new ETSI Technical Specification for an authenticated hybrid
    key establishment method, including requirements for QKD. TS 103 744 Quantum-safe
    Hybrid Key Establishment does not provide authentication, nor does it consider
    the information theoretical property of this mixing of QKD keys.  This specification
    will define a method for authenticated quantum-safe hybrid key establishment that
    can support information theoretical security property of mixing in QKD keys.
