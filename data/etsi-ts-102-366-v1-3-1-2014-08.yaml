abstract:
- language: en
  script: Latn
  content: "The present document specifies two coded representations of audio information,
    and specifies the decoding process for each coded representation. Informative
    information on the encoding process is included. The coded representations specified
    herein are suitable for use in digital audio transmission and storage applications.
    The coded representation may convey multiple full bandwidth\r\naudio signals,
    along with a low frequency enhancement signal. A wide range of\r\nencoded bit-rates
    is supported by the present document.\r\nA short form designation of the audio
    coding algorithm specified in the body of the\r\npresent document (whether or
    not annex D is included) is \"AC-3\". The short form\r\ndesignation of the audio
    coding algorithm specified in annex E is \"E-AC-3\"."
