abstract:
- language: en
  script: Latn
  content: "To completely revise current EN 300 407, using EN 300 197 as a reference
    document for full duplex point-to-point systems.   To include all PDH & SDH capacities,
    1-4 spectrum efficiency classes, co- and adjacent channel interference sensivity
    figures and transmitter spectrum masks, where defined, within EN 300 197.  The
    mode of operation shall be limited to full duplex.  To delete all references to
    analogue systems.\r\n\r\n"
