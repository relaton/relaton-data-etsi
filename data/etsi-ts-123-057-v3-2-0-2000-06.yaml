abstract:
- language: en
  script: Latn
  content: "Transfer of GSM 03.57 to 3GPP.\r\n__________________\r\nThis TS defines
    the stage two description of the Mobile Station Application Execution Environment
    (MExE). Stage 2 identifiesthe functional capabilities and information flows needed
    to support the service described in stage 1. This TS includes information applicable
    to network operators, service providers and terminal, switch and database manufacturers.
    This TS contains the core functions for a Mobile Station Application Execution
    Environment (MExE) which are sufficient to provide a completeservice. MExE uses
    a number of technologies to realise the requirements of the stage 1 description
    (GSM 22.057). This TS describes how the service requirements arerealised with
    the selected technologies. The TS is devised into sections each covering the aspects
    relating to particular MExE technologies, it isintended that this specification
    will evolve along with the MExE technologies. A generic section of the specification
    covers areas of MExE commonto all technologies."
