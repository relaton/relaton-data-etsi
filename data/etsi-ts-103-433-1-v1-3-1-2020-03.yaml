abstract:
- language: en
  script: Latn
  content: "The goal of TS 103 433 V1.1.1 and V1.2.1 was to standardize a single layer
    HDR system addressing direct backwards compatibility i.e. a system leveraging
    SDR distribution networks and services already in place and that enables high
    quality HDR rendering on HDR-enabled CE devices including high quality SDR rendering
    on SDR CE devices. \r\nThe goal of the present work item is to produce a revision
    of the referenced standard that includes some fixes and also some enhancements.
    Examples for enhancements are a more flexible HDR-to-HDR display adaptation, addition
    of 4CCs (4 Character Codes) for signaling SL-HDR in streaming services, and the
    addition of SL-HDR interfaces to DVB for parts where DVB does not yet have requirements.
    \r\nNote that existing functionality described in TS 103 433-1 V1.2.1 and the
    associated syntax/semantics of the SEI message will not be changed."
