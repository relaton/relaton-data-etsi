abstract:
- language: en
  script: Latn
  content: Specify protocols to enable trusted, secure communication sessions between
    network endpoints and one or more middleboxes between them using encryption. The
    specification is intended to facilitate implementation profiles for a wide array
    of implementations and applications. The present document covers a definition
    of a Middlebox Security Protocol. The remainder of the scope is covered in the
    other parts of the specification.
