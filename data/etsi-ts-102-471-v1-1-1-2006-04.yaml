- language: en
  script: Latn
  content: "Electronic Service Guide (ESG) contains information about the services
    available. Through the information in the ESG, the user can select the services
    and items he/she is interested in and find stored items on the terminal. \r\nThe
    present document defines the datamodel, the representation format, the encapsulation
    and the transport of the Electronic Service Guide of DVB-H [1].\r\n"
