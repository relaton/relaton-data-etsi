abstract:
- language: en
  script: Latn
  content: "This revision of NFV-IFA 049 continues the development of the specification
    as part of the NFV Release 5. This edition will add requirements to support the
    Release 5 features. The scope of the former edition is summarized hereafter:\r\n\r\nNFV-IFA
    049 specifies: a) functional requirements on sets of VNF generic OAM functions,
    specifications of the VNF generic OAM functions, and requirements on the architectural
    setup in relation to the NFV architectural framework, b) interface requirements
    for the set of interfaces exposed by the VNF generic OAM functions towards NFV-MANO
    and other management entities, c) requirements and modeling of runtime information
    exposed through the specified interfaces towards NFV-MANO and other management
    entities, d) service requirements for the interactions on interfaces with the
    VNFs that make use of and are associated to the VNF generic OAM functions, and
    e) requirements and modeling of design time information of descriptors for the
    specified VNF generic OAM functions."
