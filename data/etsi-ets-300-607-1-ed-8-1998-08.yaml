abstract:
- language: en
  script: Latn
  content: "SUBJECT\r\n Editorial modifications to section 3.2.2, table 3.1 Applicability
    of EFR tests\r\nPhase 2+Transmitter: Frequency error and phase error in multislot
    configuration\r\nAllow use of artificial ear type 3.2 for speech teleservices
    tests\r\nPhase 2- Section 14 - incorrect references to Phase 1\r\nPhase 2- section
    20.8Cell reselection when C1 (serving cell) < 0 for 5 seconds\r\nPhase 2- section
    20.20.2Multiband cell selection and reselection / Cell reselection\r\nPhase 2-
    section 30.6.1 Echo loss\r\nPhase 2-Editorial modifications to section 12.1.1.4.2\r\nSection
    30 and section 2 Allow use of artificial ear type 3.2 PIXIT\r\nEditorial modifications
    to section 22.5\r\nEditorial modification of section 22.2\r\nPhase2 Editorial
    modifications to section 20.1.4.1 & 20.20.1.4.1\r\nEditorial correction to Section
    26.10.2.5.3 CR to 11-10-1,Editorial correction to Section 26.10.2.5.3\r\nCR to
    11.10-1 Section 29.3.2.6.7 Total loss of response to checkpointing\r\nCR to 11.10-1
    Section 29.3.2.6.5 No response to checkpointing\r\nCR to 11.10-1 Section 29.3.2.6.3
    End of a sequence\r\nCR to 11.10-1 Section 29.3.2.6.2 End of a window\r\nCR to
    11.10-1 Section 29.3.2.6.1 SS in checkpoint recovery mode\r\nCR to 11.10-1 Section
    29.3.2.2.2 Transmission Window\r\nCR to 11.10-1 Section 29.3.1.2.2 Total loss
    of UA frame\r\nAddition of test case references\r\nEditorial modifications to
    Annex 3.2.3.1/3/4 removal of Phase 1 references\r\nEditorial modifications to
    section 26.12.2.2\r\nSection 26.10.2.3 Incorrect Frequencies Specified\r\nCorrection
    of 26.7.4.3.4\r\nEditorial modifications to section 26.12.2.1.3\r\nEditorial modifications
    to section 31.6.2.4\r\nPhase 2 Addition of a test purpose in 26.11.3 to test L2
    pseudolength different from 18 in SysInfo 2ter\r\n"
