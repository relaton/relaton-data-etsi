abstract:
- language: en
  script: Latn
  content: "This revision of NFV-IFA 008 propagates the deliverable into NFV Release
    4. This edition will add requirements to support Release 4 features (listed in
    the Release 4 Definition) and will extend the scope of the former Release 3 edition
    summarized hereafter:\r\n\r\nNFV-IFA 008 specifies the interfaces supported over
    the Ve-Vnfm-em and Ve-Vnfm-vnf reference points of the NFV-MANO architectural
    framework ETSI GS NFV-MAN 001 as well as the information elements exchanged over
    those interfaces."
