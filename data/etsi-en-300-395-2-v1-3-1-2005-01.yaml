abstract:
- language: en
  script: Latn
  content: "Selection and standardisation of additional speech codec(s) for TETRA,
    to enable intercommunication between TETRA and other 3G networks without transcoding,
    and to provide enhanced voice quality for TETRA by using the latest low bit rate
    voice codec technology.\r\nAreas involved expected to include:\r\n-speech coding;\r\n-FEC,
    CRC, interleaving;\r\n-protocol amendment;\r\ninter-system interface."
