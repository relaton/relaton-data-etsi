abstract:
- language: en
  script: Latn
  content: "To investigate the potential for international harmonization of policy
    requirements for CAs. This relates to the work in the US and other international
    activities specifying security management and policy requirements for CSPs issuing
    certificates (qualified or other) to ensure harmonization with the European standardization
    in this area. As well as influencing these other international activities, this
    work will identify variations in the requirements as specified in ETSI TS 101
    456 (“Policy requirements for CA issuing qualified certificates”). This activity
    will include discussions and where possible achieve harmonisation with relevant
    organisations such as: ABA, FPKI, IETF, PKI Forum, WAP Forum.\r\n"
