abstract:
- language: en
  script: Latn
  content: "This standard specifies the technical realisation of the handling of c\r\nalls
    originated by a GSM mobile subscriber and calls directed to a GSM\r\nmobile subscriber,
    up to the point where the call is established. Nor\r\nmal release of the call
    after establishment is also specified.\r\nThe handling of DTMF signalling and
    Off-Air Call setup (OACSU) are not\r\ndescribed in this specification.\r\nThe
    details of the effects of GSM supplementary services on the handli\r\nng of a
    call are described in the relevant GSM 03.8x series of specifi\r\ncations.\r\n"
