abstract:
- language: en
  script: Latn
  content: "Stage 3 description for the Communication Barring  service in TISPAN NGN
    IMS. \r\nThe Communication Barring service implements ACR, ICB and OCB services
    as specified in DTS/TSIPAN-01002. Including an analysis of the re-use of the Tool-kit
    of 3GPP to deliver the service. If new capabilities are needed they should be
    defined in cooperation with 3GPP and in accordance with RFC3427. Interoperability
    between networks must be taken into consideration. Interworking between NGN and
    PSTN/ISDN will be specified."
