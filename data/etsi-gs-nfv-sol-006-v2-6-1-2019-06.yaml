abstract:
- language: en
  script: Latn
  content: "The scope of this work item is to develop a data model specification for
    NFV descriptors fulfilling the requirements specified in GS NFV- IFA 011 and NFV
    GS NFV-IFA 014. \r\n\r\nThe specification will be based on the YANG data modeling
    language (see RFC 6020, and the common data types defined in RFC 6021) . The deliverable
    will consist of a translation in YANG of the constructs in the template specified
    in GS NFV-SOL 001, and may contain any other artifact required to ensure descriptor
    equivalence. \r\n\r\nThe deliverable will contain normative provisions and, if
    necessary, an informative mapping between the terminology used in the YANG model
    and the terminology used in GS NFV-IFA 011 and 014. The need for this informative
    mapping will be assessed as the work progresses."
