  script: Latn
  content: To add extensions to the existing profile enabling HD operation and connection
    a broadband interaction channel. Also to include additional features including
    enhanced font rendering, support for interaction with PVRs and the DVB-CI, and
    to include character repertoire required for Chinese and Polish languages, amongst
    others. To include corrigenda arising from implementation of V 1.1.1.
