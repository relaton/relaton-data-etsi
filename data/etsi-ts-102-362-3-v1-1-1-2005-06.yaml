abstract:
- language: en
  script: Latn
  content: "This technical specification (TS) contains the Abstract Test Suite (ATS)
    to test the Land mobile service; Digital Mobile Radio (DMR) Air Interface.\r\nThe
    objective of this test specification is to provide a basis for conformance tests
    for DMR equipment giving a high probability of air interface inter-operability
    between different manufacturer's DMR equipment.\r\nThe ISO standard for the methodology
    of conformance testing (ISO/IEC 9646-1 and ISO/IEC 9646-2) as well as the ETSI
    rules for conformance testing (ETS 300 406) are used as a basis for the test methodology."
