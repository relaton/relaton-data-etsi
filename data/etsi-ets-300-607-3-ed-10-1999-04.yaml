abstract:
- language: en
  script: Latn
  content: "SUBJECT\r\nImplementing  TDoc 7-67/98\r\nImplementation Error: Incorrect
    Use Of Cell Allocation Data Strucutures\r\nImplementation error in Handover test
    cases sends wrong SysInfo6 message\r\nImplementation errors in the 26.6.5.4 test
    case series\r\nImplementation of Tdoc SMG7 137/98 (Hopping Channel required)\r\nImplementation
    problems in 26.6.13 series DCS Test Cases\r\nProblem in MO test cases for Dual
    Rate phones\r\nProblem with conflicting carrier initialisation in TC_20_15\r\nProblem
    implementing a TTCN pre-defined operation\r\nDCS implementation error in the 26.6.5.1
    test case\r\nDCS Handover Tests, NCD to include BCCH arfcn\r\nCorrection for DCS
    frequencies for 26_6_4_1\r\nImplementation errors in Handover test cases for Releasing
    the Channel being Handed Over From\r\nSI3 coding conflict in 26.2.4.3 and 26.2.4.4\r\nImplementation
    errors in Handover test cases cause L2 reaching N200 limit\r\nRF Signal parameter
    change for TC_20_1\r\n"
