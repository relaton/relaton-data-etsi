abstract:
- language: en
  script: Latn
  content: "The scope of this activity is to elaborate on the basic concepts and concerns
    regarding signature policies as presented in ETSI ES 201 733 and make such concepts
    accessible to application developers and potential users. This work item shall
    take advantage of the study on signature policies made under the ISIS program.
    \r\n\r\nThis deliverable shall be an explanatory part that will be partly tutorial
    and partly descriptive that translates the standard into real world terms. The
    deliverable shall be included into TS 101 733 as an informative annex."
