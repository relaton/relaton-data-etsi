abstract:
- language: en
  script: Latn
  content: "The present document contains a stage 1 description of the interception
    information in relation to the process of binding a \"target identity\" to a physical
    line termination point of a NWO when providing Internet Access and a stage 2 description
    of when Intercept Related Information (IRI) and Content of Communication (CC)
    shall be sent, and what information it shall contain.\r\nThe document shall include
    but not be restricted to IRI based on application of Dynamic Host Configuration
    protocol (DHCP) and Remote Authentication Dial-in User Service (RADIUS) technology
    for binding a \"target identity\" to an IP address and CC for the intercepted
    Layer 2 packets.\r\nThis document shall describe the LI functionality via Layer
    2 including all specific informations and definitions.\r\nThe definition of the
    Handover Interface 2 (HI2) and Handover Interface 3 (HI3) and Layer 3 interception
    are outside the scope of the present document. For the handover interface is referred
    to TS 102 232."
