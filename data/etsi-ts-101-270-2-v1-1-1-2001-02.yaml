abstract:
- language: en
  script: Latn
  content: "To define the transceiver requirements of high bit-rate asymmetric (and\r\nsymmetric)
    metallic access transmission systems intended to transport\r\nadvanced broadband
    services.\r\nVDSL transmission is intended to operate over the periphery of existing\r\nmetallic
    access networks, and will consequently have reduced transmi\r\nssion range when
    compared with ISDN-BA, HDSL and ADSL systems.\r\n Cost effectiveness is seen as
    an important requirement by the network\r\noperators.\r\n This work item will
    encourage open discussion and dialogue between net\r\nwork operators and manufacturers,
    leading to the formulation of Part 2\r\nof the TS which will describe key electrical
    requirments.\r\nThis Part 2 will enable manufacturers to offer appropriate implementation
    specific requirements.\r\nConsideration shall be given to channel/plant characteristics,
    the access\r\nenvironment, bit-rates, latency, power feeding, EMC and spectral
    compatibility with existing narrow band services (e.g. POTS and ISDN-BA).\r\n"
