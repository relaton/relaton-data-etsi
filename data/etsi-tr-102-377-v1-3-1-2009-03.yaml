abstract:
- language: en
  script: Latn
  content: The present document describes the Digital Video Broadcasting Handheld
    (DVB-H) specification for digital terrestrial TV broadcasting to handheld portable/mobile
    terminals. It draws attention to the technical questions that need to be answered
    when setting up DVB-H services and networks plus it offers some guidance in finding
    answers to them. It does not cover in detail, issues linked to the content of
    the broadcasts such as Coding Formats, Electronic Programme Guides (EPG), Access
    Control (CA), etc.
