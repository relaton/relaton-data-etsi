  script: Latn
  content: "The scope of this description is the specification of the MAC protocol.
    \r\n\r\nThe following lists the  contents for the  specification of the MAC protocol:\r\n1.list
    of procedures\r\n2.logical flow diagrams for normal procedures\r\n3.logical description
    of message\r\n4.principles for error handling\r\n5.some exceptional procedures
    which are felt criteria\r\n6.It should, as far as possible, have the same format
    and outline as the final specification\r\n7.exact message format\r\n8.all scenarios\r\n\r\nEditors
    note: The list has to be reviewed\r\n\r\n"
