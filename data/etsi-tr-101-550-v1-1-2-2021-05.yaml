abstract:
- language: en
  script: Latn
  content: "The  document lists the documents used in the creation of EN 301 549 v.1.1.1
    on accessibility requirements for public procurement of ICT products and services
    in Europe and provides a source reference for any other documents\r\nneeded to
    implement the test procedures specified in that document.\r\n\r\nAs well as identifying
    the sources for the EN content, the present document also provides additional
    explanation to assist users of the EN with clarifications and supporting information
    about measurement methods, particularly where no globally agreed test presently
    exists.\r\n\r\nWhere there are any test gaps, these are identified and test descriptions
    and evaluation methodologies are developed. In those exceptional cases where it
    is not possible to do so, recommendations are given on how the gaps should be
    filled."
