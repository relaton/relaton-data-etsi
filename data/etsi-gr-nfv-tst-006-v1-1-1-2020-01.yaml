abstract:
- language: en
  script: Latn
  content: "-\tWill provide guidance and recommendations on how to leverage DevOps
    and CI/CD techniques across the boundary from SW provider to sercice provider,
    or any combination of developer, installation and operational entities \r\n\r\n-\tWill
    explore the implications of the processes with regard to the impact of the SW
    package handoff between SW provider and service provider, the required functionality
    in the NFV system, the different deployment and operational options\r\n \r\n-\tMay
    provide recommendations for a modification or addition to the description and
    contents of the SW package for testing/validation capability. It may impact DGS/NFV-IFA011
    (Network Functions Virtualisation (NFV); Management and Orchestration; VNF Packaging
    Specification\r\n\r\n-\tMay have some recommendations for future enhancements
    to the lifecycle management for upgrading the SW code, and test and performance
    metrics. Based on the existing and enhanced lifecycle management, the general
    procedures for software upgrade testing will be developed. Reference NFV(15)000275
    NFV REL \"Software Update/Upgrade Functionality Specification\"\r\n\r\n-\tThe
    resulting deliverable will be informative \r\n"
