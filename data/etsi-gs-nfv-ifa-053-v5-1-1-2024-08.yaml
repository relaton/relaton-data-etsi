abstract:
- language: en
  script: Latn
  content: "The work item analyzes architectural options for physical infrastructure
    management in an NFV environment. Starting from use cases from ETSI NFV documents
    (such as ETSI GS NFV-IFA 036, ETSI GR NFV-IFA 046 and DGR/NFV-EVE021) and inputs
    from Anuket RM and GSMA Operator Platform Group, it will evaluate existing solutions
    like IPMI, Ansible, DMTF Redfish, OpenStack Ironic, LFN ODIM and metal3 to prepare
    profiling of de-facto standards.\r\nThe work item defines requirements and builds
    up a common information model for describing the hardware attributes and status,
    and includes operations for managing infrastructure hardware with respect of life
    cycle and FCAPS of compute/storage/networking resources, including new types of
    resources like Smart-NICs.\r\nThe work item will consider the outcomes from the
    architectural analysis to determine the best specification approach of the interfaces
    and information modeling in relation to other ETSI NFV specifications. \r\nThe
    work item includes an informative study part as well as normative provisions."
