abstract:
- language: en
  script: Latn
  content: "Develop a Technical Specification defining the information elements and
    the protocols for the interface eLSA1 between an eLSA Controller (eLC) and an
    eLSA Repository (eLSA). The work builds on the feasibility study described in
    ETSI TR 103 588 (2018) \"Reconfigurable Radio Systems (RRS); Feasibility study
    on temporary spectrum access for local high-quality wireless networks\", the system
    requirements captured in ETSI TS 103 652-1 “System Requirements for spectrum access
    for local high-quality wireless networks” and the system architecture and high-level
    procedures captured in ETSI TS 103652-2 “System Architecture and high-level procedures
    for operation of evolved Licensed Shared Access (eLSA)”.\r\nThe scope of the work
    will be to specify the application protocol on the eLSA1 interface (eLSA1 protocol)
    and the content of the eLSA Spectrum Resource Availability Information (eLSRAI)
    conveyed by this protocol. The specification will include: eLSA1 protocol principles,
    eLSA1 procedures, messages and information elements enabling assignment and handling
    of local spectrum for the different licensing and leasing scenarios."
