abstract:
- language: en
  script: Latn
  content: "DGNA deassignment can be ignored if e.g. authentication of the SwMI has
    failed, or the Deassignment is received in clear while operating in security class
    2 or 3.\r\nDGNA Assignment can be ignored for the same reasons.\r\nMS may reject
    a DGNA Deassignment of a pre-programmed group for operational or other reasons.
    In this case, the group may be permanently detached in the current SwMI.\r\nThis
    change request updates the \"Result of deassignment\" information element table
    and other text to clarify this behaviour. It clarifies that the MS does not have
    to respond to Assign and Deassign requests in the event of an authentication failure
    or a security class mismatch.\r\n"
