  content: "To update the TS 103 732-3 Protection Profile Module based on the following information:  \r\n\r\n•\tUpdate the PP to conform to the latest revision of the Common Criteria (currently CC:2022) that will be required for the PP to be in compliance with EUCC and CRA requirements.\r\n\r\n•\tIncorporate any necessary changes to ensure consistency with the update  of TS 103 732 Part 1.\r\n"
