abstract:
- language: en
  script: Latn
  content: "The scope of this WI is to write an H.248 profile specification for controlling
    an MRFP in NGN Release 1.  The profile shall cover both IMS and PES architectures.\r\nThe
    profile that is developed will be closely coordinated with 3GPP for eventual inclusion
    in 3GPP Release 7.\r\nThe scope does not cover defining the role of the MRFC or
    the Mr interface."
