abstract:
- language: en
  script: Latn
  content: "The document will provide speech transmission performance requirements
    for narrowband VoIP loudspeaking and hands-free terminals; it addresses all types
    of IP  terminals, including wireless,  softphones and group terminals.\r\nThe
    intention of this Standard is to specify equipment requirements which enable manufacturers
    and service providers to ensure good quality end-to-end speech performance.\r\nIIn
    addition to traditional testing procedures, the present document describes advanced
    testing procedures taking into account further quality parameters as perceived
    by the user."
