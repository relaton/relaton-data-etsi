abstract:
- language: en
  script: Latn
  content: "Specification of high bit rate digital subscriber loop (HDSL)\r\ntechnique
    providing transparent capacity of 748kbit/s over expected\r\nrange of 2.75 km
    with 0.4mm wires and 3.66km with 0.5mm or about\r\n1Mbit/s over one pair of the
    existing copper local line network. Used\r\nto realise ISDN primary rate access
    digital section given in\r\nDE/TM-3003. Economical implementation of primary rate
    over 3 or 2\r\npairs (compaired to 2 pairs for the traditional 2048kbit/s\r\ntransmission
    technique) over more than double the range without a\r\nregenerator. Will support
    the penetration of ISDN with existing\r\nnetwork structures and technology.\r\n
    \ "
