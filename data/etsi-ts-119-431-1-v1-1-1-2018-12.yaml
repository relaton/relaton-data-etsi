abstract:
- language: en
  script: Latn
  content: "This will specify policy and security requirements for TSP service components
    operating a qualified signature or seal creation device (as defined in Regulation
    (EU) No 910/2014), or other form of digital signature creation device, to create
    a digital signature value on behalf of a remote signer.  These requirements are
    to be based on the general policy requirements specified in EN 319 401 and take
    into account related requirements for certificate issuance in EN 319 411-1.  This
    is to include creation of digital signature values used for electronic signatures
    and seals as defined in the eIDAS Regulation. This will build on requirements
    specified in CEN prEN 419 241, and take into account ETSI SR 019 020. \r\nThis
    is to address requirements for operation of a remote QSCD / SCD including:\r\n·operation
    in line with the operating requirements of the QSCD\r\n·obligations on the service
    user including protection of the authentication means (e.g. token devices, information
    known, biometric collection).\r\n· relationship with other TSP component services
    such as registration and certificate generation (see EN 319 411-1 clause 4.4)\r\ncompliance
    with the requirements of prEN 419 241-1."
