abstract:
- language: en
  script: Latn
  content: "SUBJECT\r\nHSCSD type approval test case 26.13.1.6 Multislot signaling
    / RR / Early classmark sending\r\nClarification of Test equipment level accuracy
    for cell (re) selection tests\r\nSection 14.6.2 and 14.8.2 - Control Channels
    - Delete Loop Back\r\nCorrections of references to GSM 04.08 Phase 2+ clause numbers\r\nNew
    generic call setup procedure for mobile terminating multislot configuration, minimum
    number of timeslots allocated\r\nNew generic call setup procedure for mobile originating
    multislot configuration, minimum number of timeslots allocated\r\nHSCSD type approval
    test case 26.13.1.1.1 Multislot signaling / RR / Measurement / symmetric     \r\nHSCSD
    type approval test case 26.13.1.1.2 Multislot signaling / RR / Measurement / asymmetric
    \    \r\nHSCSD type approval test case 26.13.1.2.1 Multislot signaling / RR /
    Dedicated assignment / successful case\r\nHSCSD type approval test case 26.13.1.2.2
    Multislot signaling / RR / Dedicated assignment / failure / general case\r\nHSCSD
    type approval test case 26.13.1.3.1 Multislot signaling / RR / Handover / successful
    / active call / non synchronized\r\nHSCSD type approval test case 26.13.1.3.3
    Multislot signaling / RR / Handover / successful / active call / finely synchronized
    / resource downgrading\r\nHSCSD type approval test case 26.13.1.3.4 Multislot
    signaling / RR / Handover / successful / call under establishment / finely synchronized
    / relocation of channels\r\nSection 36.2.1.1.1 - Loop A and FACCH\r\nHSCSD type
    approval test case 26.13.1.4 Multislot signaling / RR / Test of the channel mode
    modify procedure\r\nTable that contains a summary of the different combinations
    of parameters that have to be tested in Multislot signaling / Handover tests\r\nDefault
    contents of GSM 900 and DCS 1800 layer 3 messages for HSCSD RR tests\r\nHSCSD
    type approval test case 26.13.2.1.1 Multislot signaling / CC / In call functions
    / User initiated service level upgrade / successful\r\nHSCSD type approval test
    case 26.13.2.1.2 Multislot signaling / CC / In call functions / User initiated
    service level downgrade / successful\r\nHSCSD type approval test case 26.13.2.1.3
    Multislot signaling / CC / In call functions / User initiated service level upgrade
    / timeout of timer T323\r\nHSCSD type approval test case 26.13.2.1.4 Multislot
    signaling / CC / In call functions / User initiated service level upgrade / modify
    reject\r\nMultislot signaling / CC / In call functions / contents of some of the
    messages\r\nHSCSD type approval test case 26.13.3.1 Multislot signaling / Structured
    procedures / MS originated call / early assignment / HSCSD / non-transparent\r\nHSCSD
    type approval test case 26.13.3.2 Multislot signaling / Structured procedures
    / MS originated call / late assignment / HSCSD / non-transparent\r\nHSCSD type
    approval test case 26.13.3.3 Multislot signaling / Structured procedures / MS
    originated call / early assignment / HSCSD / transparent\r\nHSCSD type approval
    test case 26.13.3.4 Multislot signaling / Structured procedures / MS terminated
    call / early assignment / HSCSD / non-transparent\r\nHSCSD type approval test
    case 26.13.3.5 Multislot signaling / Structured procedures / MS terminated call
    / early assignment / HSCSD / transparent\r\nDefault test conditions during layer
    3 tests\r\nHSCSD type approval test case 26.13.1.3.5 Multislot signaling / RR
    / Handover / successful / call under establishment / pre-synchronized / resource
    upgrading\r\nHSCSD type approval test case 26.13.1.3.2 Multislot signaling / RR
    / Handover / successful / call under establishment / non synchronized / resource
    upgrading\r\nSection 34 , correction of defaults RP_ERROR \r\nMultiband BCCH /
    Intracell Handover - Interband Assignment\r\nSection 31 , allow DTMF signalling
    in SS tests \r\nSection 26.11.3.1.2.3 - Initial condition of MS\r\nSection 26.11
    - Coding of SI Type 2ter and 5ter in defaults and 26.11.2.3\r\nCBCH Mobile Allocation
    IE not needed in SYS INFO 4 in Test 34.3\r\nMultiband BCCH / Intercell Handover\r\nSection
    26.6.4.1.3 - Expected sequence step B25)\r\nClarification that for cell to be
    made ‘not suitable’ C1 must be made < 0\r\nSection 21.3 RXQUAL_SUB with DTX\r\n"
