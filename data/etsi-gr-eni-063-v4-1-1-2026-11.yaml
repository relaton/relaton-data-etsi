abstract:
- language: en
  script: Latn
  content: The present document examines main self-refinement mechanisms that are
    applicable to next generation mobile communication systems and extends the AI-Core
    with a self-refinement framework. In such a setting, the document investigates
    the integration of various feedbacks in AI-Core to refine network agents and ultimately
    optimize network services, e.g., via dedicated critic agents, and defines necessary
    procedures and mechanisms comprising root cause analysis, credit assignment, reputation
    incentive, self-reflection, retrieval augmented generation, and model update.
