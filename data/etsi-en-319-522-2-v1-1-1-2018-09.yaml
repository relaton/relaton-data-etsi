abstract:
- language: en
  script: Latn
  content: "This will specify the semantic contents to be produced and managed in
    electronic registered delivery transactions. It will deal with:\r\n•\tMessage
    delivery content. Specifications of the semantic of the meta-information that
    will possibly be associated to the transmission of the payload.\r\n•\tEvidence
    and identification content. Specifications of the set of evidence managed in the
    context of the service provision. The document will fully specify the semantics,
    the components, and the components' semantics for all the evidence. The document
    will also specify the content related to end user identity to be managed in the
    transactions.\r\n•\tService discovery content. Specifications of the information
    related to the identification of the remote electronic registered delivery management
    domain, the negotiation of capabilities and requirements that a service supports
    and the information related to the establishment of trust of a service (e.g. the
    content that will appear in an appropriate TSL extension for electronic registered
    delivery services)\r\n"
