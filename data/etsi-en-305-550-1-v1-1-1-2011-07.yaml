abstract:
- language: en
  script: Latn
  content: Emerging components availability provide generic SRDs above 40GHz, the
    upper limit frequency of the existing EN 300 440. A new HS for 40 to 246 GHz frequency
    range is proposed to satisfy long standing existing frequencies as designated
    by ERC Rec. 70-03 Annex 1 and will support a recommendation from the (2006) CEPT
    Report 14 in response to the EU Commission mandate to develop a strategy to improve
    the effectiveness and flexibility of spectrum availability SRDs.
