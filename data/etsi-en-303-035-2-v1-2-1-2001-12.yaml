abstract:
- language: en
  script: Latn
  content: "Removal of requirements related to Secure Disable.\r\n\r\nJustification
    for producing an EN: Since support of Disable in TBR 35 is optional, support of
    Secure Disable in the CHS can not be considered essential to avoid harmful interference
    to other users.  The WI to be started if CR is accepted by EPT.  The CHS shall
    be updated to be consistent with proposed modification of EN 303 035-1.\r\n"
