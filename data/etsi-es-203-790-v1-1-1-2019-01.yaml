abstract:
- language: en
  script: Latn
  content: "•\tTTCN-3 has been designed as a procedural language, which suits to its
    original purpose, automated functional types of testing in different domains.
    However, with time new areas and uses have appeared, like developing performance
    test frameworks, generic (customizable) functional test frameworks and new domains
    as ITS, IoT etc. There is a strong requirement from the users to increase the
    efficiency of TTCN-3 code development in these areas by adding object orientation
    (or alike) extension to the language. This shall be developed in a way, consistent
    with the existing language concepts. "
