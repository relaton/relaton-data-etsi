abstract:
- language: en
  script: Latn
  content: "This Stage 1 description of the first phase of SOR\r\n- compiles the basic
    service requirements for SOR;\r\n- describes the interactions for Supplementary
    Services (SS) in order\r\nto cater for SOR;\r\n- refers to modifications to network
    features required by SOR.\r\n This specification does not address the following:\r\n-
    There is no need for optimisation of the routing of calls originally\r\ndirected
    to a fixed network subscriber, because the physical address\r\nof a fixed network
    terminating line cannot differ from its logical\r\naddress.\r\n- SOR in non-GSM
    mobile networks is not a subject of this ETS, but\r\nmight be possible by bilateral
    arrangement between GSM network\r\noperators and those non-GSM mobile network
    operators.\r\n The purpose of SOR is to reduce the number of unnecessary inter-PLMN\r\ncall
    legs.\r\nThe first phase of SOR applies to :\r\n- OR performed within a country
    (i.e. Mobile to mobile calls where\r\nboth mobile subscribers are located in the
    same country);\r\n- OR performed towards the country where the call would have
    normally\r\nbeen routed without OR (e.g. Conditional Call Forwarding towards the\r\nHome
    Country of the called party).\r\n The complete set of scenarios included in the
    phase 1 of OR is\r\npresented in the paragraph for normal procedures. All other
    scenarios\r\nare excluded from Phase 1 of OR.\r\nNote that Optimal Routing is
    applicable to national roaming\r\nsituations, that is to calls directed to a mobile
    subscriber roaming\r\nin her home country, but registered in a PLMN different
    from her\r\nHPLMN.\r\nAll further call scenarios, including multiple call forwarding,
    are\r\nleft to subsequent phases of SOR. Subsequent phases of SOR shall be\r\nbackwards
    compatible with this first phase.\r\n "
