abstract:
- language: en
  script: Latn
  content: "This European Telecommunication Standard (ETS) specifies the\r\nprocedures
    used at the radio interface (Reference Point Um, see GSM TS\r\n04.02) for Call
    Control (CC), Mobility Management (MM) and Radio\r\nResource (RR) management.\r\nWhen
    the notations for \"further study\" or \"FS\" or \"FFS\" are present in\r\nthis
    ETS they mean that the indicated text is not a normative portion\r\nof this standard.\r\nThese
    procedures are defined in terms of messages exchanged over the\r\ncontrol channels
    of the radio interface. The control channels are\r\ndescribed in TS GSM 04.03.\r\nThe
    structured functions and procedures of this protocol and the\r\nrelationship with
    other layers and entities are described in general\r\nterms in TS GSM 04.07.\r\n
    \ "
