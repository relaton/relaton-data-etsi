abstract:
- language: en
  script: Latn
  content: "The purpose of this European Telecommunication Standard (ETS) is to\r\nidentify
    the Mobile-services Switching Centre (MSC)/Interworking\r\nFunctions (IWFs) and
    requirements to support interworking between:\r\ni) PLMN and PSTN\r\nii) PLMN
    and ISDN\r\n It is not possible to treat ISDN and PSTN as one type of network,
    even\r\nwhen both ISDN and PSTN subscribers are served by the same exchange\r\nbecause
    of the limitations of the PSTN subscribers access ie analogue\r\nconnection without
    D-channel signalling.\r\nWithin this ETS, the requirements for voice and non-voice
    (data) calls\r\nare considered separately.\r\n"
