abstract:
- language: en
  script: Latn
  content: "Release of S-UMTS G enhanced-family Technical Specifications under consideration
    of G- family as radio interface basis, including enhancing features implemented
    in A and C-family in order to optimize the radio interface over satellite. It
    is based on the results of the TR 102 278 identifying a way to achieve harmonization
    between A, C and G-family satellite radio interfaces for IMT-2000 in ITU-R. \r\nThis
    Technical Specification concerns enhanced features to multiplexing and channel
    coding for the S-UMTS G family."
