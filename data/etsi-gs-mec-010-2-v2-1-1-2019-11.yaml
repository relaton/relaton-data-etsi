abstract:
- language: en
  script: Latn
  content: "This work item will develop a revision of MEC010-2 to maintain the specification
    for fixing errors and omissions to keep alignment of application lifecycle, rules
    and requirements management with ETSI NFV Management and Orchestration VNF Packaging
    and VNFD Specifications. \r\n\r\nThis work item also intends to enhance the specification
    to define the stage-3 APIs over Mm1 and Mm3 reference points and support the related
    features identified by requirements in MEC002 GS, in alignment with the ETSI NFV
    Management and Orchestration Interface Specifications for the Os-Ma-nfvo and Or-Vnfm
    reference points, respectively."
