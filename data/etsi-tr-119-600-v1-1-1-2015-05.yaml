abstract:
- language: en
  script: Latn
  content: "This document provides guidance for the selection of standards for Trusted
    Service Status Lists Providers for given business requirements. \r\nThe document
    identifies a number of relevant Trusted Application Services using electronic
    signatures in different business areas, and whose provision has already been standardized.
    Additionally, for each of the services, it provides guidance for the selection
    of the suitable standards, ensuring in this way their correct provision and interoperability
    across the European Union.\r\nA general approach to the business guidance will
    be produced based on guidance from the viewpoint of signature creation and validation.
    \ From this general approach, guidance for each of the other areas will be produced."
