abstract:
- language: en
  script: Latn
  content: "WID approved during SCP#23\r\n\r\ndocument number of approved WID SCP-050454\r\n\r\nThe
    present work item will consider the specification of the secure channel by defining
    the protocol that shall be used to secure and exchange data. \r\nThis work item
    will define a generic solution for a secure channel between the UICC and an end
    point terminal; it will therefore be used to offer end-to-end security for all
    the applications/services/enablers defined in different SDOs/fora."
