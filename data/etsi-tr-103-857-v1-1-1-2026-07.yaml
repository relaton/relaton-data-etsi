abstract:
- language: en
  script: Latn
  content: 'To provide a Framework that serves as an Implementation Guide for interoperable
    solutions that are aimed at addressing 5G security challenges. Security challenges
    that should be addressed through automated orchestration of security mechanisms
    and services and usage for 5G network slices, network segments and services delivered
    by the End-to-End (E2E) network; and automated security policy computation and
    dynamic enforcement in various points in the network infrastructure using GANA
    autonomics (closed control-loops) in response to new 5G slice and service instantiations,
    new intents and security SLAs supplied as inputs by the human network operator
    and/or in response to detected and predicted security attacks, threats and risks.
    The Framework enables to implement solutions for "self-protection" and "self-defence"
    autonomic behaviours by 5G networks and their associated management and control
    systems without need for human operator involvement in the decisions and actions
    against detected and predicted security attacks, threats and risks -- even Across
    Multiple 5G Network Operators by Cross Domain Federated GANA Knowledge Plane (KP)
    Platforms. '
