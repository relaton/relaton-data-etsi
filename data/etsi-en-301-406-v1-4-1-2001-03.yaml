abstract:
- language: en
  script: Latn
  content: "The present document is intended to become DECT Generic Harmonized Radio
    Standard, the reference of which will be published in the Official Journal of
    the European Communities referencing the Council Directive on the approximation
    of the laws of the Member States relating to Radio Equipments and Telecommunication
    Terminal Equipments (the \"R&TTE Directive\" 99/05/EC).\r\nThis EN is intended
    to cover the provision of Directive 1999/5/EC (R&TTE Directive) for:\r\nArticle
    3.2, which states that \".... radio equipment shall be so constructed that it
    effectively uses the spectrum allocated to terrestrial/space radio communications
    and orbital resources so as to avoid harmful interference\";\r\nThe provisions
    for essential requirements under article 3.1 (a) and 3.1 (b) are covered by a
    separate standard. The provision for essential requirements under article 3.3
    possibly defined by TCAM will be subject to a separate standard.\r\nThe selection
    of the phenomena relevant to the essential requirements has been done on the base
    of the guidance given by EG 201 399 and by the further specific analysis applied
    to DECT Radio terminals.\r\nThe document shall be based on the existing TBR006.\r\nSupporting
    ETSI Member Organisations; Ericsson, Siemens, Ascom, Alcatel."
