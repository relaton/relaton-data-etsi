abstract:
- language: en
  script: Latn
  content: The document is part 2 of a multipart deliverable. It specifies a coded
    representation of audio information, and specifies the decoding process. The coded
    representation specified therein is suitable for use in digital audio transmission
    and storage applications. Building on the technology specified in part 1, it specifies
    additional functionality which may be used for immersive, personalized, or other
    advanced playback experiences. Additional representations can be included, targeting
    individual listener groups or applications (adding the possibility of different
    audio experience settings  above what part 1 specifies).
