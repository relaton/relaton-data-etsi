abstract:
- language: en
  script: Latn
  content: "This task will update the cryptographic suites recommendations based on
    inputs from national cryptographic recommendations including but not limited to
    France (ANSSI RGS) and Germany (BSI catalog) as well as from ENISA and SOG-IS.
    It will also check the given time schedule based on latest crypto analysis and
    adjust the corresponding time frames. If considered as necessary the recently
    standardized hash algorithm SHA-3 should be recommended as alternative to the
    existing SHA-2 algorithms.\r\nRecommendations from ENISA and SOG-IS will be adopted
    and integrated in the update of the TS."
