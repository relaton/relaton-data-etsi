abstract:
- language: en
  script: Latn
  content: "The present document defines an intermediate universal Geographical Area
    Description which subscriber applications or GSM services can use and the network
    can convert into an equivalent radio coverage map.\r\nFor GSM services which involve
    the use of an \"area\", it can be assumed that in the majority of cases the Service
    Requester will be forbidden access to data on the radio coverage map of a particular
    PLMN and that the Service Requester will not have direct access to network entities
    (e.g. BSC/BTS).\r\nThe interpretation by the PLMN operator of the geographical
    area in terms of cells actually used, cells that are partly within the given area
    and all other technical and quality of service aspects are out of the scope of
    the present document.\r\n"
