abstract:
- language: en
  script: Latn
  content: "S-PCN terminals working with Geostationnary Satellites\r\nThis EN is intended
    to define the minimum performance requirements and technical characteristics of
    Mobile Earth Stations (MES) with both transmit and receive capabilities for operation
    in a Geostationnary Satellite Personal Communication Network (S-PCN).\r\nAn S-PCN
    MES may be handheld, portable, vehicle-mounted, host connected, semi-fixed or
    fixed equipment, or may be an element in a multi-mode terminal; it may consist
    of a number of modules with associated connections and user interface, or may
    be a self contained single unit.\r\nThis EN will specify the requirements of the
    S-PCN MES element of the terminal operating in one or more of the MSS frequency
    bands dedicated to geostationnary S-PCNs in the 1,5/1,6 GHz band.\r\nThe requirements
    to be defined may cover following two major categories:\r\nunwanted emission limits:
    to protect other radio services from harmful interference generated by the MES
    in normal use;\r\nMES Control and Monitoring Functions (CMF): to protect other
    radio services from unwanted transmissions from the MES. The CMF in each MES is
    capable of answering to commands from the Network Control Facilities (NCF) for
    \ the operating  S-PCN.\r\n"
