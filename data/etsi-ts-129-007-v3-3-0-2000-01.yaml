abstract:
- language: en
  script: Latn
  content: "This TS identifies the Mobile-services Switching Centre/Interworking Functions
    (MSC/IWFs) and requirements to support interworking between:\r\na)PLMN and PSTN\r\nb)PLMN
    and ISDN\r\nIt is not possible to treat ISDN and PSTN as one type of network,
    even when both ISDN and PSTN subscribers are served by the same exchange because
    of the limitations of the PSTN subscribers access i.e. analogue connection without
    D-channel signalling.\r\nWithin this TS, the requirements for voice and non-voice
    (data) calls are considered separately.\r\n"
